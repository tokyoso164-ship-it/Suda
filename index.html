<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thames — интерактивная версия (откройте файл в браузере)</title>
<style>
  :root{
    --milk:#F1ECDF; --cream:#FAF7EF; --graphite:#232E38; --graphite-800:#2C3944;
    --sky:#4A8FBF; --meadow:#5DA463; --meadow-t:#3C7A42;
    --tile:#C75B39; --tile-600:#B04D2E; --straw:#E4C97E;
    --tx:#232E38; --tx2:#5C6670; --line:#DFD7C4; --err:#B03A2E;
    --serif:Georgia,'Times New Roman',serif; /* в приложении — Yeseva One */
    --mono:ui-monospace,Menlo,Consolas,monospace; /* в приложении — JetBrains Mono */
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--tx); font-size:16px; line-height:1.55;
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif; /* в приложении — Golos Text */
    background:var(--milk); padding-bottom:110px;
  }
  .sw{position:absolute; opacity:0; pointer-events:none; width:0; height:0}

  header{padding:10px 16px 12px; border-bottom:1px solid var(--line); background:var(--cream);
    position:sticky; top:0; z-index:20}
  .brand{display:flex; align-items:center; gap:10px}
  .brand b{font-family:var(--serif); font-weight:400; font-size:21px}
  header p{font-size:11.5px; color:var(--tx2); margin:6px 0 0}

  .cover{display:block; width:100%; height:auto; border-bottom:1px solid var(--line)}

  main{max-width:640px; margin:0 auto; padding:18px 16px 40px}
  .view{display:none}
  #t-auth:checked  ~ main #v-auth{display:block}
  #t-home:checked  ~ main #v-home{display:block}
  #t-art:checked   ~ main #v-art{display:block}
  #t-ob:checked    ~ main #v-ob{display:block}
  #t-ielts:checked ~ main #v-ielts{display:block}
  #t-mock:checked  ~ main #v-mock{display:block}
  #t-plan:checked  ~ main #v-plan{display:block}
  #t-chat:checked  ~ main #v-chat{display:block}
  #t-ucas:checked  ~ main #v-ucas{display:block}
  #t-mot:checked   ~ main #v-mot{display:block}
  #t-read:checked  ~ main #v-read{display:block}
  #t-writ:checked  ~ main #v-writ{display:block}
  #t-speak:checked ~ main #v-speak{display:block}
  #t-tarif:checked ~ main #v-tarif{display:block}
  #t-games:checked ~ main #v-games{display:block}
  /* обложка видна только на экране входа */
  #t-auth:checked ~ .cover{display:block}
  .cover{display:none}

  h1{font-family:var(--serif); font-weight:400; font-size:26px; line-height:1.15; margin:2px 0 8px}
  h3{font-family:var(--serif); font-weight:400}
  .sub{color:var(--tx2); font-size:13.5px; margin:0 0 16px}
  .stamp{font-family:var(--mono); font-weight:700; font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--tile)}
  .stamp::before{content:"[ "} .stamp::after{content:" ]"}
  .btn{display:inline-block; background:var(--tile); color:var(--cream); border-radius:12px;
    padding:12px 20px; font-weight:700; font-size:14px; cursor:pointer; border:0; text-align:center}
  .btn:hover{background:var(--tile-600)}
  .ghost{display:inline-block; background:transparent; border:1.5px solid var(--graphite); color:var(--graphite);
    border-radius:12px; padding:11px 16px; font-weight:600; font-size:13.5px; cursor:pointer; text-align:center}
  .card{background:var(--cream); border:1px solid var(--line); border-radius:16px; padding:15px; margin-bottom:11px;
    box-shadow:0 1px 2px rgba(35,46,56,.05)}
  .chip{display:inline-block; border-radius:999px; padding:4px 11px;
    font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    background:var(--cream); border:1px solid var(--line); color:var(--tx2)}
  .chip.mint{color:var(--meadow-t); border-color:rgba(93,164,99,.55); background:rgba(93,164,99,.1)}
  .step{display:none}
  .founder{background:var(--graphite); border-radius:12px; padding:9px 11px;
    font-size:11.5px; line-height:1.45; white-space:pre-line; margin-top:10px; color:rgba(250,247,239,.8)}
  .founder b{color:var(--straw); font-family:var(--mono); font-size:9px; letter-spacing:.08em;
    text-transform:uppercase; display:block; margin-bottom:2px}
  .field{display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:700; margin-bottom:9px}
  .field input, .field textarea{background:var(--cream); border:1px solid var(--line); border-radius:11px;
    padding:11px; color:var(--tx); font-size:14px; font-family:inherit}

  /* ---------- меню-кнопка ----------
     Телефон: правый нижний угол. Планшет/десктоп (≥768px): правый ВЕРХНИЙ угол,
     меню раскрывается вниз. В настоящем приложении кнопку можно перетащить,
     зажав её на полсекунды, — позиция запоминается (в CSS-копии жест не работает). */
  .backdrop{display:none; position:fixed; inset:0; background:rgba(35,46,56,.28); z-index:30}
  #c-menu:checked ~ .backdrop{display:block}
  .fabwrap{position:fixed; right:14px; bottom:14px; z-index:40; display:flex; flex-direction:column; align-items:flex-end; gap:10px}
  @media(min-width:768px){
    .fabwrap{bottom:auto; top:86px; flex-direction:column-reverse}
  }
  /* телефон: меню — нижняя панель на всю ширину с «ручкой» */
  @media(max-width:767px){
    #c-menu:checked ~ .fabwrap .menu{
      position:fixed; left:0; right:0; bottom:0; z-index:45;
      min-width:0; max-height:72vh; overflow-y:auto;
      border-radius:22px 22px 0 0; border-left:0; border-right:0; border-bottom:0;
      padding:14px 14px 18px;
      box-shadow:0 -14px 40px rgba(35,46,56,.28);
    }
    #c-menu:checked ~ .fabwrap .menu::before{
      content:""; display:block; width:44px; height:4px; border-radius:2px;
      background:var(--line); margin:0 auto 10px;
    }
    .menu label{min-height:48px; font-size:15px}
  }
  .sub-hint{margin-left:auto; color:var(--tx2); font-size:17px}
  .menu-close{justify-content:center; color:var(--tx2); border-top:1px solid var(--line);
    border-radius:0; margin-top:6px; font-size:13.5px !important}
  .fab{min-height:54px; border-radius:999px; border:0; background:var(--graphite);
    color:var(--cream); font-size:13px; font-weight:700; padding:0 18px; display:flex; align-items:center; gap:9px;
    cursor:pointer; box-shadow:0 6px 18px rgba(35,46,56,.3)}
  #c-menu:checked ~ .fabwrap .fab{background:var(--tile)}
  .menu{display:none; background:var(--cream); border:1px solid var(--line); border-radius:16px;
    padding:8px; flex-direction:column; gap:2px; min-width:240px; box-shadow:0 12px 32px rgba(35,46,56,.2)}
  #c-menu:checked ~ .fabwrap .menu{display:flex}
  .menu label{display:flex; align-items:center; gap:11px; min-height:42px; color:var(--tx2);
    font-size:14px; font-weight:600; border-radius:10px; padding:7px 11px; cursor:pointer}
  .menu label:hover{background:var(--milk)}
  .menu .grp{font-size:14px; font-weight:600; color:var(--tx); display:flex; gap:11px; align-items:center; padding:8px 11px}
  .menu .sub-items{border-left:1px solid var(--line); margin-left:21px; padding-left:12px; display:flex; flex-direction:column; gap:2px}
  .ic{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none}
  .icw{position:relative; width:22px; height:22px; flex:none}
  .spark{position:absolute; top:-2px; right:-4px; width:9px; height:9px; opacity:0}
  .spark circle{fill:var(--tile)}
  /* активный пункт: подсветка + терракотовая точка-«солнце», иконка терракотовая */
  #t-home:checked  ~ .fabwrap label[for=t-home],
  #t-art:checked   ~ .fabwrap label[for=t-home],
  #t-plan:checked  ~ .fabwrap label[for=t-plan],
  #t-chat:checked  ~ .fabwrap label[for=t-chat],
  #t-ucas:checked  ~ .fabwrap label[for=t-ucas],
  #t-mot:checked   ~ .fabwrap label[for=t-mot],
  #t-ielts:checked ~ .fabwrap label[for=t-ielts],
  #t-mock:checked  ~ .fabwrap label[for=t-ielts],
  #t-read:checked  ~ .fabwrap label[for=t-ielts],
  #t-writ:checked  ~ .fabwrap label[for=t-ielts],
  #t-speak:checked ~ .fabwrap label[for=t-ielts],
  #t-tarif:checked ~ .fabwrap label[for=t-tarif],
  #t-games:checked ~ .fabwrap label[for=t-games]{color:var(--graphite); background:var(--milk)}
  #t-home:checked  ~ .fabwrap label[for=t-home] .spark,
  #t-art:checked   ~ .fabwrap label[for=t-home] .spark,
  #t-plan:checked  ~ .fabwrap label[for=t-plan] .spark,
  #t-chat:checked  ~ .fabwrap label[for=t-chat] .spark,
  #t-ucas:checked  ~ .fabwrap label[for=t-ucas] .spark,
  #t-mot:checked   ~ .fabwrap label[for=t-mot] .spark,
  #t-ielts:checked ~ .fabwrap label[for=t-ielts] .spark,
  #t-mock:checked  ~ .fabwrap label[for=t-ielts] .spark,
  #t-read:checked  ~ .fabwrap label[for=t-ielts] .spark,
  #t-writ:checked  ~ .fabwrap label[for=t-ielts] .spark,
  #t-speak:checked ~ .fabwrap label[for=t-ielts] .spark,
  #t-tarif:checked ~ .fabwrap label[for=t-tarif] .spark,
  #t-games:checked ~ .fabwrap label[for=t-games] .spark{opacity:1}
  #t-home:checked  ~ .fabwrap label[for=t-home] .ic,
  #t-art:checked   ~ .fabwrap label[for=t-home] .ic,
  #t-plan:checked  ~ .fabwrap label[for=t-plan] .ic,
  #t-chat:checked  ~ .fabwrap label[for=t-chat] .ic,
  #t-ucas:checked  ~ .fabwrap label[for=t-ucas] .ic,
  #t-mot:checked   ~ .fabwrap label[for=t-mot] .ic,
  #t-ielts:checked ~ .fabwrap label[for=t-ielts] .ic,
  #t-mock:checked  ~ .fabwrap label[for=t-ielts] .ic,
  #t-read:checked  ~ .fabwrap label[for=t-ielts] .ic,
  #t-writ:checked  ~ .fabwrap label[for=t-ielts] .ic,
  #t-speak:checked ~ .fabwrap label[for=t-ielts] .ic,
  #t-tarif:checked ~ .fabwrap label[for=t-tarif] .ic,
  #t-games:checked ~ .fabwrap label[for=t-games] .ic{color:var(--tile)}

  /* ---------- облачный декор и небесная обложка ---------- */
  .sky-decor{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
  .sky-decor .sd{position:absolute; opacity:.55; pointer-events:auto;
    transition:transform 1.1s cubic-bezier(.45,0,.85,.6), opacity 1.1s ease-in}
  .sky-decor .sd label{display:block; cursor:pointer}
  .sky-decor .sd-1{top:150px; right:-140px}
  .sky-decor .sd-2{top:52vh; left:-60px; opacity:.4}
  main, header{position:relative; z-index:1}
  /* пустоты контента пропускают клики к облакам, элементы — нет */
  main, main .view{pointer-events:none}
  main .view > *, header *{pointer-events:auto}
  /* улетание по клику */
  #c-fly1:checked ~ .sky-decor .sd-1{transform:translate(120vw,-45vh) rotate(4deg); opacity:0}
  #c-fly2:checked ~ .sky-decor .sd-2{transform:translate(-120vw,-40vh) rotate(-4deg); opacity:0}
  #c-fly3:checked ~ .sky-decor .sd-x1{transform:translate(120vw,-40vh) rotate(4deg); opacity:0}
  #c-fly4:checked ~ .sky-decor .sd-x2{transform:translate(-120vw,-45vh) rotate(-4deg); opacity:0}
  #c-fly5:checked ~ .sky-decor .sd-x3{transform:translate(120vw,-50vh) rotate(4deg); opacity:0}
  /* «добавить облачности»: каждое нажатие генерирует одно облако (лимит 6).
     Кнопка только добавляет — убрать облако можно лишь кликом по нему. */
  .sd-extra{display:none}
  #c-m1:checked ~ .sky-decor .sd-x1, #c-m2:checked ~ .sky-decor .sd-x2,
  #c-m3:checked ~ .sky-decor .sd-x3, #c-m4:checked ~ .sky-decor .sd-x4,
  #c-m5:checked ~ .sky-decor .sd-x5, #c-m6:checked ~ .sky-decor .sd-x6{
    display:block; animation:sd-pop .5s cubic-bezier(.2,1.3,.5,1)}
  @keyframes sd-pop{from{transform:scale(.3); opacity:0}}
  .sd-x1{top:26vh; right:-50px; opacity:.5}
  .sd-x2{top:70vh; right:6vw; opacity:.4}
  .sd-x3{top:12vh; left:-46px; opacity:.45}
  .sd-x4{top:42vh; left:5vw; opacity:.35}
  .sd-x5{top:84vh; left:-40px; opacity:.45}
  .sd-x6{top:56vh; right:-64px; opacity:.5}
  #c-fly6:checked ~ .sky-decor .sd-x4{transform:translate(-120vw,-42vh) rotate(-4deg); opacity:0}
  #c-fly7:checked ~ .sky-decor .sd-x5{transform:translate(-120vw,-48vh) rotate(-4deg); opacity:0}
  #c-fly8:checked ~ .sky-decor .sd-x6{transform:translate(120vw,-44vh) rotate(4deg); opacity:0}
  .cloud-add{position:fixed; left:14px; bottom:14px; z-index:30; display:none; align-items:center; gap:7px;
    background:var(--cream); border:1px solid var(--line); border-radius:999px; padding:10px 15px;
    font-size:12.5px; font-weight:600; color:var(--tx2); cursor:pointer;
    box-shadow:0 4px 14px rgba(35,46,56,.12)}
  /* цепочка из 6 нажатий: видна всегда ровно одна кнопка-этап */
  .ca-1{display:flex}
  #c-m1:checked ~ .ca-1{display:none} #c-m1:checked ~ .ca-2{display:flex}
  #c-m2:checked ~ .ca-2{display:none} #c-m2:checked ~ .ca-3{display:flex}
  #c-m3:checked ~ .ca-3{display:none} #c-m3:checked ~ .ca-4{display:flex}
  #c-m4:checked ~ .ca-4{display:none} #c-m4:checked ~ .ca-5{display:flex}
  #c-m5:checked ~ .ca-5{display:none} #c-m5:checked ~ .ca-6{display:flex}
  #c-m6:checked ~ .ca-6{display:none} #c-m6:checked ~ .ca-done{display:flex}
  .ca-done{pointer-events:none; opacity:.55}
  .home-hero{position:relative; border-radius:18px; overflow:hidden; margin:2px 0 12px;
    border:1px solid var(--line); box-shadow:0 8px 24px rgba(35,46,56,.12)}
  .hh-scene{display:block; width:100%; height:auto; min-height:200px}
  .hh-copy{position:absolute; left:18px; right:18px; bottom:32px; color:var(--cream)}
  .hh-copy .stamp{color:var(--cream); text-shadow:0 1px 2px rgba(35,46,56,.3)}
  .hh-copy h1{color:#fff; margin:8px 0 5px; text-shadow:0 1px 3px rgba(35,46,56,.3)}
  .hh-copy p{margin:0; max-width:32ch; font-size:12.5px; color:#FCFAF4; text-shadow:0 1px 2px rgba(35,46,56,.35)}

  /* ---------- главная: статьи и соцсети ---------- */
  .art-card{display:block; background:var(--cream); border:1px solid var(--line); border-radius:15px;
    padding:14px; margin-bottom:9px; cursor:pointer; box-shadow:0 1px 2px rgba(35,46,56,.05)}
  .art-card:hover{border-color:var(--tile)}
  .art-cat{display:block; font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; color:var(--tile); margin-bottom:7px}
  .art-card b{display:block; font-family:var(--serif); font-weight:400; font-size:16.5px; line-height:1.3; margin-bottom:5px}
  .art-card p{margin:0; font-size:12.5px; color:var(--tx2)}
  .soc-card{display:flex; gap:11px; align-items:flex-start; background:var(--cream); border:1px solid var(--line);
    border-radius:15px; padding:13px 14px; margin-bottom:9px; text-decoration:none; color:var(--tx)}
  .soc-card b{display:block; font-size:14px}
  .soc-handle{display:block; font-family:var(--mono); font-size:10.5px; color:var(--sky); margin:1px 0 3px}
  .soc-card p{margin:0; font-size:12px; color:var(--tx2)}
  .soc-ic{display:inline-flex; width:36px; height:36px; border-radius:10px; flex:none; align-items:center;
    justify-content:center; background:var(--milk); border:1px solid var(--line); color:var(--tile)}
  .art-body{font-size:14px; line-height:1.6}
  .art-body h3{font-family:var(--serif); font-weight:400; font-size:18px; margin:20px 0 6px}
  .art-body p{margin:0 0 11px}
  .art-body ul{margin:0 0 11px; padding-left:18px}
  .art-body li{margin-bottom:4px}

  /* ---------- мини-игры: CSS-виселица (слово CLOUD) ---------- */
  .hg{display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap}
  .hg-gallows{width:150px; flex:none; background:var(--cream); border:1px solid var(--line); border-radius:14px}
  .hg-gallows .hp{opacity:0}
  #g-a:checked ~ main .hp-1{opacity:1}
  #g-e:checked ~ main .hp-2{opacity:1}
  #g-t:checked ~ main .hp-3{opacity:1}
  .hg-side{flex:1; min-width:180px}
  .hg-slots{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:8px}
  .hg-slot{width:32px; height:40px; display:inline-flex; align-items:center; justify-content:center;
    background:var(--cream); border:1px solid var(--line); border-bottom:3px solid var(--graphite);
    border-radius:8px; font-family:var(--mono); font-weight:700; font-size:19px}
  .hg-slot b{visibility:hidden}
  #g-c:checked ~ main .hs-c b{visibility:visible}
  #g-l:checked ~ main .hs-l b{visibility:visible}
  #g-o:checked ~ main .hs-o b{visibility:visible}
  #g-u:checked ~ main .hs-u b{visibility:visible}
  #g-d:checked ~ main .hs-d b{visibility:visible}
  .hg-kb{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
  .hg-kb label{width:40px; height:42px; display:inline-flex; align-items:center; justify-content:center;
    background:var(--cream); border:1px solid var(--line); border-radius:9px;
    font-family:var(--mono); font-weight:700; font-size:15px; cursor:pointer}
  #g-c:checked ~ main label[for=g-c], #g-l:checked ~ main label[for=g-l],
  #g-o:checked ~ main label[for=g-o], #g-u:checked ~ main label[for=g-u],
  #g-d:checked ~ main label[for=g-d]{opacity:.35; pointer-events:none; border-color:var(--meadow)}
  #g-a:checked ~ main label[for=g-a], #g-e:checked ~ main label[for=g-e],
  #g-t:checked ~ main label[for=g-t]{opacity:.35; pointer-events:none; border-color:var(--err)}
  .hg-win, .hg-lose{display:none; margin-top:10px}
  #g-c:checked ~ #g-l:checked ~ #g-o:checked ~ #g-u:checked ~ #g-d:checked ~ main .hg-win{display:block}
  #g-a:checked ~ #g-e:checked ~ #g-t:checked ~ main .hg-lose{display:block}

  /* ---------- хаб IELTS и полный мок ---------- */
  #c-sub:checked ~ main .lock-chip{display:none}
  .hub-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
  .hub-card{display:block; background:var(--cream); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:10px; cursor:pointer; box-shadow:0 1px 2px rgba(35,46,56,.05)}
  .hub-card:hover{border-color:var(--tile)}
  .hub-card b{display:block; font-family:var(--serif); font-weight:400; font-size:18px; margin:8px 0 5px}
  .hub-card p{margin:0; font-size:13px; color:var(--tx2)}
  .hub-ic{display:inline-flex; width:38px; height:38px; border-radius:11px; align-items:center;
    justify-content:center; background:var(--milk); border:1px solid var(--line); color:var(--tile)}
  .mk-bands{display:flex; gap:7px; flex-wrap:wrap; margin:10px 0 4px}
  .mk-cell{flex:1 1 60px; background:var(--cream); border:1px solid var(--line); border-radius:12px;
    padding:9px 6px; text-align:center}
  .mk-cell span{display:block; font-family:var(--mono); font-size:9px; color:var(--tx2); font-weight:700;
    text-transform:uppercase; letter-spacing:.07em; margin-bottom:3px}
  .mk-cell b{font-family:var(--mono); font-size:17px}
  .mk-cell.overall{border-color:var(--tile); background:rgba(199,91,57,.06)}
  .mk-cell.overall b{color:var(--tile)}

  /* ---------- опросник (диагностика) ---------- */
  #c-gcalc:checked ~ main .s-gcalc{display:block}
  #c-gcalc:checked ~ main .s-gmanual{display:none}
  #c-obdone:checked ~ main .s-obres{display:block}
  #c-obdone:checked ~ main .s-obform{display:none}
  .q-chip{display:inline-block; border:1px solid var(--line); background:var(--cream); border-radius:999px;
    padding:8px 13px; font-size:12.5px; font-weight:600; margin:0 6px 6px 0}
  .q-chip.on{border-color:var(--tile); color:var(--tile); background:rgba(199,91,57,.08)}

  /* ---------- вход ---------- */
  #c-login:checked ~ main .s-logged{display:block}
  #c-login:checked ~ main .s-login-form{display:none}

  /* ---------- план ---------- */
  .pi{display:flex; gap:11px; align-items:flex-start; background:var(--cream);
    border:1px solid var(--line); border-radius:14px; padding:12px 13px; margin-bottom:8px; cursor:pointer;
    box-shadow:0 1px 2px rgba(35,46,56,.05)}
  .pi input{width:20px; height:20px; margin-top:1px; accent-color:var(--meadow); flex:none}
  .pi .t{font-weight:600; font-size:14px}
  .pi .d{font-size:12px; color:var(--tx2); margin-top:1px}
  .badge{margin-left:auto; flex:none; font-family:var(--mono); font-size:10px; font-weight:700; border-radius:999px; padding:3px 8px; white-space:nowrap}
  .badge.soon{background:rgba(199,91,57,.12); border:1px solid rgba(199,91,57,.4); color:var(--tile)}
  .badge.far{background:var(--milk); border:1px solid var(--line); color:var(--tx2)}
  .badge.ok{background:rgba(93,164,99,.12); border:1px solid rgba(93,164,99,.45); color:var(--meadow-t)}
  .pi:has(input:checked){opacity:.6}
  .pi:has(input:checked) .t{text-decoration:line-through}

  /* ---------- чат ---------- */
  .msg{max-width:90%; border-radius:13px; padding:9px 12px; font-size:13.5px; line-height:1.5;
    white-space:pre-line; margin-bottom:8px; word-wrap:break-word}
  .m-user{background:var(--graphite); color:var(--cream); margin-left:auto; border-bottom-right-radius:4px}
  .m-bot{background:var(--cream); border:1px solid var(--line); border-bottom-left-radius:4px}
  .m-cur{border-color:rgba(74,143,191,.6); background:#EFF4F8}
  .m-cur::before{content:"Куратор"; display:block; font-family:var(--mono); font-size:9.5px; font-weight:700; color:var(--sky);
    margin-bottom:4px; text-transform:uppercase; letter-spacing:.08em}
  .src{display:block; margin-top:6px; font-size:11.5px; color:var(--tx2)}
  .ask{display:block; width:100%; background:var(--cream); border:1px solid var(--line); color:var(--tile);
    border-radius:11px; padding:10px 12px; font-size:12.5px; font-weight:700; cursor:pointer; text-align:center; margin-bottom:8px}
  #c-a1:checked ~ main .s-a1{display:block} #c-a1:checked ~ main label[for="c-a1"]{display:none}
  #c-a2:checked ~ main .s-a2{display:block} #c-a2:checked ~ main label[for="c-a2"]{display:none}
  #c-esc:checked ~ main .s-esc{display:block} #c-esc:checked ~ main label[for="c-esc"]{display:none}

  /* ---------- бары/кольца ---------- */
  .ring{width:130px; height:130px; border-radius:50%; flex:none; margin:0 auto 14px;
    background:conic-gradient(var(--tile) 0 72%, #E3DCC9 0);
    display:flex; align-items:center; justify-content:center}
  .ring .in{width:100px; height:100px; border-radius:50%; background:var(--cream);
    display:flex; flex-direction:column; align-items:center; justify-content:center}
  .ring b{font-family:var(--mono); font-size:28px} .ring span{font-size:9.5px; color:var(--tx2)}
  .crit{background:var(--cream); border:1px solid var(--line); border-radius:13px; padding:11px 13px; margin-bottom:8px}
  .cr{display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:6px}
  .cr span:last-child{font-family:var(--mono)}
  .bar{height:5px; border-radius:3px; background:#E3DCC9; margin-bottom:6px; overflow:hidden}
  .bar i{display:block; height:100%; border-radius:3px}
  .g{background:var(--meadow)} .m{background:var(--sky)} .w{background:var(--tile)}
  .cc{font-size:12px; color:var(--tx2); margin:0}

  /* ---------- UCAS ---------- */
  #c-uq:checked ~ main .s-uform{display:block} #c-uq:checked ~ main .s-upick{display:none}
  #c-ucheck:checked ~ main .s-ures{display:block} #c-ucheck:checked ~ main .s-uform{display:none}
  .fixes{padding-left:18px; margin:0; display:flex; flex-direction:column; gap:10px; font-size:13px}
  .was{color:var(--tx2); text-decoration:line-through; text-decoration-color:var(--err)}
  .became{color:var(--meadow-t); font-weight:600}
  .why{display:block; color:var(--tx2); font-size:11.5px; margin-top:1px}

  /* ---------- мотивационное письмо ---------- */
  #c-mcheck:checked ~ main .s-mres{display:block} #c-mcheck:checked ~ main .s-mform{display:none}
  details{background:var(--cream); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:12px}
  details summary{font-size:14px; font-weight:700; cursor:pointer}
  details[open] summary{margin-bottom:9px}
  .instr{font-size:12.5px; color:var(--tx2); line-height:1.55}
  .instr b{color:var(--tx)}
  .instr ol, .instr ul{padding-left:17px; margin:5px 0 11px}
  .instr li{margin-bottom:4px}

  /* ---------- Reading ---------- */
  #c-r1:checked ~ main .s-rtest{display:block} #c-r1:checked ~ main .s-rstart{display:none}
  #c-r2:checked ~ main .s-rres{display:block} #c-r2:checked ~ main .s-rtest{display:none}
  .timer{width:66px; height:66px; border-radius:50%; flex:none;
    background:conic-gradient(var(--tile) 0 98%, #E3DCC9 0);
    display:flex; align-items:center; justify-content:center}
  .timer .in{width:52px; height:52px; border-radius:50%; background:var(--cream);
    display:flex; flex-direction:column; align-items:center; justify-content:center}
  .timer b{font-family:var(--mono); font-size:11.5px; font-variant-numeric:tabular-nums} .timer span{font-size:8px; color:var(--tx2)}
  .rt-head{display:flex; gap:12px; align-items:center; background:var(--cream);
    border:1px solid var(--line); border-radius:14px; padding:9px 12px; margin-bottom:12px;
    position:sticky; top:86px; z-index:10; box-shadow:0 4px 14px rgba(35,46,56,.07)}
  .passage{background:var(--cream); border:1px solid var(--line); border-radius:14px; padding:13px 15px;
    font-size:13px; line-height:1.6; max-height:200px; overflow-y:auto; margin-bottom:12px; color:var(--tx2)}
  .passage b{color:var(--tx); font-family:var(--serif); font-weight:400; font-size:14.5px}
  .q{background:var(--cream); border:1px solid var(--line); border-radius:13px; padding:11px 13px; margin-bottom:9px}
  .q p{font-size:13px; margin:0 0 9px}
  .q p b{color:var(--tile); font-family:var(--mono)}
  .pills{display:flex; flex-wrap:wrap; gap:6px}
  .pills label{border:1px solid var(--line); background:var(--milk); border-radius:999px; padding:7px 13px; font-size:12px; font-weight:600; cursor:pointer}
  .pills input{position:absolute; opacity:0; width:0; height:0}
  .pills label:has(input:checked){border-color:var(--tile); color:var(--tile); background:rgba(199,91,57,.08)}
  .rev{border:1px solid var(--line); border-radius:11px; padding:9px 12px; margin-bottom:7px; background:var(--cream); font-size:12.5px}
  .rev .no{font-weight:800; margin-right:6px; font-family:var(--mono)}
  .rev.ok .no{color:var(--meadow-t)} .rev.bad .no{color:var(--err)}
  .rev .why{margin-top:3px}

  /* ---------- Writing ---------- */
  #c-w1:checked ~ main .s-wtest{display:block} #c-w1:checked ~ main .s-wstart{display:none}
  #c-w2:checked ~ main .s-wres{display:block} #c-w2:checked ~ main .s-wtest{display:none}

  /* ---------- Speaking / Тариф ---------- */
  #c-sub:checked ~ main .s-nosub{display:none}
  .s-hasub{display:none}
  #c-sub:checked ~ main .s-hasub{display:block}
  .rec{width:64px; height:64px; border-radius:50%; border:0; background:var(--tile); color:var(--cream);
    font-size:24px; cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center}
  #c-rec:checked ~ main .s-fb{display:block} #c-rec:checked ~ main .rec-row{display:none}
  .rec-row{display:flex; gap:13px; align-items:center; margin:14px 0}
  #c-pay:checked ~ main .s-payform{display:block} #c-pay:checked ~ main .tf-buy{display:none}
  #c-sub:checked ~ main .s-payform{display:none} #c-sub:checked ~ main .s-subon{display:block}
  .tf{background:var(--cream); border:1px solid var(--line); border-radius:16px; padding:15px; margin-bottom:11px;
    box-shadow:0 1px 2px rgba(35,46,56,.05)}
  .tf.hot{border-color:var(--tile); box-shadow:0 0 0 1px var(--tile) inset}
  .tf h3{margin:0 0 3px; font-size:17px}
  .tf .pr{font-family:var(--serif); font-size:21px}
  .tf .pr small{font-size:11.5px; color:var(--tx2); font-family:var(--mono)}
  .tf ul{margin:7px 0 11px; padding-left:17px; color:var(--tx2); font-size:12.5px}


  /* --- интерактивная версия: js-роутер вместо чекбоксов --- */
  .view{display:none} .view.on{display:block}
  .cover{display:none} body[data-view=auth] .cover{display:block}
  .menu label{user-select:none}
  .fabwrap.menu-left{align-items:flex-start}
  .fabwrap.menu-below{flex-direction:column-reverse}
  .fab.dragging{transform:scale(1.07)}
  .iform label{display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:700; margin-bottom:10px}
  .iform input, .iform textarea, .iform select{background:var(--cream); border:1px solid var(--line);
    border-radius:11px; padding:12px; color:var(--tx); font-size:15px; font-family:inherit}
  .iform textarea{resize:vertical; line-height:1.55}
  .ob-opts{display:flex; flex-direction:column; gap:8px; margin-top:12px}
  .ob-opts button{text-align:left; background:var(--cream); border:1px solid var(--line); color:var(--tx);
    border-radius:13px; padding:13px 15px; font-size:14.5px; font-weight:600; cursor:pointer; font-family:inherit}
  .ob-opts button:hover{border-color:var(--tile)}
  .gbar{height:6px; border-radius:3px; background:#E3DCC9; overflow:hidden; margin:12px 0 16px}
  .gbar i{display:block; height:100%; background:var(--tile); transition:width .25s}
  .msgrow{display:flex; gap:8px; margin-top:10px}
  .msgrow textarea{flex:1; min-height:46px; max-height:110px}
  .msgrow button{background:var(--tile); color:var(--cream); border:0; border-radius:11px; width:46px; font-size:17px; cursor:pointer}
  .demo-note{background:rgba(228,201,126,.25); border:1px solid rgba(228,201,126,.8); border-radius:11px;
    padding:9px 12px; font-size:12px; color:#6b5820; margin:10px 0}
  .timerbox{display:flex; gap:12px; align-items:center; background:var(--cream); border:1px solid var(--line);
    border-radius:14px; padding:10px 12px; margin-bottom:10px; position:sticky; top:86px; z-index:5}
  .timerbox b{font-family:var(--mono); font-size:20px}
  .g-key[disabled]{opacity:.35; pointer-events:none}

  /* js-версия меню: показ через [hidden], а не чекбокс */
  .menu:not([hidden]){display:flex}
  .backdrop:not([hidden]){display:block}
  @media(max-width:767px){
    .menu:not([hidden]){
      position:fixed; left:0; right:0; bottom:0; z-index:45;
      min-width:0; max-height:72vh; overflow-y:auto;
      border-radius:22px 22px 0 0; border-left:0; border-right:0; border-bottom:0;
      padding:14px 14px 18px; box-shadow:0 -14px 40px rgba(35,46,56,.28);
    }
    .menu:not([hidden])::before{content:""; display:block; width:44px; height:4px;
      border-radius:2px; background:var(--line); margin:0 auto 10px;}
  }
  button.cloud-add{display:flex}
  button.cloud-add:disabled{opacity:.55; pointer-events:none}

  /* --- стили мини-игр и общих карточек (перенос из app.css) --- */
  .lnk{background:none;border:0;color:var(--sky);font-weight:600;cursor:pointer;padding:0;font-size:14px;font-family:inherit}
  .acard{background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:11px;box-shadow:0 1px 2px rgba(35,46,56,.05)}
  .btn-primary{display:inline-block;background:var(--tile);color:var(--cream);font-weight:600;font-size:15px;
    padding:13px 20px;border:0;border-radius:12px;cursor:pointer;min-height:44px;font-family:inherit}
  .btn-primary:hover{background:var(--tile-600)}
  .status-line{min-height:1.3em;font-size:13.5px;color:var(--tx2);margin:10px 0}
  .status-line.err{color:var(--err)}
  .game-root{max-width:560px}
  .g-head{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .g-bar{height:6px;border-radius:3px;background:#E3DCC9;overflow:hidden}
  .g-bar i{display:block;height:100%;background:var(--tile);border-radius:3px;transition:width .25s ease}
  .g-diff{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .g-opt{text-align:left;background:var(--milk);border:1px solid var(--line);color:var(--tx);
    border-radius:13px;padding:13px 16px;font-size:15px;font-weight:600;cursor:pointer;min-height:44px;font-family:inherit}
  .g-opt span{display:block;font-weight:400;font-size:12.5px;color:var(--tx2);margin-top:2px}
  .g-opt:hover{border-color:var(--tile)}
  .g-opt:disabled{cursor:default}
  .g-opt.ok{border-color:var(--meadow);background:rgba(93,164,99,.12)}
  .g-opt.bad{border-color:var(--err);background:rgba(176,58,46,.08)}
  .g-opts{display:flex;flex-direction:column;gap:8px}
  .g-hang{display:flex;gap:18px;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap}
  .g-gallows{width:160px;flex:none;background:var(--cream);border:1px solid var(--line);border-radius:16px}
  .g-hang-side{flex:1;min-width:200px}
  .g-slots{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .g-slot{width:34px;height:42px;display:inline-flex;align-items:center;justify-content:center;
    background:var(--cream);border:1px solid var(--line);border-bottom:3px solid var(--tx);
    border-radius:8px;font-family:var(--mono);font-weight:700;font-size:20px}
  .g-hint{font-size:13.5px;color:var(--tx2);margin:0 0 6px;min-height:1.4em}
  .g-lives{font-size:13.5px;margin:0}
  .g-kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
  .g-key{min-height:42px;background:var(--cream);border:1px solid var(--line);border-radius:9px;
    font-family:var(--mono);font-weight:700;font-size:15px;color:var(--tx);cursor:pointer}
  .g-key:hover:not([disabled]){border-color:var(--tile);color:var(--tile)}
  .g-key[disabled]{opacity:.35;cursor:default}
  .g-answer{display:flex;gap:6px;flex-wrap:wrap;min-height:44px;align-items:center}
  .g-pool{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .g-chip{background:var(--milk);border:1px solid var(--line);border-radius:999px;padding:9px 14px;
    font-size:14.5px;font-weight:600;color:var(--tx);cursor:pointer;min-height:40px;font-family:inherit}
  .g-chip:hover{border-color:var(--tile)}
  .g-chip.on{background:rgba(199,91,57,.08);border-color:rgba(199,91,57,.45)}
  .g-check[disabled]{opacity:.5}
  .crit-list{display:flex;flex-direction:column;gap:10px}

  .soc-card{display:flex;gap:11px;align-items:flex-start;background:var(--cream);border:1px solid var(--line);
    border-radius:15px;padding:13px 14px;margin-bottom:9px;text-decoration:none;color:var(--tx)}
  .soc-card b{display:block;font-size:14px}
  .soc-handle{display:block;font-family:var(--mono);font-size:10.5px;color:var(--sky);margin:1px 0 3px}
  .soc-card p{margin:0;font-size:12px;color:var(--tx2)}
  .soc-ic{display:inline-flex;width:36px;height:36px;border-radius:10px;flex:none;align-items:center;
    justify-content:center;background:var(--milk);border:1px solid var(--line);color:var(--tile)}
  .art-body{font-size:14.5px;line-height:1.62;max-width:62ch}
  .art-body h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:20px 0 7px}
  .art-body p{margin:0 0 12px}
  .art-body ul,.art-body ol{margin:0 0 12px;padding-left:19px}
  .art-body li{margin-bottom:5px}
  .art-body i{color:var(--tx2)}

  .rec-idle,.rec-live{width:72px;height:72px;border-radius:50%;border:0;cursor:pointer;flex:none;
    font-size:26px;color:var(--cream)}
  .rec-idle{background:var(--tile)}
  .rec-live{background:var(--err);animation:recp 1.2s ease-in-out infinite}
  @keyframes recp{0%,100%{transform:scale(1)}50%{transform:scale(.92)}}

  .instr{font-size:12.5px;color:var(--tx2);line-height:1.55}
  .instr b{color:var(--tx)}
  .instr ol,.instr ul{padding-left:17px;margin:5px 0 11px}
  .instr li{margin-bottom:4px}
</style>
</head>

const LISTENING_TESTS = [{"test": {"id": "listening-1", "title": "Listening · Mock 1", "minutes": 30, "parts": [{"title": "Part 1 · Запись на курс английского (диалог)", "intro": "Разговор администратора языковой школы и студентки. Вопросы 1–10: дополните заметки ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Good morning, Riverside Language School, how can I help you?\nB: Hi! I'd like to book an English course, please.\nA: Of course. Can I take your name?\nB: It's Sarah Kowalski — that's K-O-W-A-L-S-K-I.\nA: Thank you, Sarah. And which level are you looking for? We run beginner, intermediate and advanced groups.\nB: I took a test online last week and it said intermediate.\nA: Perfect. The next intermediate group starts on the twelfth of September. There are three classes per week — Monday, Wednesday and Thursday.\nB: That works. Are the lessons in the morning?\nA: These ones are in the evening, from half past six. The price is two hundred and forty pounds per month, and we offer a ten per cent discount for students — do you have a student card?\nB: I do, yes.\nA: Lovely. Your classroom will be room fourteen, on the first floor. On your first day, please bring your passport so we can complete the registration.\nB: Got it. Oh — how do I reach you by public transport?\nA: The nearest bus stop is called Library — it's right opposite our entrance. Buses seven and twelve stop there.\nB: Wonderful. Thank you so much!\nA: See you on the twelfth, Sarah.", "groups": [{"kind": "gap", "label": "Вопросы 1–10. Дополните заметки ОДНИМ словом или числом из записи.", "questions": [{"no": 1, "q": "Surname: ______"}, {"no": 2, "q": "Course level: ______"}, {"no": 3, "q": "Start date: 12 ______"}, {"no": 4, "q": "Classes per week: ______"}, {"no": 5, "q": "Lessons take place in the ______"}, {"no": 6, "q": "Price per month: £______"}, {"no": 7, "q": "Discount available for ______"}, {"no": 8, "q": "Room number: ______"}, {"no": 9, "q": "On the first day bring your ______"}, {"no": 10, "q": "Nearest bus stop: ______"}]}]}, {"title": "Part 2 · Экскурсия по спортивному центру (монолог)", "intro": "Менеджер проводит вводную экскурсию для новых членов. Вопросы 11–15: выберите вариант. Вопросы 16–20: дополните ОДНИМ словом или числом.", "voices": ["A"], "script": "A: Welcome to Westgate Sports Centre, everyone! Before we walk around, a few practical points. We open at seven in the morning on weekdays, and at half past eight at weekends. If you're watching your budget, have a look at our evening membership — it's the cheapest option we offer, cheaper than the student one, and it covers everything after six p.m.\nThe swimming pool is open every day, but please note it closes on Monday mornings for cleaning. Good news for those who asked: a brand-new pilates class starts next month — the sign-up list is already open. All classes, courts and the pool are booked through our app; we no longer take bookings by phone.\nA few more things you'll want to know. Lockers cost one pound — you get the coin back when you return the key. Towels are available from reception. If you come by car, the car park is behind the building, not at the front. And do check the app before you set out: a class is cancelled if fewer than five people have booked. Right — we'll finish today's tour at the café, where coffee is on us.", "groups": [{"kind": "mc", "label": "Вопросы 11–15. Выберите правильный вариант (A–C).", "questions": [{"no": 11, "q": "On weekdays the centre opens at…", "options": ["A. 6.30", "B. 7.00", "C. 8.30"]}, {"no": 12, "q": "The cheapest membership is…", "options": ["A. student", "B. weekend", "C. evening"]}, {"no": 13, "q": "The pool is closed…", "options": ["A. on Monday mornings", "B. on Sunday evenings", "C. every lunchtime"]}, {"no": 14, "q": "The new class starting next month is…", "options": ["A. yoga", "B. pilates", "C. boxing"]}, {"no": 15, "q": "Bookings are made…", "options": ["A. by phone", "B. at reception", "C. through the app"]}]}, {"kind": "gap", "label": "Вопросы 16–20. Дополните ОДНИМ словом или числом.", "questions": [{"no": 16, "q": "The tour ends at the ______"}, {"no": 17, "q": "Lockers cost £______"}, {"no": 18, "q": "Towels are available from ______"}, {"no": 19, "q": "The car park is ______ the building"}, {"no": 20, "q": "A class is cancelled if fewer than ______ people book"}]}]}, {"title": "Part 3 · Студенты обсуждают проект (диалог с тьютором)", "intro": "Анна и Бен готовят презентацию и советуются с тьютором. Вопросы 21–26: выберите вариант. Вопросы 27–30: кто выполнит задачу — A (Anna), B (Ben) или C (both).", "voices": ["A", "B", "C"], "script": "C: So, Anna, Ben — how is the presentation going? Remind me of your topic.\nA: We settled on food waste on campus. It felt more practical than our first idea.\nC: Good choice. Any difficulties so far?\nB: Honestly, the biggest problem is finding recent data — most published figures are almost ten years old.\nC: In that case, why don't you interview the campus catering manager? She keeps monthly numbers, and first-hand data will impress the markers.\nA: That's a great idea.\nC: Now, remember the format: the presentation itself is fifteen minutes, plus questions. How are you planning to illustrate it?\nB: We thought about filming a video in the dining hall, but the file would be huge, so we'll mostly use charts instead.\nC: Sensible. Have you divided the work?\nA: Yes — I'm writing the introduction, since I drafted our proposal.\nB: And I'm designing the slides; I enjoy that part.\nA: I'll also collect the questionnaire results from the students we surveyed.\nC: And the rehearsal?\nB: We're doing that together on Friday, in the library study room.\nC: Excellent. I'll see you both after the rehearsal, then.", "groups": [{"kind": "mc", "label": "Вопросы 21–26. Выберите правильный вариант (A–C).", "questions": [{"no": 21, "q": "The students' topic is…", "options": ["A. urban wildlife", "B. food waste on campus", "C. student budgets"]}, {"n ge earned Karl von Frisch the Nobel Prize in nineteen seventy-three. Since then, researchers have even built a robot bee that can dance convincingly enough to recruit real foragers. Modern studies show the system is sensitive: bees dance far less in rain, and there is growing evidence that certain pesticides impair the dance's accuracy. Understanding all this is not just beautiful science — city planners now use dance data to decide where to plant wildflower corridors, giving urban bees routes between feeding sites.", "groups": [{"kind": "gap", "label": "Вопросы 31–40. Дополните конспект ОДНИМ словом или числом.", "questions": [{"no": 31, "q": "A returning forager performs the «______ dance»."}, {"no": 32, "q": "The length of the dance shows the ______ to the food."}, {"no": 33, "q": "Outside the hive, direction is measured relative to the ______."}, {"no": 34, "q": "Inside the hive, the angle is translated relative to ______."}, {"no": 35, "q": "Watching bees follow the dance by touch and by ______."}, {"no": 36, "q": "Von Frisch received the Nobel Prize in ______ (год)."}, {"no": 37, "q": "Scientists built a ______ bee able to recruit real foragers."}, {"no": 38, "q": "Bees dance much less in ______."}, {"no": 39, "q": "Some ______ reduce the accuracy of the dance."}, {"no": 40, "q": "Dance data helps planners position wildflower ______."}]}]}]}, "answers": {"1": {"a": ["kowalski"], "why": "«Sarah Kowalski — K-O-W-A-L-S-K-I»."}, "2": {"a": ["intermediate"], "why": "«it said intermediate»."}, "3": {"a": ["september"], "why": "«starts on the twelfth of September»."}, "4": {"a": ["3", "three"], "why": "«three classes per week»."}, "5": {"a": ["evening"], "why": "«these ones are in the evening»."}, "6": {"a": ["240"], "why": "«two hundred and forty pounds per month»."}, "7": {"a": ["students"], "why": "«a ten per cent discount for students»."}, "8": {"a": ["14", "fourteen"], "why": "«room fourteen, on the first floor»."}, "9": {"a": ["passport"], "why": "«please bring no": 1, "q": "Surname: ______"}, {"no": 2, "q": "Pick-up address: 27 ______ Lane"}, {"no": 3, "q": "Airport terminal: ______"}, {"no": 4, "q": "Day of travel: ______"}, {"no": 5, "q": "Pick-up time: ______ a.m."}, {"no": 6, "q": "Number of passengers: ______"}, {"no": 7, "q": "Number of suitcases: ______"}, {"no": 8, "q": "Recommended car type: ______"}, {"no": 9, "q": "Fixed fare: £______"}, {"no": 10, "q": "Payment method: by ______"}]}]}, {"title": "Part 2 · День волонтёра на городской ферме (монолог)", "intro": "Координатор приветствует волонтёров. Вопросы 11–15: выберите ответ. Вопросы 16–20: соотнесите человека с задачей.", "voices": ["A"], "script": "A: Good morning everyone, and welcome to Greenacre City Farm! Before we start, a little history: the farm opened in nineteen ninety-eight on the site of an old railway depot — you can still see the platform behind the stables. Now, today's jobs. Maria is leading the greenhouse team — they'll be planting tomato seedlings, perfect if you'd rather stay warm. Tom takes the pond group, clearing weeds from the water, so waterproof boots are essential there. Priya's team will be painting the fence along the main path — overalls and brushes are provided. Jack needs four strong volunteers to help him feed the goats and clean their enclosure. And Elena will be running the compost corner, turning and sieving — great exercise, I promise! A few practical points. Lunch is at half past twelve in the barn — hot soup and fresh bread, completely free for volunteers. Gloves are provided for every task, but please bring your own boots, as our spares are limited. The single most important rule on a farm: always wash your hands before eating, there are sinks by the barn door. Finally, our little farm shop offers all volunteers a twenty per cent discount today — the honey is excellent. And if you came by public transport, bus fourteen stops right outside the gate, every twenty minutes. Right — let's split into groups!", "groups": [{"kind": "mc", "label": "Вопросы 11–15. Выберите один вариант.", "questions": [{"no": 11, "q": "The farm was created on the site of", "options": ["A. an old railway depot", "B. a closed factory", "C. a former school"]}, {"no": 12, "q": "Lunch will be served in", "options": ["A. the greenhouse", "B. the barn", "C. the farm shop"]}, {"no": 13, "q": "Volunteers must bring their own", "options": ["A. gloves", "B. brushes", "C. boots"]}, {"no": 14, "q": "The most important rule is to", "options": ["A. wash your hands before eating", "B. stay with your group", "C. keep gates closed"]}, {"no": 15, "q": "Today volunteers get a shop discount of", "options": ["A. 10 per cent", "B. 20 per cent", "C. 25 per cent"]}]}, {"kind": "match", "label": "Вопросы 16–20. Кто чем занимается? A — рассада томатов, B — чистка пруда, C — покраска забора, D — кормление коз, E — компост.", "options": ["A", "B", "C", "D", "E"], "questions": [{"no": 16, "q": "Maria"}, {"no": 17, "q": "Tom"}, {"no": 18, "q": "Priya"}, {"no": 19, "q": "Jack"}, {"no": 20, "q": "Elena"}]}]}, {"title": "Part 3 · Студенты обсуждают проект с куратором (диалог)", "intro": "Лена и Марк планируют опрос о переработке отходов на кампусе. Вопросы 21–26: выберите ответ. Вопросы 27–30: соотнесите часть отчёта с её состоянием.", "voices": ["A", "B", "C"], "script": "A: Right, Lena and Mark — how is the recycling survey going?\nB: Quite well, Dr Hughes. We decided to focus on why students don't use the recycling bins, rather than just counting how many do.\nA: Good — reasons are more useful than raw numbers. How many responses are you aiming for?\nC: A hundred and twenty. We thought about doing interviews, but an online questionnaire is much faster, so we went with that.\nA: Sensible. Any problems so far?\nB: Yes — at first hardly anyone replied. So we added a prize draw, a coffee-shop voucher, and responses tripled in two days.\nA: Classic trick. Now, the report. Where do things stand?\nC: The introduction is finished — Lena wrote it nderground railway in the world — the London Underground. The first line, the Metropolitan, opened in eighteen sixty-three, running just six kilometres. Those early trains were pulled by steam locomotives, and contemporaries complained that the tunnels were permanently full of smoke — passengers emerged coughing, with dirty collars. The real breakthrough came in eighteen ninety, when the first deep-level line opened with electric trains — no smoke, and tunnels could now run far below the city. Because those deep tunnels were perfectly circular, Londoners soon gave the system its famous nickname: the Tube. One of the most influential objects in the network's history is not a train at all, but a map. In nineteen thirty-one an engineering draughtsman named Harry Beck designed a schematic map inspired by electrical circuits — straight lines, even spacing, no real geography. Passengers found it far easier to use, and versions of Beck's design are copied by metro systems all over the world today. During the Second World War the deep stations served a grim new purpose: thousands of Londoners used them as air-raid shelters, sleeping on the platforms night after night. And the system now? Two hundred and seventy-two stations, eleven lines, and up to five million passenger journeys every single day — on a railway whose oldest tunnels are more than a hundred and sixty years old.", "groups": [{"kind": "gap", "label": "Вопросы 31–40. Дополните конспект ОДНИМ словом или числом из записи.", "questions": [{"no": 31, "q": "The Metropolitan line opened in ______."}, {"no": 32, "q": "Early trains were pulled by ______ locomotives."}, {"no": 33, "q": "Passengers complained the tunnels were full of ______."}, {"no": 34, "q": "The first deep line with electric trains opened in ______."}, {"no": 35, "q": "The nickname 'the Tube' comes from the ______ shape of the tunnels."}, {"no": 36, "q": "Harry Beck designed his map in 1931, inspired by electrical ______."}, {"no": 37, "q": "Beck's map ignored real ______."}, {"no": 38, "q": "In the war, deep stations were used as air-raid ______."}, {"no": 39, "q": "The network today has ______ stations."}, {"no": 40, "q": "Daily journeys: up to ______ million."}]}]}]}, "answers": {"1": {"a": ["Craven"], "why": "Он диктует по буквам: C-R-A-V-E-N."}, "2": {"a": ["Mill"], "why": "«Twenty-seven Mill Lane»."}, "3": {"a": ["2", "two"], "why": "«Terminal two»."}, "4": {"a": ["Saturday"], "why": "«On Saturday at quarter to six»."}, "5": {"a": ["5:45", "5.45", "545"], "why": "Quarter to six = 5:45 утра; оператор подтверждает «five forty-five a.m.»."}, "6": {"a": ["3", "three"], "why": "«Three of us»."}, "7": {"a": ["4", "four"], "why": "«Four suitcases, plus hand luggage»."}, "8": {"a": ["estate"], "why": "Оператор рекомендует estate car — багажник больше."}, "9": {"a": ["38"], "why": "«A fixed fare — thirty-eight pounds»."}, "10": {"a": ["card"], "why": "«You can pay the driver by card» — клиент соглашается."}, "11": {"a": ["A"], "why": "«On the site of an old railway depot»."}, "12": {"a": ["B"], "why": "«Lunch is at half past twelve in the barn»."}, "13": {"a": ["C"], "why": "Перчатки дают, а «please bring your own boots»."}, "14": {"a": ["A"], "why": "«The single most important rule... wash your hands before eating»."}, "15": {"a": ["B"], "why": "«A twenty per cent discount today»."}, "16": {"a": ["A"], "why": "Maria ведёт теплицу — рассада томатов."}, "17": {"a": ["B"], "why": "Tom — группа пруда, чистка от водорослей."}, "18": {"a": ["C"], "why": "Priya — покраска забора вдоль дорожки."}, "19": {"a": ["D"], "why": "Jack — кормить коз и чистить загон."}, "20": {"a": ["E"], "why": "Elena — компостный угол."}, "21": {"a": ["B"], "why": "«Focus on why students don't use the recycling bins»."}, "22": {"a": ["B"], "why": "«A hundred and twenty»."}, "23": {"a": ["A"], "why": "«An online questionnaire is much faster»."}, "24": {"a": ["B"], "why": "«We added a prize draw... responses tripled»."}, "25": {"a": ["A"], "why": "«The presentation is ten minutes, no more»."}, "26": {"a": ["C"], "why": "«Let's meet again on the twenty-fifth»."}, "27": {"a": ["A"], "why": "«The introduction is finished»."}, "28": {"a": ["B"], "why": "«The methods section I'm still rewriting»."}, "29": {"a": ["C"], "why": "«The results chapter... still needs data»."}, "30": {"a": ["D"], "why": "«The conclusion we haven't started at all»."}, "31": {"a": ["1863"], "why": "«The Metropolitan, opened in eighteen sixty-three»."}, "32": {"a": ["steam"], "why": "«Pulled by steam locomotives»."}, "33": {"a": ["smoke"], "why": "«Tunnels were permanently full of smoke»."}, "34": {"a": ["1890"], "why": "«In eighteen ninety... with electric trains»."}, "35": {"a": ["circular"], "why": "«Perfectly circular» тоннели дали имя Tube."}, "36": {"a": ["circuits"], "why": "«Inspired by electrical circuits»."}, "37": {"a": ["geography"], "why": "«No real geography»."}, "38": {"a": ["shelters"], "why": "«Used them as air-raid shelters»."}, "39": {"a": ["272"], "why": "«Two hundred and seventy-two stations»."}, "40": {"a": ["5", "five"], "why": "«Up to five million passenger journeys every single day»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [32, 7.5], [30, 7.0], [26, 6.5], [23, 6.0], [18, 5.5], [16, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "listening-3", "title": "Listening · Вариант 3", "minutes": 30, "parts": [{"title": "Part 1 · Запись в спортзал (диалог)", "intro": "Девушка оформляет абонемент. Вопросы 1–10: дополните заметки ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Hi there, welcome to Pulse Fitness! How can I help?\nB: Hello! I'd like to join the gym, please.\nA: Great. Can I take your full name?\nB: Olivia Marsh — M-A-R-S-H.\nA: Thanks, Olivia. Are you working, or studying? We have a student membership that's quite a bit cheaper.\nB: I'm a student, at the university.\nA: Perfect — the student membership is twenty-nine pounds a month. And good timing: this week we're waiving the joining fee completely.\nB: Oh, excellent. What are the opening hours?\nA: On weekdays we open at six in the morning and close at eleven at night. Weekends are eight till ten.\nB: And are any classes included?\nA: Yes — the yoga class on Sunday mornings is free for all members. Everything else is pay-as-you-go.\nB: Lovely. What do I need to bring to sign up?\nA: Just some photo ID — a passport or driving licence is fine. We'll take your picture for the membership card here.\nB: Okay. Is there an introduction to the machines?\nA: Yes, we run inductions every Tuesday at four p.m. — I'd strongly recommend it. Oh, and lockers take a five-pound deposit, which you get back. If you drive, the car park is behind the building.\nB: Wonderful. Let's sign me up!", "groups": [{"kind": "gap", "label": "Вопросы 1–10. Дополните заметки ОДНИМ словом или числом из записи.", "questions": [{"no": 1, "q": "Surname: ______"}, {"no": 2, "q": "Membership type: ______"}, {"no": 3, "q": "Monthly fee: £______"}, {"no": 4, "q": "This week there is no ______ fee"}, {"no": 5, "q": "Weekday opening time: ______ a.m."}, {"no": 6, "q": "Free class on Sundays: ______"}, {"no": 7, "q": "To sign up, bring photo ______"}, {"no": 8, "q": "Inductions run every ______ at 4 p.m."}, {"no": 9, "q": "Locker deposit: £______"}, {"no": 10, "q": "The car park is ______ the building"}]}]}, {"title": "Part 2 · Объявление о фестивале у реки (монолог)", "intro": "Организатор рассказывает о музыкальном фестивале. Вопросы 11–15: выберите ответ. Вопросы 16–20: соотнесите площадку с тем, что там происходит.", "voices": ["A"], "script": "A: Hello, Riverside Radio listeners! I'm here to tell you about this year's Riverside Music Festival, which as always takes place on the third weekend of July, right along the river in Victoria Park. A quick word about tickets. Friday evening is completely free — that's our thank-you to the neighbourhood. Saturday and Sunday cost fifteen pounds per day at the gate, but if you book online you save three pounds on every ticket. Children under twelve go free all weekend. Now, what's where? The Main Stage hosts our big rock and pop headliners each evening. The Riverside Tent is the home of jazz this year — some wonderful quartets from across Europe. Families should head for the Family Field, with puppet shows and circus workshops for children all afternoon. The Market Square is packed with food stalls — everything from Thai curries to local cheese. And new this year, the Quiet Garden offers acoustic sets, poetry, and deckchairs for when your feet give up. Two rules to remember: no glass bottles anywhere on site — there are free drinking-water points by every entrance — and please use the recycling bins. If you fancy helping out, we still need volunteers for the weekend: you'll get free entry, a festival t-shirt, and our eternal gratitude. Sign up on the website. See you by the river!", "groups": [{"kind": "mc", "label": "Вопросы 11–15. Выберите один вариант.", "questions": [{"no": 11, "q": "The festival takes place on the", "options": ["A. first weekend of July", "B. third weekend of July", "C. last weekend of June"]}, {"no": 12, "q": "Entry on Friday evening is", "options": ["A. £15", "B. £12", "C. free"]}, {"no": 13, "q": "Booking online saves", "options": ["A. £3 per ticket", "B. £5 per ticket", "C. nothing"]}, {"no": 14, "q": "Which items are banned on site?", "options": ["A. glass bottles", "B. umbrellas", "C. cameras"]}, {"no": 15, "q": "Volunteers receive free entry and", "options": ["A. a meal voucher", "B. a festival t-shirt", "C. a parking pass"]}]}, {"kind": "match", "label": "Вопросы 16–20. Что где происходит? A — рок-хедлайнеры, B — джаз, C — детские представления, D — еда, E — акустика и поэзия.", "options": ["A", "B", "C", "D", "E"], "questions": [{"no": 16, "q": "Main Stage"}, {"no": 17, "q": "Riverside Tent"}, {"no": 18, "q": "Family Field"}, {"no": 19, "q": "Market Square"}, {"no": 20, "q": "Quiet Garden"}]}]}, {"title": "Part 3 · Диссертация о городских лисах (диалог)", "intro": "Студент обсуждает исследование с научным руководителем. Вопросы 21–26: выберите ответ. Вопросы 27–30: дополните ОДНИМ словом.", "voices": ["A", "B"], "script": "A: So, Ben, tell me how the fox project is coming along.\nB: Well, Dr Rees, I got interested in urban foxes while volunteering at a wildlife rescue centre last summer — we kept getting fox cubs from the city centre, not the countryside.\nA: A good origin story. And your data?\nB: I'm using camera traps — eight cameras across parks and gardens, running for six weeks.\nA: Any technical difficulties?\nB: Two, actually. First the batteries kept dying in the cold, so I switched to lithium ones, which last much longer. And then one camera was stolen from the park, so I've started mounting them higher up on the trees, out of easy reach.\nA: Practical solutions. Are you only using cameras?\nB: No — I'm also running a short survey of residents, asking whether people feed the foxes deliberately.\nA: Good. My one concern is that your research question is still too broad. 'How do foxes live in cities' is a book, not a dissertation. I'd narrow it to feeding behaviour — where the food comes from, natural or human.\nB: That makes sense. I'll rewrite the question this week.\nA: Excellent. Send me the new draft by Friday, and let's meet again in November, once you have a month of camera data.", "groups": [{"kind": "mc", "label": "Вопросы 21–26. Выберите один вариант.", "questions": [{"no": 21, "q": "Ben became interested in foxes while", "options": ["A. volunteering at a rescue centre", "B. reading a journal article", "C. watching a documentary"]}, {"no": 22, "q": "How many camera traps is he using?", "options": ["A. 6", "B. 8", "C. 10"]}, {"no": 23, "q": "The battery problem was solved by", "options": ["A. adding solar panels", "B. switching to lithium batteries", "C. checking cameras daily"]}, {"no": 24, "q": "After the theft, Ben now mounts cameras", "options": ["A. higher on the trees", "B. inside metal boxes", "C. only in private gardens"]}, {"no": 25, "q": "The resident survey asks whether people", "options": ["A. are afraid of foxes", "B. feed the foxes deliberately", "C. want foxes removed"]}, {"no": 26, "q": "The tutor thinks the research question is", "options": ["A. too broad", "B. too narrow", "C. already perfect"]}]}, {"kind": "gap", "label": "Вопросы 27–30. Дополните ОДНИМ словом из записи.", "questions": [{"no": 27, "q": "The cameras will run for six ______."}, {"no": 28, "q": "The tutor suggests focusing on ______ behaviour."}, {"no": 29, "q": "Ben must send the new draft by ______."}, {"no": 30, "q": "The next meeting will be in ______."}]}]}, {"title": "Part 4 · Лекция: краткая история бумаги (монолог)", "intro": "Фрагмент лекции по истории технологий. Вопросы 31–40: дополните конспект ОДНИМ словом или числом.", "voices": ["A"], "script": "A: Few inventions have carried more ideas than paper. The traditional date of its invention is one hundred and five AD, when a Chinese court official named Cai Lun presented the emperor with sheets made from tree bark, old rags and even fishing nets, beaten into pulp and dried on screens. For centuries China guarded the technique as a state secret. It began to travel west after the year seven fifty-one, when — according to the traditional account — Chinese papermakers taken prisoner after a battle passed their skills on in Central Asia. From there paper moved through the Arab world, reaching Baghdad, Cairo and eventually Spain, where Europe's first paper mills were established in the twelfth century. For a long time European paper was made from rags — worn-out clothing was so valuable that rag collectors went door to door. Demand exploded after the fifteenth century, when the printing press turned books from treasures into products. The rag supply simply couldn't keep up. The answer came in the nineteenth century with the wood-pulp process, which finally made paper truly cheap — cheap enough for daily newspapers, penny novels and, eventually, the paperback. Today the story has come full circle: like Cai Lun with his rags and nets, we make much of our paper from recovered material. A paper fibre can be recycled about seven times before it becomes too short to use — a fact worth remembering next time a cardboard box lands on your doorstep.", "groups": [{"kind": "gap", "label": "Вопросы 31–40. Дополните конспект ОДНИМ словом или числом из записи.", "questions": [{"no": 31, "q": "Traditional date of invention: ______ AD."}, {"no": 32, "q": "Cai Lun used tree bark, fishing nets and old ______."}, {"no": 33, "q": "China kept the method a state ______."}, {"no": 34, "q": "The technique began moving west after the year ______."}, {"no": 35, "q": "It was passed on by captured Chinese ______."}, {"no": 36, "q": "Europe's first paper mills appeared in ______."}, {"no": 37, "q": "Demand exploded after the invention of the printing ______."}, {"no": 38, "q": "The 19th-century breakthrough was the ______-pulp process."}, {"no": 39, "q": "Wood pulp made paper truly ______."}, {"no": 40, "q": "A paper fibre can be recycled about ______ times."}]}]}]}, "answers": {"1": {"a": ["Marsh"], "why": "«Olivia Marsh — M-A-R-S-H»."}, "2": {"a": ["student"], "why": "Она студентка, оформляет student membership."}, "3": {"a": ["29"], "why": "«Twenty-nine pounds a month»."}, "4": {"a": ["joining"], "why": "«This week we're waiving the joining fee»."}, "5": {"a": ["6", "six"], "why": "«On weekdays we open at six in the morning»."}, "6": {"a": ["yoga"], "why": "«The yoga class on Sunday mornings is free»."}, "7": {"a": ["ID"], "why": "«Just some photo ID»."}, "8": {"a": ["Tuesday"], "why": "«Inductions every Tuesday at four p.m.»."}, "9": {"a": ["5", "five"], "why": "«Lockers take a five-pound deposit»."}, "10": {"a": ["behind"], "why": "«The car park is behind the building»."}, "11": {"a": ["B"], "why": "«The third weekend of July»."}, "12": {"a": ["C" truly cheap»."}, "40": {"a": ["7", "seven"], "why": "«Recycled about seven times»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [32, 7.5], [30, 7.0], [26, 6.5], [23, 6.0], [18, 5.5], [16, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "listening-4", "title": "Listening · Вариант 4", "minutes": 30, "parts": [{"title": "Part 1 · Запись к стоматологу (диалог)", "intro": "Пациентка записывается на приём по телефону. Вопросы 1–10: дополните заметки ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Good morning, Riverside Dental Clinic, how can I help you?\nB: Hello, I'd like to make an appointment, please.\nA: Of course. Can I take your name?\nB: Yes, it's Emma Walton — W-A-L-T-O-N.\nA: Thank you. And what seems to be the problem?\nB: A filling has fallen out of one of my back teeth. It doesn't hurt much, but I'd like it looked at soon.\nA: I see. Our next available dentist is Dr Baker. Would that be all right?\nB: That's fine.\nA: He has a free slot on Thursday. Could you come then?\nB: Thursday works. What time?\nA: Half past two in the afternoon — so that's two thirty p.m.\nB: Perfect. And where exactly is the clinic? I've never been before.\nA: We're at fourteen Bridge Street, just above the pharmacy — the entrance is on the left of the shop.\nB: Got it. How much will the appointment cost?\nA: The check-up is forty-five pounds. If you have dental cover, please bring your insurance card and we'll sort out the paperwork.\nB: I will. Anything else?\nA: Yes — please arrive ten minutes early to fill in a registration form.\nB: No problem. Thank you very much!\nA: See you on Thursday, Ms Walton.", "groups": [{"kind": "gap", "label": "Вопросы 1–10. Дополните заметки ОДНИМ словом или числом из записи.", "questions": [{"no": 1, "q": "Surname: ______"}, {"no": 2, "q": "Problem: a lost ______"}, {"no": 3, "q": "Dentist's name: Dr ______"}, {"no": 4, "q": "Day of appointment: ______"}, {"no": 5, "q": "Time of appointment: ______ p.m."}, {"no": 6, "q": "Clinic address: 14 ______ Street"}, {"no": 7, "q": "The clinic is above the ______"}, {"no": 8, "q": "Cost of the check-up: £______"}, {"no": 9, "q": "Bring your ______ card"}, {"no": 10, "q": "Arrive ______ minutes early"}]}]}, {"title": "Part 2 · Экскурсия по городской библиотеке (монолог)", "intro": "Библиотекарь проводит экскурсию для новых читателей. Вопросы 11–15: выберите ответ. Вопросы 16–20: соотнесите этаж с тем, что там находится.", "voices": ["A"], "script": "A: Welcome, everyone, to the Central City Library. Before we walk round, a little background. This building was originally the city's main post office — it opened in nineteen oh two, and you can still see the old brass counters near the entrance. The library moved in about thirty years ago. Now, practical things first. On weekdays we're open from eight in the morning until ten at night — later than most libraries in the country. At weekends we close at six. Membership is completely free; to join, you just need to show proof of address, such as a recent bill. Once you're a member, you can borrow up to eight books at a time, for three weeks. Families take note: our storytime for children takes place every Sunday afternoon at three — no booking needed. As we walk, here's the layout of the building. Down in the basement we keep the rare books and the city archive — ask a librarian if you'd like to see them. Here on the ground floor is our café, which does excellent coffee and cakes. The first floor is entirely given over to the children's section. On the second floor you'll find the computer room, with thirty machines and free internet. And at the top, on the third floor, is the quiet reading room, where we keep all the newspapers and magazines. Right — follow me!", "groups": [{"kind": "mc", "label": "Вопросы 11–15. Выберите один вариант.", "questions": [{"no": 11, "q": "The library building used to be", "options": ["A. a bank", "B. a post office", "C. a theatre"]}, {"no": 12, "q": "On weekdays the library closes at", "options": ["A. 8 p.m.", "B. 9 p.m.", "C. 10 p.m."]}, {"no": 13, "q": "Members can borrow up to", "options": ["A. eight books", "B. ten books", "C. twelve books"]}, {"no": 14, "q": "To become a member, you need to show", "options": ["A. a student card", "B. a photo", "C. proof of address"]}, {"no": 15, "q": "Storytime for children takes place on", "options": ["A. Saturday mornings", "B. Sunday afternoons", "C. Friday evenings"]}]}, {"kind": "match", "label": "Вопросы 16–20. Что находится на каждом этаже? A — детская литература, B — компьютерный зал, C — редкие книги и городской архив, D — кафе, E — читальный зал с газетами и журналами.", "options": ["A", "B", "C", "D", "E"], "questions": [{"no": 16, "q": "Basement"}, {"no": 17, "q": "Ground floor"}, {"no": 18, "q": "First floor"}, {"no": 19, "q": "Second floor"}, {"no": 20, "q": "Third floor"}]}]}, {"title": "Part 3 · Студенты готовят презентацию по истории (диалог)", "intro": "Том и Анна планируют презентацию о Великом лондонском пожаре. Вопросы 21–26: выберите ответ. Вопросы 27–30: дополните ОДНИМ словом.", "voices": ["A", "B"], "script": "A: Right, Anna, we need to plan our history presentation properly.\nB: Agreed. I'm glad we picked the Great Fire of London — I've wanted to do it ever since we visited the Monument on the school trip.\nA: Same here. So, Mr Field said the presentation has to be fifteen minutes, including questions.\nB: Fifteen minutes — that's longer than I thought. How should we open?\nA: I found a video clip of a reconstruction of the fire. It's dramatic, and the clip only lasts two minutes, so we'd still have plenty of time.\nB: Perfect, let's start with the video clip then.\nA: Our main problem is that we've got far too much material. Causes, the fire itself, eyewitnesses, the rebuilding...\nB: True, we can't cover everything. I think the most interesting part is how the city was rebuilt afterwards — the new brick houses, the wider streets.\nA: Good, let's make the rebuilding of the city our focus and only mention the causes briefly.\nB: Fine. I'll design the slides, if you write the talking notes.\nA: Deal. Don't forget Mr Field wants our plan by Friday.\nB: I'll email it to him on Thursday night, then. When shall we rehearse?\nA: The library has small study rooms — let's rehearse in the library on Tuesday after class.\nB: Tuesday it is. This is going to be good!", "groups": [{"kind": "mc", "label": "Вопросы 21–26. Выберите один вариант.", "questions": [{"no": 21, "q": "Anna wanted this topic after", "options": ["A. visiting the Monument on a school trip", "B. reading a novel about the fire", "C. watching a TV documentary"]}, {"no": 22, "q": "The presentation must last", "options": ["A. ten minutes", "B. twelve minutes", "C. fifteen minutes"]}, {"no": 23, "q": "The students will begin with", "options": ["A. a map of London", "B. a video clip", "C. a quiz for the class"]}, {"no": 24, "q": "Their main problem is that they have", "options": ["A. too much material", "B. too few sources", "C. too little time to prepare"]}, {"no": 25, "q": "They decide to focus on", "options": ["A. the causes of the fire", "B. famous eyewitnesses", "C. the rebuilding of the city"]}, {"no": 26, "q": "They will rehearse", "options": ["A. in an empty classroom", "B. in the library", "C. at Anna's house"]}]}, {"kind": "gap", "label": "Вопросы 27–30. Дополните ОДНИМ словом из записи.", "questions": [{"no": 27, "q": "The video clip lasts only two ______."}, {"no": 28, "q": "Anna will design the ______."}, {"no": 29, "q": "Mr Field wants the plan by ______."}, {"no": 30, "q": "The rehearsal will be on ______."}]}]}, {"title": "Part 4 · Лекция: как строили Эйфелеву башню (монолог)", "intro": "Фрагмент лекции по истории инженерного дела. Вопросы 31–40: дополните конспект ОДНИМ словом или числом.", "voices": ["A"], "script": "A: Today we turn to one of the most famous structures on Earth — the Eiffel Tower — and ask a simple question: how was it actually built? The tower was created for the World's Fair of eighteen eighty-nine, held in Paris to mark the hundredth anniversary of the French Revolution. Contrary to what many visitors assume, it is made not of steel but of iron, produced in Gustave Eiffel's own factory outside Paris. Every piece was calculated in advance: the design required around eighteen thousand separate parts, each one drawn individually, and they were joined together by two and a half million rivets. The workforce was surprisingly small: about three hundred workers assembled the tower, and thanks to strict safety rules only one man died during construction — remarkable for that era. Not everyone was pleased. Before building even began, a group of well-known artists and writers signed a petition protesting against what they called a useless and monstrous tower. The plan, in fact, was for the tower to stand for only twenty years and then be demolished. It survived for one reason: it proved perfect as a radio antenna, first for military messages and later for public broadcasting. And one final detail engineers love: to protect the iron, the tower is repainted every seven years, a job that requires about sixty tonnes of paint — all of it applied by hand.", "groups": [{"kind": "gap", "label": "Вопросы 31–40. Дополните конспект ОДНИМ словом или числом из записи.", "questions": [{"no": 31, "q": "The tower was built for the World's Fair of ______."}, {"no": 32, "q": "It is made not of steel but of ______."}, {"no": 33, "q": "The design required around ______ thousand separate parts."}, {"no": 34, "q": "The parts were joined by 2.5 million ______."}, {"no": 35, "q": "About ______ workers assembled the tower."}, {"no": 36, "q": "Artists and writers signed a ______ against the tower."}, {"no": 37, "q": "The tower was meant to stand for only ______ years."}, {"no": 38, "q": "It was saved because it worked as a radio ______."}, {"no": 39, "q": "The tower is repainted every ______ years."}, {"no":

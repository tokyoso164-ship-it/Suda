owing where home lies. To solve that, pigeons seem to build a 'map' as well as a compass. One striking idea is that they smell their way home, learning to associate particular winds with the odours they carry; pigeons prevented from smelling often lose their way. Closer to the loft, birds switch to familiar landmarks — roads, rivers and buildings — following them like a driver on a known route.\n\nE. None of these senses works alone. The modern view is that a pigeon combines sun, magnetism, smell and memory, weighting whichever is most reliable at the moment, much as a sailor once used stars, compass and coastline together. Tiny satellite trackers now let scientists watch individual journeys in detail, revealing that birds often follow looping, habitual paths rather than dead-straight lines — a reminder that even a 'simple' animal skill can hide layers of subtlety.", "instructions_groups": [{"kind": "headings", "label": "Вопросы 14–18. Подберите заголовок к каждому абзацу A–E. Два заголовка лишние.", "options": ["i. A compass based on the sun", "ii. Using the planet's magnetic field", "iii. More than one sense working together", "iv. Finding the way by smell and landmarks", "v. A long-valued and long-mysterious skill", "vi. Breeding pigeons for racing", "vii. How pigeons build their nests"], "questions": [{"no": 14, "q": "Абзац A"}, {"no": 15, "q": "Абзац B"}, {"no": 16, "q": "Абзац C"}, {"no": 17, "q": "Абзац D"}, {"no": 18, "q": "Абзац E"}]}, {"kind": "mc", "label": "Вопросы 19–22. Выберите один вариант.", "questions": [{"no": 19, "q": "The experiment with artificial lighting showed that pigeons", "options": ["A. cannot fly at night", "B. use only one part of the brain", "C. combine an internal clock with the sun's position", "D. rely only on magnetism"]}, {"no": 20, "q": "Some researchers think pigeons sense magnetism using", "options": ["A. iron-rich crystals in the beak", "B. their feathers", "C. their internal clock", "D. their sense of hearing"]}, {"no": 21, "q": "Pigeons that cannot smell", "options": ["A. fly faster", "B. navigate better under cloud", "C. refuse to leave the loft", "D. often lose their way"]}, {"no": 22, "q": "Satellite trackers have revealed that pigeons", "options": ["A. always fly in straight lines", "B. often follow looping, habitual paths", "C. never use landmarks", "D. cannot cross water"]}]}, {"kind": "ynng", "label": "Вопросы 23–26. YES — совпадает с мнением автора; NO — противоречит; NOT GIVEN — мнения нет.", "options": ["YES", "NO", "NOT GIVEN"], "questions": [{"no": 23, "q": "Scientists fully understand how pigeons detect magnetism."}, {"no": 24, "q": "The sun compass alone explains pigeon navigation."}, {"no": 25, "q": "Pigeons are more intelligent than other birds."}, {"no": 26, "q": "Pigeons rely on several senses together rather than one."}]}]}, {"title": "The story of the sandwich", "text": "The sandwich is so ordinary that it is easy to forget it has a history — and a lord's title — attached to it. The popular story credits John Montagu, the fourth Earl of Sandwich, an English aristocrat of the eighteenth century. According to a tale first written down by a French traveller, Montagu was such a keen gambler that he refused to leave the card table for meals, and instead ordered his servants to bring him slices of meat between two pieces of bread, so that he could eat with one hand and keep playing with the other. Whether or not the gambling story is true — his supporters said he was in fact a busy man eating at his desk — the food took his name.\n\nOf course, people had wrapped fillings in bread long before the earl was born. Two thousand years ago the Jewish sage Hillel the Elder is said to have eaten bitter herbs and nuts pressed between flatbreads at Passover, a practice still echoed in the Seder meal today. Medieval Europeans used thick slabs of stale bread called 'trenchers' as edible plates, soaking up juices from the meat piled on top; at the end of the meal the gravy-soaked trencher was eaten or given to the poor.\n\nWhat the earl's name did was give an old idea a fashionable label, and the timing was perfect. The eighteenth century saw the rise of coffee houses and busy urban life, and a portable, informal meal suited it well. In the following century, industrial cities needed food that workers could carry and eat quickly, and the sandwich fitted the factory day exactly.\n\nThe twentieth century turned it into an industry. The invention of commercially sliced bread in the United States in 1928 made assembly effortless and uniform. Refrigerated display, cling film and the pre-packed 'meal deal' followed, and the sandwich became one of the best-selling prepared foods in Britain and America, supporting a market worth billions.\n\nFood historians enjoy pointing out the irony: a dish named after a single aristocrat was really invented, and reinvented, by countless anonymous cooks across the world. The Earl of Sandwich gave his name to a food he certainly did not invent — proof that in cooking, as in much else, a good story can travel further than the truth.", "instructions_groups": [{"kind": "match", "label": "Вопросы 27–31. Соотнесите утверждение с фигурой или группой: A — John Montagu (граф Сэндвич), B — Hillel the Elder, C — средневековые европейцы, D — пищевая индустрия XX века. Буквы могут повторяться.", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "Is said to have eaten herbs and nuts between flatbreads at Passover."}, {"no": 28, "q": "Used slabs of stale bread as edible plates."}, {"no": 29, "q": "Gave the food its name."}, {"no": 30, "q": "Made assembly uniform through commercially sliced bread."}, {"no": 31, "q": "Reportedly ate at the card table while gambling."}]}, {"kind": "gap", "label": "Вопросы 32–36. Дополните предложения ОДНИМ словом или числом из текста.", "questions": [{"no": 32, "q": "The gambling story was first written down by a French ______."}, {"no": 33, "q": "Medieval diners used stale bread plates called ______."}, {"no": 34, "q": "Commercially sliced bread was invented in ______."}, {"no": 35, "q": "Hillel is said to have eaten herbs and nuts at ______."}, {"no": 36, "q": "Industrial cities needed food that ______ could carry and eat quickly."}]}, {"kind": "mc", "label": "Вопросы 37–40. Выберите один вариант.", "questions": [{"no": 37, "q": "The gambling story about Montagu", "options": ["A. was denied by his supporters, who said he ate at his desk", "B. is certainly true", "C. was invented in the twentieth century", "D. comes from his own diary"]}, {"no": 38, "q": "Trenchers were", "options": ["A. metal plates", "B. slices of meat", "C. thick slabs of stale bread used as plates", "D. a type of coffee house"]}, {"no": 39, "q": "Sliced bread mattered because", "options": ["A. it tasted better", "B. it was cheaper than meat", "C. it was invented in Britain", "D. it made sandwich assembly effortless and uniform"]}, {"no": 40, "q": "The main irony noted by historians is that", "options": ["A. the earl hated sandwiches", "B. the French invented the sandwich", "C. a food named after one aristocrat was really made by many anonymous cooks", "D. sandwiches are unhealthy"]}]}]}]}, "answers": {"1": {"a": ["TRUE"], "why": "«Captained HMS Beagle on Charles Darwin's famous voyage» — он командовал кораблём Дарвина."}, "2": {"a": ["TRUE"], "why": "Телеграф позволял слать весть о шторме «faster than the storm itself could travel»."}, "3": {"a": ["FALSE"], "why": "Royal Charter затонул в 1859, а ежедневные прогнозы начались в 1861 — то есть ПОСЛЕ, а не до."}, "4": {"a": ["TRUE"], "why": "«It was FitzRoy who coined the word 'forecast'»."}, "5": {"a": ["FALSE"], "why": "«Some scientists complained» — не все одобряли прогнозы."}, "6": {"a": ["NOT GIVEN"], "why": "О влиянии предупреждений на число кораблекрушений текст не говорит."}, "7": {"a": ["TRUE"], "why": "Бьеркнес «argued that the atmosphere obeys the laws of physics»."}, "8": {"a": ["map"], "why": "«Compared on a single map»."}, "9": {"a": ["synoptic"], "why": "«Charts he called 'synoptic'»."}, "10": {"a": ["cones"], "why": "«Hoisting cones on harbour masts»."}, "11": {"a": ["The Times", "Times"], "why": "«Publishing daily predictions in The Times»."}, "12": {"a": ["maps"], "why": "«Comparing the current map with past maps that looked similar»."}, "13": {"a": ["equations"], "why": "«Turning weather into equations»."}, "14": {"a": ["v"], "why": "Абзац A — старинный и до сих пор загадочный навык голубей."}, "15": {"a": ["i"], "why": "Абзац B — про «sun compass», компас по солнцу."}, "16": {"a": ["ii"], "why": "Абзац C — про магнитное поле Земли как запасной компас."}, "17": {"a": ["iv"], "why": "Абзац D — дорогу находят по запаху и ориентирам."}, "18": {"a": ["iii"], "why": "Абзац E — работают несколько чувств вместе."}, "19": {"a": ["C"], "why": "Сдвиг внутренних часов сбивал угол полёта — значит, голубь сочетает часы и положение солнца."}, "20": {"a": ["A"], "why": "«Tiny crystals of iron-rich material in the beak»."}, "21": {"a": ["D"], "why": "«Pigeons prevented from smelling often lose their way»."}, "22": {"a": ["B"], "why": "Трекеры показали «looping, habitual paths rather than dead-straight lines»."}, "23": {"a": ["NO"], "why": "«Exactly how they sense it is still debated» — полного понимания нет."}, "24": {"a": ["NO"], "why": "«The sun cannot be the whole story» — одного солнца недостаточно."}, "25": {"a": ["NOT GIVEN"], "why": "Сравнения интеллекта голубей с другими птицами в тексте нет."}, "26": {"a": ["YES"], "why": "«A pigeon combines sun, magnetism, smell and memory»."}, "27": {"a": ["B"], "why": "Хиллель ел горькие травы и орехи между лепёшками на Пасху (Passover)."}, "28": {"a": ["C"], "why": "Средневековые европейцы использовали «trenchers» как съедобные тарелки."}, "29": {"a": ["A"], "why": "«The food took his name» — еда получила имя графа."}, "30": {"a": ["D"], "why": "Нарезанный хлеб 1928 года «made assembly effortless and uniform»."}, "31": {"a": ["A"], "why": "По рассказу, Монтегю ел за карточным столом во время игры."}, "32": {"a": ["traveller", "traveler"], "why": "«A tale first written down by a French traveller»."}, "33": {"a": ["trenchers", "trencher"], "why": "«Thick slabs of stale bread called 'trenchers'»."}, "34": {"a": ["1928"], "why": "«Commercially sliced bread in the United States in 1928»."}, "35": {"a": ["Passover"], "why": "«Herbs and nuts pressed between flatbreads at Passover»."}, "36": {"a": ["workers"], "why": "«Food that workers could carry and eat quickly»."}, "37": {"a": ["A"], "why": "«His supporters said he was in fact a busy man eating at his desk»."}, "38": {"a": ["C"], "why": "«Thick slabs of stale bread called 'trenchers' as edible plates»."}, "39": {"a": ["D"], "why": "Нарезанный хлеб «made assembly effortless and uniform»."}, "40": {"a": ["C"], "why": "Ирония: блюдо назвали в честь одного аристократа, но создали безымянные повара."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "reading-14", "title": "Reading · Вариант 14", "minutes": 60, "passages": [{"title": "Tulip mania in the Netherlands", "text": "In the winter of 1636, something extraordinary was happening in the markets of the Dutch Republic. Contracts for tulip bulbs — flowers that would not even bloom until spring — were changing hands for the price of a comfortable house. This episode, later called 'tulip mania', is often described as the first great speculative bubble in recorded history, and it still appears in economics textbooks as a warning.\n\nThe tulip was not native to the Netherlands. It had arrived from the Ottoman Empire in the sixteenth century, and its intense, pure colours were unlike anything in European gardens. The most prized bulbs produced petals streaked with dramatic flames of contrasting colour. Buyers did not know that these beautiful patterns were in fact caused by a virus carried by aphids, which weakened the plant and made such bulbs rare and unpredictable — qualities that only pushed prices higher.\n\nBecause bulbs lie dormant underground for much of the year, traders began buying and selling promises to deliver them later, effectively a form of futures contract. Deals were struck in taverns, and much of the trade was conducted by people who never handled an actual bulb and never intended to grow one. Prices rose through 1636 as buyers assumed they could always sell to someone else for more.\n\nThen, in February 1637, the market simply collapsed. At a routine auction in Haarlem, no buyers appeared, and confidence evaporated within days. Contracts signed for enormous sums became worthless, and courts were left to untangle who owed what to whom. Some historians argue that the damage to the wider Dutch economy has been exaggerated, and that relatively few people were ruined; the vivid stories of bankruptcy and suicide, they say, owe much to later moralising pamphlets.\n\nWhatever the true scale, tulip mania has become a byword for financial madness, invoked whenever a modern asset — from shares to digital currencies — rises far above what reason seems to justify. What is striking is how modern the episode feels: ordinary people trading complex contracts on an asset they barely understood, convinced that prices could only go up. The tulip, meanwhile, survived its brush with economic history and remains one of the Netherlands' proudest symbols, grown today by the billion and exported around the world.", "instructions_groups": [{"kind": "tfng", "label": "Вопросы 1–7. TRUE — совпадает с текстом; FALSE — противоречит; NOT GIVEN — информации нет.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "questions": [{"no": 1, "q": "Some tulip contracts cost as much as a house."}, {"no": 2, "q": "The tulip was originally native to the Netherlands."}, {"no": 3, "q": "The flame-like patterns were caused by a virus spread by aphids."}, {"no": 4, "q": "Buyers at the time understood what caused the patterns."}, {"no": 5, "q": "Much of the trading involved people who never handled a real bulb."}, {"no": 6, "q": "The Dutch government banned tulip trading after 1637."}, {"no": 7, "q": "Some historians think the economic damage was overstated."}]}, {"kind": "gap", "label": "Вопросы 8–13. Дополните предложения ОДНИМ-ДВУМЯ словами из текста.", "questions": [{"no": 8, "q": "The tulip came to the Netherlands from the ______ Empire."}, {"no": 9, "q": "The colourful streaks were caused by a ______ carried by aphids."}, {"no": 10, "q": "Traders effectively sold ______ contracts to deliver bulbs later."}, {"no": 11, "q": "Deals were often struck in ______."}, {"no": 12, "q": "The market collapsed at an auction in ______ in February 1637."}, {"no": 13, "q": "Today the tulip remains one of the Netherlands' proudest ______."}]}]}, {"title": "The science of handwriting", "text": "A. Handwriting can feel like a dying skill. Keyboards and touchscreens now handle most of what people once wrote by hand, and many schools spend less time on penmanship than they did a generation ago. Yet a growing body of research suggests that forming letters by hand does something for the brain that typing does not — which is why the question of whether children should still learn to write is more than mere nostalgia.\n\nB. When we write by hand, several parts of the brain work together at once. The hand must plan and execute a different, complicated movement for every letter, while the eyes monitor the result and the mind attends to meaning. Brain-imaging studies show that this effortful process activates regions linked to learning and memory far more strongly than tapping identical keys does. In one well-known experiment, children who practised letters by hand later recognised them better than those who only typed them.\n\nC. The benefit seems to carry into later life. Studies of university students found that those who took lecture notes by hand understood and remembered the material better than those who typed, even though the typists recorded more words. The likely reason is revealing: because writing is slower, note-takers cannot get everything down and are forced to summarise in their own words — and that act of selecting and rephrasing is itself a form of learning.\n\nD. Handwriting also carries information that print cannot. The unique shape of a person's script has long been used, cautiously, in forensic investigation to link or distinguish documents, and a signature remains a legal mark of identity. Doctors, meanwhile, have learned the hard way that unclear handwriting can be dangerous: misread prescriptions were once a notable cause of medical error, one reason many hospitals have moved to typed records.\n\nE. None of this means the keyboard is the enemy. For long documents, for people with certain disabilities, and for sheer speed, typing is invaluable, and few would give it up. The emerging view among researchers is simply that the two skills do different jobs, and that abandoning handwriting altogether would quietly remove a useful tool for thinking — especially for young children first learning how letters and words are built.", "instructions_groups": [{"kind": "headings", "label": "Вопросы 14–18. Подберите заголовок к каждому абзацу A–E. Два заголовка лишние.", "options": ["i. How writing by hand engages the brain", "ii. Better notes, deeper learning", "iii. Not a contest between pen and keyboard", "iv. A skill that seems to be fading", "v. Clues in the shape of the script", "vi. The history of the fountain pen", "vii. Teaching adults to type faster"], "questions": [{"no": 14, "q": "Абзац A"}, {"no": 15, "q": "Абзац B"}, {"no": 16, "q": "Абзац C"}, {"no": 17, "q": "Абзац D"}, {"no": 18, "q": "Абзац E"}]}, {"kind": "mc", "label": "Вопросы 19–22. Выберите один вариант.", "questions": [{"no": 19, "q": "According to the passage, writing letters by hand", "options": ["A. is faster than typing", "B. uses only one part of the brain", "C. is easier for children than typing", "D. activates brain regions for learning more than typing"]}, {"no": 20, "q": "Students who took lecture notes by hand", "options": ["A. recorded more words than typists", "B. understood the material less well", "C. remembered the material better than typists", "D. copied lectures word for word"]}, {"no": 21, "q": "Unclear handwriting by doctors", "options": ["A. was once a notable cause of medical error", "B. improved patient trust", "C. was always easy to read", "D. replaced typed records"]}, {"no": 22, "q": "The emerging view among researchers is that", "options": ["A. handwriting should be banned", "B. typing is always superior", "C. the two skills do different jobs", "D. children should not learn to type"]}]}, {"kind": "ynng", "label": "Вопросы 23–26. YES — совпадает с мнением автора; NO — противоречит; NOT GIVEN — мнения нет.", "options": ["YES", "NO", "NOT GIVEN"], "questions": [{"no": 23, "q": "Typing should be completely replaced by handwriting."}, {"no": 24, "q": "Writing by hand can help young children learn letters."}, {"no": 25, "q": "Handwriting is more artistic than typing."}, {"no": 26, "q": "Slower note-taking can actually aid learning."}]}]}, {"title": "Island biodiversity", "text": "Islands have fascinated biologists since Charles Darwin puzzled over the finches of the Galápagos. Cut off by water, island populations evolve along their own paths, and the results are often strange and instructive. Because the same processes repeat on scattered islands around the world, islands have become natural laboratories for the study of evolution.\n\nOne striking pattern is 'adaptive radiation': a single colonising species diversifies to fill many empty roles. Darwin's finches are the classic case — from one ancestor came birds with beaks specialised for seeds, insects and even blood. Hawaii's honeycreepers tell a similar story, evolving into dozens of forms once the islands offered a range of unoccupied niches.\n\nSize, too, behaves oddly on islands. Freed from large predators, or squeezed by limited food, animals may shrink or swell over generations. Fossils reveal dwarf elephants that once lived on Mediterranean islands, no taller than a large dog, while in other cases small creatures became giants — the flightless dodo of Mauritius was, in effect, an oversized pigeon. The loss of flight itself is common on islands: where there are no ground predators to escape, wings are costly to grow and easy to lose, and many island birds, from rails to parrots, have abandoned them.\n\nThese same features make island life dangerously fragile. Species that evolved without predators often have no fear of them and no defences, so the arrival of rats, cats, goats or snakes from ships can be catastrophic. The dodo, hunted by sailors and preyed on by the animals they introduced, was extinct within a century of its discovery. Even today, introduced species are the leading cause of extinctions on islands, and conservationists spend great effort removing them.\n\nEcologists Robert MacArthur and Edward Wilson turned these observations into theory. Their 'theory of island biogeography', published in 1967, proposed that the number of species on an island reflects a balance between new arrivals and local extinctions, shaped by the island's size and its distance from the mainland. Larger, closer islands hold more species; small, remote ones hold fewer. The idea reached far beyond islands: nature reserves surrounded by farmland or city, biologists realised, behave much like islands in a sea of human land — a lesson that shapes conservation planning to this day.", "instructions_groups": [{"kind": "match", "label": "Вопросы 27–31. Соотнесите пример с явлением, которое он иллюстрирует: A — adaptive radiation, B — island dwarfism or gigantism, C — loss of flight, D — vulnerability to introduced species. Буквы могут повторяться.", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "Darwin's finches evolving beaks for different foods."}, {"no": 28, "q": "Dwarf elephants no taller than a large dog."}, {"no": 29, "q": "Island birds such as rails abandoning their wings."}, {"no": 30, "q": "Species with no fear of newly arrived rats and cats."}, {"no": 31, "q": "Hawaii's honeycreepers diversifying into dozens of forms."}]}, {"kind": "gap", "label": "Вопросы 32–36. Дополните предложения ОДНИМ словом или числом из текста.", "questions": [{"no": 32, "q": "Island populations are cut off from others by ______."}, {"no": 33, "q": "The flightless dodo lived on the island of ______."}, {"no": 34, "q": "The theory of island biogeography was published in ______."}, {"no": 35, "q": "Larger, closer islands hold ______ species than small, remote ones."}, {"no": 36, "q": "Nature reserves surrounded by farmland behave much like ______."}]}, {"kind": "mc", "label": "Вопросы 37–40. Выберите один вариант.", "questions": [{"no": 37, "q": "Adaptive radiation refers to", "options": ["A. a single species diversifying to fill many roles", "B. animals growing larger", "C. the extinction of island birds", "D. birds losing the ability to fly"]}, {"no": 38, "q": "Island animals may change size because", "options": ["A. they are hunted by sailors", "B. they face limited food or few predators", "C. they migrate to the mainland", "D. they cannot find water"]}, {"no": 39, "q": "Introduced species on islands are described as", "options": ["A. a minor problem today", "B. helpful to native species", "C. the leading cause of island extinctions", "D. easy to reverse"]}, {"no": 40, "q": "MacArthur and Wilson's theory was later applied to", "options": ["A. ocean currents", "B. the breeding of finches", "C. the design of ships", "D. nature reserves in a sea of human land"]}]}]}]}, "answers": {"1": {"a": ["TRUE"], "why": "Контракты уходили «for the price of a comfortable house»."}, "2": {"a": ["FALSE"], "why": "«The tulip was not native to the Netherlands» — тюльпан не был родным."}, "3": {"a": ["TRUE"], "why": "«Caused by a virus carried by aphids»."}, "4": {"a": ["FALSE"], "why": "«Buyers did not know» о причине узоров."}, "5": {"a": ["TRUE"], "why": "«People who never handled an actual bulb»."}, "6": {"a": ["NOT GIVEN"], "why": "О запрете торговли властями текст ничего не сообщает."}, "7": {"a": ["TRUE"], "why": "«The damage... has been exaggerated» — по мнению части историков."}, "8": {"a": ["Ottoman"], "why": "«It had arrived from the Ottoman Empire»."}, "9": {"a": ["virus"], "why": "«Caused by a virus carried by aphids»."}, "10": {"a": ["futures"], "why": "«Effectively a form of futures contract»."}, "11": {"a": ["taverns"], "why": "«Deals were struck in taverns»."}, "12": {"a": ["Haarlem"], "why": "«At a routine auction in Haarlem»."}, "13": {"a": ["symbols"], "why": "«One of the Netherlands' proudest symbols»."}, "14": {"a": ["iv"], "why": "Абзац A — навык, который, кажется, угасает."}, "15": {"a": ["i"], "why": "Абзац B — как письмо от руки задействует мозг."}, "16": {"a": ["ii"], "why": "Абзац C — рукописные конспекты дают более глубокое усвоение."}, "17": {"a": ["v"], "why": "Абзац D — подсказки в форме почерка (криминалистика, подпись)."}, "18": {"a": ["iii"], "why": "Абзац E — это не соперничество ручки и клавиатуры."}, "19": {"a": ["D"], "why": "Письмо от руки «activates regions linked to learning and memory far more strongly»."}, "20": {"a": ["C"], "why": "Писавшие от руки «understood and remembered the material better»."}, "21": {"a": ["A"], "why": "«Misread prescriptions were once a notable cause of medical error»."}, "22": {"a": ["C"], "why": "«The two skills do different jobs»."}, "23": {"a": ["NO"], "why": "Автор пишет, что клавиатура «is not the enemy» и печать незаменима."}, "24": {"a": ["YES"], "why": "Особенно полезно «for young children first learning how letters... are built»."}, "25": {"a": ["NOT GIVEN"], "why": "О большей «художественности» почерка автор не рассуждает."}, "26": {"a": ["YES"], "why": "Медленное письмо заставляет резюмировать — «itself a form of learning»."}, "27": {"a": ["A"], "why": "Разные клювы вьюрков — классический пример адаптивной радиации."}, "28": {"a": ["B"], "why": "Карликовые слоны — пример островного измельчания (dwarfism)."}, "29": {"a": ["C"], "why": "Пастушки и другие птицы утратили крылья — loss of flight."}, "30": {"a": ["D"], "why": "Отсутствие страха перед крысами и кошками — уязвимость к завезённым видам."}, "31": {"a": ["A"], "why": "Гавайские цветочницы диверсифицировались — адаптивная радиация."}, "32": {"a": ["water"], "why": "«Cut off by water»."}, "33": {"a": ["Mauritius"], "why": "«The flightless dodo of Mauritius»."}, "34": {"a": ["1967"], "why": "«Published in 1967»."}, "35": {"a": ["more"], "why": "«Larger, closer islands hold more species»."}, "36": {"a": ["islands"], "why": "«Behave much like islands in a sea of human land»."}, "37": {"a": ["A"], "why": "«A single colonising species diversifies to fill many empty roles»."}, "38": {"a": ["B"], "why": "«Freed from large predators, or squeezed by limited food»."}, "39": {"a": ["C"], "why": "«Introduced species are the leading cause of extinctions on islands»."}, "40": {"a": ["D"], "why": "Теорию применили к заповедникам «like islands in a sea of human land»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "reading-15", "title": "Reading · Вариант 15", "minutes": 60, "passages": [{"title": "The Antikythera mechanism", "text": "In 1901, divers exploring a Roman-era shipwreck off the tiny Greek island of Antikythera brought up a lump of corroded bronze the size of a small book. For decades it lay in a museum drawer, overshadowed by the statues and jewellery recovered from the same wreck. When scholars finally examined it, they found the remains of something no one had expected from the ancient world: a geared machine of astonishing complexity, now known as the Antikythera mechanism.\n\nThe device, built in Greece in roughly the second century BC, once held at least thirty interlocking bronze gears housed in a wooden case. By turning a handle on the side, a user could set the machine to any date and read off the positions of the Sun and Moon, the phase of the Moon, and probably the movements of the known planets. Dials on the back tracked longer cycles, including the timing of eclipses and the four-year schedule of the ancient Greek games, among them the Olympics.\n\nWhat makes the mechanism so remarkable is that nothing of comparable sophistication is known for well over a thousand years afterwards. Geared clocks of similar intricacy did not reappear in Europe until the medieval period. The skill it represents was, it seems, developed and then lost, a reminder of how much ancient knowledge has vanished without trace.\n\nStudying the object has been a long detective story. The bronze is fragile, cracked and encrusted, and the surviving fragments show only a fraction of the original. Progress came from technology: in the 2000s, researchers used high-resolution X-ray imaging to peer inside the fragments, revealing tiny gear teeth and — crucially — thousands of minute Greek letters engraved on the surfaces, a kind of instruction manual and astronomical guide hidden in the metal.\n\nThose inscriptions confirmed what the gears implied: the mechanism was a working model of the cosmos as the Greeks understood it, with the Earth at the centre. It was not a navigational instrument, as some had first guessed, but a device for teaching and display — perhaps to demonstrate the order of the heavens to students or admirers. Exactly who designed it remains unknown, though its sophistication points to a tradition of skilled craftsmen rather than a single genius. The Antikythera mechanism stands as proof that the ancient Greeks combined their famous theoretical science with a practical, mechanical ingenuity that historians had long underestimated.", "instructions_groups": [{"kind": "tfng", "label": "Вопросы 1–7. TRUE — совпадает с текстом; FALSE — противоречит; NOT GIVEN — информации нет.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "questions": [{"no": 1, "q": "The mechanism was found in a Roman-era shipwreck."}, {"no": 2, "q": "It was recognised as important as soon as it was discovered."}, {"no": 3, "q": "The device could show the phase of the Moon."}, {"no": 4, "q": "The mechanism could predict earthquakes."}, {"no": 5, "q": "Machines of similar complexity appeared soon afterwards in Greece."}, {"no": 6, "q": "X-ray imaging revealed Greek letters on the fragments."}, {"no": 7, "q": "The designer of the mechanism is known by name."}]}, {"kind": "gap", "label": "Вопросы 8–13. Дополните предложения ОДНИМ-ДВУМЯ словами из текста.", "questions": [{"no": 8, "q": "The bronze lump was recovered off the island of ______."}, {"no": 9, "q": "The device once contained at least thirty interlocking bronze ______."}, {"no": 10, "q": "Dials on the back tracked the timing of ______."}, {"no": 11, "q": "It also tracked the Greek games, among them the ______."}, {"no": 12, "q": "Researchers used high-resolution ______ imaging to look inside."}, {"no": 13, "q": "The mechanism modelled the cosmos with the ______ at the centre."}]}]}, {"title": "A history of window glass", "text": "A. For most of human history, a window was simply a hole in the wall — a way to let in light and air, and to let out smoke. The problem was obvious: an open window also let in cold, rain and thieves. Shutters, cloth and thin sheets of horn or oiled paper all offered partial solutions, but none combined the two things people really wanted, which were shelter and light at the same time.\n\nB. The Romans were the first to use glass in windows on any scale, casting small, cloudy panes for their grandest villas and bathhouses. Their glass was far from clear, but it marked a revolution: for the first time a room could be sealed against the weather and still be bright. When Roman power faded in western Europe, so largely did window glass, surviving chiefly in the coloured windows of great churches, where its glowing images were as important as the light itself.\n\nC. Making a flat, clear pane was surprisingly difficult. For centuries the standard method was the 'crown' process, in which a blown bubble of glass was spun into a flat disc; panes cut from it were small, and the thick central lump — the 'bull's-eye' — was the cheapest, least valued part, though today it is prized as decoration. Only wealthy households could afford to fill a large window, and glass was so valuable that some owners took their windows with them when they moved house.\n\nD. The breakthrough came slowly, then suddenly. In the nineteenth century, larger sheets could be made by blowing glass into long cylinders that were cut and flattened, allowing the great glass halls of the industrial age. But the decisive change was the 'float' process, developed in Britain in the 1950s, in which molten glass is floated on a bath of liquid tin to cool. The result is a perfectly flat, clear sheet, made cheaply and continuously — the glass in almost every modern window.\n\nE. Cheap, flawless glass changed how buildings look and feel. Architects could replace solid walls with expanses of glass, flooding interiors with daylight and giving cities their glittering towers. Today the frontier is glass that does more than let in light: coatings that reflect heat, panes that darken at the touch of a switch, and double or triple layers that keep warmth inside — turning the humble window, at last, into an active part of the wall.", "instructions_groups": [{"kind": "headings", "label": "Вопросы 14–18. Подберите заголовок к каждому абзацу A–E. Два заголовка лишние.", "options": ["i. The Romans bring glass indoors", "ii. The float process transforms glass", "iii. Windows that do more than admit light", "iv. A hole with no good solution", "v. The difficulty of making a flat pane", "vi. How stained glass is coloured", "vii. The decline of the glass industry"], "questions": [{"no": 14, "q": "Абзац A"}, {"no": 15, "q": "Абзац B"}, {"no": 16, "q": "Абзац C"}, {"no": 17, "q": "Абзац D"}, {"no": 18, "q": "Абзац E"}]}, {"kind": "mc", "label": "Вопросы 19–22. Выберите один вариант.", "questions": [{"no": 19, "q": "Before glass, windows were often covered with", "options": ["A. horn or oiled paper", "B. sheets of iron", "C. clear glass", "D. nothing at all"]}, {"no": 20, "q": "Roman window glass was", "options": ["A. perfectly clear", "B. cloudy but still a revolution", "C. only ever used in churches", "D. cheaper than paper"]}, {"no": 21, "q": "The 'bull's-eye' was originally", "options": ["A. the most valued part", "B. used only in churches", "C. the cheapest, least valued part", "D. impossible to make"]}, {"no": 22, "q": "The float process involves", "options": ["A. spinning a disc of glass", "B. blowing glass into cylinders", "C. pressing glass in moulds", "D. floating molten glass on liquid tin"]}]}, {"kind": "ynng", "label": "Вопросы 23–26. YES — совпадает с мнением автора; NO — противоречит; NOT GIVEN — мнения нет.", "options": ["YES", "NO", "NOT GIVEN"], "questions": [{"no": 23, "q": "Roman glass was as clear as modern glass."}, {"no": 24, "q": "Glass was once so valuable that people took windows when they moved."}, {"no": 25, "q": "Stained-glass windows are more beautiful than plain ones."}, {"no": 26, "q": "Modern coatings can make glass reflect heat."}]}]}, {"title": "Learning a second language as an adult", "text": "It is often said that children soak up languages effortlessly while adults struggle, and that anyone hoping to speak a second language should start young. Like many popular beliefs, this one is partly true, partly misleading, and more interesting than the slogan suggests.\n\nThe idea has a scientific name: the 'critical period hypothesis', proposed in the 1960s, which holds that the brain is especially wired for language in early childhood and that this window narrows after puberty. There is real evidence behind it, above all in pronunciation. People who begin a language before their early teens are far more likely to speak it without a foreign accent; the fine motor control of unfamiliar sounds seems genuinely harder to acquire later. In this narrow sense, younger really is better.\n\nBut 'better at sounding native' is not the same as 'better at learning'. In the early stages, adults and older children often make faster progress than young children, because they can already read, use dictionaries, grasp grammatical rules explicitly and draw on the structure of their first language. A motivated adult who studies deliberately can reach a high level of reading and conversation in a couple of years — something a small child cannot do.\n\nCircumstances matter as much as age. Children who appear to learn effortlessly are usually immersed: surrounded by the language for many hours a day, with a strong social need to fit in and no fear of embarrassment. Adults rarely enjoy those conditions, juggling jobs and families and often practising for only a few hours a week. When adults are placed in genuine immersion, their progress can be surprisingly rapid, which suggests that exposure, not just youth, drives much of the difference.\n\nAttitude plays a quiet but powerful role. Adults are more self-conscious and more afraid of making mistakes, and that anxiety can block the very practice they need. Researchers consistently find that motivation and a willingness to tolerate errors predict success in adult learners better than raw talent does. The good news for late starters is clear: while a flawless accent may be hard to win after childhood, fluent, confident use of a new language is well within reach at any age — given time, exposure and the courage to sound imperfect.", "instructions_groups": [{"kind": "match", "label": "Вопросы 27–31. Соотнесите утверждение с идеей: A — the critical period hypothesis, B — advantages that adults have, C — the role of immersion, D — attitude and anxiety. Буквы могут повторяться.", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "The claim that a language window narrows after puberty."}, {"no": 28, "q": "Being able to use dictionaries and grasp grammar rules explicitly."}, {"no": 29, "q": "Learning quickly because of many hours of daily exposure."}, {"no": 30, "q": "Fear of making mistakes blocking the practice a learner needs."}, {"no": 31, "q": "The greater likelihood of a native accent when starting young."}]}, {"kind": "gap", "label": "Вопросы 32–36. Дополните предложения ОДНИМ словом или числом из текста.", "questions": [{"no": 32, "q": "The critical period hypothesis was proposed in the ______."}, {"no": 33, "q": "The language window is said to narrow after ______."}, {"no": 34, "q": "Adults can draw on the structure of their ______ language."}, {"no": 35, "q": "Children who learn easily are usually ______ in the language."}, {"no": 36, "q": "In adult learners, motivation predicts success better than raw ______."}]}, {"kind": "mc", "label": "Вопросы 37–40. Выберите один вариант.", "questions": [{"no": 37, "q": "According to the passage, starting young mainly helps with", "options": ["A. reading skills", "B. grammar knowledge", "C. vocabulary size", "D. acquiring a native accent"]}, {"no": 38, "q": "In the early stages of learning, adults often", "options": ["A. progress more slowly than young children", "B. cannot use grammar rules", "C. make faster progress than young children", "D. avoid using dictionaries"]}, {"no": 39, "q": "Adult immersion suggests that", "options": ["A. youth alone explains success", "B. immersion is useless for adults", "C. exposure matters as much as age", "D. children cannot be immersed"]}, {"no": 40, "q": "The passage concludes that fluent use of a new language", "options": ["A. is impossible after childhood", "B. is within reach at any age", "C. requires a perfect accent", "D. depends only on talent"]}]}]}]}, "answers": {"1": {"a": ["TRUE"], "why": "«A Roman-era shipwreck off the tiny Greek island of Antikythera»."}, "2": {"a": ["FALSE"], "why": "Оно годами лежало в ящике музея, «overshadowed» другими находками."}, "3": {"a": ["TRUE"], "why": "«Read off... the phase of the Moon»."}, "4": {"a": ["NOT GIVEN"], "why": "О предсказании землетрясений в тексте нет ни слова (только затмения и т.п.)."}, "5": {"a": ["FALSE"], "why": "«Nothing of comparable sophistication is known for well over a thousand years afterwards»."}, "6": {"a": ["TRUE"], "why": "Рентген выявил «thousands of minute Greek letters engraved on the surfaces»."}, "7": {"a": ["FALSE"], "why": "«Exactly who designed it remains unknown»."}, "8": {"a": ["Antikythera"], "why": "«Off the tiny Greek island of Antikythera»."}, "9": {"a": ["gears"], "why": "«At least thirty interlocking bronze gears»."}, "10": {"a": ["eclipses"], "why": "«Including the timing of eclipses»."}, "11": {"a": ["Olympics"], "why": "«The ancient Greek games, among them the Olympics»."}, "12": {"a": ["X-ray", "X ray", "xray"], "why": "«High-resolution X-ray imaging»."}, "13": {"a": ["Earth"], "why": "«A working model of the cosmos... with the Earth at the centre»."}, "14": {"a": ["iv"], "why": "Абзац A — окно было дырой без хорошего решения."}, "15": {"a": ["i"], "why": "Абзац B — римляне впервые вставили стекло в окна."}, "16": {"a": ["v"], "why": "Абзац C — как трудно было сделать плоское стекло."}, "17": {"a": ["ii"], "why": "Абзац D — флоат-процесс преобразил стекло."}, "18": {"a": ["iii"], "why": "Абзац E — стекло, которое делает больше, чем просто пропускает свет."}, "19": {"a": ["A"], "why": "«Thin sheets of horn or oiled paper»."}, "20": {"a": ["B"], "why": "«Far from clear, but it marked a revolution»."}, "21": {"a": ["C"], "why": "«The 'bull's-eye' — was the cheapest, least valued part»."}, "22": {"a": ["D"], "why": "«Molten glass is floated on a bath of liquid tin»."}, "23": {"a": ["NO"], "why": "Римское стекло было «far from clear» — не как современное."}, "24": {"a": ["YES"], "why": "«Some owners took their windows with them when they moved house»."}, "25": {"a": ["NOT GIVEN"], "why": "Сравнения красоты витражей и простых окон автор не даёт."}, "26": {"a": ["YES"], "why": "«Coatings that reflect heat»."}, "27": {"a": ["A"], "why": "Сужение окна после полового созревания — суть critical period hypothesis."}, "28": {"a": ["B"], "why": "Умение пользоваться словарями и правилами — преимущество взрослых."}, "29": {"a": ["C"], "why": "Быстрое обучение от многочасового погружения — роль immersion."}, "30": {"a": ["D"], "why": "Страх ошибок, мешающий практике, — отношение и тревожность."}, "31": {"a": ["A"], "why": "Более вероятный «родной» акцент при раннем старте — часть critical period hypothesis."}, "32": {"a": ["1960s"], "why": "«Proposed in the 1960s»."}, "33": {"a": ["puberty"], "why": "«This window narrows after puberty»."}, "34": {"a": ["first"], "why": "«Draw on the structure of their first language»."}, "35": {"a": ["immersed"], "why": "«Children who appear to learn effortlessly are usually immersed»."}, "36": {"a": ["talent"], "why": "«Better than raw talent does»."}, "37": {"a": ["D"], "why": "Ранний старт помогает прежде всего с акцентом/произношением."}, "38": {"a": ["C"], "why": "«Adults and older children often make faster progress than young children»."}, "39": {"a": ["C"], "why": "«Exposure, not just youth, drives much of the difference»."}, "40": {"a": ["B"], "why": "«Fluent, confident use of a new language is well within reach at any age»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}];

const FOUNDATION_COUNTRIES = ["Россия", "Казахстан", "Беларусь"];
// Foundation не нужен магистрам (есть Pre-Masters) и, в большинстве случаев,
// действующим студентам бакалавриата — обычно засчитывают 1–2 закрытых курса.
function needsFoundation(certCountry, status = "", target = ""){
  if (target === "Магистратура в UK") return false;
  if ((status || "").startsWith("Студент/выпускник бакалавриата")) return false;
  return FOUNDATION_COUNTRIES.includes(certCountry) || !certCountry;
}
const FIELD_TITLES = {business:"Бизнес и менеджмент", economics:"Экономика и финансы", cs:"Computer Science и IT",
  engineering:"Инженерия", law:"Право", life:"Медицина и биология", art:"Дизайн и искусство", humanities:"Гуманитарные науки"};
function matchUnis(dirTag, gpa, ielts, needFnd = true, level = "bachelor"){
  const tiers = {safe:0, match:1, reach:2}, titles = {safe:"уверенно", match:"реально", reach:"на вырост"};
  const master = level === "master";
  const out = [];
  CATALOG.forEach(([name, city, fields, minGpa, minIelts, courses, note, foundation], ci) => {
    if (!master && needFnd && !foundation) return;
    if (dirTag && !fields.includes(dirTag)) return;
    let tier;
    if (gpa == null) tier = "match";
    else if (gpa >= minGpa + 0.4) tier = "safe";
    else if (gpa >= minGpa) tier = "match";
    else if (gpa >= minGpa - 0.3) tier = "reach";
    else return;
    if (master) courses = "Магистратура: MSc/MA по направлению" + (foundation ? " · при нехватке балла есть Pre-Masters" : "");
    out.push({name, city, courses, note, minGpa, minIelts, ci, tier, tierTitle: titles[tier],
              foundation, ieltsGap: ielts != null && ielts < minIelts});
  });
  out.sort((a,b) => tiers[a.tier]-tiers[b.tier] || b.minGpa-a.minGpa);
  return out;
}

const VIEWS = {};
function go(v, arg){
  document.body.dataset.view = v;
  document.querySelectorAll(".view").forEach(x => x.classList.remove("on"));
  const el = document.getElementById("v-" + v);
  if (el) el.classList.add("on");
  (VIEWS[v] || (()=>{}))(arg);
  toggleMenu(false);
  renderMenu(v);
  window.scrollTo({top:0});
}

  ).join("") + `<label class="menu-close" onclick="toggleMenu(false)">Закрыть</label>`;

// перетаскивание кнопки меню зажатием — как в полной версии
const fabWrap = document.getElementById("fabwrap"), fabBtn = document.getElementById("fab");
let fabHold=null, fabDrag=false, fabMoved=false, fabSuppress=false, fsx=0, fsy=0;
function placeFab(xr, yr){
  const vw=innerWidth, vh=innerHeight, fw=fabBtn.offsetWidth, fh=fabBtn.offsetHeight;
  const cx=Math.min(Math.max(xr*vw, fw/2+8), vw-fw/2-8);
  const cy=Math.min(Math.max(yr*vh, fh/2+8), vh-fh/2-8);
  fabWrap.classList.toggle("menu-below", cy < vh/2);
  fabWrap.classList.toggle("menu-left", cx < vw/2);
  fabWrap.style.right=(vw-cx-fw/2)+"px";
  if (cy < vh/2){ fabWrap.style.top=(cy-fh/2)+"px"; fabWrap.style.bottom="auto"; }
  else { fabWrap.style.bottom=(vh-cy-fh/2)+"px"; fabWrap.style.top="auto"; }
}
fabBtn.addEventListener("pointerdown", e => {
  fsx=e.clientX; fsy=e.clientY; fabMoved=false;
  fabHold=setTimeout(()=>{ fabHold=null; fabDrag=true; fabBtn.classList.add("dragging"); toggleMenu(false); fabBtn.setPointerCapture(e.pointerId); },350);
});
fabBtn.addEventListener("pointermove", e => {
  if (!fabDrag){ if (fabHold && Math.hypot(e.clientX-fsx,e.clientY-fsy)>12){clearTimeout(fabHold);fabHold=null;} return; }
  fabMoved=true; placeFab(e.clientX/innerWidth, e.clientY/innerHeight);
});
function fabEnd(){ if(fabHold){clearTimeout(fabHold);fabHold=null;} if(!fabDrag)return;
  fabDrag=false; fabBtn.classList.remove("dragging");
  if(fabMoved){ fabSuppress=true; setTimeout(()=>fabSuppress=false,0); } }
fabBtn.addEventListener("pointerup", fabEnd);
fabBtn.addEventListener("pointercancel", fabEnd);

// ---- диагностика ----
addView("ob", "");
VIEWS.ob = () => {
  const answers = {}; let i = 0, gpa = null;
  const box = document.getElementById("v-ob");
  // showIf: ["ключ","значение"] — показать при совпадении; ["ключ","!значение"] — при НЕсовпадении
  const shown = qd => { if (!qd.showIf) return true;
    const [k, v] = qd.showIf;
    return v.startsWith("!") ? answers[k] !== v.slice(1) : answers[k] === v; };
  function q(){
    while (i < QUESTIONS.length && !shown(QUESTIONS[i])) i++;
    if (i >= QUESTIONS.length) return gpaStep();
    const cur = QUESTIONS[i];
    box.innerHTML = `<h1>Пара минут — и соберу план</h1>
      <div class="gbar"><i style="width:${(i/(QUESTIONS.length+1))*100}%"></i></div>
      <h3 style="font-size:18px;margin:0 0 6px">${i+1}/${QUESTIONS.length} · ${esc(cur.t)}</h3>
      ${cur.o ? `<div class="ob-opts">${cur.o.map(o=>`<button onclick="obAnswer('${esc(o).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join("")}</div>`
              : `<div class="iform" style="margin-top:12px"><textarea id="ob-free" rows="3" placeholder="Ответьте своими словами"></textarea>
                 <button class="btn" style="border:0;margin-top:10px" onclick="obAnswer(document.getElementById('ob-free').value.trim())">Дальше</button></div>`}`;
    window.obAnswer = v => { if(!v) return; answers[cur.k]=v; i++; q(); };
  }
  function gpaStep(){
    const master = answers.target === "Магистратура в UK";
    const forecast = master ? (answers.degree_status||"").startsWith("Заканчиваю")
                            : (answers.cert_status||"").startsWith("Ещё учусь");
    const title = master ? (forecast ? "Прогнозируемый балл диплома" : "Средний балл диплома бакалавра")
                         : (forecast ? "Прогнозируемый средний балл" : "Средний балл аттестата");
    const hint = master
      ? (forecast ? "Диплома ещё нет — укажите балл, на который идёте." : "По 5-балльной шкале, как в приложении к диплому.")
        + " По нему подберу магистерские программы, куда реально поступить."
      : (forecast ? "Аттестата ещё нет — укажите балл, на который идёте." : "По 5-балльной шкале, например 4.6.")
        + " По нему подберу вузы, куда реально поступить.";
    box.innerHTML = `<h1>${title}</h1>
      <div class="gbar"><i style="width:95%"></i></div>
      <p class="sub">${hint}</p>
      <div class="card iform">
        <label>Средний балл<input id="gpa-in" type="number" step="0.01" min="2" max="5" inputmode="decimal" placeholder="4.60"></label>
        <button class="btn" style="border:0" onclick="gpaManual()">Дальше</button>
        <button style="background:none;border:0;color:var(--sky);font-weight:600;cursor:pointer;text-align:left;padding:10px 0 0;font-size:13.5px" onclick="gpaCalc()">Не знаю — посчитать по оценкам</button>
        <p class="cc" id="gpa-err" style="color:var(--err);min-height:1.2em"></p>
      </div>
      <div class="card iform" id="gpa-calc" hidden>
        <p class="cc" style="margin:0 0 10px">Сколько итоговых оценок за четверти/триместры/семестры:</p>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px">
          <label>Пятёрок<input id="c5" type="number" min="0" value="0" oninput="gpaRecalc()"></label>
          <label>Четвёрок<input id="c4" type="number" min="0" value="0" oninput="gpaRecalc()"></label>
          <label>Троек<input id="c3" type="number" min="0" value="0" oninput="gpaRecalc()"></label>
        </div>
        <p style="font-size:14px;margin:4px 0 10px">Средний балл: <b id="calc-avg" style="font-family:var(--mono);font-size:19px">—</b></p>
        <button class="btn" style="border:0" id="calc-use" disabled onclick="gpaUse()">Использовать этот балл</button>
      </div>`;
    window.gpaManual = () => {
      const v = parseFloat(document.getElementById("gpa-in").value.replace(",", "."));
      if (isNaN(v)||v<2||v>5) { document.getElementById("gpa-err").textContent="Балл от 2 до 5 — например 4.6."; return; }
      gpa = Math.round(v*100)/100; trackStep();
    };
    window.gpaCalc = () => { document.getElementById("gpa-calc").hidden = false; };
    window.gpaRecalc = () => {
      const n5=+document.getElementById("c5").value||0, n4=+document.getElementById("c4").value||0, n3=+document.getElementById("c3").value||0;
      const n=n5+n4+n3;
      const el=document.getElementById("calc-avg"), btn=document.getElementById("calc-use");
      if(!n){el.textContent="—";btn.disabled=true;return null;}
      const avg=Math.round((5*n5+4*n4+3*n3)/n*100)/100;
      el.textContent=avg.toFixed(2); btn.disabled=false; return avg;
    };
    window.gpaUse = () => { gpa = window.gpaRecalc(); if (gpa!=null) trackStep(); };
  }
  function trackStep(){
    box.innerHTML = `<h1>Какой трек вам нужен?</h1><div class="gbar"><i style="width:100%"></i></div>
      <div class="ob-opts">
        <button onclick="obTrack('admissions')">🎓 Поступление в UK<br><span class="cc">план цикла UCAS + IELTS и все инструменты</span></button>
        <button onclick="obTrack('ielts')">📝 Подготовка к IELTS<br><span class="cc">эссе, mock-интервью, план подготовки</span></button>
        <button onclick="obTrack('both')">🎓+📝 И то и другое<br><span class="cc">полный план</span></button>
      </div>`;
    window.obTrack = track => {
      const months = DEADLINE_MONTHS[answers.deadline] || 12;
      const now = Date.now(), horizon = months*30*24*3600*1000;
      const plan = PLAN_STEPS[track].map(([title, frac]) => ({
        title, due: new Date(now + horizon*frac).toISOString().slice(0,10), done: false }));
      store.survey = {answers, gpa, track}; store.plan = plan; save();
      go("plan");
    };
  }
  q();
};

VIEWS.plan = () => {
  const box = document.getElementById("v-plan");
  if (!store.survey){ box.innerHTML = `<h1>План</h1><p class="sub">Сначала пройдите диагностику.</p>
    <button class="btn" style="border:0" onclick="go('ob')">Пройти диагностику</button>`; return; }
  const fmt = iso => iso.split("-").reverse().join(".");
  const days = iso => Math.round((new Date(iso) - Date.now())/86400000);
  const badge = d => d < 0 ? ["soon","просрочено"] : d <= 7 ? ["soon", d+" дн."] : ["far", d+" дн."];
  const a = store.survey.answers;
  const level = a.target === "Магистратура в UK" ? "master" : "bachelor";
  const needFnd = needsFoundation(a.cert_country || "", a.status || "", a.target || "");
  const m = matchUnis(DIRS[a.programs]||"", store.survey.gpa, IELTS_BAND[a.ielts] ?? null, needFnd, level);
  const undecided = (a.unis||"").startsWith("Ещё");
  const routeNote = level === "master"
    ? "Подбор магистратуры: Foundation не нужен, балл — средний по диплому; где его не хватает, отмечен Pre-Masters."
    : (a.status||"").startsWith("Студент/выпускник бакалавриата")
      ? "Вы уже студент бакалавриата — Foundation в большинстве случаев не нужен: обычно засчитывают 1–2 закрытых курса (вуз может решить иначе, финально проверит куратор)."
      : needFnd
        ? "Показаны только вузы с Foundation-маршрутом (из каталога топ-100): с вашим аттестатом прямой вход в бакалавриат недоступен."
        : "Каталог топ-100, включая вузы без Foundation — ваш аттестат позволяет прямой вход.";
  box.innerHTML = `<h1>Привет, ${esc(store.user.name)}!</h1>
    <p class="sub">${NOTE("Демонстрационный план: дедлайны рассчитаны от вашего ответа «когда подаётесь». В полной версии план точнее и приходит с напоминаниями.")}</p>
    ${store.plan.map((s,k) => {
      const [cls,label] = s.done ? ["ok","готово"] : badge(days(s.due));
      return `<label class="pi"><input type="checkbox" ${s.done?"checked":""} onchange="planToggle(${k})">
        <span><span class="t" style="${s.done?'text-decoration:line-through':''}">${esc(s.title)}</span><span class="d">до ${fmt(s.due)}</span></span>
        <span class="badge ${cls}">${label}</span></label>`; }).join("")}
    <h3 style="font-size:19px;margin:22px 0 8px">Куда реально поступить</h3>
    <p class="cc" style="margin-bottom:10px">${undecided?"Вы ещё не выбрали вузы — вот с чего начать шорт-лист. ":""}Исходные данные:
      ${esc(a.programs||"")}${store.survey.gpa?` · балл ${store.survey.gpa.toFixed(2)}`:""} · ${IELTS_BAND[a.ielts]?`IELTS ~${IELTS_BAND[a.ielts]}`:"IELTS впереди"}.
      ${routeNote} Нажмите на вуз — откроется его профиль.</p>
    ${[["reach","На вырост — амбициозные"],["match","Реально — ваш уровень"],["safe","Уверенно — запасные"]].map(([tier, title]) => {
      const g = m.filter(u => u.tier === tier);
      if (!g.length) return "";
      return `<p style="font-weight:700;font-size:13px;margin:14px 0 8px">${title}</p>` +
        g.slice(0,6).map(u => `<div class="card" style="cursor:pointer" onclick="go('uni', ${u.ci})">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap">
            <b style="font-size:14px">${esc(u.name)} · ${esc(u.city)}</b>
            <span class="chip ${u.tier==='safe'?'mint':''}" style="${u.tier==='reach'?'color:var(--tile);border-color:rgba(199,91,57,.5)':''}">${u.tierTitle}</span></div>
          <p class="cc" style="margin-top:6px">${esc(u.courses)} — ${esc(u.note)}</p>
          <p class="cc" style="margin-top:5px">Типичный вход: балл от ${u.minGpa.toFixed(1)}, IELTS от ${u.minIelts.toFixed(1)}${u.ieltsGap?" · вашего IELTS пока не хватает — решаемо":""}</p></div>`).join("") +
        (g.length > 6 ? `<p class="cc" style="margin:4px 0 8px">…и ещё ${g.length - 6} в этой группе — в полной версии куратор сузит список под ваши цели.</p>` : "");
    }).join("")}
    <p class="cc" style="font-size:11.5px">Подборка — ориентир по типичным требованиям программ, не гарантия. Финальный шорт-лист проверяет куратор.</p>`;
  window.planToggle = k => { store.plan[k].done = !store.plan[k].done; save(); VIEWS.plan(); };
};

window.chatSend = () => {
  const inp = document.getElementById("chat-in"), log = document.getElementById("chat-log");
  const text = inp.value.trim(); if (!text) return; inp.value = "";
  log.insertAdjacentHTML("beforeend", `<div class="msg m-user">${esc(text)}</div>`);
  const hit = CHAT_CANNED.find(([re]) => re.test(text));
  const reply = hit ? hit[1] : "В офлайн-версии я отвечаю только на самые частые темы: IELTS, виза, бюджет, UCAS, Foundation. Полный ассистент с проверенной базой и эскалацией куратору — в полной версии.";
  setTimeout(() => {
    log.insertAdjacentHTML("beforeend", `<div class="msg m-bot">${esc(reply).replace(/\n/g,"<br>")}</div>`);
    log.lastElementChild.scrollIntoView({behavior:"smooth"});
  }, 350);
};

    <p class="cc" style="font-weight:700;margin:12px 0 6px">Task 2 · 40 минут · 250+ слов — эссе-рассуждение, две трети оценки</p>
    ${WRITING_TOPICS.task2.map((t, i) => `<div class="card" style="cursor:pointer" onclick="wStart('task2',${i})">
      <p style="font-size:13px;margin:0">${esc(t)}</p></div>`).join("")}
    <p class="cc" style="font-weight:700;margin:14px 0 6px">Task 1 · 20 минут · 150+ слов — описание данных или процесса</p>
    ${WRITING_TOPICS.task1.map((t, i) => `<div class="card" style="cursor:pointer" onclick="wStart('task1',${i})">
      <p style="font-size:13px;margin:0">${esc(t)}</p></div>`).join("")}`;
  window.wStart = (task, ti) => {
    const topic = WRITING_TOPICS[task][ti ?? Math.floor(Math.random()*WRITING_TOPICS[task].length)];
    let left = (task === "task2" ? 40 : 20) * 60;
    const target = task === "task2" ? 250 : 150;
    box.innerHTML = `<h1>Writing · ${task === "task2" ? "Task 2" : "Task 1"}</h1>
      <div class="timerbox"><b id="w-timer">--:--</b>
        <span style="font-size:12.5px;color:var(--tx2)"><span id="w-words">0</span> слов · цель ${target}+ · время выйдет — проверка запустится сама</span></div>
      <div class="card"><p style="font-size:13.5px;margin:0">${esc(topic)}</p></div>
      <div class="iform"><textarea id="w-text" rows="12" placeholder="Пишите здесь..."></textarea></div>
      <button class="btn" style="border:0;margin-top:10px" onclick="wCheck()">Проверить эссе</button>`;
    const tick = () => {
      const m = String(Math.floor(left/60)).padStart(2,"0"), s = String(left%60).padStart(2,"0");
      const el = document.getElementById("w-timer"); if (!el) { clearInterval(wTimer); return; }
      el.textContent = m+":"+s;
      if (--left < 0) { clearInterval(wTimer); window.wCheck(); }
    };
    tick(); wTimer = setInterval(tick, 1000);
    document.getElementById("w-text").addEventListener("input", e => {
      document.getElementById("w-words").textContent = e.target.value.trim().split(/\s+/).filter(Boolean).length;
    });
    window.wCheck = () => {
      clearInterval(wTimer);
      const text = (document.getElementById("w-text")||{value:""}).value;
      const words = text.trim().split(/\s+/).filter(Boolean).length;
      const sents = text.split(/[.!?]+/).filter(s=>s.trim()).length || 1;
      const avgLen = words / sents;
      let band = 5.5;
      if (words >= target) band += 0.5;
      if (words >= target * 1.2) band += 0.25;
      if (avgLen >= 12 && avgLen <= 24) band += 0.5;
      if (/however|moreover|furthermore|although|whereas|consequently/i.test(text)) band += 0.25;
      band = Math.min(7.5, Math.round(band*2)/2);
      store.mock = store.mock || {}; store.mock.writing = band; save();
      box.innerHTML = `<h1>Примерный разбор</h1>${AI_NOTE}
        <div class="ring" style="background:conic-gradient(var(--tile) 0 ${band/9*100}%, #E3DCC9 0)"><div class="in"><b>${band.toFixed(1)}</b><span>очень грубый ориентир</span></div></div>

          <ul style="padding-left:17px;color:var(--tx2);font-size:13px;margin:8px 0 0">
            <li>Объём: ${words} слов ${words>=target?"— цель достигнута ✓":`— ниже цели ${target}, это сразу минус к Task Response`}</li>
            <li>Средняя длина предложения: ${avgLen.toFixed(0)} слов ${avgLen<8?"— коротковато, добавьте сложные конструкции":avgLen>26?"— громоздко, режьте":"— здоровый диапазон"}</li>
            <li>Связки (however, moreover…): ${/however|moreover|furthermore|although|whereas|consequently/i.test(text)?"есть ✓":"не найдены — Coherence пострадает"}</li>
          </ul></div>
        <div class="card"><b style="font-size:13px">Что сделает полная версия</b>
          <p class="cc" style="margin-top:6px">Разбор по четырём официальным критериям с баллами, правки «было → стало»
          по вашему тексту с объяснениями и честный прогноз band ±0.5.</p></div>
        ${window.mockChain ? `<button class="btn" style="border:0;display:block;width:100%;margin-top:14px" onclick="window.mockChain=false; go('mock')">Мок завершён — посмотреть Overall →</button>` : ""}
        <button class="btn" style="border:0;margin-top:12px" onclick="VIEWS.writing()">Ещё эссе</button>`;
    };
  };
};

addView("reading", "");
let rTimer = null;
VIEWS.reading = () => {
  clearInterval(rTimer);
  const box = document.getElementById("v-reading");
  if (!ieltsAllowed()){
    box.innerHTML = `<p style="margin:2px 0 0"><button class="lnk" onclick="go('ielts')">← IELTS</button></p>

  }
  const rDone = (store.bands || {}).reading || {};
  box.innerHTML = `<p style="margin:2px 0 0"><button class="lnk" onclick="go('ielts')">← IELTS</button></p>
    <h1 style="margin:6px 0 8px">IELTS Reading</h1>
    ${window.mockChain ? `<p class="cc" style="font-family:var(--mono);font-size:11px;color:var(--tile)">[ ПОЛНЫЙ МОК · ШАГ 2 ИЗ 3 ]</p>` : ""}
    <p class="sub">База тестов: выберите вариант. В каждом — 3 академических пассажа, 40 вопросов,
    таймер 60 минут; время выйдет — тест сдастся сам. В полной версии банк пополняется автоматически.</p>
    ${READING_TESTS.map((t, i) => `<div class="card" style="cursor:pointer" onclick="rStart(${i})">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
        <b style="font-family:var(--serif);font-weight:400;font-size:17px">Вариант ${i+1}</b>

      <p class="cc" style="margin-top:5px">${t.test.passages.map(p => esc(p.title)).join(" · ")}</p></div>`).join("")}`;
  window.rStart = vi => {
    const RT = READING_TESTS[vi];
    const answers = {};
    let left = 60 * 60, cur = 0;
    const P = RT.test.passages;

    function answered(){ return Object.keys(answers).filter(k => answers[k]).length; }
    function fmt(s){ return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); }

    rTimer = setInterval(() => {
      left--;
      const el = document.getElementById("r-clock");
      if (!el) { clearInterval(rTimer); return; }
      el.textContent = fmt(left);
      if (left <= 0) finish();
    }, 1000);

    function groupHtml(g){
      const qs = g.questions.map(q => {
        const chosen = answers[q.no] || "";
        if (g.kind === "gap")
          return `<div class="q"><p><b>${q.no}.</b> ${esc(q.q)}</p>
            <input class="r-gap" data-no="${q.no}" value="${esc(chosen)}" placeholder="ответ одним-двумя словами"
              style="width:100%;background:var(--milk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit"></div>`;
        const opts = g.kind === "mc" ? q.options : g.options;
        const stack = g.kind === "mc" || (g.options && g.options[0] && g.options[0].length > 14);
        return `<div class="q"><p><b>${q.no}.</b> ${esc(q.q)}</p>
          <div class="pills" style="${stack ? "flex-direction:column;align-items:stretch" : ""}">
            ${opts.map(o => {
              const val = g.kind === "mc" ? o.split(".")[0].trim() : o;
              return `<label class="r-pill ${chosen === val ? "onp" : ""}" data-no="${q.no}" data-val="${esc(val)}"
                style="${stack ? "border-radius:11px" : ""}${chosen === val ? ";border-color:var(--tile);color:var(--tile)" : ""}">${esc(o)}</label>`;
            }).join("")}
          </div></div>`;
      }).join("");
      return `<p class="cc" style="font-weight:600;margin:14px 0 8px">${esc(g.label)}</p>${qs}`;
    }

    function render(){
      const pas = P[cur];
      box.innerHTML = `
        <div class="timerbox"><b id="r-clock">${fmt(left)}</b>
          <span style="font-size:12px;color:var(--tx2)">отвечено <span id="r-done">${answered()}</span>/40</span>
          <button class="ghost" style="margin-left:auto;padding:8px 12px;font-size:12px" onclick="rFinish()">Завершить</button></div>
        <div style="display:flex;gap:6px;margin-bottom:10px">
          ${P.map((pp,i)=>`<button class="r-tab" data-i="${i}" style="flex:1;min-height:42px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;background:var(--cream);border:1px solid ${i===cur?"var(--tile)":"var(--line)"};color:${i===cur?"var(--tile)":"var(--tx2)"}">Пассаж ${i+1}</button>`).join("")}
        </div>
        <div class="passage" style="max-height:34vh"><b>${esc(pas.title)}</b><br><br>${esc(pas.text).replace(/\n/g,"<br>")}</div>
        ${pas.instructions_groups.map(groupHtml).join("")}
        <button class="btn" style="border:0;display:block;width:100%;margin-top:6px"
          onclick="${cur < 2 ? "rNext()" : "rFinish()"}">${cur < 2 ? "Дальше: пассаж " + (cur+2) : "Завершить и проверить"}</button>`;
      box.querySelectorAll(".r-pill").forEach(el => el.addEventListener("click", () => {
        answers[el.dataset.no] = el.dataset.val;
        const sibs = el.parentElement.querySelectorAll(".r-pill");
        sibs.forEach(s => { s.style.borderColor = "var(--line)"; s.style.color = ""; });
        el.style.borderColor = "var(--tile)"; el.style.color = "var(--tile)";
        document.getElementById("r-done").textContent = answered();
      }));

    }

    function finish(){
      clearInterval(rTimer);
      let raw = 0; const review = [];
      for (const [no, {a, why}] of Object.entries(RT.answers)){

        const ok = a.map(x => x.toLowerCase()).includes(given.toLowerCase().replace(/[ .]+$/,"").replace(/^[ .]+/,""));
        if (ok) raw++;
        review.push({no, given: given || "—", correct: a[0], ok, why});

        <p class="cc" style="text-align:center;margin:0 0 16px">Официальная шкала перевода баллов в band.</p>
        ${window.mockChain ? `<button class="btn" style="border:0;display:block;width:100%;margin-bottom:14px" onclick="go('writing')">Дальше: Writing (шаг 3 из 3) →</button>` : ""}
        ${review.map(r => `<div class="rev ${r.ok ? "ok" : "bad"}"><span class="no">${r.ok ? "✓" : "✗"} ${r.no}</span>
          ${esc(r.given)}${r.ok ? "" : " · правильно: <b>" + esc(r.correct) + "</b>"}
          <p class="cc why">${esc(r.why)}</p></div>`).join("")}
        <button class="btn" style="border:0;margin-top:12px" onclick="VIEWS.reading()">К вариантам Reading</button>`;
      store.mock = store.mock || {}; store.mock.reading = band;
      store.bands = store.bands || {}; (store.bands.reading = store.bands.reading || {})[vi] = band; save();
      window.scrollTo({top:0});
    }
    window.rFinish = finish;
    render();
  };
};

VIEWS.listening = () => {

    return;
  }
  const lDone = (store.bands || {}).listening || {};
  box.innerHTML = `<p style="margin:2px 0 0"><button class="lnk" onclick="go('ielts')">← IELTS</button></p>

    ${window.mockChain ? `<p class="cc" style="font-family:var(--mono);font-size:11px;color:var(--tile)">[ ПОЛНЫЙ МОК · ШАГ 1 ИЗ 3 ]</p>` : ""}

    ${LISTENING_TESTS.map((t, i) => `<div class="card" style="cursor:pointer" onclick="lStart(${i})">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">

  window.lStart = vi => {
    const LT = LISTENING_TESTS[vi];

    const played = [false, false, false, false];
    const P = LT.test.parts;

    function speak(part, onDone){
      speechSynthesis.cancel();
      const all = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"));
      // предпочитаем естественные голоса: Google/Microsoft Natural/классические маковские
      const PREFER = ["google uk english female", "google uk english male", "google us english",
                      "microsoft sonia", "microsoft ryan", "microsoft libby", "daniel", "serena", "kate", "samantha"];
      const ranked = all.slice().sort((a, b) => {
        const ra = PREFER.findIndex(p => a.name.toLowerCase().includes(p));
        const rb = PREFER.findIndex(p => b.name.toLowerCase().includes(p));
        return (ra < 0 ? 99 : ra) - (rb < 0 ? 99 : rb);
      });
      const voices = ranked.length ? ranked : all;
      const roleVoice = {};
      (part.voices || ["A"]).forEach((r, i) => roleVoice[r] = voices[i % Math.max(voices.length,1)]);
      const lines = part.script.split("\n").filter(l => l.trim());
      let li = 0;
      const next = () => {
        if (li >= lines.length){ onDone(); return; }
        const line = lines[li++];
        const mm = line.match(/^([A-C]):\s*(.*)$/);
        const u = new SpeechSynthesisUtterance(mm ? mm[2] : line);
        if (mm && roleVoice[mm[1]]) u.voice = roleVoice[mm[1]];

    function groupHtml(g){
      return `<p class="cc" style="font-weight:600;margin:14px 0 8px">${esc(g.label)}</p>` +

                style="width:100%;background:var(--milk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit"></div>`;
          const opts = g.kind === "mc" ? q.options : g.options;
          return `<div class="q"><p><b>${q.no}.</b> ${esc(q.q)}</p>
            <div class="pills" style="flex-direction:column;align-items:stretch">
              ${opts.map(o => { const val = g.kind === "mc" ? o.split(".")[0].trim() : o;
                return `<label class="l-pill" data-no="${q.no}" data-val="${esc(val)}"
                  style="border-radius:11px${chosen===val ? ";border-color:var(--tile);color:var(--tile)" : ""}">${esc(o)}</label>`; }).join("")}

      box.innerHTML = `

          <button class="ghost" style="margin-left:auto;padding:8px 12px;font-size:12px" onclick="lFinish()">Завершить</button></div>
        <div class="card"><b style="font-size:14px">${esc(part.title)}</b>
          <p class="cc" style="margin:5px 0 10px">${esc(part.intro)}</p>
          <button class="btn" style="border:0" id="l-play" ${played[cur] ? "disabled" : ""}>${played[cur] ? "Прослушано (играет один раз)" : "▶ Прослушать запись"}</button>
          <button class="lnk" style="display:block;margin-top:10px" id="l-script">Показать транскрипт (если звук недоступен)</button>
          <div class="passage" id="l-transcript" hidden style="max-height:180px;margin-top:8px">${esc(part.script).replace(/\n/g,"<br>")}</div>
        </div>
        ${part.groups.map(groupHtml).join("")}
        <button class="btn" style="border:0;display:block;width:100%;margin-top:6px"
          onclick="${cur < 3 ? "lNext()" : "lFinish()"}">${cur < 3 ? "Дальше: Part " + (cur+2) : "Завершить и проверить"}</button>`;
      const playBtn = document.getElementById("l-play");
      playBtn.addEventListener("click", () => {
        if (played[cur]) return;
        played[cur] = true;
        playBtn.disabled = true; playBtn.textContent = "🔊 Звучит…";
        speak(part, () => { playBtn.textContent = "Прослушано (играет один раз)"; });
      });
      document.getElementById("l-script").addEventListener("click", () => {
        usedTranscript = true;
        document.getElementById("l-transcript").hidden = false;
      });
      box.querySelectorAll(".l-pill").forEach(el => el.addEventListener("click", () => {
        answers[el.dataset.no] = el.dataset.val;
        el.parentElement.querySelectorAll(".l-pill").forEach(s => { s.style.borderColor = "var(--line)"; s.style.color = ""; });
        el.style.borderColor = "var(--tile)"; el.style.color = "var(--tile)";
      }));
      box.querySelectorAll(".l-gap").forEach(el => el.addEventListener("input", () => { answers[el.dataset.no] = el.value; }));
      window.lNext = () => { speechSynthesis.cancel(); cur++; render(); window.scrollTo({top:0}); };
    }

    window.lFinish = () => {

        if (ok) raw++;
        review.push({no, given: given || "—", correct: a[0], ok, why});

      let band = 2.0;
      for (const [thr, b] of LT.bands){ if (raw >= thr){ band = b; break; } }
      store.mock = store.mock || {}; store.mock.listening = band;
      store.bands = store.bands || {}; (store.bands.listening = store.bands.listening || {})[vi] = band; save();
      box.innerHTML = `<h1>Результат Listening · вариант ${vi+1}</h1>
        ${usedTranscript ? NOTE("Вы подглядывали в транскрипт — на экзамене его не будет, band ориентировочный.") : ""}
        <div class="ring" style="background:conic-gradient(var(--tile) 0 ${band/9*100}%, #E3DCC9 0)">
          <div class="in"><b>${band.toFixed(1)}</b><span>band Listening</span></div></div>
        <p style="text-align:center;font-size:14.5px;margin:0 0 16px"><b>${raw} из 40 правильных</b></p>
        ${window.mockChain ? `<button class="btn" style="border:0;display:block;width:100%;margin-bottom:14px" onclick="go('reading')">Дальше: Reading (шаг 2 из 3) →</button>` : ""}
        ${review.map(r => `<div class="rev ${r.ok ? "ok" : "bad"}"><span class="no">${r.ok ? "✓" : "✗"} ${r.no}</span>
          ${esc(r.given)}${r.ok ? "" : " · правильно: <b>" + esc(r.correct) + "</b>"}
          <p class="cc why">${esc(r.why)}</p></div>`).join("")}
        <button class="btn" style="border:0;margin-top:12px" onclick="VIEWS.listening()">К вариантам Listening</button>`;
      window.scrollTo({top:0});

            <li>Слышны связки (well, actually, on the other hand)?</li>
          </ul></div>` : ""}
      <div style="display:flex;gap:10px;margin-top:8px">
        ${audioUrl || state === "skip" ? `<button class="btn" style="border:0" onclick="spNext()">${qi < script.length-1 ? "Следующий вопрос" : "Завершить"}</button>` : ""}
        <button class="ghost" onclick="spSkip()">Ответил(а) вслух без записи</button>
      </div>`;
    const recBtn = document.getElementById("sp-rec");
    if (recBtn) recBtn.addEventListener("click", startRec);
    const stopBtn = document.getElementById("sp-stop");
    if (stopBtn) stopBtn.addEventListener("click", () => recorder && recorder.stop());
  }
  async function startRec(){
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio: true});
      recorder = new MediaRecorder(stream); chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        stream.getTracks().forEach(tr => tr.stop());
        render("done", URL.createObjectURL(new Blob(chunks)));
      };
      recorder.start();
      setTimeout(() => { if (recorder && recorder.state === "recording") recorder.stop(); }, 120000);
      render("rec");
    } catch(e) {
      render("skip");
      box.insertAdjacentHTML("beforeend", NOTE("Микрофон недоступен (нет разрешения или страница открыта как файл). Отвечайте вслух и жмите «Следующий вопрос»."));
    }
  }
  window.spSkip = () => render("skip");
  window.spNext = () => {
    if (qi < script.length - 1){ qi++; render("idle"); window.scrollTo({top:0}); }
    else {
      store.bands = store.bands || {}; (store.bands.speaking = store.bands.speaking || {})[si] = true; save();
      box.innerHTML = `<h1>Интервью пройдено 🎉</h1>
      <p class="sub">Вы ответили на ${script.length} вопросов. В полной версии каждый ответ
      расшифровывается и разбирается по Fluency, Lexical Resource и Grammar с честной пометкой про произношение.</p>

    }
  };
  render("idle");
  }
};

    const old = getBest();

  const PHRASAL_ROUND = 10;

  function hangman() {

  function hangmanRound(diff) {
    const bank = HANG_WORDS[diff];
    const [wi] = deck("hang." + diff, bank.length).draw();
    const [word, hint] = bank[wi];
    const guessed = new Set();
    let lives = 6;

      const parts = HANG_PARTS.slice(0, 6 - lives).join("");
      return `<svg class="g-gallows" viewBox="0 0 200 170" aria-hidden="true">
        <g stroke="#232E38" stroke-width="3" stroke-linecap="round" fill="none">

          <g stroke="#C75B39">${parts}</g>
        </g></svg>`;
    }
    function slots() {
      return word.split("").map(ch =>
        `<span class="g-slot">${guessed.has(ch) ? ch : "&nbsp;"}</span>`).join("");
    }
    function kb() {
      return "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(ch => {
        const used = guessed.has(ch) || (!word.includes(ch) && usedWrong.has(ch));
        return `<button class="g-key" data-ch="${ch}" ${used ? "disabled" : ""}>${ch}</button>`;
      }).join("");
    }
    const usedWrong = new Set();
    const showHint = () => diff === "easy" || (diff === "medium" && usedWrong.size > 0);

    function render() {
      const won = word.split("").every(ch => guessed.has(ch));
      const lost = lives <= 0;
      screen(`
        <div class="g-hang">
          ${gallowsSvg()}
          <div class="g-hang-side">
            <div class="g-slots">${slots()}</div>
            <p class="g-hint">${showHint() ? "Подсказка: " + esc(hint) : "&nbsp;"}</p>
            <p class="g-lives">Осталось попыток: <b>${lives}</b></p>
          </div>
        </div>
        ${won || lost ? "" : `<div class="g-kb">${kb()}</div>`}
        ${won ? resultCard("🎉 Слово разгадано!", `${word} — ${esc(hint)}. Ошибок: ${usedWrong.size}.`) : ""}
        ${lost ? resultCard("Человечек собрался…", `Слово было ${word} — ${esc(hint)}. В следующий раз получится.`) : ""}

        if (won) saveBest(`${diff}: ${usedWrong.size} ошибок`, () => true);

          const ch = b.dataset.ch;
          if (word.includes(ch)) guessed.add(ch);
          else { usedWrong.add(ch); lives--; }
          render();
        }));
    }
    render();
  }

      let score = 0, streak = 0, left = 60;
      const dk = deck("match", MATCH_PAIRS.length);
      const timer = setInterval(() => {
        left--;
        const t = $(".g-timer"); if (t) t.textContent = left + " c";
        if (left <= 0) { clearInterval(timer); finish(); }

      function finish() {
        clearInterval(timer);
        saveBest(score, (a, b) => Number(a) > Number(b));

      function question() {

        root.querySelectorAll(".g-opt").forEach(b =>

              if (streak % 5 === 0) score += 2;

          }));

  // ---------- собери предложение ----------
  function builder() {
    let idx = 0, mistakes = 0;
    const order = deck("builder", SENTENCES.length).draw(BUILDER_ROUND);

    function round() {
      if (idx >= order.length) {
        saveBest(`${order.length} фраз, ошибок: ${mistakes}`, () => true);

        return;
      }
      const sentence = SENTENCES[order[idx]];
      const words = sentence.split(" ");

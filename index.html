, "why": "Абзац B — листья ловят пыль, корни впитывают ливни."}, "16": {"a": ["iv"], "why": "Абзац C — вид на деревья и здоровье."}, "17": {"a": ["ii"], "why": "Абзац D — экономическая ценность деревьев."}, "18": {"a": ["iii"], "why": "Абзац E — как выбирать и содержать городские деревья."}, "19": {"a": ["B"], "why": "Пациенты с видом на деревья просили меньше обезболивающих."}, "20": {"a": ["B"], "why": "«Shoppers linger longer — and spend more»."}, "21": {"a": ["B"], "why": "i-Tree — софт, оценивающий услуги деревьев в деньгах."}, "22": {"a": ["B"], "why": "Пример голландской болезни вязов: одна болезнь уничтожила миллионы деревьев."}, "23": {"a": ["YES"], "why": "«The totals routinely exceed the cost... many times over»."}, "24": {"a": ["NO"], "why": "Проблема решается правилом «right tree in the right place»."}, "25": {"a": ["NOT GIVEN"], "why": "Продолжительность жизни городских и лесных деревьев не сравнивается."}, "26": {"a": ["YES"], "why": "«Maintenance budgets are often the first thing cut»."}, "27": {"a": ["B"], "why": "Годовые слои считают, как кольца дерева."}, "28": {"a": ["A"], "why": "Пузырьки — образцы древнего воздуха."}, "29": {"a": ["C"], "why": "Полосы пепла датируют извержения."}, "30": {"a": ["D"], "why": "Пыль показывает, насколько сухо и ветрено было."}, "31": {"a": ["A"], "why": "Уровни газов измеряют по воздуху из пузырьков."}, "32": {"a": ["800,000", "800000"], "why": "EPICA довёл архив до ~800 000 лет."}, "33": {"a": ["rings"], "why": "«Much as tree rings are»."}, "34": {"a": ["35", "thirty-five"], "why": "Хранилища при −35 °C."}, "35": {"a": ["higher"], "why": "«Higher than at any point in the entire record»."}, "36": {"a": ["years"], "why": "«Several years of seasons to complete»."}, "37": {"a": ["B"], "why": "В пузырьках — настоящая древняя атмосфера."}, "38": {"a": ["A"], "why": "Кривые газов и температуры движутся вместе."}, "39": {"a": ["B"], "why": "Текст в целом — о том, что керны рассказывают о климате."}, "40": {"a": ["C"], "why": "«Has no precedent in almost a million years»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [32, 7.5], [30, 7.0], [26, 6.5], [23, 6.0], [18, 5.5], [16, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "reading-4", "title": "Reading · Вариант 4", "minutes": 60, "passages": [{"title": "The history of the umbrella", "text": "The umbrella is one of the oldest inventions still in daily use, yet its purpose has changed completely over the centuries. The earliest versions, seen in ancient carvings from Egypt, Assyria and China more than three thousand years ago, were not designed to keep off rain at all. They were sunshades — the very word 'parasol' comes from Latin roots meaning 'to shield from the sun' — and they were carried above kings and priests as symbols of rank rather than practical objects. A servant, not the owner, usually held the canopy aloft.\n\nIn ancient China, however, craftsmen took a decisive step: they waxed and lacquered their paper parasols so that water ran off them, creating the first true rain umbrellas. From China the collapsible design spread slowly westward along trade routes. For a long time in Europe the umbrella remained an item associated with women, and a man who carried one in the street risked mockery.\n\nThat attitude was challenged in eighteenth-century London by the traveller and writer Jonas Hanway, who carried an umbrella publicly for some thirty years despite the jeers of coach drivers, whose trade suffered when pedestrians could stay dry. By the time Hanway died in 1786, the umbrella had become respectable, and Londoners even nicknamed it a 'Hanway'.\n\nEarly European umbrellas were heavy and awkward, built on frames of wood or whalebone that soon warped or snapped. The breakthrough came in 1852, when Samuel Fox introduced a frame made of thin, U-shaped steel ribs, or 'Paragon' ribs. Fox's design was lighter, stronger and cheaper, and the basic steel-ribbed umbrella has scarcely changed since.\n\nLater inventors chased convenience. The compact folding umbrella that fits into a bag was perfected in the twentieth century, and countless patents have tried, mostly without success, to solve the umbrella's remaining weaknesses: it turns inside out in strong wind, drips indoors, and is left behind on trains in enormous numbers. London's transport network alone collects tens of thousands of forgotten umbrellas every year.\n\nToday the umbrella is both utterly ordinary and quietly symbolic. It has appeared as a fashion accessory, a film prop and even a political emblem, as in Hong Kong's 'Umbrella Movement'. From a mark of royalty to a cheap object left on a bus, the umbrella has completed an unusual journey — and on a rainy morning it remains as useful as ever.", "instructions_groups": [{"kind": "tfng", "label": "Вопросы 1–7. TRUE — утверждение совпадает с текстом; FALSE — противоречит; NOT GIVEN — в тексте об этом нет.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "questions": [{"no": 1, "q": "The earliest umbrellas were mainly used to protect people from rain."}, {"no": 2, "q": "In ancient societies, a servant usually held the umbrella above an important person."}, {"no": 3, "q": "Chinese craftsmen made parasols waterproof by waxing and lacquering them."}, {"no": 4, "q": "In early modern Europe, the umbrella was mainly associated with men."}, {"no": 5, "q": "Jonas Hanway made a large fortune from selling umbrellas."}, {"no": 6, "q": "Samuel Fox's steel-ribbed umbrella was heavier than earlier wooden ones."}, {"no": 7, "q": "Tens of thousands of umbrellas are lost on London's transport network each year."}]}, {"kind": "gap", "label": "Вопросы 8–13. Дополните предложения ОДНИМ-ДВУМЯ словами из текста.", "questions": [{"no": 8, "q": "The Latin roots of the word 'parasol' mean to shield from the ______."}, {"no": 9, "q": "Jonas Hanway carried his umbrella publicly for about thirty ______."}, {"no": 10, "q": "Samuel Fox's ribs were made of thin, U-shaped ______."}, {"no": 11, "q": "Fox's rib design was known as the ______ rib."}, {"no": 12, "q": "The compact ______ umbrella was perfected in the twentieth century."}, {"no": 13, "q": "In Hong Kong the umbrella became a symbol in the ______ Movement."}]}]}, {"title": "Smart streetlights: how cities use data", "text": "A. For over a century, the street light did one job: it switched on at dusk and off at dawn, burning the same amount of energy whether the pavement below was crowded or empty. Lighting is one of the largest items on a city's electricity bill, and much of that money is quite literally poured into the empty night. The arrival of cheap sensors, wireless networks and efficient LED lamps has turned the humble lamp post into something far more interesting: a node in a city-wide computer.\n\nB. The simplest saving comes from dimming. A modern LED can be turned down or up instantly, so lights can burn at low power on a quiet street and brighten only when a sensor detects a pedestrian, cyclist or car approaching. Cities that have installed such systems report energy savings of well over half, without leaving anyone walking through total darkness. Because each lamp reports its own status, a burnt-out bulb no longer waits for a resident to complain; the network flags it automatically for repair.\n\nC. Once a lamp post carries a network connection and a power supply, engineers realise it can carry much more. Around the world, streetlights have been fitted with sensors that measure air quality, count traffic, detect the sound of a car crash, monitor how full nearby car parks are, or provide public wireless internet. A single pole can thus become a platform for a dozen services, gathering the data that 'smart city' planners crave.\n\nD. Not everyone welcomes the trend. Microphones and cameras attached to public lighting have alarmed privacy campaigners, who point out that infrastructure installed to save energy can quietly become a tool for surveillance. In several cities, plans to add cameras to streetlights were withdrawn after public protest. Critics argue that the rules governing who owns the data, and who may look at it, have lagged far behind the technology itself.\n\nE. The lesson emerging from early projects is that technology is the easy part. The lamps and sensors work; the hard questions are about governance, cost and trust. Cities that succeed tend to start small, publish clearly what each sensor does, and give residents a say. Handled openly, the connected streetlight can cut bills, speed up repairs and make streets both greener and safer. Handled carelessly, it risks turning a symbol of public service into a symbol of the watched city.", "instructions_groups": [{"kind": "headings", "label": "Вопросы 14–18. Подберите заголовок к каждому абзацу A–E. Два заголовка лишние.", "options": ["i. From a simple lamp to a networked device", "ii. Saving energy by dimming and self-reporting", "iii. One pole, many jobs", "iv. Worries about privacy and data", "v. Getting the balance right", "vi. The rising cost of electricity worldwide", "vii. How LED bulbs are manufactured"], "questions": [{"no": 14, "q": "Абзац A"}, {"no": 15, "q": "Абзац B"}, {"no": 16, "q": "Абзац C"}, {"no": 17, "q": "Абзац D"}, {"no": 18, "q": "Абзац E"}]}, {"kind": "mc", "label": "Вопросы 19–22. Выберите один вариант.", "questions": [{"no": 19, "q": "According to the passage, traditional street lights waste money because they", "options": ["A. use expensive LED bulbs", "B. burn the same energy whether streets are busy or empty", "C. switch off too early in the evening", "D. are difficult to repair"]}, {"no": 20, "q": "Dimming systems make the lights brighter when", "options": ["A. the sun sets", "B. electricity is cheap", "C. a sensor detects someone approaching", "D. a resident complains"]}, {"no": 21, "q": "In a networked system, a burnt-out bulb is", "options": ["A. reported automatically for repair", "B. ignored until dawn", "C. replaced by local residents", "D. left dark for safety"]}, {"no": 22, "q": "In several cities, plans to add cameras to streetlights were", "options": ["A. praised by privacy campaigners", "B. withdrawn after public protest", "C. required by new laws", "D. abandoned because of cost"]}]}, {"kind": "ynng", "label": "Вопросы 23–26. YES — совпадает с мнением автора; NO — противоречит; NOT GIVEN — мнения нет.", "options": ["YES", "NO", "NOT GIVEN"], "questions": [{"no": 23, "q": "Connected streetlights can help make streets safer."}, {"no": 24, "q": "Privacy concerns about streetlight sensors are unjustified."}, {"no": 25, "q": "Most cities have now banned cameras on their streetlights."}, {"no": 26, "q": "Successful smart-lighting projects tend to involve residents in decisions."}]}]}, {"title": "Exploring the deep ocean", "text": "More than eighty per cent of the ocean floor has never been mapped in detail, and for most of history the deep sea was as unreachable as the surface of the Moon. The pressure at the bottom of the deepest trenches is more than a thousand times that at sea level — enough to crush an ordinary submarine like a paper cup — and no sunlight penetrates below about a kilometre, leaving the vast majority of the ocean in permanent, freezing darkness.\n\nThe first tool to reveal the shape of this hidden world was sound. Sonar, developed rapidly during the twentieth century, works by sending pulses of sound towards the sea floor and timing their echoes; from millions of such measurements, ships can build maps of undersea mountains and trenches without ever seeing them. It was sonar that traced the mid-ocean ridge, the longest mountain range on Earth, winding unseen around the globe.\n\nReaching the bottom in person came next. In 1960 the bathyscaphe Trieste, carrying Jacques Piccard and Don Walsh, descended almost eleven kilometres to the floor of the Mariana Trench, the deepest point in any ocean. The craft was essentially a thick steel sphere hung beneath a huge float; it proved that humans could survive the journey, though it could barely move once it arrived and made no return trip for decades.\n\nFar more useful for science was the small submersible Alvin, launched in 1964 and still working after many rebuilds. Nimble and equipped with robotic arms, Alvin allowed researchers to collect samples by hand. In 1977, near the Galapagos, scientists aboard Alvin made one of biology's great discoveries: hydrothermal vents, cracks in the sea floor gushing hot, mineral-rich water, surrounded by strange communities of tube worms and shrimp that live without any sunlight, powered instead by chemicals from within the Earth.\n\nToday much of the work is done without people on board at all. Remotely operated vehicles, or ROVs, are robots linked to a ship by a cable, able to stay down for days and carry cameras into spaces too dangerous for humans. Their cheaper cousins, autonomous underwater vehicles, roam the depths on pre-set missions with no cable at all. Together these machines are slowly filling in the map — and almost every expedition still returns with species that no one has ever seen before.", "instructions_groups": [{"kind": "match", "label": "Вопросы 27–31. Соотнесите описание с технологией: A — батискаф «Триест», B — аппарат «Элвин», C — телеуправляемые аппараты (ROV), D — сонар. Буквы могут повторяться.", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "Produced maps of undersea mountains from echoes of sound."}, {"no": 28, "q": "Carried two men to the deepest point of any ocean."}, {"no": 29, "q": "Was used to discover hydrothermal vents near the Galapagos."}, {"no": 30, "q": "Traced the longest mountain range on Earth."}, {"no": 31, "q": "Robots that stay connected to a ship by a cable."}]}, {"kind": "gap", "label": "Вопросы 32–36. Дополните предложения ОДНИМ словом или числом из текста.", "questions": [{"no": 32, "q": "The pressure in the deepest trenches is over a ______ times that at sea level."}, {"no": 33, "q": "Sonar traced the mid-ocean ______, the longest mountain range on Earth."}, {"no": 34, "q": "The Trieste descended almost ______ kilometres."}, {"no": 35, "q": "Alvin was equipped with robotic ______ to collect samples by hand."}, {"no": 36, "q": "Autonomous underwater vehicles travel with no ______ at all."}]}, {"kind": "mc", "label": "Вопросы 37–40. Выберите один вариант.", "questions": [{"no": 37, "q": "Why is the deep ocean compared to the surface of the Moon?", "options": ["A. Both are equally cold", "B. Both were long almost impossible to reach", "C. Both are covered in craters", "D. Both contain no water"]}, {"no": 38, "q": "The hydrothermal vent communities are unusual because they", "options": ["A. survive without sunlight, using chemical energy", "B. live in bright sunlight", "C. are found only in shallow water", "D. contain no living creatures"]}, {"no": 39, "q": "According to the passage, the Trieste", "options": ["A. could move easily across the sea floor", "B. could barely move once it reached the bottom", "C. made regular return trips for decades", "D. was never able to reach the trench"]}, {"no": 40, "q": "What does the passage suggest about the deep ocean today?", "options": ["A. It has been completely mapped", "B. Exploration has largely stopped", "C. New species are still frequently found", "D. Robots have replaced all research ships"]}]}]}]}, "answers": {"1": {"a": ["FALSE"], "why": "Первые зонты были солнцезащитными («sunshades»), а не от дождя."}, "2": {"a": ["TRUE"], "why": "«A servant, not the owner, usually held the canopy aloft»."}, "3": {"a": ["TRUE"], "why": "«They waxed and lacquered their paper parasols so that water ran off them»."}, "4": {"a": ["FALSE"], "why": "В Европе зонт долго ассоциировался с женщинами: «associated with women»."}, "5": {"a": ["NOT GIVEN"], "why": "О том, что Ханвей разбогател на зонтах, в тексте не сказано."}, "6": {"a": ["FALSE"], "why": "Конструкция Фокса была легче: «lighter, stronger and cheaper»."}, "7": {"a": ["TRUE"], "why": "«Collects tens of thousands of forgotten umbrellas every year»."}, "8": {"a": ["sun"], "why": "«To shield from the sun»."}, "9": {"a": ["years"], "why": "«For some thirty years»."}, "10": {"a": ["steel"], "why": "«Thin, U-shaped steel ribs»."}, "11": {"a": ["Paragon"], "why": "«'Paragon' ribs»."}, "12": {"a": ["folding"], "why": "«The compact folding umbrella... was perfected in the twentieth century»."}, "13": {"a": ["Umbrella"], "why": "«Hong Kong's 'Umbrella Movement'»."}, "14": {"a": ["i"], "why": "Абзац A — лампа превращается в узел городской сети."}, "15": {"a": ["ii"], "why": "Абзац B — экономия за счёт диммирования и самодиагностики."}, "16": {"a": ["iii"], "why": "Абзац C — один столб выполняет множество функций."}, "17": {"a": ["iv"], "why": "Абзац D — тревоги о приватности и данных."}, "18": {"a": ["v"], "why": "Абзац E — как найти баланс."}, "19": {"a": ["B"], "why": "«Burning the same amount of energy whether the pavement... was crowded or empty»."}, "20": {"a": ["C"], "why": "Свет усиливается, когда датчик замечает приближающегося человека."}, "21": {"a": ["A"], "why": "«The network flags it automatically for repair»."}, "22": {"a": ["B"], "why": "«Plans to add cameras to streetlights were withdrawn after public protest»."}, "23": {"a": ["YES"], "why": "«Make streets both greener and safer»."}, "24": {"a": ["NO"], "why": "Автор относится к опасениям всерьёз — камеры «alarmed privacy campaigners»."}, "25": {"a": ["NOT GIVEN"], "why": "О всеобщем запрете камер в тексте не говорится, лишь о нескольких городах."}, "26": {"a": ["YES"], "why": "«Give residents a say» — успешные проекты вовлекают жителей."}, "27": {"a": ["D"], "why": "Карты подводных гор из эха строит сонар."}, "28": {"a": ["A"], "why": "Батискаф «Триест» доставил двух человек на дно Марианской впадины."}, "29": {"a": ["B"], "why": "На «Элвине» открыли гидротермальные источники у Галапагосов."}, "30": {"a": ["D"], "why": "Сонар проследил срединно-океанический хребет."}, "31": {"a": ["C"], "why": "ROV — роботы, соединённые с судном кабелем."}, "32": {"a": ["thousand"], "why": "«More than a thousand times that at sea level»."}, "33": {"a": ["ridge"], "why": "«The mid-ocean ridge»."}, "34": {"a": ["eleven"], "why": "«Descended almost eleven kilometres»."}, "35": {"a": ["arms"], "why": "«Equipped with robotic arms»."}, "36": {"a": ["cable"], "why": "«With no cable at all»."}, "37": {"a": ["B"], "why": "И глубины, и Луна долго были почти недосягаемы."}, "38": {"a": ["A"], "why": "Сообщества живут без солнца, за счёт химической энергии."}, "39": {"a": ["B"], "why": "«Could barely move once it arrived»."}, "40": {"a": ["C"], "why": "«Almost every expedition still returns with species that no one has ever seen»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "reading-5", "title": "Reading · Вариант 5", "minutes": 60, "passages": [{"title": "Coffee's journey around the world", "text": "Few plants have travelled as far, or stirred as much trouble, as coffee. The story begins in the highlands of Ethiopia, where the coffee shrub grows wild and where, according to a much-repeated legend, a goat herder named Kaldi noticed that his animals became lively after eating the plant's bright red berries. Whether or not the goats existed, it was in the Arabian Peninsula, by the fifteenth century, that people first roasted and brewed the beans into something close to the drink we know today.\n\nFrom the Yemeni port of Mocha, coffee spread across the Muslim world, and coffee houses became famous as places to talk, play games and argue politics. Rulers were sometimes so alarmed by this free exchange of ideas that they tried, always unsuccessfully, to ban the drink. When coffee reached Europe in the seventeenth century, the same pattern repeated: London's coffee houses were nicknamed 'penny universities', because for the price of a cup a customer could join the conversation of merchants, writers and scientists.\n\nFor a long time Arabia guarded its monopoly jealously, allowing beans to leave only after they had been treated so they could not be planted. Smugglers eventually broke the hold. Dutch traders carried living plants to their colonies in the East Indies, and a single seedling given to the French was the ancestor of vast plantations in the Caribbean and, above all, in Brazil, which by the nineteenth century had become the largest coffee producer in the world — a position it still holds today.\n\nThe dark side of this expansion was labour. Coffee is picked by hand, and the great plantations of the Americas depended for centuries on enslaved and then poorly paid workers. Even now, most of the world's coffee is grown by smallholders in tropical countries who receive only a small fraction of the price paid in cafes far away — a gap that 'fair trade' schemes try, with mixed success, to narrow.\n\nCoffee has also shaped how we live and work. The morning cup, the office break and the cafe as a place to meet or study are habits that have spread around the globe. Tastes keep changing: from the instant coffee that conquered the twentieth century to the elaborate espresso drinks of today's chains, and now a 'third wave' of small roasters who treat coffee much as wine lovers treat fine wine. From a wild Ethiopian bush to a four-billion-cup-a-day industry, coffee's journey is far from over.", "instructions_groups": [{"kind": "tfng", "label": "Вопросы 1–7. TRUE — совпадает с текстом; FALSE — противоречит; NOT GIVEN — информации нет.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "questions": [{"no": 1, "q": "Coffee beans were first roasted and brewed in Ethiopia."}, {"no": 2, "q": "The story of Kaldi and his goats is frequently retold."}, {"no": 3, "q": "Some rulers managed to ban coffee successfully."}, {"no": 4, "q": "London coffee houses were nicknamed 'penny universities'."}, {"no": 5, "q": "Arabia allowed fertile coffee beans to be exported freely."}, {"no": 6, "q": "Brazil is still the world's largest coffee producer today."}, {"no": 7, "q": "Instant coffee is more popular today than espresso drinks."}]}, {"kind": "gap", "label": "Вопросы 8–13. Дополните предложения ОДНИМ-ДВУМЯ словами из текста.", "questions": [{"no": 8, "q": "According to legend, a goat herder named ______ noticed the effect of the berries."}, {"no": 9, "q": "Coffee spread across the Muslim world from the Yemeni port of ______."}, {"no": 10, "q": "Dutch traders took living coffee plants to their colonies in the East ______."}, {"no": 11, "q": "Most coffee today is grown by ______ in tropical countries."}, {"no": 12, "q": "Coffee is still picked by ______."}, {"no": 13, "q": "Today's small roasters are described as the '______ wave'."}]}]}, {"title": "The psychology of colour", "text": "A. Colour is one of the first things we notice about the world, and advertisers, designers and film-makers have long believed it quietly shapes how we feel and behave. The idea has an obvious appeal, but separating genuine effects from wishful thinking has proved surprisingly difficult, and the science of colour psychology is younger and shakier than its popularity suggests.\n\nB. Some responses do seem to be widely shared. Across many cultures, people describe blues and greens as calming and associate them with sky, sea and vegetation, while reds and oranges feel warm, urgent and stimulating. Red in particular grabs attention: it is used for stop signs and warnings the world over, and several studies suggest that a flash of red can slightly raise the heart rate. Whether this comes from biology or from a lifetime of learned associations is still debated. Marketers exploit these tendencies constantly, from the calming blue of banks that want to seem trustworthy to the energetic red and yellow of fast-food signs.\n\nC. Much of what people 'know' about colour, however, does not survive close inspection. The popular claim that painting a wall pink calms aggressive prisoners, for example, rests on weak and contradictory evidence, yet it is repeated endlessly. Many confident statements about colour turn out to be marketing folklore dressed up as fact, and careful experiments often fail to reproduce the dramatic effects that popular articles promise.\n\nD. Context, it turns out, matters more than colour alone. The same red means danger on a warning label, passion on a greetings card and good fortune at a Chinese wedding; white is worn at Western weddings but is the colour of mourning in parts of Asia. Because meaning depends so heavily on culture, memory and situation, a colour ripped out of context tells us very little about how a person will actually respond.\n\nE. This does not mean colour is powerless — only that its effects are subtle and dependent on circumstances. Businesses still spend heavily to choose exactly the right shade for a logo or a product, and researchers continue to look for reliable patterns. The honest summary is that colour clearly influences mood and attention in real, measurable ways, but rarely acts as the simple emotional switch that popular psychology likes to imagine. The most useful advice for a designer may be less about universal rules and more about testing a particular colour with a particular audience for a particular purpose.", "instructions_groups": [{"kind": "headings", "label": "Вопросы 14–18. Подберите заголовок к каждому абзацу A–E. Два заголовка лишние.", "options": ["i. A field younger than it appears", "ii. Reactions that many people share", "iii. Popular claims that fail the test", "iv. Why context changes everything", "v. Real but modest effects", "vi. How the eye detects colour", "vii. Colours used in national flags"], "questions": [{"no": 14, "q": "Абзац A"}, {"no": 15, "q": "Абзац B"}, {"no": 16, "q": "Абзац C"}, {"no": 17, "q": "Абзац D"}, {"no": 18, "q": "Абзац E"}]}, {"kind": "mc", "label": "Вопросы 19–22. Выберите один вариант.", "questions": [{"no": 19, "q": "The passage says the science of colour psychology is", "options": ["A. older than most people realise", "B. younger and less certain than its popularity suggests", "C. no longer studied by anyone", "D. completely and firmly proven"]}, {"no": 20, "q": "Red is used for stop signs and warnings because it", "options": ["A. strongly grabs attention", "B. is cheap to produce", "C. calms people down", "D. is only visible at night"]}, {"no": 21, "q": "The claim about pink walls calming prisoners is presented as", "options": ["A. firmly established fact", "B. resting on weak and contradictory evidence", "C. a recent scientific discovery", "D. official prison policy"]}, {"no": 22, "q": "In parts of Asia, white is associated with", "options": ["A. weddings", "B. good fortune", "C. mourning", "D. danger"]}]}, {"kind": "ynng", "label": "Вопросы 23–26. YES — совпадает с мнением автора; NO — противоречит; NOT GIVEN — мнения нет.", "options": ["YES", "NO", "NOT GIVEN"], "questions": [{"no": 23, "q": "Colour has no effect on people at all."}, {"no": 24, "q": "Some claims about colour are marketing folklore rather than fact."}, {"no": 25, "q": "The meaning of a colour can change from one culture to another."}, {"no": 26, "q": "Blue is the most profitable colour for company logos."}]}]}, {"title": "The return of the sailing cargo ship", "text": "For most of human history, goods crossed the oceans under sail. That ended abruptly in the twentieth century, when cheap oil and powerful diesel engines made wind seem quaint and unreliable; by the 1950s the last commercial sailing ships had all but vanished. Today, remarkably, the wind is coming back — not out of nostalgia, but because shipping has a carbon problem. The world's cargo fleet burns enormous quantities of dirty fuel and produces around three per cent of global greenhouse-gas emissions, roughly as much as a large industrial country.\n\nThe simplest revival is the most old-fashioned. A handful of small companies now carry coffee, wine and chocolate across the Atlantic on rebuilt or newly built wooden schooners, sailed much as they were a century ago. These voyages are slow and the cargoes tiny, but they sell a story: buyers pay a premium for goods delivered with almost no emissions, and the ships prove that the idea is not absurd.\n\nSerious change, though, will come from fitting wind technology to ordinary modern ships. One eye-catching device is the Flettner rotor, a tall spinning cylinder that, through a curious effect of physics, generates forward thrust when wind blows across it. Several cargo vessels now carry these rotors on deck, cutting fuel use on windy routes by a useful margin without changing how the ship is otherwise operated.\n\nA very different approach flies a huge kite, or parafoil, hundreds of metres above the ship, where winds are stronger and steadier than at deck level. The kite pulls the vessel forward like a sled dog and can be launched or reeled in automatically. Others are reviving the sail itself in a modern form: rigid, aircraft-style wingsails of steel and composite that fold flat when a ship enters port and can be adjusted by computer for maximum efficiency.\n\nNone of these systems is likely to replace engines entirely. They are best understood as fuel-savers, trimming consumption by anywhere from a few per cent to, in ideal conditions, well over a fifth. But with tightening international rules on emissions and a rising price on carbon, even modest savings add up quickly across thousands of vessels. After a century in which sail seemed a museum piece, the oldest form of ocean transport is quietly being invited back to work — this time with the help of computers, weather satellites and materials the old sailors could never have imagined.", "instructions_groups": [{"kind": "match", "label": "Вопросы 27–31. Соотнесите описание с технологией: A — ротор Флеттнера, B — буксирный кайт, C — жёсткие крыло-паруса, D — деревянные шхуны. Буквы могут повторяться.", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "Spins on the deck to create forward thrust."}, {"no": 28, "q": "Flies high above the ship where winds are stronger."}, {"no": 29, "q": "Carries small premium cargoes such as coffee and wine."}, {"no": 30, "q": "Can fold flat when the ship enters port."}, {"no": 31, "q": "Can be launched or reeled in automatically."}]}, {"kind": "gap", "label": "Вопросы 32–36. Дополните предложения ОДНИМ словом или числом из текста.", "questions": [{"no": 32, "q": "Shipping produces around ______ per cent of global greenhouse-gas emissions."}, {"no": 33, "q": "Small companies carry coffee, wine and ______ across the Atlantic."}, {"no": 34, "q": "A Flettner rotor is a tall spinning ______."}, {"no": 35, "q": "The kite pulls the vessel forward like a sled ______."}, {"no": 36, "q": "In ideal conditions, fuel savings can be well over a ______."}]}, {"kind": "mc", "label": "Вопросы 37–40. Выберите один вариант.", "questions": [{"no": 37, "q": "Sailing cargo ships mostly disappeared in the twentieth century because", "options": ["A. cheap oil and diesel engines replaced them", "B. the oceans became too dangerous", "C. governments banned them", "D. there were no more sailors"]}, {"no": 38, "q": "The wooden schooner companies mainly succeed by", "options": ["A. carrying huge volumes of cargo", "B. travelling faster than diesel ships", "C. selling a low-emission story at a premium", "D. avoiding the Atlantic altogether"]}, {"no": 39, "q": "According to the passage, modern wind systems are best seen as", "options": ["A. complete replacements for engines", "B. fuel-savers that reduce consumption", "C. useful only on wooden ships", "D. too expensive to be worthwhile"]}, {"no": 40, "q": "Why might even small fuel savings become important?", "options": ["A. Because sailors prefer the wind", "B. Because fuel is now free", "C. Because they add up across thousands of ships", "D. Because ships are getting smaller"]}]}]}]}, "answers": {"1": {"a": ["FALSE"], "why": "Впервые обжаривать и заваривать бобы стали на Аравийском полуострове, не в Эфиопии."}, "2": {"a": ["TRUE"], "why": "«A much-repeated legend» — историю о Калди часто пересказывают."}, "3": {"a": ["FALSE"], "why": "Правители пытались, но «always unsuccessfully» — всегда безуспешно."}, "4": {"a": ["TRUE"], "why": "«London's coffee houses were nicknamed 'penny universities'»."}, "5": {"a": ["FALSE"], "why": "Бобы выпускали только обработанными, чтобы их «could not be planted»."}, "6": {"a": ["TRUE"], "why": "«The largest coffee producer... a position it still holds today»."}, "7": {"a": ["NOT GIVEN"], "why": "Текст не сравнивает нынешнюю популярность растворимого кофе и эспрессо."}, "8": {"a": ["Kaldi"], "why": "«A goat herder named Kaldi»."}, "9": {"a": ["Mocha"], "why": "«The Yemeni port of Mocha»."}, "10": {"a": ["Indies"], "why": "«Their colonies in the East Indies»."}, "11": {"a": ["smallholders"], "why": "«Grown by smallholders in tropical countries»."}, "12": {"a": ["hand"], "why": "«Coffee is picked by hand»."}, "13": {"a": ["third"], "why": "«A 'third wave' of small roasters»."}, "14": {"a": ["i"], "why": "Абзац A — наука о цвете моложе, чем кажется."}, "15": {"a": ["ii"], "why": "Абзац B — реакции, общие для многих людей."}, "16": {"a": ["iii"], "why": "Абзац C — популярные утверждения, не выдерживающие проверки."}, "17": {"a": ["iv"], "why": "Абзац D — почему контекст меняет всё."}, "18": {"a": ["v"], "why": "Абзац E — эффекты реальны, но скромны."}, "19": {"a": ["B"], "why": "«Younger and shakier than its popularity suggests»."}, "20": {"a": ["A"], "why": "«Red in particular grabs attention»."}, "21": {"a": ["B"], "why": "Пример с розовыми стенами основан на «weak and contradictory evidence»."}, "22": {"a": ["C"], "why": "«White... is the colour of mourning in parts of Asia»."}, "23": {"a": ["NO"], "why": "Автор пишет, что цвет «clearly influences mood and attention»."}, "24": {"a": ["YES"], "why": "«Marketing folklore dressed up as fact»."}, "25": {"a": ["YES"], "why": "«Meaning depends so heavily on culture»."}, "26": {"a": ["NOT GIVEN"], "why": "О прибыльности синего цвета для логотипов текст не говорит."}, "27": {"a": ["A"], "why": "Роторы Флеттнера вращаются на палубе, создавая тягу."}, "28": {"a": ["B"], "why": "Кайт летит высоко над судном, где ветер сильнее."}, "29": {"a": ["D"], "why": "Деревянные шхуны везут небольшие премиальные грузы — кофе, вино."}, "30": {"a": ["C"], "why": "Жёсткие крыло-паруса складываются при заходе в порт."}, "31": {"a": ["B"], "why": "Кайт можно автоматически запускать и сматывать."}, "32": {"a": ["three"], "why": "«Around three per cent of global greenhouse-gas emissions»."}, "33": {"a": ["chocolate"], "why": "«Coffee, wine and chocolate across the Atlantic»."}, "34": {"a": ["cylinder"], "why": "«A tall spinning cylinder»."}, "35": {"a": ["dog"], "why": "«Like a sled dog»."}, "36": {"a": ["fifth"], "why": "«Well over a fifth»."}, "37": {"a": ["A"], "why": "«Cheap oil and powerful diesel engines made wind seem quaint»."}, "38": {"a": ["C"], "why": "«Buyers pay a premium for goods delivered with almost no emissions»."}, "39": {"a": ["B"], "why": "«They are best understood as fuel-savers»."}, "40": {"a": ["C"], "why": "«Even modest savings add up quickly across thousands of vessels»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "reading-6", "title": "Reading · Вариант 6", "minutes": 60, "passages": [{"title": "The Great Fire of London and the rebuilding of a city", "text": "In the early hours of 2 September 1666, a fire broke out in the shop of Thomas Farriner, a baker in Pudding Lane, in the heart of the City of London. Small fires were common and rarely feared, but this one caught at the end of a long, dry summer, in a city built largely of timber and packed tight within its medieval walls. Fanned by a strong east wind, the flames leapt from house to house, and within hours the blaze was beyond control.\n\nThe city was poorly prepared. The main firefighting method of the age was to pull down buildings to create gaps the fire could not cross, but the Lord Mayor hesitated to give the order, worried about the cost of rebuilding. By the time demolition began in earnest, the fire had grown too fierce. It burned for four days, and by the time it died down it had destroyed some thirteen thousand houses, dozens of churches and the great medieval cathedral of St Paul's. Astonishingly, the official death toll was tiny — only a handful of people are recorded as having died, though the true number was probably higher.\n\nThe disaster did have one silver lining. The old city had been filthy and overcrowded, and the fire is often credited with helping to end the outbreaks of plague that had killed tens of thousands the year before, by destroying the crowded slums where rats and their fleas had thrived.\n\nRebuilding began almost at once, and it was shaped by new laws. Houses now had to be built of brick and stone rather than wood, streets were widened, and the crowded riverside was given better access. The architect Christopher Wren submitted a bold plan to replace the tangle of medieval lanes with grand, straight avenues, but property owners were unwilling to give up their plots, and in the end the old street pattern largely survived. Wren's greatest legacy was the new St Paul's Cathedral, with its vast dome, together with more than fifty city churches.\n\nTo pay for the work, a tax was placed on coal coming into the city. The same period saw the birth of an entirely new industry: fire insurance. The first companies formed their own private fire brigades, who would rush to protect buildings marked with the company's metal badge. Out of catastrophe, in other words, came the brick-built, insured and slightly better-planned city that would grow into the modern capital.", "instructions_groups": [{"kind": "tfng", "label": "Вопросы 1–7. TRUE — совпадает с текстом; FALSE — противоречит; NOT GIVEN — информации нет.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "questions": [{"no": 1, "q": "The fire began in a baker's shop in Pudding Lane."}, {"no": 2, "q": "Small fires were rare and greatly feared in London at the time."}, {"no": 3, "q": "A strong east wind helped the fire to spread."}, {"no": 4, "q": "The Lord Mayor ordered demolition immediately when the fire began."}, {"no": 5, "q": "Thomas Farriner was later punished for causing the fire."}, {"no": 6, "q": "New buildings had to be constructed of brick and stone."}, {"no": 7, "q": "Christopher Wren's plan for straight avenues was fully implemented."}]}, {"kind": "gap", "label": "Вопросы 8–13. Дополните предложения ОДНИМ-ДВУМЯ словами из текста.", "questions": [{"no": 8, "q": "The baker Thomas Farriner worked in ______ Lane."}, {"no": 9, "q": "The fire burned for ______ days before it died down."}, {"no": 10, "q": "The fire destroyed the great medieval cathedral of ______."}, {"no": 11, "q": "To fund rebuilding, a tax was placed on ______ entering the city."}, {"no": 12, "q": "A completely new industry born in this period was fire ______."}, {"no": 13, "q": "Early insurance brigades protected buildings marked with a metal ______."}]}]}, {"title": "How animals sleep", "text": "A. Sleep is one of the great puzzles of biology. It is dangerous — a sleeping animal cannot watch for predators, find food or defend its territory — and yet almost every animal studied does it, from elephants to fruit flies. The fact that evolution has kept such a risky behaviour for hundreds of millions of years strongly suggests that sleep does something essential, even if scientists still argue about exactly what.\n\nB. Different animals solve the danger of sleep in remarkably different ways. Many birds and marine mammals use a trick called unihemispheric sleep: one half of the brain sleeps while the other stays awake, with the matching eye open. Dolphins never fall completely unconscious, because they must keep surfacing to breathe; ducks at the edge of a group sleep with the outward-facing eye open, literally keeping watch on one side while resting on the other.\n\nC. The amount of sleep an animal needs varies enormously. Big grazing animals such as giraffes and elephants sleep only a few hours a day, probably because they must spend most of their time eating and staying alert. Some bats and opossums, by contrast, sleep for eighteen hours or more. A newborn animal often sleeps far more than an adult of the same species, a pattern that hints at sleep's role in growth and the developing brain.\n\nD. Where and how animals sleep can be just as strange. Migrating birds are thought to snatch tiny bursts of sleep on the wing, lasting only seconds. Frigatebirds have been recorded sleeping during long ocean flights. Some fish and amphibians enter a rest state rather than true sleep, and horses can doze standing up, thanks to a system of tendons that locks their legs in place without effort.\n\nE. Understanding animal sleep is not only a curiosity. Because the basic machinery of sleep is so ancient and so widely shared, simple creatures such as the fruit fly and the zebrafish have become powerful tools for studying it. What researchers learn from a sleeping fly may, in time, help explain human insomnia and the disorders that disturb the sleep of millions of people. The more we look, the clearer it becomes that sleep is not wasted time but a fundamental part of being an animal.", "instructions_groups": [{"kind": "headings", "label": "Вопросы 14–18. Подберите заголовок к каждому абзацу A–E. Два заголовка лишние.", "options": ["i. A risky behaviour that must be useful", "ii. Sleeping with half a brain", "iii. How much sleep, and why it differs", "iv. Sleeping in unusual places and positions", "v. Why studying animal sleep helps humans", "vi. Which animals never sleep at all", "vii. How to help pets sleep better"], "questions": [{"no": 14, "q": "Абзац A"}, {"no": 15, "q": "Абзац B"}, {"no": 16, "q": "Абзац C"}, {"no": 17, "q": "Абзац D"}, {"no": 18, "q": "Абзац E"}]}, {"kind": "mc", "label": "Вопросы 19–22. Выберите один вариант.", "questions": [{"no": 19, "q": "The passage suggests that sleep must be important because", "options": ["A. all animals seem to enjoy it", "B. evolution has kept it despite its dangers", "C. it is easy and completely safe", "D. only large animals do it"]}, {"no": 20, "q": "Unihemispheric sleep allows an animal to", "options": ["A. rest one half of the brain while staying partly alert", "B. sleep far longer than usual", "C. stop breathing safely", "D. sleep with both eyes closed"]}, {"no": 21, "q": "Compared with adults, newborn animals tend to", "options": ["A. sleep much less", "B. sleep much more", "C. never sleep at all", "D. sleep only while standing"]}, {"no": 22, "q": "Horses are able to doze standing up because", "options": ["A. they are too big to lie down", "B. they never sleep deeply", "C. a system of tendons locks their legs", "D. they sleep on the wing"]}]}, {"kind": "ynng", "label": "Вопросы 23–26. YES — совпадает с мнением автора; NO — противоречит; NOT GIVEN — мнения нет.", "options": ["YES", "NO", "NOT GIVEN"], "questions": [{"no": 23, "q": "Scientists completely agree about why animals sleep."}, {"no": 24, "q": "Studying fruit flies may help explain human insomnia."}, {"no": 25, "q": "Migrating birds are believed to sleep in very short bursts while flying."}, {"no": 26, "q": "Zebrafish are the most commonly used animal in sleep research."}]}]}, {"title": "A history of maps", "text": "Maps are among humanity's oldest documents, older than most writing. Scratched onto clay, bark and stone, the earliest known maps show not the shape of coastlines but what mattered to their makers: hunting grounds, rivers, the position of stars. From the beginning, a map was never a neutral picture of the world but an argument about what was worth recording.\n\nThe ancient Greeks turned mapmaking into a science. In the second century AD, Ptolemy compiled a great work of geography that listed thousands of places by coordinates resembling latitude and longitude, and set out rules for projecting the round Earth onto a flat sheet. His maps, lost for centuries in western Europe, were rediscovered during the Renaissance and shaped European ideas of the world for generations.\n\nMedieval Europe, by contrast, often mapped belief rather than measured space. The great 'mappae mundi' of the period were circular diagrams that placed Jerusalem at the centre and the Garden of Eden at the top, mixing geography with religion and legend. Beautiful and symbolic, they were never meant to help a traveller find the way; distance and direction were beside the point.\n\nEverything changed with ocean voyaging. As European ships ventured across the Atlantic, sailors needed charts they could steer by. In 1569 the Flemish scholar Gerardus Mercator published a projection that solved a real navigational problem: on his map a line of constant compass bearing appears as a straight line, which made ocean navigation far easier. The price was distortion — his projection stretches the far north and south, making Greenland look as large as Africa, though Africa is in truth fourteen times bigger.\n\nMapping soon became an instrument of power. Governments surveyed their territories to tax and control them, and empires drew borders across lands they had barely seen, sometimes with lasting and painful consequences. To map a place was, in part, to claim it.\n\nThe digital age has transformed maps once more. Satellites now photograph the whole surface of the planet, and the map in a person's pocket updates in real time, showing traffic, businesses and the user's own moving position. Yet the old truth still holds: someone decides what these maps show and what they leave out. The technology has changed beyond recognition, but a map remains, as it always was, a picture of the world shaped by human choices.", "instructions_groups": [{"kind": "match", "label": "Вопросы 27–31. Соотнесите описание с картами/автором: A — Птолемей, B — средневековые mappae mundi, C — Герард Меркатор, D — современные цифровые карты. Буквы могут повторяться.", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "Placed Jerusalem at the centre of the world."}, {"no": 28, "q": "Listed thousands of places using coordinates."}, {"no": 29, "q": "Made a line of constant compass bearing appear as a straight line."}, {"no": 30, "q": "Update in real time and show live traffic."}, {"no": 31, "q": "Were rediscovered in Europe during the Renaissance."}]}, {"kind": "gap", "label": "Вопросы 32–36. Дополните предложения ОДНИМ словом или числом из текста.", "questions": [{"no": 32, "q": "Ptolemy compiled his work of geography in the second century ______."}, {"no": 33, "q": "Mercator published his projection in the year ______."}, {"no": 34, "q": "On Mercator's map, Greenland looks as large as ______."}, {"no": 35, "q": "Governments surveyed their territories in order to tax and ______ them."}, {"no": 36, "q": "In the digital age, ______ photograph the whole surface of the planet."}]}, {"kind": "mc", "label": "Вопросы 37–40. Выберите один вариант.", "questions": [{"no": 37, "q": "According to the passage, the earliest known maps showed", "options": ["A. accurate coastlines", "B. what mattered to their makers", "C. lines of latitude and longitude", "D. the whole planet"]}, {"no": 38, "q": "Medieval mappae mundi were mainly intended to", "options": ["A. express religious belief and symbolism", "B. help travellers find their way", "C. measure distances accurately", "D. guide ships across the Atlantic"]}, {"no": 39, "q": "The main drawback of Mercator's projection is that it", "options": ["A. was too difficult to print", "B. distorts the size of northern and southern regions", "C. left out the oceans", "D. could not show compass bearings"]}, {"no": 40, "q": "What point does the passage make about digital maps?", "options": ["A. They are completely neutral and objective", "B. They no longer require any human choices", "C. Someone still decides what they show and leave out", "D. They have made all older maps more accurate"]}]}]}]}, "answers": {"1": {"a": ["TRUE"], "why": "«A fire broke out in the shop of Thomas Farriner, a baker in Pudding Lane»."}, "2": {"a": ["FALSE"], "why": "«Small fires were common and rarely feared» — не редкими и не страшившими."}, "3": {"a": ["TRUE"], "why": "«Fanned by a strong east wind, the flames leapt from house to house»."}, "4": {"a": ["FALSE"], "why": "Мэр колебался: «the Lord Mayor hesitated to give the order»."}, "5": {"a": ["NOT GIVEN"], "why": "О наказании Фарринера в тексте не сказано."}, "6": {"a": ["TRUE"], "why": "«Houses now had to be built of brick and stone»."}, "7": {"a": ["FALSE"], "why": "План Рена не осуществили: «the old street pattern largely survived»."}, "8": {"a": ["Pudding"], "why": "«A baker in Pudding Lane»."}, "9": {"a": ["four"], "why": "«It burned for four days»."}, "10": {"a": ["St Paul's", "Saint Paul's", "St Pauls"], "why": "«The great medieval cathedral of St Paul's»."}, "11": {"a": ["coal"], "why": "«A tax was placed on coal coming into the city»."}, "12": {"a": ["insurance"], "why": "«An entirely new industry: fire insurance»."}, "13": {"a": ["badge"], "why": "«Buildings marked with the company's metal badge»."}, "14": {"a": ["i"], "why": "Абзац A — рискованное поведение, значит, оно важно."}, "15": {"a": ["ii"], "why": "Абзац B — сон одной половиной мозга."}, "16": {"a": ["iii"], "why": "Абзац C — сколько сна нужно и почему по-разному."}, "17": {"a": ["iv"], "why": "Абзац D — сон в необычных местах и позах."}, "18": {"a": ["v"], "why": "Абзац E — зачем изучение сна животных полезно людям."}, "19": {"a": ["B"], "why": "«Evolution has kept such a risky behaviour... suggests that sleep does something essential»."}, "20": {"a": ["A"], "why": "«One half of the brain sleeps while the other stays awake»."}, "21": {"a": ["B"], "why": "«A newborn animal often sleeps far more than an adult»."}, "22": {"a": ["C"], "why": "«A system of tendons that locks their legs in place»."}, "23": {"a": ["NO"], "why": "Учёные «still argue about exactly what» — единого мнения нет."}, "24": {"a": ["YES"], "why": "«May, in time, help explain human insomnia»."}, "25": {"a": ["YES"], "why": "«Snatch tiny bursts of sleep on the wing»."}, "26": {"a": ["NOT GIVEN"], "why": "О том, что зебрафиш — самый частый объект исследований, не сказано."}, "27": {"a": ["B"], "why": "Mappae mundi помещали Иерусалим в центр."}, "28": {"a": ["A"], "why": "Птолемей перечислил тысячи мест по координатам."}, "29": {"a": ["C"], "why": "Проекция Меркатора делает линию постоянного курса прямой."}, "30": {"a": ["D"], "why": "Цифровые карты обновляются в реальном времени и показывают трафик."}, "31": {"a": ["A"], "why": "Карты Птолемея заново открыли в эпоху Возрождения."}, "32": {"a": ["AD"], "why": "«In the second century AD»."}, "33": {"a": ["1569"], "why": "«In 1569... Gerardus Mercator published a projection»."}, "34": {"a": ["Africa"], "why": "«Making Greenland look as large as Africa»."}, "35": {"a": ["control"], "why": "«Surveyed their territories to tax and control them»."}, "36": {"a": ["satellites", "satellite"], "why": "«Satellites now photograph the whole surface of the planet»."}, "37": {"a": ["B"], "why": "«The earliest known maps show... what mattered to their makers»."}, "38": {"a": ["A"], "why": "Mappae mundi выражали религию и символизм, а не помогали путникам."}, "39": {"a": ["B"], "why": "Проекция искажает размеры севера и юга: Гренландия кажется огромной."}, "40": {"a": ["C"], "why": "«Someone decides what these maps show and what they leave out»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "reading-7", "title": "Reading · Вариант 7", "minutes": 60, "passages": [{"title": "Silk: an accidental discovery", "text": "According to Chinese legend, silk was discovered by accident around 2700 BC. The empress Leizu, wife of the Yellow Emperor, was drinking tea in her garden beneath a mulberry tree when a cocoon dropped from a branch into her hot cup. As she tried to lift it out, the cocoon began to unwind into a single lustrous thread, and Leizu found she could pull out more and more of it without a break. She persuaded her husband to give her a grove of mulberry trees, learned to raise the caterpillars that spin the cocoons, and is credited with inventing the silk reel and the loom.\n\nWhatever the truth of the legend, silk was being produced in China at least five thousand years ago, and the process has changed remarkably little. The pale caterpillars, usually called silkworms, eat nothing but mulberry leaves; after about a month of constant feeding, each one wraps itself in a cocoon spun from a single thread that can be several hundred metres long. To keep that thread whole, the cocoons are dropped into hot water before the moth can chew its way out, and the strands of several cocoons are wound together to form yarn. Thousands of cocoons are needed for a single robe.\n\nFor roughly three thousand years China guarded this knowledge as a state secret, and revealing it to a foreigner was punishable by death. The fabric itself, however, was traded enthusiastically along the caravan routes that later became known as the Silk Road. In Rome, silk was literally worth its weight in gold, and moralists complained that the empire's fortune was draining east to pay for a luxury that, scandalously, was almost transparent.\n\nThe monopoly ended in the sixth century AD, when — according to the historian Procopius — two monks arrived at the court of the Byzantine emperor Justinian and offered to fetch the secret. They travelled east and returned with silkworm eggs hidden inside their hollow bamboo canes, and within a generation workshops in Byzantium were weaving silk of their own.\n\nSilk has never been merely decorative. Because the fibre is light, elastic and extraordinarily strong, twentieth-century pilots trusted their lives to silk parachutes, and surgeons have long used silk thread for stitches. Today researchers are studying spider silk, which is tougher still — weight for weight, it is stronger than steel — in the hope of producing artificial versions for medicine and engineering. If they succeed, the thread that supposedly fell into an empress's teacup will have travelled all the way from ancient legend to the modern laboratory.", "instructions_groups": [{"kind": "tfng", "label": "Вопросы 1–7. TRUE — утверждение совпадает с текстом; FALSE — противоречит; NOT GIVEN — в тексте об этом нет.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "questions": [{"no": 1, "q": "According to legend, silk was discovered by an empress."}, {"no": 2, "q": "Leizu deliberately dropped the cocoon into her tea."}, {"no": 3, "q": "Silkworm farming in ancient China was done mainly by women."}, {"no": 4, "q": "A single cocoon can contain a thread several hundred metres long."}, {"no": 5, "q": "China willingly shared the secret of silk production with its neighbours."}, {"no": 6, "q": "The two monks received a large reward from Justinian."}, {"no": 7, "q": "Silk thread has been used in surgery."}]}, {"kind": "gap", "label": "Вопросы 8–13. Дополните предложения ОДНИМ словом из текста.", "questions": [{"no": 8, "q": "Leizu was sitting beneath a ______ tree when the cocoon fell."}, {"no": 9, "q": "Revealing the secret of silk to a foreigner was punishable by ______."}, {"no": 10, "q": "In Rome, silk was worth its weight in ______."}, {"no": 11, "q": "The monks hid silkworm eggs inside hollow ______ canes."}, {"no": 12, "q": "Twentieth-century pilots relied on silk ______."}, {"no": 13, "q": "Weight for weight, spider silk is stronger than ______."}]}]}, {"title": "Why we forget names", "text": "A. It happens to everyone: a colleague greets you warmly at a party, and while you can recall her job, her opinions and even the street she lives on, her name has simply vanished. Surveys of memory complaints put forgetting names at the very top of the list, well ahead of losing keys or missing appointments, and the embarrassment is universal enough to have produced a small industry of coping tricks, from mumbled greetings to the hopeful 'why don't you introduce yourselves?'.\n\nB. Psychologists argue that names really are harder than other facts, and the classic demonstration is the 'Baker/baker paradox'. Show people a photograph of a man and tell half of them that he is a baker and the other half that his surname is Baker: days later, the profession is remembered far more often than the identical word used as a name. As a job, 'baker' summons flour, ovens and early mornings — a web of connections offering many routes back to the memory. As a surname, the same word is an arbitrary label attached to nothing, and a memory without connections has nothing to hold on to.\n\nC. The problem often starts even earlier, at the moment of introduction. Registering a new name requires attention, and attention is exactly what we lack while shaking hands, smiling and planning our own next sentence. Studies of conversation show that many people are rehearsing what to say rather than listening; the name is never properly stored in the first place, so strictly speaking there is nothing to forget.\n\nD. Even a well-learned name can refuse to appear on demand. In the 'tip-of-the-tongue' state we know the name is there — we may even know its first letter or its rhythm — yet what surfaces instead is a stubborn, similar-sounding rival that blocks the target like a car parked across a driveway. Such retrieval failures become more frequent with age and with stress, which is why names desert us at precisely the moments, such as making introductions, when we need them most.\n\nE. The remedies are unglamorous but effective. Repeat the name immediately ('Nice to meet you, Marina'), use it again during the conversation, and link it deliberately to a vivid image or to a person you already know; reviewing new names a day later fixes them further. Above all, researchers offer reassurance: forgetting names is not an early sign of a failing mind but a normal consequence of how memory works — and, as they cheerfully admit, it happens to memory researchers too.", "instructions_groups": [{"kind": "headings", "label": "Вопросы 14–18. Подберите заголовок к каждому абзацу A–E. Два заголовка лишние.", "options": ["i. A meaningless label is hard to store", "ii. Not listening in the first place", "iii. When the name is on the tip of the tongue", "iv. An embarrassment everyone shares", "v. Tricks that help — and some reassurance", "vi. How parents choose babies' names", "vii. Why we never forget faces"], "questions": [{"no": 14, "q": "Абзац A"}, {"no": 15, "q": "Абзац B"}, {"no": 16, "q": "Абзац C"}, {"no": 17, "q": "Абзац D"}, {"no": 18, "q": "Абзац E"}]}, {"kind": "mc", "label": "Вопросы 19–22. Выберите один вариант.", "questions": [{"no": 19, "q": "The 'Baker/baker paradox' demonstrates that", "options": ["A. unusual surnames are easier to remember", "B. people remember faces better than words", "C. the same word is remembered better as a job than as a name", "D. bakers have particularly good memories"]}, {"no": 20, "q": "According to the passage, names are often lost at introductions because people", "options": ["A. are busy planning what to say next", "B. dislike shaking hands", "C. hear too many names at once", "D. are distracted by loud music"]}, {"no": 21, "q": "In the tip-of-the-tongue state,", "options": ["A. the name has been permanently erased", "B. people forget the person's face as well", "C. the name always returns within seconds", "D. a similar-sounding name can block the one we want"]}, {"no": 22, "q": "One strategy the author recommends is", "options": ["A. writing every new name in a notebook", "B. repeating the name during the conversation", "C. avoiding large parties", "D. asking people to wear name badges"]}]}, {"kind": "ynng", "label": "Вопросы 23–26. YES — совпадает с мнением автора; NO — противоречит; NOT GIVEN — мнения нет.", "options": ["YES", "NO", "NOT GIVEN"], "questions": [{"no": 23, "q": "Forgetting a name is usually an early sign of serious memory disease."}, {"no": 24, "q": "Lack of attention during introductions is a major cause of forgotten names."}, {"no": 25, "q": "Women remember names better than men."}, {"no": 26, "q": "Simple techniques can make names easier to remember."}]}]}, {"title": "Rewilding Britain's countryside", "text": "For most of the twentieth century, the ambition of the British countryside was production: more wheat, more milk, more sheep on every acre. Rewilding turns that ambition on its head. Instead of managing land ever more tightly, it hands the controls back to nature — and its best-known experiment began at Knepp, a 1,400-hectare estate in West Sussex whose heavy clay soils had kept its dairy and arable business permanently in debt. In 2001 the owners gave up intensive agriculture altogether, sold their machinery, and let the fields go.\n\nThey did not simply abandon the land. Large grazing animals shape wild landscapes, so Knepp introduced old breeds as stand-ins for the wild species Britain lost long ago: longhorn cattle in place of the extinct aurochs, Tamworth pigs to root through the soil as wild boar once did, along with deer and hardy ponies. Wandering freely, the animals broke up scrub and turf, creating a shifting mosaic of grassland, thorny thickets and young woodland. The results startled ecologists. Nightingales and turtle doves, two of the country's fastest-declining birds, began breeding at Knepp, and the estate now supports Britain's largest population of purple emperor butterflies — all without a single conservation plan aimed at any of them.\n\nRewilding can also mean bringing back the animals themselves. Beavers, hunted to extinction in Britain four centuries ago, have been released in Devon and elsewhere; their dams hold back water during storms, reducing flooding in villages downstream, and trap sediment that would otherwise cloud the rivers. In Scotland, white-tailed eagles — reintroduced from Norway after the native birds were shot to extinction — have become a business in their own right: eagle-watching tourism is estimated to bring around five million pounds a year to the island of Mull.\n\nNot everyone is persuaded. Farming unions point out that land given over to scrub produces little food, and hill farmers fear that reintroduced predators, and even the eagles, may take their lambs. Critics also ask who pays, since rewilded land earns less, at least at first, than land in production. Supporters reply that nobody proposes rewilding fertile arable country; the approach suits marginal land, where farming survives only on subsidies. Knepp itself now earns more than it ever did from dairy — through wildlife tourism, camping and the sale of pasture-fed meat.\n\nThe argument is really about what the countryside is for. To rewilders, a landscape that holds floodwater, absorbs carbon and rings with birdsong is productive in a different way — and Britain, one of the most nature-depleted countries in Europe, may need both kinds of productivity at once.", "instructions_groups": [{"kind": "match", "label": "Вопросы 27–31. Соотнесите утверждение: A — поместье Кнепп, B — бобры в Девоне, C — орланы-белохвосты в Шотландии, D — критики ревайлдинга. Буквы могут повторяться.", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "Former intensive farmland where rare birds now breed."}, {"no": 28, "q": "Their dams reduce flooding in settlements downstream."}, {"no": 29, "q": "Attract tourist money to a Scottish island."}, {"no": 30, "q": "Warn that rewilded land produces little food."}, {"no": 31, "q": "Uses old breeds of livestock in place of extinct wild animals."}]}, {"kind": "gap", "label": "Вопросы 32–36. Дополните предложения ОДНИМ словом или числом из текста.", "questions": [{"no": 32, "q": "Knepp gave up intensive agriculture in ______."}, {"no": 33, "q": "Beaver dams reduce ______ in villages downstream."}, {"no": 34, "q": "Eagle-watching tourism brings about five million pounds a year to ______."}, {"no": 35, "q": "Hill farmers fear that predators may take their ______."}, {"no": 36, "q": "Supporters say rewilding suits ______ land."}]}, {"kind": "mc", "label": "Вопросы 37–40. Выберите один вариант.", "questions": [{"no": 37, "q": "Before 2001, the farming business at Knepp was", "options": ["A. highly profitable", "B. permanently in debt", "C. owned by the government", "D. focused on sheep"]}, {"no": 38, "q": "Nightingales, turtle doves and purple emperor butterflies are mentioned to show that", "options": ["A. some species still need special protection", "B. Knepp attracts many tourists", "C. butterflies recover faster than birds", "D. rare wildlife returned without species-specific plans"]}, {"no": 39, "q": "The white-tailed eagles in Scotland were brought from", "options": ["A. Norway", "B. Germany", "C. Iceland", "D. Devon"]}, {"no": 40, "q": "The author's overall attitude to rewilding is best described as", "options": ["A. firmly opposed", "B. entirely uncritical", "C. sympathetic while acknowledging objections", "D. indifferent"]}]}]}]}, "answers": {"1": {"a": ["TRUE"], "why": "По легенде шёлк открыла императрица Лэйцзу: «silk was discovered... The empress Leizu»."}, "2": {"a": ["FALSE"], "why": "Кокон УПАЛ с ветки сам: «a cocoon dropped from a branch into her hot cup» — это была случайность."}, "3": {"a": ["NOT GIVEN"], "why": "О том, кто именно (мужчины или женщины) занимался шелководством, текст не говорит."}, "4": {"a": ["TRUE"], "why": "«A cocoon spun from a single thread that can be several hundred metres long»."}, "5": {"a": ["FALSE"], "why": "Наоборот: Китай хранил секрет как государственную тайну под страхом смерти."}, "6": {"a": ["NOT GIVEN"], "why": "О награде монахам текст не сообщает — сказано лишь, что они привезли яйца шелкопряда."}, "7": {"a": ["TRUE"], "why": "«Surgeons have long used silk thread for stitches» — шёлковая нить для швов."}, "8": {"a": ["mulberry"], "why": "«Beneath a mulberry tree» — под тутовым (шелковичным) деревом."}, "9": {"a": ["death"], "why": "«Revealing it to a foreigner was punishable by death»."}, "10": {"a": ["gold"], "why": "«Silk was literally worth its weight in gold»."}, "11": {"a": ["bamboo"], "why": "«Hidden inside their hollow bamboo canes»."}, "12": {"a": ["parachutes"], "why": "«Pilots trusted their lives to silk parachutes»."}, "13": {"a": ["steel"], "why": "«Weight for weight, it is stronger than steel»."}, "14": {"a": ["iv"], "why": "Абзац A — забывание имён случается со всеми, всеобщий конфуз."}, "15": {"a": ["i"], "why": "Абзац B — имя как ярлык без смысловых связей трудно сохранить (парадокс Baker/baker)."}, "16": {"a": ["ii"], "why": "Абзац C — при знакомстве мы не слушаем, и имя вообще не записывается в память."}, "17": {"a": ["iii"], "why": "Абзац D — состояние «вертится на языке» и блокировка похожим именем."}, "18": {"a": ["v"], "why": "Абзац E — приёмы запоминания и успокоение: это не болезнь."}, "19": {"a": ["C"], "why": "Профессию «baker» помнят чаще, чем то же слово в роли фамилии Baker."}, "20": {"a": ["A"], "why": "«Many people are rehearsing what to say rather than listening» — заняты своей репликой."}, "21": {"a": ["D"], "why": "«A stubborn, similar-sounding rival that blocks the target» — похожее имя блокирует нужное."}, "22": {"a": ["B"], "why": "«Repeat the name immediately... use it again during the conversation»."}, "23": {"a": ["NO"], "why": "Автор прямо пишет обратное: «not an early sign of a failing mind but a normal consequence»."}, "24": {"a": ["YES"], "why": "Абзац C: без внимания при знакомстве имя «is never properly stored»."}, "25": {"a": ["NOT GIVEN"], "why": "Различия между мужчинами и женщинами в тексте не обсуждаются."}, "26": {"a": ["YES"], "why": "«The remedies are unglamorous but effective» — простые приёмы работают."}, "27": {"a": ["A"], "why": "В Кнеппе снова гнездятся соловьи и горлицы — самые быстро исчезающие птицы."}, "28": {"a": ["B"], "why": "Плотины бобров сдерживают воду и уменьшают наводнения ниже по течению."}, "29": {"a": ["C"], "why": "Наблюдение за орланами приносит около пяти миллионов фунтов в год острову Малл."}, "30": {"a": ["D"], "why": "Фермерские союзы указывают, что заросшая земля «produces little food»."}, "31": {"a": ["A"], "why": "Кнепп выпустил лонгхорнов и тамвортских свиней вместо вымерших туров и кабанов."}, "32": {"a": ["2001"], "why": "«In 2001 the owners gave up intensive agriculture altogether»."}, "33": {"a": ["flooding"], "why": "«Reducing flooding in villages downstream»."}, "34": {"a": ["Mull"], "why": "«Around five million pounds a year to the island of Mull»."}, "35": {"a": ["lambs"], "why": "«Hill farmers fear that... predators... may take their lambs»."}, "36": {"a": ["marginal"], "why": "«The approach suits marginal land, where farming survives only on subsidies»."}, "37": {"a": ["B"], "why": "Тяжёлые глины держали хозяйство «permanently in debt» — в постоянных долгах."}, "38": {"a": ["D"], "why": "Редкие виды вернулись «without a single conservation plan aimed at any of them»."}, "39": {"a": ["A"], "why": "«White-tailed eagles — reintroduced from Norway»."}, "40": {"a": ["C"], "why": "Автор приводит успехи и возражения и заключает, что нужны «оба вида продуктивности»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "reading-8", "title": "Reading · Вариант 8", "minutes": 60, "passages": [{"title": "The story of the number zero", "text": "It is tempting to assume that numbers were discovered one after another, like islands on a map. In fact the most useful of them all had to be invented, and it arrived astonishingly late. For thousands of years, sophisticated civilisations counted, taxed and built pyramids without any symbol for nothing.\n\nThe Babylonians came close. By around 300 BC their scribes, pressing wedge-shaped marks into clay, used a special sign to show that a column was empty, distinguishing 205 from 25. But the sign was only a placeholder: it never stood at the end of a number and was never used in calculation. On the other side of the world, the Maya of Central America independently created a true zero of their own, drawn as a shell, and used it in the elaborate calendars with which their priests tracked the planets and ordered ritual life.\n\nZero became a genuine number in India. In 628 AD the astronomer Brahmagupta set out, for the first time anywhere, rules for calculating with it: a number minus itself leaves zero, and a number plus zero is unchanged. (He struggled, as everyone since has, with division by zero.) The Sanskrit name for the new number was shunya, meaning emptiness. As the idea travelled west through the Arab world, the word became sifr, which survives in English as 'cipher' and, through Italian, as 'zero' itself.\n\nEurope resisted for centuries. Roman numerals had served merchants since antiquity, and the new system met real suspicion. Leonardo of Pisa, better known as Fibonacci, demonstrated in his book Liber Abaci, which appeared in 1202, how much faster the Hindu-Arabic numerals made commercial arithmetic. Bookkeepers, however, worried that a zero could too easily be stretched into a 6 or a 9 by a dishonest clerk, and in 1299 the city of Florence banned the new numerals in official records. Italian account books clung to Roman numerals for another two centuries.\n\nThe eventual victory of zero was total, because almost nothing in modern mathematics works without it. Zero makes place value possible, anchors the scale of the thermometer and the coordinates of every map, and separates positive numbers from negative ones. Centuries later it acquired a second career: every computer on Earth stores music, photographs and words in the binary system, whose entire alphabet consists of one and zero. The number that a great European city once banned as suspicious now quietly underlies nearly everything the modern world does.", "instructions_groups": [{"kind": "tfng", "label": "Вопросы 1–6. TRUE — утверждение совпадает с текстом; FALSE — противоречит; NOT GIVEN — в тексте об этом нет.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "questions": [{"no": 1, "q": "The Babylonian sign for an empty column was used in calculations."}, {"no": 2, "q": "The Maya invented a zero without outside influence."}, {"no": 3, "q": "Brahmagupta was famous throughout Asia during his lifetime."}, {"no": 4, "q": "European bookkeepers adopted the new numerals without resistance."}, {"no": 5, "q": "The word 'zero' can be traced back to a Sanskrit term."}, {"no": 6, "q": "Fibonacci worked as a merchant himself."}]}, {"kind": "gap", "label": "Вопросы 7–13. Дополните предложения ОДНИМ словом или числом из текста.", "questions": [{"no": 7, "q": "The Babylonian sign for zero was only a ______."}, {"no": 8, "q": "The Maya used their zero in elaborate ______."}, {"no": 9, "q": "Brahmagupta wrote his rules for zero in ______ AD."}, {"no": 10, "q": "The Sanskrit name for zero was ______."}, {"no": 11, "q": "Fibonacci's book Liber Abaci appeared in ______."}, {"no": 12, "q": "In 1299 the new numerals were banned in the city of ______."}, {"no": 13, "q": "Computers store information in the ______ system."}]}]}, {"title": "Noise pollution in cities", "text": "A. Noise is the pollution nobody can see. It leaves no smoke, no stains and no litter, and so it is easily dismissed as a mere irritation — yet the World Health Organization ranks traffic noise as the second most damaging environmental threat to health in western Europe, behind only air pollution. By its estimates, roughly one European city dweller in five is regularly exposed to night-time noise at levels that harm health, and the total burden, measured in years of healthy life lost, runs into the hundreds of thousands annually.\n\nB. The damage goes far beyond hearing. The body reacts to noise as it does to threat: even in a sleeping person, a passing lorry raises the pulse and releases stress hormones. Night after night, this quiet alarm fragments sleep and, over the years, has been linked to raised blood pressure and a higher risk of heart disease. Children pay a price too: a well-known study of schools lying under airport flight paths found that reading progress was slower in the noisiest classrooms, and improved when the noise was reduced.\n\nC. City wildlife cannot install double glazing. Great tits in Dutch cities have been recorded singing at a higher pitch to lift their songs above the roar of traffic, and urban robins increasingly sing at night, when the streets are quieter. The problem reaches the sea as well: the low rumble of shipping carries for enormous distances underwater, masking the calls that whales use to find food and one another.\n\nD. Little of this is inevitable, because much of the remedy is straightforward engineering. Special quiet road surfaces can cut traffic noise by several decibels, and low-noise tyres by several more; electric buses remove engine roar from the busiest streets. Earth banks, barriers and belts of trees absorb sound, and lower speed limits are the cheapest measure of all. Architects can help by placing bedrooms towards quiet courtyards and offices towards the street.\n\nE. Finally, quiet itself can be defended. European law now requires large cities to draw up noise maps and to designate protected 'quiet areas' — parks, squares and riversides where people can rest their ears. Researchers argue that these oases deserve the same care as clean water, since time spent in them measurably lowers stress. A city will never be silent; but it can decide, street by street, where peace is allowed to survive.", "instructions_groups": [{"kind": "headings", "label": "Вопросы 14–18. Подберите заголовок к каждому абзацу A–E. Два заголовка лишние.", "options": ["i. A threat second only to dirty air", "ii. Animals forced to change their behaviour", "iii. Engineering a quieter street", "iv. What noise does to the human body", "v. Protecting the places that remain peaceful", "vi. The history of the motor car", "vii. Why some people enjoy loud music"], "questions": [{"no": 14, "q": "Абзац A"}, {"no": 15, "q": "Абзац B"}, {"no": 16, "q": "Абзац C"}, {"no": 17, "q": "Абзац D"}, {"no": 18, "q": "Абзац E"}]}, {"kind": "ynng", "label": "Вопросы 19–22. YES — совпадает с мнением автора; NO — противоречит; NOT GIVEN — мнения нет.", "options": ["YES", "NO", "NOT GIVEN"], "questions": [{"no": 19, "q": "Noise pollution is taken less seriously than it should be."}, {"no": 20, "q": "Wearing earplugs at night is an effective form of protection."}, {"no": 21, "q": "Urban noise affects only human beings."}, {"no": 22, "q": "Quiet areas in cities are worth protecting."}]}, {"kind": "mc", "label": "Вопросы 23–27. Выберите один вариант.", "questions": [{"no": 23, "q": "The study of schools under flight paths found that", "options": ["A. children stopped attending school", "B. teachers spoke more loudly", "C. exam results were unaffected", "D. reading progress was slower in noisier classrooms"]}, {"no": 24, "q": "Urban robins are mentioned because they", "options": ["A. have stopped singing altogether", "B. increasingly sing at night", "C. have left the cities", "D. imitate traffic sounds"]}, {"no": 25, "q": "Which measure is described as the cheapest?", "options": ["A. lower speed limits", "B. quiet road surfaces", "C. electric buses", "D. noise barriers"]}, {"no": 26, "q": "European law obliges large cities to", "options": ["A. ban night flights", "B. plant more trees", "C. draw up noise maps and designate quiet areas", "D. close streets to traffic on Sundays"]}, {"no": 27, "q": "The main message of the passage is that urban noise", "options": ["A. is impossible to measure accurately", "B. seriously harms health but can be reduced", "C. worries scientists more than citizens", "D. has disappeared thanks to electric cars"]}]}]}, {"title": "Training guide dogs", "text": "Dogs have guided blind people for centuries — a wall painting from Roman times appears to show exactly that — but the guide dog as we know it is a product of the First World War. Thousands of German soldiers came home blinded by poison gas. According to a much-told story, a doctor walking with one such patient was called away, and returned to find his own dog standing guard over the blind man. Struck by the animal's behaviour, he began training dogs systematically, and in 1916 the world's first guide dog school opened in Germany. Within a decade the country had trained thousands of dogs.\n\nThe idea crossed the Atlantic thanks to two determined people. Dorothy Eustis, a wealthy American then breeding working dogs in Switzerland, visited a German school and described what she saw in a 1927 magazine article. Among the flood of letters it produced was one from Morris Frank, a nineteen-year-old blind man from Tennessee, who promised that if Eustis trained a dog for him, he would spread the idea across America. He kept his word: he came home with Buddy, a German shepherd, demonstrated her skill to journalists by crossing a chaotic New York street, and became the first American to use a guide dog. In 1929 Eustis founded The Seeing Eye, the first guide dog school in the United States.\n\nProducing a guide dog takes about two years. Most are labradors, golden retrievers or a cross between the two, chosen for their steady temperament. Puppies spend their first year living with volunteer families, who teach basic obedience a

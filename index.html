nd introduce them to buses, shops, lifts and crowds; the aim is a confident young dog that nothing in a city can surprise. Formal training then takes several months with professional trainers: the dog learns to walk just ahead of its handler in a straight line, to stop at every kerb, to find doors and crossings on command, and to avoid obstacles — including overhead ones, such as low branches, that the dog itself could pass under but its handler could not.\n\nThe most remarkable lesson, taught by those same trainers, is what the profession calls intelligent disobedience. A guide dog must refuse a command when obeying it would put the handler in danger: told 'forward' at the edge of a railway platform or into moving traffic, it must stand still. Teaching a dog when to disobey is far harder than teaching obedience itself.\n\nNot every candidate succeeds. Dogs that prove too playful or too easily alarmed are withdrawn and 'career-changed': many become family pets or detection dogs. For those that qualify, the final step is matching — schools pair each dog with a handler of similar walking speed, lifestyle and temperament, because a partnership that may last eight years or more works only if the two halves suit each other.", "instructions_groups": [{"kind": "match", "label": "Вопросы 28–32. Соотнесите утверждение: A — Dorothy Eustis, B — Morris Frank, C — семьи-волонтёры, D — профессиональные тренеры. Буквы могут повторяться.", "options": ["A", "B", "C", "D"], "questions": [{"no": 28, "q": "Wrote a magazine article about guide dog training in Germany."}, {"no": 29, "q": "Was the first American to be guided by a dog."}, {"no": 30, "q": "Give puppies their first year of everyday city experience."}, {"no": 31, "q": "Teach dogs to refuse a dangerous command."}, {"no": 32, "q": "Founded the first guide dog school in the United States."}]}, {"kind": "gap", "label": "Вопросы 33–36. Дополните предложения ОДНИМ словом из текста.", "questions": [{"no": 33, "q": "The world's first guide dog school opened in 1916 in ______."}, {"no": 34, "q": "Morris Frank's dog was called ______."}, {"no": 35, "q": "A guide dog learns to stop at every ______."}, {"no": 36, "q": "Refusing an unsafe command is called intelligent ______."}]}, {"kind": "mc", "label": "Вопросы 37–40. Выберите один вариант.", "questions": [{"no": 37, "q": "Modern guide dog training first developed in response to", "options": ["A. a rise in city traffic", "B. a shortage of human guides", "C. soldiers blinded in the First World War", "D. the invention of the harness"]}, {"no": 38, "q": "According to the passage, most guide dogs today are", "options": ["A. labradors, golden retrievers or their crosses", "B. German shepherds", "C. rescue dogs of mixed origin", "D. spaniels and terriers"]}, {"no": 39, "q": "A dog that does not complete the training", "options": ["A. is returned to Germany", "B. repeats the course the following year", "C. is never allowed near people again", "D. is moved to a different career, such as a family pet"]}, {"no": 40, "q": "When matching a dog with a handler, schools consider", "options": ["A. the handler's profession only", "B. walking speed, lifestyle and temperament", "C. the colour of the dog", "D. the handler's age only"]}]}]}]}, "answers": {"1": {"a": ["FALSE"], "why": "Знак был лишь заполнителем: «never used in calculation» — в вычислениях не применялся."}, "2": {"a": ["TRUE"], "why": "«The Maya... independently created a true zero of their own» — независимо."}, "3": {"a": ["NOT GIVEN"], "why": "О прижизненной славе Брахмагупты текст ничего не сообщает."}, "4": {"a": ["FALSE"], "why": "Наоборот: счетоводы боялись подделок, а Флоренция в 1299 году запретила новые цифры."}, "5": {"a": ["TRUE"], "why": "Цепочка: санскритское shunya → арабское sifr → итальянское/английское zero."}, "6": {"a": ["NOT GIVEN"], "why": "Текст говорит о его книге для купцов, но не о том, что он сам был купцом."}, "7": {"a": ["placeholder"], "why": "«The sign was only a placeholder»."}, "8": {"a": ["calendars"], "why": "«Used it in the elaborate calendars»."}, "9": {"a": ["628"], "why": "«In 628 AD the astronomer Brahmagupta set out... rules»."}, "10": {"a": ["shunya"], "why": "«The Sanskrit name for the new number was shunya»."}, "11": {"a": ["1202"], "why": "«His book Liber Abaci, which appeared in 1202»."}, "12": {"a": ["Florence"], "why": "«In 1299 the city of Florence banned the new numerals»."}, "13": {"a": ["binary"], "why": "«Stores music, photographs and words in the binary system»."}, "14": {"a": ["i"], "why": "Абзац A — шум на втором месте после загрязнения воздуха как угроза здоровью."}, "15": {"a": ["iv"], "why": "Абзац B — пульс, гормоны стресса, давление, болезни сердца, чтение у детей."}, "16": {"a": ["ii"], "why": "Абзац C — синицы поют выше, малиновки поют ночью, киты не слышат друг друга."}, "17": {"a": ["iii"], "why": "Абзац D — тихий асфальт, шины, электробусы, барьеры: инженерные решения."}, "18": {"a": ["v"], "why": "Абзац E — карты шума и охраняемые «тихие зоны»: защита оставшейся тишины."}, "19": {"a": ["YES"], "why": "Автор: шум «easily dismissed as a mere irritation», ХОТЯ ВОЗ ставит его на второе место."}, "20": {"a": ["NOT GIVEN"], "why": "Беруши в тексте вообще не упоминаются."}, "21": {"a": ["NO"], "why": "Целый абзац посвящён птицам и китам — страдают не только люди."}, "22": {"a": ["YES"], "why": "«These oases deserve the same care as clean water» — автор поддерживает защиту."}, "23": {"a": ["D"], "why": "«Reading progress was slower in the noisiest classrooms»."}, "24": {"a": ["B"], "why": "«Urban robins increasingly sing at night, when the streets are quieter»."}, "25": {"a": ["A"], "why": "«Lower speed limits are the cheapest measure of all»."}, "26": {"a": ["C"], "why": "«European law now requires large cities to draw up noise maps and to designate... 'quiet areas'»."}, "27": {"a": ["B"], "why": "Общая мысль: шум вредит здоровью (A–C), но поддаётся снижению и контролю (D–E)."}, "28": {"a": ["A"], "why": "Дороти Юстис описала немецкую школу в журнальной статье 1927 года."}, "29": {"a": ["B"], "why": "Моррис Фрэнк «became the first American to use a guide dog»."}, "30": {"a": ["C"], "why": "Щенки первый год живут в семьях волонтёров и привыкают к городу."}, "31": {"a": ["D"], "why": "«Умному непослушанию» учат профессиональные тренеры: «taught by those same trainers»."}, "32": {"a": ["A"], "why": "«In 1929 Eustis founded The Seeing Eye, the first guide dog school in the United States»."}, "33": {"a": ["Germany"], "why": "«In 1916 the world's first guide dog school opened in Germany»."}, "34": {"a": ["Buddy"], "why": "«He came home with Buddy, a German shepherd»."}, "35": {"a": ["kerb", "curb"], "why": "«The dog learns... to stop at every kerb» — у каждого бордюра."}, "36": {"a": ["disobedience"], "why": "«What the profession calls intelligent disobedience»."}, "37": {"a": ["C"], "why": "Тысячи немецких солдат ослепли от газа в Первую мировую — с этого всё началось."}, "38": {"a": ["A"], "why": "«Most are labradors, golden retrievers or a cross between the two»."}, "39": {"a": ["D"], "why": "Неподошедших собак «career-changed»: они становятся питомцами или собаками-детекторами."}, "40": {"a": ["B"], "why": "«Schools pair each dog with a handler of similar walking speed, lifestyle and temperament»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "reading-9", "title": "Reading · Вариант 9", "minutes": 60, "passages": [{"title": "Chocolate: from bean to bar", "text": "Chocolate begins with a tree so particular about its home that it grows only within about twenty degrees of the equator. Theobroma cacao — the botanists' Latin means 'food of the gods' — demands constant warmth, high humidity and shelter from wind, and it fruits in a strange way: its ridged pods sprout directly from the trunk. Inside each pod lie thirty to forty seeds, the cacao beans, wrapped in sweet white pulp.\n\nRaw beans taste nothing like chocolate. After harvest they are heaped under banana leaves and left to ferment for several days, while the pulp heats up and the flavour begins to develop; only then are the beans spread out and dried in the sun. Fermentation is so important that badly fermented beans can never be rescued, however skilfully they are roasted afterwards.\n\nThe Maya and later the Aztecs prized the beans for a drink: roasted, ground and whisked with water and chilli into a bitter, frothy liquid reserved largely for rulers, warriors and priests. Beans were also money — surviving price lists show a turkey costing a hundred beans — and counterfeiters even stuffed empty shells with earth. When the Spanish reached Central America in the sixteenth century they carried the drink home and, by mixing it with sugar and serving it hot, turned a bitter ritual beverage into a fashionable European luxury.\n\nFor three more centuries chocolate remained something you drank. The solid bar required a chain of nineteenth-century inventions. In 1828 the Dutch chemist Coenraad van Houten patented a press that squeezed most of the fatty cocoa butter out of the roasted beans, leaving a dry cake that could be ground into cocoa powder. In 1847 the English firm Fry's recombined powder, sugar and melted cocoa butter to mould the first solid chocolate bar. In 1875 the Swiss confectioner Daniel Peter, using the dried milk developed by his neighbour Henri Nestlé, finally produced milk chocolate, and four years later another Swiss, Rodolphe Lindt, invented the conching machine, whose hours of slow stirring gave chocolate the smoothness we now take for granted.\n\nToday the crop has moved. Although cacao is American by origin, about sixty per cent of the world's supply now comes from two West African countries, Côte d'Ivoire and Ghana, where it is grown mainly on small family farms and picked by hand. Campaigners point to an uncomfortable arithmetic: the farmers who begin the process typically receive only a few per cent of the price of the bar on a European shelf. The industry that turned a sacred Aztec drink into an everyday pleasure is still working out how to share that pleasure fairly.", "instructions_groups": [{"kind": "tfng", "label": "Вопросы 1–7. TRUE — утверждение совпадает с текстом; FALSE — противоречит; NOT GIVEN — в тексте об этом нет.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "questions": [{"no": 1, "q": "Cacao beans were used by the Aztecs as a form of money."}, {"no": 2, "q": "Aztec children were forbidden to taste the chocolate drink."}, {"no": 3, "q": "The original Aztec drink was sweet."}, {"no": 4, "q": "Van Houten's invention removed much of the cocoa butter from the beans."}, {"no": 5, "q": "Milk chocolate was first produced in England."}, {"no": 6, "q": "Lindt's company is the largest chocolate maker today."}, {"no": 7, "q": "Most of the world's cacao is now grown in West Africa."}]}, {"kind": "gap", "label": "Вопросы 8–14. Дополните предложения ОДНИМ словом или числом из текста.", "questions": [{"no": 8, "q": "Cacao trees grow only within about twenty degrees of the ______."}, {"no": 9, "q": "After fermenting, the beans are spread out and dried in the ______."}, {"no": 10, "q": "The Spanish added ______ to the drink and served it hot."}, {"no": 11, "q": "Van Houten patented a ______ that squeezed out the cocoa butter."}, {"no": 12, "q": "The first solid chocolate bar was moulded in ______."}, {"no": 13, "q": "In 1875 Daniel Peter produced the first ______ chocolate."}, {"no": 14, "q": "The flavour of the beans depends critically on proper ______."}]}]}, {"title": "The science of laughter", "text": "A. Ask people why they laugh and they will talk about jokes and comedians. The American psychologist Robert Provine decided to check: with his students he eavesdropped on more than a thousand episodes of laughter in shopping centres and city streets, noting what was said just before each laugh. The results were humbling for comedians. Fewer than one laugh in five followed anything that could be called a joke; people laughed after remarks as flat as 'I'll see you later'. What mattered was company: Provine calculated that we are about thirty times more likely to laugh with other people than alone. Laughter, he concluded, is less about comedy than about relationships.\n\nB. It is also far older than our species. Chimpanzees and gorillas produce a breathy panting when they are tickled or chased in play — the ape version of laughter — and the sound appears in exactly the same social games. Even rats, tickled by researchers, emit high-pitched ultrasonic chirps and come back eagerly for more. Such findings suggest that laughter evolved from play signals used by mammals long before language existed: a sound that meant 'this is play, not a real fight'.\n\nC. Laughter is also famously catching. Brain-imaging studies show that merely hearing laughter activates the areas that prepare the facial muscles to join in — one reason television producers have added recorded laughter to comedies since the 1950s. The infection works best when the laughter is real: the brain readily distinguishes involuntary laughter, which erupts on its own, from polite social laughter, which is performed. Genuine laughter is notoriously hard to produce on demand — actors say a convincing laugh is one of the most difficult things to fake.\n\nD. The body takes laughter seriously. In experiments led by the Oxford psychologist Robin Dunbar, volunteers who had just watched comedy together could tolerate noticeably more pain than those who had watched neutral films — an effect attributed to endorphins, the brain's natural painkillers. Other studies link a good laugh with lower levels of stress hormones and relaxed muscles. The effects are modest — laughter will not replace medicine — but they are real and measurable.\n\nE. Put these strands together and laughter looks like social glue. It signals safety, defuses tension and synchronises the mood of a group; strangers who laugh together go on to talk more openly and to trust each other more. That, perhaps, is why we laugh thirty times more often in company: laughter is not so much a reaction to the world as a message to the people beside us.", "instructions_groups": [{"kind": "headings", "label": "Вопросы 15–19. Подберите заголовок к каждому абзацу A–E. Два заголовка лишние.", "options": ["i. Laughter that spreads from person to person", "ii. More about company than comedy", "iii. An ability older than humanity", "iv. How laughter binds people together", "v. Measurable effects on the body", "vi. The world's funniest joke", "vii. How to become a professional comedian"], "questions": [{"no": 15, "q": "Абзац A"}, {"no": 16, "q": "Абзац B"}, {"no": 17, "q": "Абзац C"}, {"no": 18, "q": "Абзац D"}, {"no": 19, "q": "Абзац E"}]}, {"kind": "mc", "label": "Вопросы 20–23. Выберите один вариант.", "questions": [{"no": 20, "q": "Provine's street recordings showed that most laughter", "options": ["A. occurred when people were alone", "B. followed ordinary remarks rather than jokes", "C. was produced by professional performers", "D. happened inside theatres"]}, {"no": 21, "q": "When tickled by researchers, rats", "options": ["A. become aggressive", "B. fall silent", "C. run away and hide", "D. emit ultrasonic chirps and return for more"]}, {"no": 22, "q": "Dunbar's experiments found that volunteers who laughed together", "options": ["A. could tolerate more pain", "B. slept longer at night", "C. remembered the films better", "D. became worse at concentrating"]}, {"no": 23, "q": "The passage as a whole argues that laughter is primarily", "options": ["A. a modern cultural invention", "B. a reaction to skilful comedy", "C. a social behaviour with ancient roots", "D. a medical treatment"]}]}, {"kind": "ynng", "label": "Вопросы 24–27. YES — совпадает с мнением автора; NO — противоречит; NOT GIVEN — мнения нет.", "options": ["YES", "NO", "NOT GIVEN"], "questions": [{"no": 24, "q": "Laughter is mainly a response to well-crafted jokes."}, {"no": 25, "q": "Genuine laughter is difficult to produce deliberately."}, {"no": 26, "q": "Professional comedians laugh less than other people."}, {"no": 27, "q": "Laughter existed before human language."}]}]}, {"title": "Lighthouses and their keepers", "text": "The first great lighthouse was also the most celebrated ever built. The Pharos, completed around 280 BC on a small island at the entrance to the harbour of Alexandria, rose higher than a modern thirty-storey building and guided ships with fire by night and a column of smoke by day. Counted among the seven wonders of the ancient world, it stood for some fifteen centuries before earthquakes finally brought it down — and it gave lighthouse engineering its name, pharology.\n\nBuilding a tower on a wave-swept rock in the open sea proved a far harder problem. The Eddystone rocks, lying in the approaches to the English port of Plymouth, had wrecked ships for generations when Henry Winstanley, a showman and engineer, raised the first lighthouse there in 1698. Winstanley was so confident of his creation that he declared he wished to be inside it during 'the greatest storm that ever was'. He got his wish. In November 1703 the worst storm in recorded English history swept the tower away entirely, and Winstanley, who was on the rock overseeing repairs, died with it.\n\nThe lasting solution came from John Smeaton in 1759. He built in stone rather than wood, cutting the blocks so that they interlocked like pieces of a puzzle, and he gave his tower a gently curving profile copied from the trunk of an oak tree, broad at the base and narrowing above, so that waves slid around it instead of striking it flat. Smeaton's tower stood for more than a century, and his design became the model for wave-swept lighthouses all over the world.\n\nThe light itself was transformed in 1822, when the French physicist Augustin Fresnel invented a lens assembled from concentric rings of glass. Where the old mirrors wasted most of a lamp's light, the Fresnel lens gathered it into a single flat beam visible more than thirty kilometres away, and rotating versions gave each lighthouse its own rhythm of flashes, so that sailors could tell one stretch of coast from another.\n\nFor the keepers, the glamour was thin. They wound the clockwork that turned the lens, trimmed the lamp wicks, polished glass for hours, and kept logbooks recording weather, repairs and passing ships, through months of isolation on storm-bound rocks. Electric lamps, automatic sensors and satellite navigation slowly made them unnecessary, and in 1998 the last keeper in Britain left North Foreland lighthouse in Kent. The towers themselves remain: automated, monitored from shore and still flashing their patterns — and sailors with every electronic aid on board still look for them.", "instructions_groups": [{"kind": "match", "label": "Вопросы 28–32. Соотнесите утверждение: A — Henry Winstanley, B — John Smeaton, C — Augustin Fresnel, D — смотрители маяков. Буквы могут повторяться.", "options": ["A", "B", "C", "D"], "questions": [{"no": 28, "q": "Built the first tower on the Eddystone rocks."}, {"no": 29, "q": "Copied the shape of a tree trunk for his design."}, {"no": 30, "q": "Invented a lens made of concentric rings of glass."}, {"no": 31, "q": "Recorded weather and passing ships in logbooks."}, {"no": 32, "q": "Died when a storm destroyed his lighthouse."}]}, {"kind": "gap", "label": "Вопросы 33–36. Дополните предложения ОДНИМ словом или числом из текста.", "questions": [{"no": 33, "q": "The Pharos stood at the entrance to the harbour of ______."}, {"no": 34, "q": "Smeaton copied the profile of his tower from an ______ tree."}, {"no": 35, "q": "Fresnel invented his glass lens in ______."}, {"no": 36, "q": "The last British lighthouse keeper left his post in ______."}]}, {"kind": "mc", "label": "Вопросы 37–40. Выберите один вариант.", "questions": [{"no": 37, "q": "The Pharos of Alexandria is described as", "options": ["A. one of the seven wonders of the ancient world", "B. the first stone building in Egypt", "C. a tower destroyed by a storm", "D. a lighthouse that still operates today"]}, {"no": 38, "q": "Smeaton's key innovation was", "options": ["A. using wood instead of stone", "B. building far from the coast", "C. interlocking stone blocks and a curved profile", "D. installing an electric lamp"]}, {"no": 39, "q": "The Fresnel lens made lighthouse beams", "options": ["A. dimmer but cheaper", "B. visible from much greater distances", "C. permanently fixed in one direction", "D. unnecessary for sailors"]}, {"no": 40, "q": "By the end of the twentieth century, lighthouse keepers", "options": ["A. were paid much more than before", "B. moved to lighthouses abroad", "C. went on strike across Britain", "D. were no longer needed because of automation"]}]}]}]}, "answers": {"1": {"a": ["TRUE"], "why": "«Beans were also money» — прайс-листы показывают индейку за сто бобов."}, "2": {"a": ["NOT GIVEN"], "why": "Напиток был «reserved largely for rulers, warriors and priests», но о запрете именно детям не сказано."}, "3": {"a": ["FALSE"], "why": "Напиток был горьким и с чили: «a bitter, frothy liquid»."}, "4": {"a": ["TRUE"], "why": "Пресс «squeezed most of the fatty cocoa butter out of the roasted beans»."}, "5": {"a": ["FALSE"], "why": "Молочный шоколад создал швейцарец Даниэль Петер, а не англичане."}, "6": {"a": ["NOT GIVEN"], "why": "О сегодняшнем положении компании Линдта текст не сообщает."}, "7": {"a": ["TRUE"], "why": "Около 60% мирового урожая дают Кот-д'Ивуар и Гана — Западная Африка."}, "8": {"a": ["equator"], "why": "«Grows only within about twenty degrees of the equator»."}, "9": {"a": ["sun"], "why": "«Spread out and dried in the sun»."}, "10": {"a": ["sugar"], "why": "«By mixing it with sugar and serving it hot»."}, "11": {"a": ["press"], "why": "«Van Houten patented a press»."}, "12": {"a": ["1847"], "why": "«In 1847 the English firm Fry's... mould[ed] the first solid chocolate bar»."}, "13": {"a": ["milk"], "why": "«Daniel Peter... finally produced milk chocolate»."}, "14": {"a": ["fermentation"], "why": "«Fermentation is so important that badly fermented beans can never be rescued»."}, "15": {"a": ["ii"], "why": "Абзац A — смех связан с компанией, а не с шутками: «less about comedy than about relationships»."}, "16": {"a": ["iii"], "why": "Абзац B — смеются обезьяны и даже крысы: смех древнее языка и человека."}, "17": {"a": ["i"], "why": "Абзац C — смех заразителен: мозг «готовит» лицевые мышцы присоединиться."}, "18": {"a": ["v"], "why": "Абзац D — эндорфины, болевой порог, гормоны стресса: измеримые эффекты."}, "19": {"a": ["iv"], "why": "Абзац E — смех как «социальный клей», объединяющий группу."}, "20": {"a": ["B"], "why": "Менее одного смеха из пяти следовало за шуткой; смеялись после обычных реплик."}, "21": {"a": ["D"], "why": "«Emit high-pitched ultrasonic chirps and come back eagerly for more»."}, "22": {"a": ["A"], "why": "После совместного просмотра комедии добровольцы «could tolerate noticeably more pain»."}, "23": {"a": ["C"], "why": "Сквозная мысль: смех — социальное поведение с древними эволюционными корнями."}, "24": {"a": ["NO"], "why": "Автор утверждает обратное: большинство смеха не связано с шутками."}, "25": {"a": ["YES"], "why": "«Genuine laughter is notoriously hard to produce on demand»."}, "26": {"a": ["NOT GIVEN"], "why": "О том, сколько смеются сами комики, текст не говорит."}, "27": {"a": ["YES"], "why": "«Play signals used by mammals long before language existed»."}, "28": {"a": ["A"], "why": "Уинстенли «raised the first lighthouse there in 1698» на скалах Эддистон."}, "29": {"a": ["B"], "why": "Смитон скопировал профиль башни со ствола дуба."}, "30": {"a": ["C"], "why": "Френель изобрёл линзу из концентрических стеклянных колец."}, "31": {"a": ["D"], "why": "Смотрители «kept logbooks recording weather, repairs and passing ships»."}, "32": {"a": ["A"], "why": "В шторм 1703 года башню смыло, и Уинстенли «died with it»."}, "33": {"a": ["Alexandria"], "why": "«At the entrance to the harbour of Alexandria»."}, "34": {"a": ["oak"], "why": "«Profile copied from the trunk of an oak tree»."}, "35": {"a": ["1822"], "why": "«The light itself was transformed in 1822, when... Fresnel invented a lens»."}, "36": {"a": ["1998"], "why": "«In 1998 the last keeper in Britain left North Foreland lighthouse»."}, "37": {"a": ["A"], "why": "«Counted among the seven wonders of the ancient world»."}, "38": {"a": ["C"], "why": "Камни, сцепленные «like pieces of a puzzle», и изогнутый профиль по образцу дуба."}, "39": {"a": ["B"], "why": "Линза собирала свет в луч, «visible more than thirty kilometres away»."}, "40": {"a": ["D"], "why": "Электрические лампы, датчики и спутниковая навигация «made them unnecessary»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "reading-10", "title": "Reading · Вариант 10", "minutes": 60, "passages": [{"title": "The history of the postal service", "text": "The desire to send messages over long distances is as old as government itself. The rulers of ancient Persia built one of the first organised systems around 550 BC: mounted couriers waited at stations a day's ride apart, handing letters from one rider to the next so that royal orders could cross the empire in a week. The Roman Empire copied and improved the idea with its cursus publicus, a state relay that carried official post along paved roads maintained for the purpose.\n\nFor centuries, however, the post served rulers, not ordinary people. In medieval Europe letters travelled by private messengers, merchants or monks, and delivery was slow and uncertain. A turning point came in 1516, when the Thurn und Taxis family began operating a postal network across the Holy Roman Empire; for the first time, private citizens could pay to have letters carried along fixed routes on a regular timetable.\n\nThe great reform arrived in Britain in 1840. Before then, the cost of a letter depended on distance and the number of sheets, and — strangely — was usually paid by the person receiving it, not the sender. Rowland Hill argued that this system was expensive to administer and easy to cheat. His solution was a uniform rate: a single low price for any letter under a certain weight, paid in advance by the sender with a small adhesive stamp. The Penny Black, the world's first postage stamp, made posting a letter cheap and simple, and the volume of mail rose dramatically within a few years.\n\nOther countries quickly adopted stamps and prepayment. As international mail grew, the confusion of different national rules became a serious problem, so in 1874 the Universal Postal Union was founded to standardise how letters crossed borders. It remains one of the oldest international organisations in the world.\n\nThe twentieth century added speed. Mail was sorted on moving trains, then flown between continents by air; postcodes were introduced to help machines sort envelopes automatically. Yet the same century eventually produced the post's greatest rival. The spread of the telephone, and later of email and instant messaging, meant that personal letters — once the heart of the service — became rare. Modern postal services have survived by changing their business. The explosion of online shopping has turned them into parcel companies: the envelope may be dying, but the delivery van is busier than ever, carrying to the doorstep the goods that customers once fetched from shops themselves.", "instructions_groups": [{"kind": "tfng", "label": "Вопросы 1–7. TRUE — утверждение совпадает с текстом; FALSE — противоречит; NOT GIVEN — в тексте об этом нет.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "questions": [{"no": 1, "q": "Persia built one of the first organised postal systems."}, {"no": 2, "q": "Roman post travelled along unpaved tracks."}, {"no": 3, "q": "In medieval Europe, letters were always delivered within a day."}, {"no": 4, "q": "Before 1840, the receiver of a letter usually paid for it."}, {"no": 5, "q": "The Penny Black increased the amount of mail sent."}, {"no": 6, "q": "The Universal Postal Union has more than one hundred member countries."}, {"no": 7, "q": "Online shopping has reduced the workload of postal services."}]}, {"kind": "gap", "label": "Вопросы 8–13. Дополните предложения ОДНИМ словом из текста.", "questions": [{"no": 8, "q": "Royal Persian orders could cross the empire in a ______."}, {"no": 9, "q": "The Roman state relay was known as the ______ publicus."}, {"no": 10, "q": "Rowland Hill proposed a ______ rate for all letters."}, {"no": 11, "q": "The world's first postage stamp was the Penny ______."}, {"no": 12, "q": "The ______ Postal Union was founded in 1874."}, {"no": 13, "q": "______ were introduced so that machines could sort envelopes."}]}]}, {"title": "Left-handedness: what science knows", "text": "A. Roughly one person in ten is left-handed, and this ratio has stayed remarkably steady across cultures and across recorded history. Studies of cave paintings and ancient tools suggest that the proportion of left-handers thousands of years ago was much the same as it is today. The stability of the figure has long puzzled scientists, since traits that offer no advantage usually fade away. Whatever causes handedness, it is clearly deep-rooted rather than a modern fashion.\n\nB. Where does it come from? Handedness runs in families, so genes clearly play a part, yet the pattern is not simple. Identical twins, who share all their genes, are sometimes one right- and one left-handed, which proves that genetics cannot be the whole story. Researchers now think that handedness emerges from a mix of many genes and events before birth, including the position of the baby in the womb and the balance of hormones it is exposed to.\n\nC. For centuries left-handers faced open hostility. In many languages the very word for 'left' carries negative meaning, while 'right' suggests correctness and skill. Generations of left-handed children were forced to write with their right hand, sometimes by having the left hand tied behind their back. Only in the twentieth century did most schools abandon the practice, and everyday tools — from scissors to school desks — were still designed almost entirely for the right-handed majority.\n\nD. Is being left-handed an advantage or a disadvantage? The honest answer is a little of both, depending on the task. In sports where opponents face each other directly, such as boxing, tennis and cricket, left-handers are strikingly over-represented, probably because their right-handed rivals get far less practice against them. In a world of right-handed equipment, however, left-handers suffer slightly more accidents with tools and machines.\n\nE. The brain is where the story becomes truly interesting. In most people language is handled mainly by the left half of the brain, which also controls the right hand. In left-handers the picture is more varied: many still process language on the left, but a larger share use the right side or both sides together. Scientists are still debating whether this difference brings any advantage in creativity or problem-solving, a popular claim for which the evidence remains surprisingly thin. Whatever the truth, left-handedness is now seen not as a fault to be corrected but simply as one of the natural varieties of the human brain.", "instructions_groups": [{"kind": "headings", "label": "Вопросы 14–18. Подберите заголовок к каждому абзацу A–E. Два заголовка лишние.", "options": ["i. The tangled origins of handedness", "ii. Faster reactions and longer lives", "iii. Advantages and drawbacks in daily life", "iv. A constant share throughout history", "v. Centuries of prejudice", "vi. Teaching left-handed children today", "vii. Language and the two sides of the brain"], "questions": [{"no": 14, "q": "Абзац A"}, {"no": 15, "q": "Абзац B"}, {"no": 16, "q": "Абзац C"}, {"no": 17, "q": "Абзац D"}, {"no": 18, "q": "Абзац E"}]}, {"kind": "mc", "label": "Вопросы 19–22. Выберите один вариант.", "questions": [{"no": 19, "q": "Over history the proportion of left-handers has", "options": ["A. risen sharply", "B. remained roughly constant", "C. fallen steadily", "D. varied greatly from country to country"]}, {"no": 20, "q": "Identical twins are mentioned to show that", "options": ["A. handedness is purely genetic", "B. twins are usually right-handed", "C. genes do not fully determine handedness", "D. handedness changes with age"]}, {"no": 21, "q": "Left-handers often do well in sports such as tennis because", "options": ["A. their opponents rarely practise against left-handers", "B. they are naturally stronger", "C. the rules of these sports favour them", "D. they train much harder"]}, {"no": 22, "q": "In most people, language is controlled mainly by", "options": ["A. both sides of the brain equally", "B. the right side of the brain", "C. neither side of the brain", "D. the left side of the brain"]}]}, {"kind": "ynng", "label": "Вопросы 23–26. YES — совпадает с мнением автора; NO — противоречит; NOT GIVEN — мнения нет.", "options": ["YES", "NO", "NOT GIVEN"], "questions": [{"no": 23, "q": "Genetics alone can explain which hand a person prefers."}, {"no": 24, "q": "In the past, left-handed children were treated unfairly."}, {"no": 25, "q": "Left-handers earn less money than right-handers."}, {"no": 26, "q": "Everyday tools have mostly been designed for right-handed people."}]}]}, {"title": "Growing food with seawater: desert greenhouses", "text": "Deserts have two things in abundance — sunshine and, along many coasts, seawater — and two things in short supply: fresh water and fertile land. For decades engineers have asked whether the first pair could be used to supply the second. The seawater greenhouse, an idea developed in the 1990s and since built in Australia, Oman and the Arabian Gulf, is one of the most elegant attempts.\n\nThe principle is simple. At the front of the greenhouse, seawater is pumped over a wall of honeycomb-shaped cardboard pads. Hot desert air is drawn through these wet pads by fans; as it passes, it cools and picks up moisture, so the crops inside grow in air that is cool and humid rather than scorching and dry. This alone can lower the temperature by ten degrees or more, allowing tomatoes, cucumbers and lettuces to flourish where they would otherwise wilt.\n\nFresh water is produced at the other end. The warm, moist air meets a series of pipes carrying cold seawater pumped up from deep offshore. Moisture condenses on the cold surfaces exactly as it does on a cold drink on a summer day, and the fresh water runs down to be collected. In effect the greenhouse copies the natural water cycle in miniature, turning salt water and sunshine into a supply of water for the plants.\n\nThe benefits reach beyond the crops themselves. Because the air leaving the greenhouse is cool and damp, the ground immediately outside stays moister than the surrounding desert, and hardy plants can be established around the building. Some projects have used this effect deliberately, aiming to green a patch of desert rather than merely farm it. The salt left behind can be harvested rather than dumped, and the sun can drive the pumps through solar panels, reducing running costs.\n\nThere are limits. Building a seawater greenhouse is expensive, it must sit near both a coast and flat land, and the salty air corrodes metal parts, so materials must be chosen with care. Critics also note that the fresh water produced is often not quite enough for the crops in the hottest months, so a second source may be needed. Still, in a warming world where fresh water is growing scarce, the appeal is obvious. A structure that takes the two things a coastal desert has too much of — heat and salt water — and turns them into food and fresh water looks less like a curiosity and more like a glimpse of the future.", "instructions_groups": [{"kind": "match", "label": "Вопросы 27–31. Соотнесите функцию с элементом системы: A — картонные пады, B — трубы с холодной морской водой, C — солнечные панели, D — влажный воздух на выходе. Буквы могут повторяться.", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "Cools and moistens the hot air entering the greenhouse."}, {"no": 28, "q": "Provides cold surfaces where fresh water condenses."}, {"no": 29, "q": "Can drive the pumps and lower running costs."}, {"no": 30, "q": "Keeps the ground just outside the greenhouse moist."}, {"no": 31, "q": "Is responsible for the large drop in temperature inside."}]}, {"kind": "gap", "label": "Вопросы 32–36. Дополните предложения ОДНИМ словом из текста.", "questions": [{"no": 32, "q": "Seawater is pumped over pads shaped like a ______."}, {"no": 33, "q": "The cooling effect can lower the temperature by ______ degrees or more."}, {"no": 34, "q": "Fresh water forms when moisture ______ on the cold pipes."}, {"no": 35, "q": "The greenhouse copies the natural water ______ in miniature."}, {"no": 36, "q": "The salty air ______ metal parts of the structure."}]}, {"kind": "mc", "label": "Вопросы 37–40. Выберите один вариант.", "questions": [{"no": 37, "q": "The wet cardboard pads mainly serve to", "options": ["A. cool and humidify the incoming air", "B. filter salt out of seawater", "C. generate electricity", "D. block sunlight from the crops"]}, {"no": 38, "q": "Fresh water in the greenhouse is produced by", "options": ["A. boiling seawater", "B. filtering rainwater", "C. melting ice", "D. condensation on cold pipes"]}, {"no": 39, "q": "One drawback the passage mentions is that the greenhouses", "options": ["A. cannot grow any vegetables", "B. may not make enough fresh water in the hottest months", "C. use no electricity at all", "D. must be built far inland"]}, {"no": 40, "q": "The author's overall view of the technology is that it is", "options": ["A. a pointless curiosity", "B. too dangerous to use", "C. a promising answer to future water shortages", "D. already obsolete"]}]}]}]}, "answers": {"1": {"a": ["TRUE"], "why": "«The rulers of ancient Persia built one of the first organised systems»."}, "2": {"a": ["FALSE"], "why": "Римская почта шла по мощёным дорогам: «along paved roads»."}, "3": {"a": ["FALSE"], "why": "В средневековье доставка была «slow and uncertain», а не всегда за день."}, "4": {"a": ["TRUE"], "why": "«Usually paid by the person receiving it, not the sender»."}, "5": {"a": ["TRUE"], "why": "«The volume of mail rose dramatically within a few years»."}, "6": {"a": ["NOT GIVEN"], "why": "О числе стран-членов ВПС в тексте не сказано."}, "7": {"a": ["FALSE"], "why": "Наоборот: «the delivery van is busier than ever»."}, "8": {"a": ["week"], "why": "«Could cross the empire in a week»."}, "9": {"a": ["cursus"], "why": "«Its cursus publicus, a state relay»."}, "10": {"a": ["uniform"], "why": "«His solution was a uniform rate»."}, "11": {"a": ["Black"], "why": "«The Penny Black, the world's first postage stamp»."}, "12": {"a": ["Universal"], "why": "«The Universal Postal Union was founded»."}, "13": {"a": ["Postcodes", "postcodes"], "why": "«Postcodes were introduced to help machines sort envelopes»."}, "14": {"a": ["iv"], "why": "Абзац A — доля левшей неизменна на протяжении истории."}, "15": {"a": ["i"], "why": "Абзац B — о запутанных причинах леворукости (гены и не только)."}, "16": {"a": ["v"], "why": "Абзац C — века враждебности и предрассудков."}, "17": {"a": ["iii"], "why": "Абзац D — плюсы и минусы леворукости в жизни."}, "18": {"a": ["vii"], "why": "Абзац E — язык и два полушария мозга."}, "19": {"a": ["B"], "why": "Доля левшей «stayed remarkably steady» — оставалась примерно постоянной."}, "20": {"a": ["C"], "why": "Близнецы доказывают, что «genetics cannot be the whole story»."}, "21": {"a": ["A"], "why": "«Their right-handed rivals get far less practice against them»."}, "22": {"a": ["D"], "why": "«Language is handled mainly by the left half of the brain»."}, "23": {"a": ["NO"], "why": "Автор пишет, что одни гены не объясняют леворукость."}, "24": {"a": ["YES"], "why": "«Left-handers faced open hostility», детей заставляли переучиваться."}, "25": {"a": ["NOT GIVEN"], "why": "О доходах левшей и правшей в тексте ничего нет."}, "26": {"a": ["YES"], "why": "Инструменты «designed almost entirely for the right-handed majority»."}, "27": {"a": ["A"], "why": "Пады охлаждают и увлажняют входящий воздух."}, "28": {"a": ["B"], "why": "Влага конденсируется на трубах с холодной морской водой."}, "29": {"a": ["C"], "why": "«The sun can drive the pumps through solar panels, reducing running costs»."}, "30": {"a": ["D"], "why": "Влажный воздух на выходе делает землю снаружи влажнее."}, "31": {"a": ["A"], "why": "Именно пады дают падение температуры «by ten degrees or more»."}, "32": {"a": ["honeycomb"], "why": "«Honeycomb-shaped cardboard pads»."}, "33": {"a": ["ten"], "why": "«Lower the temperature by ten degrees or more»."}, "34": {"a": ["condenses"], "why": "«Moisture condenses on the cold surfaces»."}, "35": {"a": ["cycle"], "why": "«Copies the natural water cycle in miniature»."}, "36": {"a": ["corrodes"], "why": "«The salty air corrodes metal parts»."}, "37": {"a": ["A"], "why": "Воздух через пады «cools and picks up moisture»."}, "38": {"a": ["D"], "why": "«Moisture condenses on the cold surfaces» — конденсация на трубах."}, "39": {"a": ["B"], "why": "«The fresh water produced is often not quite enough... in the hottest months»."}, "40": {"a": ["C"], "why": "Вывод: технология выглядит как «a glimpse of the future»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "reading-11", "title": "Reading · Вариант 11", "minutes": 60, "passages": [{"title": "The invention of photography", "text": "The dream of capturing an image without a brush is older than photography itself. Since at least the Renaissance, artists had used the camera obscura — a dark box or room with a small hole that projects an upside-down image of the scene outside onto a wall. The image was beautiful but fleeting; no one knew how to make it stay.\n\nThe first person to fix such an image permanently was the Frenchman Nicéphore Niépce. In 1826 or 1827 he coated a pewter plate with a light-sensitive substance and left it in a camera pointed out of his window. After an exposure lasting many hours, he obtained a faint, grainy view of the rooftops — the oldest surviving photograph from nature. The process was far too slow to be practical, and Niépce died before he could improve it.\n\nHis partner Louis Daguerre carried the work forward. In 1839 he announced the daguerreotype, which produced a sharp, detailed picture on a silvered copper plate in minutes rather than hours. The French government bought the rights and gave the invention 'free to the world', and daguerreotype studios opened across Europe and America within a year. Each daguerreotype, however, was a unique object that could not be copied.\n\nThe solution to that problem came from England. The scientist William Henry Fox Talbot developed a process using paper coated with silver salts, which produced a 'negative' — an image with light and dark reversed. From a single negative, any number of positive prints could be made, and it is this negative–positive principle, not the daguerreotype, that shaped photography for the next century and a half.\n\nEarly photography was demanding. Exposures were long, so portrait sitters had to keep still for many seconds, often supported by hidden metal stands, which is why people in old photographs so rarely smile. Cameras were bulky, and photographers had to prepare and develop their plates on the spot, carrying tents and chemicals wherever they worked. Photography moved into ordinary hands in 1888, when George Eastman launched the Kodak camera. It came pre-loaded with a roll of flexible film for a hundred pictures; the owner simply pressed the button and sent the whole camera back to the factory, where the pictures were printed and the camera reloaded. 'You press the button, we do the rest,' ran the slogan. For the first time, taking a photograph required no skill and no chemistry — and the family snapshot was born.", "instructions_groups": [{"kind": "tfng", "label": "Вопросы 1–7. TRUE — совпадает с текстом; FALSE — противоречит; NOT GIVEN — информации нет.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "questions": [{"no": 1, "q": "The camera obscura was invented in the nineteenth century."}, {"no": 2, "q": "Niépce's first photograph needed an exposure of several hours."}, {"no": 3, "q": "The daguerreotype was faster than Niépce's process."}, {"no": 4, "q": "Each daguerreotype could easily be copied."}, {"no": 5, "q": "Fox Talbot's negative–positive principle influenced photography for over a century."}, {"no": 6, "q": "The Kodak camera was cheaper than the daguerreotype."}, {"no": 7, "q": "The first Kodak came loaded with film for a hundred pictures."}]}, {"kind": "gap", "label": "Вопросы 8–13. Дополните предложения ОДНИМ словом из текста.", "questions": [{"no": 8, "q": "Artists used the ______ obscura to project a scene onto a wall."}, {"no": 9, "q": "Niépce's photograph showed a faint view of the ______."}, {"no": 10, "q": "Daguerre's process created a picture on a silvered ______ plate."}, {"no": 11, "q": "Fox Talbot's method produced a ______ with light and dark reversed."}, {"no": 12, "q": "In old portraits, sitters were supported by hidden metal ______."}, {"no": 13, "q": "The Kodak slogan was 'You press the ______, we do the rest.'"}]}]}, {"title": "Why birds migrate", "text": "A. Every autumn, billions of birds leave the places where they were born and fly toward the equator, only to return the following spring. The scale is staggering: the Arctic tern travels from pole to pole and back each year, covering a distance over its lifetime equal to several trips to the Moon. For centuries such journeys were a mystery; some scholars even suggested that swallows spent the winter asleep in the mud at the bottom of ponds.\n\nB. The basic reason for migration is food, not warmth. Many birds could survive a cold winter if there were enough to eat, but insects vanish and seeds are buried under snow. By flying to warmer regions, birds find abundant food during the northern winter; by returning north in spring, they exploit the sudden explosion of insects and the long daylight hours, which are ideal for raising young. Migration, in short, is a way of living in two summers.\n\nC. How birds find their way remains one of the wonders of biology. Experiments show that they use several compasses at once: the position of the sun by day, the pattern of the stars by night, and, remarkably, the Earth's magnetic field, which they seem able to sense directly. Young birds of some species inherit both the direction and the distance of their first journey, setting off correctly even when they have never seen the route and travel without their parents.\n\nD. Migration is also extraordinarily dangerous. Storms blow small birds out to sea, predators gather at places where migrants must pass, and the long flights demand enormous reserves of fat, built up by feeding intensely before departure. Some birds cross entire deserts or oceans in a single non-stop flight of several days, during which they cannot feed or drink at all. Many do not survive their first migration.\n\nE. Human activity is now reshaping these ancient patterns. Bright city lights confuse night-flying birds, tall buildings and wind turbines kill many, and the draining of wetlands removes the 'service stations' where migrants rest and refuel. Warmer springs create a subtler danger: if insects appear earlier than they used to, birds that arrive on their old schedule may miss the peak of food just when their chicks need it most. Conservationists warn that protecting migratory birds means protecting a chain of sites across many countries at once.", "instructions_groups": [{"kind": "headings", "label": "Вопросы 14–18. Подберите заголовок к каждому абзацу A–E. Два заголовка лишние.", "options": ["i. Chasing food, not warmth", "ii. How birds were first tracked", "iii. A journey full of dangers", "iv. Astonishing journeys and old myths", "v. Finding the way", "vi. Why some birds no longer migrate", "vii. New threats from human activity"], "questions": [{"no": 14, "q": "Абзац A"}, {"no": 15, "q": "Абзац B"}, {"no": 16, "q": "Абзац C"}, {"no": 17, "q": "Абзац D"}, {"no": 18, "q": "Абзац E"}]}, {"kind": "mc", "label": "Вопросы 19–22. Выберите один вариант.", "questions": [{"no": 19, "q": "The Arctic tern is given as an example of", "options": ["A. a bird that never migrates", "B. a bird that sleeps in mud", "C. an extremely long migration", "D. a city-dwelling bird"]}, {"no": 20, "q": "According to the passage, the main reason birds migrate is", "options": ["A. to find enough food", "B. to escape the heat", "C. to avoid predators", "D. to find mates"]}, {"no": 21, "q": "Young birds of some species", "options": ["A. always follow their parents", "B. cannot find their way at all", "C. never migrate alone", "D. inherit the direction and distance of their route"]}, {"no": 22, "q": "Draining wetlands harms migrants by removing", "options": ["A. their breeding grounds", "B. places to rest and refuel", "C. their food in winter", "D. their magnetic sense"]}]}, {"kind": "ynng", "label": "Вопросы 23–26. YES — совпадает с мнением автора; NO — противоречит; NOT GIVEN — мнения нет.", "options": ["YES", "NO", "NOT GIVEN"], "questions": [{"no": 23, "q": "Birds migrate mainly to escape cold temperatures."}, {"no": 24, "q": "Some birds can sense the Earth's magnetic field."}, {"no": 25, "q": "Migration is more dangerous than staying in one place for the winter."}, {"no": 26, "q": "Climate change may cause some birds to arrive after the peak of insect food."}]}]}, {"title": "The economics of second-hand clothes", "text": "Few people think about where their old clothes go once they are dropped into a charity bin or a recycling bank. In fact those garments enter one of the world's largest and least visible trades. Wealthy countries throw away far more clothing than their own charity shops can ever sell, and the surplus — hundreds of thousands of tonnes a year — is baled up and shipped abroad, mostly to Africa, South Asia and Eastern Europe.\n\nThe journey is surprisingly organised. In sorting warehouses, low-paid workers grade incoming clothes by type and quality at high speed. The best items are sold at home in vintage or charity shops; the middle grade is exported for resale; the worst is shredded into cleaning rags or insulation, or simply dumped. Only a small fraction of what we donate is actually worn again by someone else.\n\nAt the receiving end, the trade supports whole economies. In markets from Accra to Nairobi, imported second-hand clothes — known in Ghana as obroni wawu, 'the clothes of the dead white man' — are cheap, varied and often better made than new budget garments. Thousands of traders, tailors and cleaners earn a living from importing, altering and reselling them, and shoppers get good clothing at low prices.\n\nYet the same trade has a darker side. Local critics argue that a flood of cheap imports has undermined domestic clothing industries that once employed many people; several African governments have tried to restrict or ban second-hand imports to protect their own factories. There is also a growing waste problem: so much unsellable clothing now arrives that it piles up on beaches and in rivers, because the poorer importing countries lack the systems to dispose of it.\n\nThe root of the problem lies back in the rich world. 'Fast fashion' has made clothes so cheap that many are worn only a handful of times before being discarded, and much of it is made from synthetic fibres that do not rot. Donating unwanted garments feels virtuous, but it can simply shift the burden of disposal onto countries least able to cope. Some see a better model emerging. Rental services, repair cafés and online resale platforms all aim to keep clothes in use for longer, and a few brands now design garments to be recycled into new fibres. Whether such ideas can outweigh the sheer volume of clothing the world now produces remains, for the moment, an open question.", "instructions_groups": [{"kind": "match", "label": "Вопросы 27–31. Соотнесите утверждение с группой людей: A — работники сортировочных складов, B — африканские торговцы и портные, C — местные швейные фабрики, D — покупатели fast fashion в богатых странах. Буквы могут повторяться.", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "Grade incoming clothes by type and quality at speed."}, {"no": 28, "q": "Earn a living by altering and reselling imported clothes."}, {"no": 29, "q": "Have suffered from competition with cheap imports."}, {"no": 30, "q": "Often wear garments only a few times before discarding them."}, {"no": 31, "q": "Are paid little for their work handling donations."}]}, {"kind": "gap", "label": "Вопросы 32–36. Дополните предложения ОДНИМ словом из текста.", "questions": [{"no": 32, "q": "Surplus clothing is ______ up and shipped abroad."}, {"no": 33, "q": "In Ghana second-hand clothes are called obroni ______."}, {"no": 34, "q": "The worst grade is shredded into cleaning ______ or insulation."}, {"no": 35, "q": "Much fast fashion is made from ______ fibres that do not rot."}, {"no": 36, "q": "______ services aim to keep clothes in use for longer."}]}, {"kind": "mc", "label": "Вопросы 37–40. Выберите один вариант.", "questions": [{"no": 37, "q": "According to the passage, most donated clothing is", "options": ["A. sold in local charity shops", "B. never worn again by another person", "C. turned into new clothes", "D. returned to the donor"]}, {"no": 38, "q": "Several African governments have tried to", "options": ["A. increase second-hand imports", "B. ban all new clothing", "C. subsidise imports", "D. restrict second-hand imports to protect factories"]}, {"no": 39, "q": "The author suggests that donating clothes", "options": ["A. can shift the burden of disposal onto poorer countries", "B. always helps the environment", "C. is illegal in most countries", "D. earns money for the donor"]}, {"no": 40, "q": "The passage ends by suggesting that the future of the trade is", "options": ["A. certain to end soon", "B. sure to keep growing", "C. still an open question", "D. fully controlled by governments"]}]}]}]}, "answers": {"1": {"a": ["FALSE"], "why": "Камера-обскура использовалась «since at least the Renaissance», а не в XIX веке."}, "2": {"a": ["TRUE"], "why": "«After an exposure lasting many hours»."}, "3": {"a": ["TRUE"], "why": "Дагеротип давал картинку «in minutes rather than hours»."}, "4": {"a": ["FALSE"], "why": "Каждый дагеротип был «a unique object that could not be copied»."}, "5": {"a": ["TRUE"], "why": "Принцип «negative–positive» определил фотографию «for the next century and a half»."}, "6": {"a": ["NOT GIVEN"], "why": "Цены Kodak и дагеротипа в тексте не сравниваются."}, "7": {"a": ["TRUE"], "why": "«Pre-loaded with a roll of flexible film for a hundred pictures»."}, "8": {"a": ["camera"], "why": "«Artists had used the camera obscura»."}, "9": {"a": ["rooftops"], "why": "«A faint, grainy view of the rooftops»."}, "10": {"a": ["copper"], "why": "«A picture on a silvered copper plate»."}, "11": {"a": ["negative"], "why": "«Which produced a 'negative' — an image with light and dark reversed»."}, "12": {"a": ["stands"], "why": "«Supported by hidden metal stands»."}, "13": {"a": ["button"], "why": "«You press the button, we do the rest»."}, "14": {"a": ["iv"], "why": "Абзац A — поразительные перелёты и старые мифы (ласточки в иле)."}, "15": {"a": ["i"], "why": "Абзац B — причина миграции еда, а не тепло."}, "16": {"a": ["v"], "why": "Абзац C — как птицы находят путь."}, "17": {"a": ["iii"], "why": "Абзац D — перелёт полон опасностей."}, "18": {"a": ["vii"], "why": "Абзац E — новые угрозы от деятельности человека."}, "19": {"a": ["C"], "why": "Полярная крачка — пример крайне длинной миграции («pole to pole»)."}, "20": {"a": ["A"], "why": "«The basic reason for migration is food, not warmth»."}, "21": {"a": ["D"], "why": "«Inherit both the direction and the distance of their first journey»."}, "22": {"a": ["B"], "why": "Болота — «service stations» где мигранты отдыхают и кормятся."}, "23": {"a": ["NO"], "why": "Автор прямо говорит: «food, not warmth»."}, "24": {"a": ["YES"], "why": "«The Earth's magnetic field, which they seem able to sense directly»."}, "25": {"a": ["NOT GIVEN"], "why": "Автор не сравнивает опасность миграции и зимовки на месте."}, "26": {"a": ["YES"], "why": "«Birds... may miss the peak of food» из-за более ранних вёсен."}, "27": {"a": ["A"], "why": "Работники складов сортируют одежду по типу и качеству."}, "28": {"a": ["B"], "why": "Торговцы и портные зарабатывают на переделке и перепродаже."}, "29": {"a": ["C"], "why": "«Undermined domestic clothing industries» — местные фабрики пострадали."}, "30": {"a": ["D"], "why": "Fast fashion носят «only a handful of times before being discarded»."}, "31": {"a": ["A"], "why": "«Low-paid workers grade incoming clothes»."}, "32": {"a": ["baled"], "why": "«The surplus... is baled up and shipped abroad»."}, "33": {"a": ["wawu"], "why": "«Known in Ghana as obroni wawu»."}, "34": {"a": ["rags"], "why": "«Shredded into cleaning rags or insulation»."}, "35": {"a": ["synthetic"], "why": "«Made from synthetic fibres that do not rot»."}, "36": {"a": ["Rental", "rental"], "why": "«Rental services... aim to keep clothes in use for longer»."}, "37": {"a": ["B"], "why": "«Only a small fraction... is actually worn again by someone else»."}, "38": {"a": ["D"], "why": "«Tried to restrict or ban second-hand imports to protect their own factories»."}, "39": {"a": ["A"], "why": "«It can simply shift the burden of disposal onto countries least able to cope»."}, "40": {"a": ["C"], "why": "Финал: «remains, for the moment, an open question»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "reading-12", "title": "Reading · Вариант 12", "minutes": 60, "passages": [{"title": "Venice and the sea", "text": "Venice is one of the strangest cities ever built. It stands not on solid ground but on a scatter of small islands in a shallow lagoon at the head of the Adriatic Sea. Its first inhabitants were refugees who fled to the marshes in the fifth and sixth centuries to escape invaders on the mainland, choosing a place so difficult to reach that no army could easily follow.\n\nBuilding a city on mud was an astonishing feat. The Venetians drove millions of wooden piles deep into the soft ground until they reached a firmer layer of clay, then laid stone platforms on top to carry their houses, churches and palaces. Sealed away from air under water and mud, the submerged wood did not rot but slowly hardened almost to stone, and much of the medieval city still rests on these ancient foundations.\n\nFor centuries the sea made Venice rich. With little farmland, the city turned to trade, and its fleets dominated commerce between Europe and the East, carrying spices, silk and salt. The lagoon that protected the city also gave it a superb harbour, and Venice grew into one of the wealthiest and most powerful states in Europe, ruled by an elected leader known as the Doge.\n\nThe same sea, however, has always threatened the city. Venice suffers from acqua alta, 'high water', when high tides and storms push the sea over the quaysides and flood the famous Piazza San Marco. The problem is growing worse for two reasons: the land is slowly sinking, partly because groundwater was pumped out during the twentieth century, while the sea is rising as the climate warms.\n\nTo defend itself, the city has built one of the largest engineering projects in Europe: a system of mobile barriers, known as MOSE, that can be raised from the seabed across the entrances to the lagoon to hold back exceptionally high tides. First proposed decades ago and repeatedly delayed, the barriers have in recent years been raised successfully to keep the worst floods out of the city. Venice faces a subtler threat as well. Its permanent population has fallen sharply as residents leave, driven out by high prices and the difficulties of daily life, while millions of tourists arrive each year. Some fear that the city risks becoming a kind of museum — beautifully preserved, endlessly photographed, but slowly emptied of the ordinary people who once made it a living place rather than a spectacle.", "instructions_groups": [{"kind": "tfng", "label": "Вопросы 1–7. TRUE — совпадает с текстом; FALSE — противоречит; NOT GIVEN — информации нет.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "questions": [{"no": 1, "q": "Venice is built on a group of small islands."}, {"no": 2, "q": "The wooden piles beneath Venice quickly rotted away."}, {"no": 3, "q": "Venice became wealthy mainly through farming."}, {"no": 4, "q": "The land under Venice is sinking partly because of groundwater pumping."}, {"no": 5, "q": "The MOSE barriers have never been raised successfully."}, {"no": 6, "q": "Venice attracts more tourists than any other Italian city."}, {"no": 7, "q": "Venice's permanent population has been falling."}]}, {"kind": "gap", "label": "Вопросы 8–13. Дополните предложения ОДНИМ словом из текста.", "questions": [{"no": 8, "q": "Venice's first inhabitants were ______ escaping invaders."}, {"no": 9, "q": "Builders drove millions of wooden ______ into the soft ground."}, {"no": 10, "q": "The submerged wood hardened almost to ______."}, {"no": 11, "q": "Venice was ruled by an elected leader called the ______."}, {"no": 12, "q": "Flooding in Venice is called acqua ______."}, {"no": 13, "q": "The mobile flood barriers are known as ______."}]}]}, {"title": "The mathematics of queues", "text": "A. Nobody likes waiting in line, yet queues are everywhere: at supermarket tills, in telephone call centres, on hospital waiting lists and inside the computers that route traffic across the internet. The study of how queues behave is a genuine branch of mathematics, known as queueing theory, and it began in the early twentieth century with a Danish engineer named Agner Krarup Erlang, who was trying to work out how many telephone lines a town really needed.\n\nB. The central insight of queueing theory is that waiting times depend not only on how busy a system is but on how irregular it is. If customers arrived at perfectly even intervals and every service took exactly the same time, queues would barely form. In the real world, arrivals come in random clusters and some tasks take far longer than others, and it is this variability, more than anything else, that creates the lines we hate.\n\nC. A second, less obvious lesson concerns how full a system runs. As a service approaches full capacity, waiting times do not rise smoothly; they shoot upward. A checkout that is busy ninety per cent of the time produces far longer waits than one busy eighty per cent of the time, not slightly longer but dramatically so. This is why hospitals and airports that try to use every resource to the maximum often collapse into long delays at the smallest disruption.\n\nD. Queueing theory also studies how lines are organised, and the results can be surprising. A single line feeding several servers — as used in many banks and airports — is fairer and usually faster overall than separate lines for each server, because no unlucky customer is trapped behind one very slow case while other lines move on. Understanding such effects lets designers cut waiting times without hiring a single extra member of staff.\n\nE. Perhaps the most interesting findings are about psychology. Experiments show that how long a wait feels matters as much as how long it actually is. Unexplained waits feel longer than explained ones, and idle time feels longer than occupied time; this is why some buildings place mirrors by lifts and screens in waiting rooms. One airport, flooded with complaints about waiting for luggage, solved the problem not by speeding up the baggage handlers but by making passengers walk further to the carousel, so that less of the wait was spent standing still.", "instructions_groups": [{"kind": "headings", "label": "Вопросы 14–18. Подберите заголовок к каждому абзацу A–E. Два заголовка лишние.", "options": ["i. Why irregularity creates lines", "ii. Removing queues altogether", "iii. One line or many?", "iv. A new science of waiting", "v. The danger of running too full", "vi. The cost of hiring more staff", "vii. How waiting feels"], "questions": [{"no": 14, "q": "Абзац A"}, {"no": 15, "q": "Абзац B"}, {"no": 16, "q": "Абзац C"}, {"no": 17, "q": "Абзац D"}, {"no": 18, "q": "Абзац E"}]}, {"kind": "mc", "label": "Вопросы 19–22. Выберите один вариант.", "questions": [{"no": 19, "q": "Queueing theory was first developed to solve a problem about", "options": ["A. supermarket tills", "B. telephone lines", "C. hospital beds", "D. internet traffic"]}, {"no": 20, "q": "According to the passage, queues mainly form because of", "options": ["A. lazy staff", "B. too few customers", "C. low prices", "D. variability in arrivals and service times"]}, {"no": 21, "q": "As a system nears full capacity, waiting times", "options": ["A. rise sharply", "B. fall slowly", "C. stay the same", "D. become predictable"]}, {"no": 22, "q": "A single line feeding several servers is usually", "options": ["A. slower and unfair", "B. only used in banks", "C. fairer and faster overall", "D. more expensive to run"]}]}, {"kind": "ynng", "label": "Вопросы 23–26. YES — совпадает с мнением автора; NO — противоречит; NOT GIVEN — мнения нет.", "options": ["YES", "NO", "NOT GIVEN"], "questions": [{"no": 23, "q": "Running a system at full capacity is an efficient way to avoid delays."}, {"no": 24, "q": "How long a wait feels can matter as much as its real length."}, {"no": 25, "q": "Separate lines for each server are always fairer than a single line."}, {"no": 26, "q": "Most passengers prefer walking to standing still."}]}]}, {"title": "A short history of the alphabet", "text": "Writing was invented more than once, but the alphabet — a small set of signs standing for individual sounds — seems to have been invented only once, and everything from Latin to Arabic to Russian descends from that single ancestor. The earliest writing systems were not alphabets at all. The cuneiform of Mesopotamia and the hieroglyphs of Egypt used hundreds of signs, some standing for whole words and others for syllables, so that mastering them took years and reading and writing remained the preserve of a trained few.\n\nThe breakthrough came from ordinary workers, not scholars. Around 1800 BC, Semitic-speaking people living in or near Egypt began borrowing a handful of Egyptian signs and using them in a new way: each sign stood for the first sound of the word it pictured. A sign for 'house', for example, came to represent simply the sound 'b'. With only a couple of dozen such signs, any word could be spelled out, and writing became something that could be learned in weeks rather than years.\n\nThis early alphabet was spread across the Mediterranean by the Phoenicians, a people of traders and sailors based in what is now Lebanon. Their script, written from right to left, recorded only consonants; readers were expected to supply the vowels from their knowledge of the language, much as some shorthand does today.\n\nIt was the Greeks who took the decisive final step. Borrowing the Phoenician letters, they reused several signs for sounds their own language did not need as symbols for vowels. For the first time, both consonants and vowels were written down, producing an alphabet that could record speech precisely. The very word 'alphabet' comes from the names of the first two Greek letters, alpha and beta, themselves borrowed from the Phoenician words for 'ox' and 'house'.\n\nFrom Greek the alphabet branched again. The Romans adapted it for Latin, giving us the letters used across most of the Western world today, while a separate line led through Greek to the Cyrillic script used for Russian and many other languages. Each culture added, dropped or reshaped letters to fit its own sounds. What makes the story remarkable is how democratic the invention proved. By reducing writing to a few dozen symbols, the alphabet put literacy within reach of anyone, not just a priestly class with years to spare. Every alphabetic script in use today, for all their different shapes, is a distant cousin, tracing back to those first experiments by workers scratching signs in the shadow of the pyramids.", "instructions_groups": [{"kind": "match", "label": "Вопросы 27–31. Соотнесите утверждение с народом: A — египтяне и месопотамцы, B — семитские работники, C — финикийцы, D — греки. Буквы могут повторяться.", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "Used writing systems with hundreds of signs."}, {"no": 28, "q": "First made each sign stand for the first sound of a word."}, {"no": 29, "q": "Spread the early alphabet by sea and wrote only consonants."}, {"no": 30, "q": "Added separate letters for vowels."}, {"no": 31, "q": "Lived near Egypt and borrowed a handful of its signs."}]}, {"kind": "gap", "label": "Вопросы 32–36. Дополните предложения ОДНИМ словом из текста.", "questions": [{"no": 32, "q": "Egyptian writing used signs called ______."}, {"no": 33, "q": "The Phoenician script recorded only ______."}, {"no": 34, "q": "The Phoenicians were based in what is now ______."}, {"no": 35, "q": "The word 'alphabet' comes from alpha and ______."}, {"no": 36, "q": "The Romans adapted the alphabet for ______."}]}, {"kind": "mc", "label": "Вопросы 37–40. Выберите один вариант.", "questions": [{"no": 37, "q": "According to the passage, the alphabet was probably invented", "options": ["A. many separate times", "B. only once", "C. in Greece", "D. by the Romans"]}, {"no": 38, "q": "The early alphabet cut the time needed to learn writing to", "options": ["A. a few days", "B. several years", "C. a lifetime", "D. a few weeks"]}, {"no": 39, "q": "The Greeks' key contribution was", "options": ["A. writing down vowels as well as consonants", "B. inventing cuneiform", "C. dropping all consonants", "D. writing from right to left"]}, {"no": 40, "q": "The author suggests the alphabet mattered because it", "options": ["A. was beautiful to look at", "B. was very hard to learn", "C. put literacy within reach of ordinary people", "D. used hundreds of signs"]}]}]}]}, "answers": {"1": {"a": ["TRUE"], "why": "«On a scatter of small islands in a shallow lagoon»."}, "2": {"a": ["FALSE"], "why": "Дерево не гнило: «the submerged wood did not rot»."}, "3": {"a": ["FALSE"], "why": "«With little farmland, the city turned to trade» — богатела торговлей."}, "4": {"a": ["TRUE"], "why": "«The land is slowly sinking, partly because groundwater was pumped out»."}, "5": {"a": ["FALSE"], "why": "«The barriers have... been raised successfully»."}, "6": {"a": ["NOT GIVEN"], "why": "Сравнения Венеции с другими городами Италии по туризму нет."}, "7": {"a": ["TRUE"], "why": "«Its permanent population has fallen sharply»."}, "8": {"a": ["refugees"], "why": "«Its first inhabitants were refugees who fled to the marshes»."}, "9": {"a": ["piles"], "why": "«Drove millions of wooden piles»."}, "10": {"a": ["stone"], "why": "«Slowly hardened almost to stone»."}, "11": {"a": ["Doge"], "why": "«Ruled by an elected leader known as the Doge»."}, "12": {"a": ["alta"], "why": "«Venice suffers from acqua alta»."}, "13": {"a": ["MOSE"], "why": "«A system of mobile barriers, known as MOSE»."}, "14": {"a": ["iv"], "why": "Абзац A — новая наука об ожидании и её основатель Эрланг."}, "15": {"a": ["i"], "why": "Абзац B — очереди создаёт нерегулярность (variability)."}, "16": {"a": ["v"], "why": "Абзац C — опасность работы на пределе загрузки."}, "17": {"a": ["iii"], "why": "Абзац D — одна очередь или несколько."}, "18": {"a": ["vii"], "why": "Абзац E — как ощущается ожидание (психология)."}, "19": {"a": ["B"], "why": "Эрланг считал, сколько нужно телефонных линий."}, "20": {"a": ["D"], "why": "«It is this variability... that creates the lines we hate»."}, "21": {"a": ["A"], "why": "«They shoot upward» — время ожидания резко растёт."}, "22": {"a": ["C"], "why": "Одна очередь к нескольким кассам «fairer and usually faster overall»."}, "23": {"a": ["NO"], "why": "Автор пишет обратное: полная загрузка ведёт к резким задержкам."}, "24": {"a": ["YES"], "why": "«How long a wait feels matters as much as how long it actually is»."}, "25": {"a": ["NO"], "why": "Автор считает справедливее единую очередь, а не раздельные."}, "26": {"a": ["NOT GIVEN"], "why": "О предпочтениях пассажиров (ходить или стоять) автор не говорит."}, "27": {"a": ["A"], "why": "Клинопись и иероглифы использовали «hundreds of signs»."}, "28": {"a": ["B"], "why": "Семитские работники: каждый знак — первый звук слова."}, "29": {"a": ["C"], "why": "Финикийцы разнесли алфавит и писали «only consonants»."}, "30": {"a": ["D"], "why": "Греки добавили символы для гласных."}, "31": {"a": ["B"], "why": "«Semitic-speaking people living in or near Egypt began borrowing... signs»."}, "32": {"a": ["hieroglyphs"], "why": "«The hieroglyphs of Egypt»."}, "33": {"a": ["consonants"], "why": "«Recorded only consonants»."}, "34": {"a": ["Lebanon"], "why": "«Based in what is now Lebanon»."}, "35": {"a": ["beta"], "why": "«The names of the first two Greek letters, alpha and beta»."}, "36": {"a": ["Latin"], "why": "«The Romans adapted it for Latin»."}, "37": {"a": ["B"], "why": "«The alphabet... seems to have been invented only once»."}, "38": {"a": ["D"], "why": "«Learned in weeks rather than years»."}, "39": {"a": ["A"], "why": "Греки впервые записали и согласные, и гласные."}, "40": {"a": ["C"], "why": "«The alphabet put literacy within reach of anyone»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "reading-13", "title": "Reading · Вариант 13", "minutes": 60, "passages": [{"title": "The first weather forecasts", "text": "For most of history, forecasting the weather relied on folk sayings and the aches of an old sailor's knee. That began to change in the middle of the nineteenth century, when the electric telegraph made it possible, for the first time, to send news of an approaching storm faster than the storm itself could travel. Suddenly weather could be gathered from many places at once and compared on a single map.\n\nThe man usually credited with the first public forecasts is Robert FitzRoy, the British naval officer who had earlier captained HMS Beagle on Charles Darwin's famous voyage. In 1854 he was put in charge of a new government office to collect weather data from ships. After a violent storm sank a passenger ship called the Royal Charter in 1859, drowning hundreds, FitzRoy set up a network of coastal stations that telegraphed observations to London. He drew the results as charts he called 'synoptic', because they gave a synopsis — a single view — of the weather over a wide area.\n\nFrom these charts FitzRoy issued storm warnings to ports, hoisting cones on harbour masts to warn ships to stay in. In 1861 he went further, publishing daily predictions in The Times. It was FitzRoy who coined the word 'forecast', insisting that he was not prophesying but making a reasoned estimate from data.\n\nThe public reaction was mixed. Sailors were grateful, but critics mocked every failed prediction, and some scientists complained that forecasting was not respectable science. FitzRoy, exhausted, in poor health and spending his own money on the work, took his own life in 1865. His forecasts were briefly suspended, only to be restored after fishermen and shipowners protested at their loss.\n\nThe science remained crude for decades. Forecasters worked by comparing the current map with past maps that looked similar, a method that struggled beyond a day or two. The real breakthrough waited until the twentieth century, when the Norwegian Vilhelm Bjerknes argued that the atmosphere obeys the laws of physics and could, in principle, be calculated. That idea — turning weather into equations — eventually gave rise to the computer models that guide forecasts today. Yet the basic tools of FitzRoy's revolution, observations shared quickly and drawn onto a shared map, remain at the heart of every forecast, on land, at sea and in the air.", "instructions_groups": [{"kind": "tfng", "label": "Вопросы 1–7. TRUE — утверждение совпадает с текстом; FALSE — противоречит; NOT GIVEN — в тексте об этом нет.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "questions": [{"no": 1, "q": "FitzRoy had commanded the ship on which Darwin made his famous voyage."}, {"no": 2, "q": "The telegraph could carry news of a storm faster than the storm moved."}, {"no": 3, "q": "FitzRoy began publishing daily forecasts before the Royal Charter sank."}, {"no": 4, "q": "FitzRoy created the term 'forecast'."}, {"no": 5, "q": "Every scientist of the time approved of weather forecasting."}, {"no": 6, "q": "FitzRoy's warnings reduced the number of ships wrecked."}, {"no": 7, "q": "Bjerknes claimed the atmosphere obeys the laws of physics."}]}, {"kind": "gap", "label": "Вопросы 8–13. Дополните предложения ОДНИМ-ДВУМЯ словами из текста.", "questions": [{"no": 8, "q": "The telegraph let weather be gathered and compared on a single ______."}, {"no": 9, "q": "FitzRoy called his charts ______ because they gave a synopsis."}, {"no": 10, "q": "He hoisted ______ on harbour masts to warn ships to stay in."}, {"no": 11, "q": "In 1861 FitzRoy published daily predictions in ______."}, {"no": 12, "q": "Early forecasters compared the current map with past ______ that looked similar."}, {"no": 13, "q": "Bjerknes's idea was to turn weather into ______."}]}]}, {"title": "How pigeons navigate", "text": "A. Few animal talents have puzzled scientists as long as the homing pigeon's ability to find its loft. Released hundreds of kilometres from home, in a place it has never seen, a trained bird will circle once or twice and then set off in roughly the right direction, often arriving the same day. For centuries this skill made pigeons valuable messengers, carrying news across empires and battlefields long before radio; the puzzle of how they do it is only now being unravelled.\n\nB. The most familiar explanation is the sun. Pigeons, like many birds, carry an internal clock, and by combining the time of day with the sun's position they can work out compass directions — a 'sun compass'. Clever experiments confirmed this: when researchers shifted a bird's body clock by keeping it under artificial lighting, the pigeon flew off at a predictable wrong angle, exactly as a mistaken clock would predict. Yet pigeons also navigate under thick cloud, so the sun cannot be the whole story.\n\nC. A second sense involves the Earth's magnetic field. Pigeons appear able to detect the field and use it as a back-up compass, especially when the sun is hidden. Exactly how they sense it is still debated: some researchers point to tiny crystals of iron-rich material in the beak, while others suspect a light-sensitive chemical reaction in the eye. Whatever the mechanism, birds fitted with small magnets, or released during magnetic storms, become noticeably less accurate.\n\nD. Knowing which way is north, however, is not the same as kn

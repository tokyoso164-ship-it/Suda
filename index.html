"}, {"no": 40, "q": "A freight train from China to Europe takes about ______ days."}]}]}]}, "answers": {"1": {"a": ["Whitfield"], "why": "Она диктует по буквам: W-H-I-T-F-I-E-L-D."}, "2": {"a": ["382"], "why": "«It's three eight two»."}, "3": {"a": ["Thursday"], "why": "«Could we arrive on Thursday instead of Tuesday?»."}, "4": {"a": ["4", "four"], "why": "«Yes, four nights, exactly as before»."}, "5": {"a": ["twin"], "why": "«Could we have a twin room rather than a double?»."}, "6": {"a": ["garden"], "why": "«Something quiet, facing the garden rather than the street»."}, "7": {"a": ["9", "nine"], "why": "«It's nine pounds per person per day»."}, "8": {"a": ["underground"], "why": "«We have an underground car park»."}, "9": {"a": ["48"], "why": "«More than forty-eight hours in advance»."}, "10": {"a": ["email"], "why": "«I'll send the new confirmation by email»."}, "11": {"a": ["A"], "why": "«The market will be held every Saturday morning»."}, "12": {"a": ["B"], "why": "«The location is the old cattle yard behind the town hall»."}, "13": {"a": ["C"], "why": "«Every visitor receives a free coffee from the van by the gate»."}, "14": {"a": ["B"], "why": "«Single-use plastic bags are banned at the market»."}, "15": {"a": ["C"], "why": "«Don't phone the council — simply visit the market office»."}, "16": {"a": ["D"], "why": "Rachel «grows wonderful vegetables» — овощи."}, "17": {"a": ["C"], "why": "Martin «keeps bees and will be selling honey» — мёд."}, "18": {"a": ["A"], "why": "Mrs Hale «makes prize-winning cheese» — сыр."}, "19": {"a": ["E"], "why": "Sofia — «fresh flowers from her garden» — цветы."}, "20": {"a": ["B"], "why": "Ben — пекарь: «piled with bread and pastries»."}, "21": {"a": ["C"], "why": "«It kept bending in the middle»."}, "22": {"a": ["B"], "why": "«We're using balsa wood now — it's very light»."}, "23": {"a": ["A"], "why": "«By adding weights gradually — small bags of sand»."}, "24": {"a": ["C"], "why": "«The weakest part is almost never the beams — it's the joints»."}, "25": {"a": ["A"], "why": "«I want photographs of each stage of construction»."}, "26": {"a": ["B"], "why": "«Book the testing rig now. It gets very busy»."}, "27": {"a": ["D"], "why": "Преподаватель: «send me your calculations... I'll check them myself»."}, "28": {"a": ["B"], "why": "Радж: «I'm building the deck»."}, "29": {"a": ["A"], "why": "Эмма: «I'm keeping a photo diary of the whole project»."}, "30": {"a": ["C"], "why": "«We'll give the presentation together — half each»."}, "31": {"a": ["1877"], "why": "«Coined by a German geographer... in eighteen seventy-seven»."}, "32": {"a": ["valuable"], "why": "«Light and extremely valuable»."}, "33": {"a": ["30", "thirty"], "why": "«About thirty kilometres a day»."}, "34": {"a": ["oasis"], "why": "«Goods changed hands again and again in oasis towns»."}, "35": {"a": ["Buddhism"], "why": "«Religions such as Buddhism spread along it»."}, "36": {"a": ["paper"], "why": "«The secret of making paper travelled slowly westwards»."}, "37": {"a": ["plague"], "why": "«Carried disease, including the plague»."}, "38": {"a": ["sea"], "why": "«Faster and cheaper to move goods by sea»."}, "39": {"a": ["2014"], "why": "«In twenty fourteen, UNESCO added long sections... to the World Heritage list»."}, "40": {"a": ["18", "eighteen"], "why": "«A journey of about eighteen days»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "listening-11", "title": "Listening · Вариант 11", "minutes": 30, "parts": [{"title": "Part 1 · Запись в хор (диалог)", "intro": "Мужчина записывается в любительский хор. Вопросы 1–10: дополните заметки ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Good evening! Are you here about joining the choir?\nB: Yes, I saw your poster at the library. Is it too late to join for this season?\nA: Not at all, we're always happy to see new singers. Let me take your details. Your name?\nB: James Fletcher — that's F-L-E-T-C-H-E-R.\nA: Lovely. And which voice part do you sing?\nB: Tenor, usually. I sang tenor in my university choir.\nA: Excellent, we're short of tenors! Now, we rehearse once a week, every Wednesday.\nB: Wednesday works for me. What time?\nA: We start at half past seven and finish at nine thirty. The venue is the church hall — do you know it? On Green Street, next to the primary school.\nB: Green Street, yes, I cycle past it every day. Is there a fee?\nA: There is — twenty-five pounds a term. That covers the sheet music and the hire of the hall, and the first payment also includes a music folder with your name on it.\nB: Very reasonable. Do I need to audition?\nA: Only a short one — it's just a simple voice test, so there's nothing to prepare. We'll do it before rehearsal next week.\nB: That's a relief. And when is the next concert?\nA: In December — carols in the town square, our most popular event of the year.\nB: Perfect. Sign me up!\nA: Welcome to the choir, James.", "groups": [{"kind": "gap", "label": "Вопросы 1–10. Дополните заметки ОДНИМ словом или числом из записи.", "questions": [{"no": 1, "q": "Surname: ______"}, {"no": 2, "q": "Voice part: ______"}, {"no": 3, "q": "Rehearsal day: ______"}, {"no": 4, "q": "Rehearsals start at ______ p.m."}, {"no": 5, "q": "Venue: the ______ hall"}, {"no": 6, "q": "Street: ______ Street"}, {"no": 7, "q": "Fee per term: £______"}, {"no": 8, "q": "First payment includes a music ______"}, {"no": 9, "q": "The audition is a simple ______ test"}, {"no": 10, "q": "Next concert: in ______"}]}]}, {"title": "Part 2 · Реконструкция вокзала (монолог)", "intro": "Объявление для пассажиров о реконструкции станции. Вопросы 11–15: выберите ответ. Вопросы 16–20: соотнесите объект с его судьбой.", "voices": ["A"], "script": "A: Good afternoon, passengers. This is an announcement about the reconstruction of Milford station. Work begins next Monday, and the whole project will take six months, finishing in the spring. Let me explain what will change. While the main hall is rebuilt, tickets will be sold from a temporary kiosk on platform one, right beside the coffee machine. The old footbridge will be completely closed for safety reasons, so to cross the tracks please use the underpass at the south end of the station. Now, some good news. The waiting room will be enlarged, with twice as many seats and new heating. The café, unfortunately, will be temporarily closed during the works, but it will reopen with a bigger kitchen. The old signal box, which has stood empty for thirty years, will be demolished to make room for the new entrance. The bicycle racks will move to a new location beside the north entrance, where there is space for eighty bikes. Platform three is not part of the project and will stay exactly as it is — trains to London will run normally. Finally, we will post weekly updates on the noticeboard by the main entrance, so do check it when you pass. Thank you for your patience.", "groups": [{"kind": "mc", "label": "Вопросы 11–15. Выберите один вариант.", "questions": [{"no": 11, "q": "The reconstruction work begins", "options": ["A. next Monday", "B. next Friday", "C. next month"]}, {"no": 12, "q": "During the works, tickets will be sold", "options": ["A. in the main hall", "B. on platform one", "C. in the car park"]}, {"no": 13, "q": "Which part of the station will be completely closed?", "options": ["A. the underpass", "B. the waiting room", "C. the footbridge"]}, {"no": 14, "q": "The whole project will take", "options": ["A. six weeks", "B. six months", "C. a year"]}, {"no": 15, "q": "Weekly updates will appear", "options": ["A. on the noticeboard by the main entrance", "B. on local radio", "C. in a mobile app"]}]}, {"kind": "match", "label": "Вопросы 16–20. Что произойдёт с каждым объектом? A — будет расширен, B — временно закроется, C — переедет на новое место, D — останется без изменений, E — будет снесён.", "options": ["A", "B", "C", "D", "E"], "questions": [{"no": 16, "q": "The café"}, {"no": 17, "q": "The waiting room"}, {"no": 18, "q": "The old signal box"}, {"no": 19, "q": "The bicycle racks"}, {"no": 20, "q": "Platform three"}]}]}, {"title": "Part 3 · Студенты-биологи и учёт птиц (диалог)", "intro": "Кейти и Лиам планируют учёт птиц с преподавателем. Вопросы 21–26: выберите ответ. Вопросы 27–30: дополните ОДНИМ словом.", "voices": ["A", "B", "C"], "script": "A: Katie, Liam — let's plan the bird count for next month.\nB: We've decided to focus on water birds on the lake, Dr Novak. The forest survey was done last year, so the lake data will be more useful.\nA: I agree. When will you start?\nC: Early in the morning, around sunrise — that's when the birds are most active, so we'll see far more of them.\nA: True. My worry is double counting — birds move around the lake all the time.\nB: We thought about that. We're going to divide the lake into sections, with one team in each, and everyone counts at exactly the same time.\nA: Very good. Do you have enough equipment?\nC: That was a problem — the department only has three pairs of binoculars. But the local birdwatching society has agreed to lend us four more pairs.\nA: Excellent. And what if the weather is bad?\nB: If it rains, we'll simply move the count to the next weekend. Wet birds hide, so the data would be useless anyway.\nA: Right. How will you record the numbers?\nC: We were planning paper forms.\nA: Hmm — paper gets wet and gets lost. I'd suggest a mobile app instead; there's a free one designed for bird surveys, and it saves everything instantly.\nB: That does sound better. We'll try it.\nA: How long will you count for?\nC: Three hours, from six until nine.\nA: And remember, each section needs two observers — one watching, one recording. When it's all done, the results will be added to the national bird database, and I need your final report by the end of March.\nB: Understood. Thank you!", "groups": [{"kind": "mc", "label": "Вопросы 21–26. Выберите один вариант.", "questions": [{"no": 21, "q": "The survey will focus on", "options": ["A. birds in gardens", "B. birds in the forest", "C. water birds on the lake"]}, {"no": 22, "q": "Counting will start at sunrise because birds are", "options": ["A. easier to photograph", "B. most active", "C. less shy"]}, {"no": 23, "q": "To avoid double counting, the students will", "options": ["A. divide the lake into sections", "B. count only male birds", "C. use a single observer"]}, {"no": 24, "q": "The extra binoculars will come from", "options": ["A. the biology department", "B. the local birdwatching society", "C. another university"]}, {"no": 25, "q": "If it rains, the count will be", "options": ["A. cancelled", "B. done from cars", "C. moved to the next weekend"]}, {"no": 26, "q": "The tutor suggests recording data with", "options": ["A. paper forms", "B. a mobile app", "C. voice recorders"]}]}, {"kind": "gap", "label": "Вопросы 27–30. Дополните ОДНИМ словом из записи.", "questions": [{"no": 27, "q": "The count will last three ______."}, {"no": 28, "q": "Each section needs two ______."}, {"no": 29, "q": "The results will be added to the national bird ______."}, {"no": 30, "q": "The final report is due by the end of ______."}]}]}, {"title": "Part 4 · Лекция: история кино (монолог)", "intro": "Фрагмент лекции по истории культуры. Вопросы 31–40: дополните конспект ОДНИМ словом или числом.", "voices": ["A"], "script": "A: How did cinema begin? Most historians point to December eighteen ninety-five, when the Lumiere brothers held the first public film screening for a paying audience. It took place, rather modestly, in the basement of a cafe in Paris. Those early films lasted about one minute each — workers leaving a factory, a train arriving at a station — yet audiences were astonished. The new entertainment spread quickly. In America, small cinemas were nicknamed nickelodeons, because a ticket cost just five cents. Films were still silent, of course, so the action was accompanied by a live piano, and a skilled player could make a simple chase feel thrilling. The great turning point came in nineteen twenty-seven, when the first feature film with sound amazed the public, and within a few years silent cinema had almost disappeared. Colour arrived more slowly: although experiments began early, colour films only became dominant in the nineteen fifties. Then a new rival appeared — television. To win audiences back, studios introduced much wider screens and grand epics that a small living-room set could not match. Technology kept moving: today most films are shot on digital cameras, and thanks to streaming services many people now watch films at home. Cinema has changed constantly — and it has survived every change.", "groups": [{"kind": "gap", "label": "Вопросы 31–40. Дополните конспект ОДНИМ словом или числом из записи.", "questions": [{"no": 31, "q": "The first public screening was held in December ______."}, {"no": 32, "q": "It took place in the ______ of a Paris cafe."}, {"no": 33, "q": "Early films lasted about one ______ each."}, {"no": 34, "q": "A ticket to a nickelodeon cost ______ cents."}, {"no": 35, "q": "Silent films were accompanied by a live ______."}, {"no": 36, "q": "The first feature film with sound appeared in ______."}, {"no": 37, "q": "Colour films became dominant in the ______."}, {"no": 38, "q": "To compete with television, studios introduced much wider ______."}, {"no": 39, "q": "Today most films are shot on ______ cameras."}, {"no": 40, "q": "Thanks to streaming, many people now watch films at ______."}]}]}]}, "answers": {"1": {"a": ["Fletcher"], "why": "Он диктует по буквам: F-L-E-T-C-H-E-R."}, "2": {"a": ["tenor"], "why": "«Tenor, usually. I sang tenor in my university choir»."}, "3": {"a": ["Wednesday"], "why": "«We rehearse once a week, every Wednesday»."}, "4": {"a": ["7:30", "7.30", "730"], "why": "«We start at half past seven» = 7:30 вечера."}, "5": {"a": ["church"], "why": "«The venue is the church hall»."}, "6": {"a": ["Green"], "why": "«On Green Street, next to the primary school»."}, "7": {"a": ["25"], "why": "«Twenty-five pounds a term»."}, "8": {"a": ["folder"], "why": "«The first payment also includes a music folder»."}, "9": {"a": ["voice"], "why": "«It's just a simple voice test»."}, "10": {"a": ["December"], "why": "«In December — carols in the town square»."}, "11": {"a": ["A"], "why": "«Work begins next Monday»."}, "12": {"a": ["B"], "why": "«Tickets will be sold from a temporary kiosk on platform one»."}, "13": {"a": ["C"], "why": "«The old footbridge will be completely closed»."}, "14": {"a": ["B"], "why": "«The whole project will take six months»."}, "15": {"a": ["A"], "why": "«Weekly updates on the noticeboard by the main entrance»."}, "16": {"a": ["B"], "why": "Кафе «will be temporarily closed during the works»."}, "17": {"a": ["A"], "why": "«The waiting room will be enlarged»."}, "18": {"a": ["E"], "why": "«The old signal box... will be demolished»."}, "19": {"a": ["C"], "why": "«The bicycle racks will move to a new location»."}, "20": {"a": ["D"], "why": "«Platform three... will stay exactly as it is»."}, "21": {"a": ["C"], "why": "«Focus on water birds on the lake»."}, "22": {"a": ["B"], "why": "«That's when the birds are most active»."}, "23": {"a": ["A"], "why": "«We're going to divide the lake into sections»."}, "24": {"a": ["B"], "why": "«The local birdwatching society has agreed to lend us four more pairs»."}, "25": {"a": ["C"], "why": "«We'll simply move the count to the next weekend»."}, "26": {"a": ["B"], "why": "«I'd suggest a mobile app instead»."}, "27": {"a": ["hours"], "why": "«Three hours, from six until nine»."}, "28": {"a": ["observers"], "why": "«Each section needs two observers»."}, "29": {"a": ["database"], "why": "«Added to the national bird database»."}, "30": {"a": ["March"], "why": "«Your final report by the end of March»."}, "31": {"a": ["1895"], "why": "«December eighteen ninety-five... the first public film screening»."}, "32": {"a": ["basement"], "why": "«In the basement of a cafe in Paris»."}, "33": {"a": ["minute"], "why": "«Lasted about one minute each»."}, "34": {"a": ["5", "five"], "why": "«A ticket cost just five cents»."}, "35": {"a": ["piano"], "why": "«Accompanied by a live piano»."}, "36": {"a": ["1927"], "why": "«In nineteen twenty-seven... the first feature film with sound»."}, "37": {"a": ["1950s", "fifties"], "why": "«Became dominant in the nineteen fifties»."}, "38": {"a": ["screens"], "why": "«Studios introduced much wider screens»."}, "39": {"a": ["digital"], "why": "«Most films are shot on digital cameras»."}, "40": {"a": ["home"], "why": "«Many people now watch films at home»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "listening-12", "title": "Listening · Вариант 12", "minutes": 30, "parts": [{"title": "Part 1 · Бронирование кемпинга (диалог)", "intro": "Женщина бронирует место в кемпинге по телефону. Вопросы 1–10: дополните заметки ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Greenhill Campsite, good morning!\nB: Oh hello. I'd like to book a pitch for next weekend, please.\nA: Certainly. Could I have your surname?\nB: Osborne — O-S-B-O-R-N-E.\nA: Thank you. And when would you like to arrive?\nB: On Friday, in the late afternoon, if that's okay.\nA: Friday is fine. How many nights?\nB: Three nights — we'll leave on Monday morning.\nA: And is it a tent or a caravan?\nB: A tent — quite a big one. Could we have a pitch with an electric hook-up?\nA: Yes, all our tent pitches have electricity. How many people?\nB: Two adults and three children, so five altogether.\nA: Five, lovely. That pitch is twenty-two pounds a night. Oh, will you be bringing a dog?\nB: Yes, our spaniel. Is that all right?\nA: Dogs are welcome, but they must be kept on a lead at all times, even at night. And please note there are no open fires — barbecues are only allowed in the picnic area by the gate.\nB: Understood. Is there a shop on site?\nA: There is, quite a good one, and it closes at eight in the evening. To hold the booking I just need a deposit of ten pounds; the rest you pay on arrival.\nB: No problem, I'll pay the deposit by card now.\nA: Perfect. We'll see you on Friday, Mrs Osborne!", "groups": [{"kind": "gap", "label": "Вопросы 1–10. Дополните заметки ОДНИМ словом или числом из записи.", "questions": [{"no": 1, "q": "Surname: ______"}, {"no": 2, "q": "Arrival day: ______"}, {"no": 3, "q": "Number of nights: ______"}, {"no": 4, "q": "Pitch for a large ______ with electricity"}, {"no": 5, "q": "Total number of people: ______"}, {"no": 6, "q": "Price per night: £______"}, {"no": 7, "q": "Dogs must be kept on a ______"}, {"no": 8, "q": "Barbecues are only allowed in the ______ area"}, {"no": 9, "q": "The shop closes at ______ p.m."}, {"no": 10, "q": "Deposit: £______"}]}]}, {"title": "Part 2 · Брифинг перед благотворительным забегом (монолог)", "intro": "Организатор инструктирует участников забега. Вопросы 11–15: выберите ответ. Вопросы 16–20: соотнесите место с его назначением.", "voices": ["A"], "script": "A: Good morning, runners, and welcome to the tenth Oakfield Charity Run! A few important points before we begin. The run starts at half past nine exactly, so please be at the start line ten minutes early. The route is ten kilometres, along the river and back through the park — it's flat, fast and clearly marked. Remember why we're here: every pound raised today will go to the children's hospital, which is building a new ward. Now, some rules. Runners must pin their number to their chest, where the judges can see it — not to your back, and not to your bag. Every finisher gets a medal at the line, and the prizes for the fastest runners will be presented at midday on the main stage. Where is everything? If you have a bag, leave it in the sports hall, which we're using for bag storage today. Registration, if you haven't signed in yet, is in the white tent. The blue tent is the first-aid point, staffed by volunteer nurses all morning. Water will be handed out at tables at the halfway point, so you don't need to carry your own. And drivers — please park in the field behind the church, not on the village streets. Good luck, everybody!", "groups": [{"kind": "mc", "label": "Вопросы 11–15. Выберите один вариант.", "questions": [{"no": 11, "q": "The run starts at", "options": ["A. 9:00", "B. 9:30", "C. 10:00"]}, {"no": 12, "q": "The route is", "options": ["A. 5 kilometres", "B. 8 kilometres", "C. 10 kilometres"]}, {"no": 13, "q": "The money raised will go to", "options": ["A. the children's hospital", "B. an animal shelter", "C. a food bank"]}, {"no": 14, "q": "Runners must", "options": ["A. carry their own water", "B. pin their number to their chest", "C. wear headphones"]}, {"no": 15, "q": "Prizes will be presented", "options": ["A. at midday", "B. straight after the race", "C. in the evening"]}]}, {"kind": "match", "label": "Вопросы 16–20. Что где находится? A — регистрация, B — вода, C — первая помощь, D — камера хранения, E — парковка.", "options": ["A", "B", "C", "D", "E"], "questions": [{"no": 16, "q": "The sports hall"}, {"no": 17, "q": "The white tent"}, {"no": 18, "q": "The blue tent"}, {"no": 19, "q": "The halfway point"}, {"no": 20, "q": "The field behind the church"}]}]}, {"title": "Part 3 · Статистика для курсовой (диалог)", "intro": "Анна обсуждает с тьютором обработку данных для курсовой. Вопросы 21–26: выберите ответ. Вопросы 27–30: соотнесите часть работы с её состоянием.", "voices": ["A", "B"], "script": "A: Come in, Anna. How is the statistics side of your coursework going?\nB: Mostly well, Dr Grant. I collected ninety completed questionnaires about student spending habits.\nA: Ninety responses is plenty for a project of this size, so don't worry about the sample.\nB: Good. There is one problem, though — a lot of people skipped the question about income. I think it felt too personal.\nA: That happens. How many questionnaires are incomplete overall?\nB: Twelve have missing answers in several places.\nA: Then the cleanest solution is to leave them out of the analysis completely, and say clearly in your methods chapter that you did so.\nB: Okay. Now, the averages. The mean spending looks strangely high.\nA: Let me guess — a few big spenders? When a handful of people spend far more than everyone else, they distort the mean. Use the median instead; it gives a much fairer picture.\nB: The median. Right. And for comparing the three student groups, I made pie charts.\nA: Hmm. Pie charts are hard to compare side by side. For comparing groups, a bar chart is much clearer — one bar per group, same scale.\nB: I'll redo them tonight, then.\nA: Where are you with everything else?\nB: The data entry is finished — every questionnaire is in the spreadsheet. I'm halfway through transcribing the interviews, so that's still in progress. But the statistical tests I haven't started yet — I wanted to ask you which ones to use first.\nA: We'll choose the tests together next time. Send me the new charts by Tuesday, and we'll meet on Thursday.\nB: By Tuesday. Thank you, Dr Grant!", "groups": [{"kind": "mc", "label": "Вопросы 21–26. Выберите один вариант.", "questions": [{"no": 21, "q": "The tutor thinks that ninety responses is", "options": ["A. too few", "B. enough", "C. too many"]}, {"no": 22, "q": "Many respondents skipped the question about", "options": ["A. income", "B. age", "C. study hours"]}, {"no": 23, "q": "The incomplete questionnaires should be", "options": ["A. sent back to the respondents", "B. filled in with average numbers", "C. left out of the analysis"]}, {"no": 24, "q": "Instead of the mean, Anna should report the", "options": ["A. mode", "B. median", "C. range"]}, {"no": 25, "q": "For comparing the groups, the tutor recommends", "options": ["A. a pie chart", "B. a table", "C. a bar chart"]}, {"no": 26, "q": "Anna will send the new charts by", "options": ["A. Tuesday", "B. Thursday", "C. Friday"]}]}, {"kind": "match", "label": "Вопросы 27–30. В каком состоянии каждая часть работы? A — готова, B — нужно переделать, C — в процессе, D — не начата.", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "Data entry"}, {"no": 28, "q": "The charts"}, {"no": 29, "q": "Interview transcripts"}, {"no": 30, "q": "Statistical tests"}]}]}, {"title": "Part 4 · Лекция: вулканы и климат (монолог)", "intro": "Фрагмент лекции по наукам о Земле. Вопросы 31–40: дополните конспект ОДНИМ словом или числом.", "voices": ["A"], "script": "A: Can a single mountain change the weather of the whole planet? Large volcanic eruptions can. When a big volcano explodes, it pushes ash and gas high above the clouds, into the stratosphere. The most important gas is sulphur dioxide, which turns into tiny droplets, and these droplets reflect sunlight back into space, cooling the surface below. The cooling effect usually lasts about two years, before the droplets finally fall out of the sky. History gives us dramatic examples. Mount Tambora in Indonesia erupted in eighteen fifteen — the most powerful eruption in modern history. The following year was so cold in Europe and North America that it was called the year without a summer. Crops failed across the northern hemisphere, and the failures led to serious food shortages. In eighteen eighty-three the eruption of Krakatoa filled the atmosphere with dust that produced bright red sunsets around the world for many months. And in more recent times, the eruption of Mount Pinatubo in nineteen ninety-one cooled the planet by about half a degree. Today scientists no longer rely on ground observers alone: volcanic clouds are tracked by satellites within hours of an eruption. One final point: volcanic cooling is short-lived — quite unlike the long-term warming caused by carbon dioxide.", "groups": [{"kind": "gap", "label": "Вопросы 31–40. Дополните конспект ОДНИМ словом или числом из записи.", "questions": [{"no": 31, "q": "Eruptions push ash and gas into the ______."}, {"no": 32, "q": "Tiny droplets reflect ______ back into space."}, {"no": 33, "q": "The cooling effect lasts about two ______."}, {"no": 34, "q": "Mount Tambora erupted in ______."}, {"no": 35, "q": "The next year was called 'the year without a ______'."}, {"no": 36, "q": "Crop failures led to serious food ______."}, {"no": 37, "q": "Krakatoa's dust produced bright red ______."}, {"no": 38, "q": "Pinatubo cooled the planet by about half a ______."}, {"no": 39, "q": "Volcanic clouds are now tracked by ______."}, {"no": 40, "q": "Long-term warming is caused by carbon ______."}]}]}]}, "answers": {"1": {"a": ["Osborne"], "why": "Она диктует по буквам: O-S-B-O-R-N-E."}, "2": {"a": ["Friday"], "why": "«On Friday, in the late afternoon»."}, "3": {"a": ["3", "three"], "why": "«Three nights — we'll leave on Monday morning»."}, "4": {"a": ["tent"], "why": "«A tent — quite a big one» с электроподключением."}, "5": {"a": ["5", "five"], "why": "«Two adults and three children, so five altogether»."}, "6": {"a": ["22"], "why": "«That pitch is twenty-two pounds a night»."}, "7": {"a": ["lead"], "why": "«They must be kept on a lead at all times»."}, "8": {"a": ["picnic"], "why": "«Barbecues are only allowed in the picnic area by the gate»."}, "9": {"a": ["8", "eight"], "why": "«It closes at eight in the evening»."}, "10": {"a": ["10", "ten"], "why": "«A deposit of ten pounds»."}, "11": {"a": ["B"], "why": "«The run starts at half past nine exactly» = 9:30."}, "12": {"a": ["C"], "why": "«The route is ten kilometres»."}, "13": {"a": ["A"], "why": "«Every pound raised today will go to the children's hospital»."}, "14": {"a": ["B"], "why": "«Runners must pin their number to their chest»."}, "15": {"a": ["A"], "why": "«Prizes... will be presented at midday on the main stage»."}, "16": {"a": ["D"], "why": "Спортзал: «we're using for bag storage today» — камера хранения."}, "17": {"a": ["A"], "why": "«Registration... is in the white tent»."}, "18": {"a": ["C"], "why": "«The blue tent is the first-aid point»."}, "19": {"a": ["B"], "why": "«Water will be handed out at tables at the halfway point»."}, "20": {"a": ["E"], "why": "«Please park in the field behind the church»."}, "21": {"a": ["B"], "why": "«Ninety responses is plenty for a project of this size»."}, "22": {"a": ["A"], "why": "«A lot of people skipped the question about income»."}, "23": {"a": ["C"], "why": "«Leave them out of the analysis completely»."}, "24": {"a": ["B"], "why": "«Use the median instead; it gives a much fairer picture»."}, "25": {"a": ["C"], "why": "«For comparing groups, a bar chart is much clearer»."}, "26": {"a": ["A"], "why": "«Send me the new charts by Tuesday»."}, "27": {"a": ["A"], "why": "«The data entry is finished»."}, "28": {"a": ["B"], "why": "Диаграммы надо переделать: «I'll redo them tonight»."}, "29": {"a": ["C"], "why": "«Halfway through transcribing the interviews... still in progress»."}, "30": {"a": ["D"], "why": "«The statistical tests I haven't started yet»."}, "31": {"a": ["stratosphere"], "why": "«Pushes ash and gas high above the clouds, into the stratosphere»."}, "32": {"a": ["sunlight"], "why": "«These droplets reflect sunlight back into space»."}, "33": {"a": ["years"], "why": "«The cooling effect usually lasts about two years»."}, "34": {"a": ["1815"], "why": "«Mount Tambora in Indonesia erupted in eighteen fifteen»."}, "35": {"a": ["summer"], "why": "«It was called the year without a summer»."}, "36": {"a": ["shortages"], "why": "«The failures led to serious food shortages»."}, "37": {"a": ["sunsets"], "why": "«Dust that produced bright red sunsets around the world»."}, "38": {"a": ["degree"], "why": "«Cooled the planet by about half a degree»."}, "39": {"a": ["satellites"], "why": "«Volcanic clouds are tracked by satellites»."}, "40": {"a": ["dioxide"], "why": "«The long-term warming caused by carbon dioxide»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "listening-13", "title": "Listening · Вариант 13", "minutes": 30, "parts": [{"title": "Part 1 · Обращение в мастерскую по ремонту телефонов (диалог)", "intro": "Клиентка звонит в мастерскую по поводу сломанного телефона. Вопросы 1–10: дополните заметки ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Good morning, FixPoint Phone Repairs, how can I help?\nB: Hi, my phone's broken — I dropped it yesterday and now the screen is cracked.\nA: We can certainly look at that. Could I take your name?\nB: Yes, it's Sarah Whitlock — that's W-H-I-T-L-O-C-K.\nA: Thank you. And what phone is it?\nB: It's a Vega — the model is Vega eight.\nA: Vega eight, fine. So the screen is cracked. Anything else we should look at?\nB: Yes, actually — the battery runs out really quickly, usually by early afternoon.\nA: We can replace both. A new screen for that model is fifty-five pounds, and a new battery is twenty-five.\nB: That's fine. How long will it take?\nA: We're quite busy this week — if you bring it in tomorrow morning, it will be ready by Thursday.\nB: Thursday's okay. Is there any guarantee on the work?\nA: Yes, all our repairs come with a six-month guarantee.\nB: Great. Do I need to do anything before I bring it in?\nA: Please remove your SIM card — we don't keep customers' cards in the shop.\nB: Will do. And where exactly are you?\nA: We're on Station Road, directly opposite the library. There's parking nearby.\nB: Perfect, see you tomorrow morning. Thank you!\nA: You're welcome. Goodbye!", "groups": [{"kind": "gap", "label": "Вопросы 1–10. Дополните заметки ОДНИМ словом или числом из записи.", "questions": [{"no": 1, "q": "Surname: ______"}, {"no": 2, "q": "Phone model: Vega ______"}, {"no": 3, "q": "First problem: cracked ______"}, {"no": 4, "q": "Second problem: the ______ runs out quickly"}, {"no": 5, "q": "Cost of a new screen: £______"}, {"no": 6, "q": "Cost of a new battery: £______"}, {"no": 7, "q": "Phone will be ready by: ______"}, {"no": 8, "q": "All repairs come with a guarantee of ______ months"}, {"no": 9, "q": "Before the repair, remove the ______ card"}, {"no": 10, "q": "The shop is opposite the ______"}]}]}, {"title": "Part 2 · Вступление аудиотура в художественной галерее (монолог)", "intro": "Запись-приветствие аудиогида в галерее. Вопросы 11–15: выберите ответ. Вопросы 16–20: соотнесите зал с тем, что там выставлено.", "voices": ["A"], "script": "A: Welcome to the Harewood Gallery, and thank you for choosing our audio tour. Before we begin, a little background. The building you are standing in was not designed as a gallery at all — for almost a century it was a bank, and the grand marble hall where you collected your headset was once the main banking floor. The full tour takes roughly ninety minutes, but you can pause it whenever you like. You are welcome to take photographs anywhere in the gallery, as long as you do not use flash, which damages the paintings. Now, let me explain the layout. In Room One you will find our collection of landscapes — English rivers, Dutch winters and Italian coasts. Room Two is devoted to portraits, from Tudor merchants to modern faces. The Sculpture Hall, under the great glass roof, displays modern sculpture in steel and stone. In the East Wing we are proud to show contemporary glass art — please keep bags close to your body there. And downstairs, the Basement Gallery hosts photography: this season, a hundred years of street photography from five continents. When you feel like a rest, the café is on the top floor, with fine views over the square. Finally, at the end of your visit, please return your headset to the front desk. Enjoy the collection!", "groups": [{"kind": "mc", "label": "Вопросы 11–15. Выберите один вариант.", "questions": [{"no": 11, "q": "For almost a century the building was", "options": ["A. a church", "B. a bank", "C. a post office"]}, {"no": 12, "q": "The full audio tour takes about", "options": ["A. 45 minutes", "B. 60 minutes", "C. 90 minutes"]}, {"no": 13, "q": "Photography in the gallery is", "options": ["A. banned everywhere", "B. allowed without flash", "C. allowed only in the hall"]}, {"no": 14, "q": "The café is located on", "options": ["A. the ground floor", "B. the basement level", "C. the top floor"]}, {"no": 15, "q": "At the end of the visit, headsets should be returned to", "options": ["A. the front desk", "B. the gift shop", "C. the cloakroom"]}]}, {"kind": "match", "label": "Вопросы 16–20. Что где выставлено? A — портреты, B — пейзажи, C — современная скульптура, D — фотография, E — стеклянное искусство.", "options": ["A", "B", "C", "D", "E"], "questions": [{"no": 16, "q": "Room One"}, {"no": 17, "q": "Room Two"}, {"no": 18, "q": "Sculpture Hall"}, {"no": 19, "q": "East Wing"}, {"no": 20, "q": "Basement Gallery"}]}]}, {"title": "Part 3 · Два студента планируют учебный подкаст (диалог)", "intro": "Дана и Лео обсуждают запуск подкаста об учебных навыках. Вопросы 21–26: выберите ответ. Вопросы 27–30: соотнесите задачу с тем, как она решена.", "voices": ["A", "B"], "script": "A: Right, Leo, let's plan this podcast properly. Who is it actually for?\nB: I think we should aim it at first-year students — they're the ones who struggle most with study skills.\nA: Agreed. How long should each episode be?\nB: I listened to a few student podcasts, and anything over half an hour feels too long. Let's make each episode twenty minutes.\nA: Twenty minutes it is. Where can we record? My flatmates are noisy.\nB: The library has a media room with proper soundproofing, and it's free to book for students.\nA: Perfect, the library media room then. And how often do we publish?\nB: Weekly is too much pressure with our coursework. Let's release an episode every two weeks.\nA: Fine. Now, how do we get people to actually listen?\nB: Posters never work. I thought we could invite a guest lecturer for each episode — students will come for the names.\nA: Great idea. Dr Osei would be perfect for the first one. Speaking of which — first topic?\nB: Note-taking. Everyone writes notes badly, including me.\nA: Note-taking it is. Now the practical stuff. What about editing software?\nB: Already sorted — I've installed the editing software on my laptop, it's open source.\nA: Brilliant. Microphones?\nB: We can borrow two microphones from the media department — I checked yesterday, we just sign a form.\nA: What about theme music? We can't use anything copyrighted.\nB: I'll compose a short theme tune myself — I play guitar, remember?\nA: Then I'll design the logo — I'm good with graphics. Let's meet on Friday to record a trial episode.\nB: Deal. Friday afternoon, media room.", "groups": [{"kind": "mc", "label": "Вопросы 21–26. Выберите один вариант.", "questions": [{"no": 21, "q": "The podcast is aimed at", "options": ["A. final-year students", "B. first-year students", "C. international students"]}, {"no": 22, "q": "Each episode will last", "options": ["A. 10 minutes", "B. 15 minutes", "C. 20 minutes"]}, {"no": 23, "q": "They will record the podcast in", "options": ["A. the library media room", "B. Leo's flat", "C. an empty classroom"]}, {"no": 24, "q": "New episodes will come out", "options": ["A. every week", "B. every two weeks", "C. every month"]}, {"no": 25, "q": "To attract listeners, they will", "options": ["A. put up posters", "B. pay for adverts", "C. invite a guest lecturer"]}, {"no": 26, "q": "The first episode will be about", "options": ["A. note-taking", "B. exam stress", "C. student budgets"]}]}, {"kind": "match", "label": "Вопросы 27–30. Как решён каждый вопрос? A — уже сделано, B — сделает Дана, C — сделает Лео, D — одолжат на факультете.", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "Editing software"}, {"no": 28, "q": "Microphones"}, {"no": 29, "q": "Theme music"}, {"no": 30, "q": "Logo"}]}]}, {"title": "Part 4 · Лекция: история часов и измерения времени (монолог)", "intro": "Фрагмент лекции по истории техники. Вопросы 31–40: дополните конспект ОДНИМ словом или числом.", "voices": ["A"], "script": "A: How did people know the time before clocks ticked on every wrist? The earliest sundials appeared in Egypt more than three thousand years ago — a simple stick whose shadow moved across marked stones. The obvious weakness of a sundial is that it tells you nothing after dark or under clouds, so ancient engineers also built water clocks, which measured time by water dripping steadily from one vessel into another — and they worked perfectly well at night. Mechanical clocks arrived in Europe in the thirteenth century. The first ones stood in church towers, and interestingly they had no hands and no dial at all — they simply struck a bell to call people to prayer. Accuracy came much later. In sixteen fifty-six a scientist from Holland, Christiaan Huygens, built the first pendulum clock, cutting the error from a quarter of an hour a day to barely a minute. For centuries every town still kept its own local time, and nobody minded — until the growth of railway travel made shared timetables essential: a train cannot leave every station at its own local noon. So in eighteen eighty-four an international conference divided the world into twenty-four time zones, the system we still use today. The twentieth century brought two more leaps. In nineteen twenty-seven engineers created the first quartz clock, far steadier than any pendulum. And finally came the atomic clock, which loses less than one second in millions of years — your phone quietly sets its time from such clocks every single day.", "groups": [{"kind": "gap", "label": "Вопросы 31–40. Дополните конспект ОДНИМ словом или числом из записи.", "questions": [{"no": 31, "q": "The earliest sundials appeared in ______."}, {"no": 32, "q": "Unlike sundials, water clocks also worked at ______."}, {"no": 33, "q": "Mechanical clocks appeared in Europe in the ______ century."}, {"no": 34, "q": "Early tower clocks had no dial — they simply struck a ______."}, {"no": 35, "q": "The first pendulum clock was built in ______."}, {"no": 36, "q": "Christiaan Huygens was a scientist from ______."}, {"no": 37, "q": "Shared timetables became essential because of ______ travel."}, {"no": 38, "q": "In 1884 the world was divided into 24 time ______."}, {"no": 39, "q": "The first quartz clock was created in ______."}, {"no": 40, "q": "An atomic clock loses less than one ______ in millions of years."}]}]}]}, "answers": {"1": {"a": ["Whitlock"], "why": "Она диктует по буквам: W-H-I-T-L-O-C-K."}, "2": {"a": ["8", "eight"], "why": "«The model is Vega eight»."}, "3": {"a": ["screen"], "why": "«Now the screen is cracked»."}, "4": {"a": ["battery"], "why": "«The battery runs out really quickly»."}, "5": {"a": ["55"], "why": "«A new screen for that model is fifty-five pounds»."}, "6": {"a": ["25"], "why": "«And a new battery is twenty-five»."}, "7": {"a": ["Thursday"], "why": "«It will be ready by Thursday»."}, "8": {"a": ["6", "six"], "why": "«All our repairs come with a six-month guarantee»."}, "9": {"a": ["SIM"], "why": "«Please remove your SIM card»."}, "10": {"a": ["library"], "why": "«On Station Road, directly opposite the library»."}, "11": {"a": ["B"], "why": "«For almost a century it was a bank»."}, "12": {"a": ["C"], "why": "«The full tour takes roughly ninety minutes»."}, "13": {"a": ["B"], "why": "«Take photographs anywhere... as long as you do not use flash»."}, "14": {"a": ["C"], "why": "«The café is on the top floor»."}, "15": {"a": ["A"], "why": "«Please return your headset to the front desk»."}, "16": {"a": ["B"], "why": "Room One — «our collection of landscapes»."}, "17": {"a": ["A"], "why": "Room Two — «devoted to portraits»."}, "18": {"a": ["C"], "why": "Sculpture Hall — «displays modern sculpture in steel and stone»."}, "19": {"a": ["E"], "why": "East Wing — «contemporary glass art»."}, "20": {"a": ["D"], "why": "Basement Gallery — «hosts photography»."}, "21": {"a": ["B"], "why": "«Aim it at first-year students»."}, "22": {"a": ["C"], "why": "«Let's make each episode twenty minutes»."}, "23": {"a": ["A"], "why": "«The library has a media room... free to book for students»."}, "24": {"a": ["B"], "why": "«Release an episode every two weeks»."}, "25": {"a": ["C"], "why": "«Invite a guest lecturer for each episode»."}, "26": {"a": ["A"], "why": "«First topic? — Note-taking»."}, "27": {"a": ["A"], "why": "«Already sorted — I've installed the editing software»."}, "28": {"a": ["D"], "why": "«We can borrow two microphones from the media department»."}, "29": {"a": ["C"], "why": "Лео: «I'll compose a short theme tune myself — I play guitar»."}, "30": {"a": ["B"], "why": "Дана: «Then I'll design the logo — I'm good with graphics»."}, "31": {"a": ["Egypt"], "why": "«The earliest sundials appeared in Egypt»."}, "32": {"a": ["night"], "why": "«They worked perfectly well at night»."}, "33": {"a": ["13th", "thirteenth"], "why": "«Arrived in Europe in the thirteenth century»."}, "34": {"a": ["bell"], "why": "«They simply struck a bell to call people to prayer»."}, "35": {"a": ["1656"], "why": "«In sixteen fifty-six... built the first pendulum clock»."}, "36": {"a": ["Holland"], "why": "«A scientist from Holland, Christiaan Huygens»."}, "37": {"a": ["railway"], "why": "«The growth of railway travel made shared timetables essential»."}, "38": {"a": ["zones"], "why": "«Divided the world into twenty-four time zones»."}, "39": {"a": ["1927"], "why": "«In nineteen twenty-seven... the first quartz clock»."}, "40": {"a": ["second"], "why": "«Loses less than one second in millions of years»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "listening-14", "title": "Listening · Вариант 14", "minutes": 30, "parts": [{"title": "Part 1 · Запись ребёнка на уроки плавания (диалог)", "intro": "Мама записывает дочь в бассейн. Вопросы 1–10: дополните заметки ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Good afternoon, Riverside Pool. How can I help?\nB: Hello, I'd like to enrol my daughter in swimming lessons, please.\nA: Of course. Can I take her name?\nB: Emma Tanner — the surname is spelt T-A-N-N-E-R.\nA: Thank you. And how old is Emma?\nB: She's seven — she turned seven last month.\nA: Seven, lovely. Has she had lessons before?\nB: No, never — she'll need the beginner class.\nA: Right, beginners. We have places on Wednesday afternoons.\nB: Wednesday works — what time does the class start?\nA: At half past four — that's four thirty — and each lesson lasts thirty minutes.\nB: That's fine. How much does it cost?\nA: It's sixty pounds for the term, which covers ten lessons.\nB: Okay. What does she need to bring?\nA: A towel, of course, and goggles — the chlorine can sting children's eyes.\nB: I'll buy some this week. Anything else I should know?\nA: Yes — parents and children should use the side entrance, not the main one; it takes you straight to the family changing rooms.\nB: Good to know. And who will teach her?\nA: The beginner class is taught by Miss Peters — she's wonderful with young children.\nB: Perfect. Can I pay over the phone now?\nA: Certainly, let's do that.", "groups": [{"kind": "gap", "label": "Вопросы 1–10. Дополните заметки ОДНИМ словом или числом из записи.", "questions": [{"no": 1, "q": "Child's surname: ______"}, {"no": 2, "q": "Child's age: ______"}, {"no": 3, "q": "Class level: ______"}, {"no": 4, "q": "Lesson day: ______"}, {"no": 5, "q": "Start time: ______ p.m."}, {"no": 6, "q": "Length of each lesson: ______ minutes"}, {"no": 7, "q": "Cost per term: £______"}, {"no": 8, "q": "Child should bring a towel and ______"}, {"no": 9, "q": "Families should use the ______ entrance"}, {"no": 10, "q": "Teacher's name: Miss ______"}]}]}, {"title": "Part 2 · Собрание общинного сада (монолог)", "intro": "Координатор открывает весеннее собрание общинного сада. Вопросы 11–15: выберите ответ. Вопросы 16–20: соотнесите человека с участком работы.", "voices": ["A"], "script": "A: Good evening everyone, and welcome to the spring meeting of the Elm Street Community Garden. For our new faces, a word of history: the garden opened three years ago on a patch of wasteland behind the supermarket, and today we have over forty members. If you'd like to join, the membership fee is fifteen pounds a year, which covers seeds, shared tools and insurance. Now, jobs for the new season. Marta will be running the greenhouse, raising seedlings for everybody — see her if you want tomatoes or peppers. Sam is taking care of our two beehives; please don't disturb him when he's in the bee suit! Ruth is in charge of the vegetable beds along the south wall, and she needs helpers for weeding. Dev looks after the compost — take all your green waste to him, but no cooked food, please. And Ken will be replanting the flower beds by the gate, so the entrance finally looks welcoming. Three practical reminders. Water is precious: please water your plants with rainwater from the barrels, not from the tap. The code on the tool shed changes every month — the new one is always on the noticeboard. And put the date in your diaries: our summer barbecue will be in August, on the second Saturday. Right — any questions before we hand out the seed catalogues?", "groups": [{"kind": "mc", "label": "Вопросы 11–15. Выберите один вариант.", "questions": [{"no": 11, "q": "The garden was created on", "options": ["A. wasteland behind a supermarket", "B. an old car park", "C. a school field"]}, {"no": 12, "q": "The yearly membership fee is", "options": ["A. £10", "B. £15", "C. £20"]}, {"no": 13, "q": "Members are asked to water plants with", "options": ["A. tap water", "B. rainwater from the barrels", "C. bottled water"]}, {"no": 14, "q": "The summer barbecue will take place in", "options": ["A. June", "B. July", "C. August"]}, {"no": 15, "q": "The code on the tool shed changes", "options": ["A. every week", "B. once a year", "C. every month"]}]}, {"kind": "match", "label": "Вопросы 16–20. Кто за что отвечает? A — грядки с овощами, B — цветочные клумбы, C — компост, D — теплица, E — ульи.", "options": ["A", "B", "C", "D", "E"], "questions": [{"no": 16, "q": "Marta"}, {"no": 17, "q": "Sam"}, {"no": 18, "q": "Ruth"}, {"no": 19, "q": "Dev"}, {"no": 20, "q": "Ken"}]}]}, {"title": "Part 3 · Студенты-экономисты обсуждают опрос посетителей кофейни (диалог)", "intro": "Анна и Макс готовят отчёт по опросу клиентов кофейни. Вопросы 21–26: выберите ответ. Вопросы 27–30: дополните ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Okay Max, let's go through the coffee-shop survey before we write it up.\nB: Sure. So, just to be clear about our aim: we wanted to find out why people choose an independent coffee shop when there are two big chains on the same street.\nA: Exactly. In the end we questioned eighty customers — I was worried we'd only get fifty, but the owner let us stay all day.\nB: And the method worked well. Remember we planned an email questionnaire at first?\nA: Yes, but people ignore emails, so we switched to short interviews at the tables instead. The response rate was brilliant.\nB: The results surprised me. I honestly expected people to talk about prices, but the most common reason for coming was the friendly atmosphere.\nA: Mm, over half mentioned it. The unhappiest group, though, were the office workers — almost all of them complained about slow service at lunchtime.\nB: Right, they only have thirty minutes to grab lunch. So in the report our main recommendation should be more staff at lunchtime, not a loyalty card.\nA: Agreed — the loyalty card can go in as a minor point. Now, timing. We did the interviews over two weekends, so we should admit that weekday mornings are missing from the data.\nB: Good point, I'll put that in the limitations section. When is the written report due?\nA: The deadline is the twentieth of May, so we have three weeks.\nB: Fine. I'll draft the text, and you're better at spreadsheets — will you design the charts?\nA: Happily. And let's rehearse the presentation twice before the seminar — last time we ran over.\nB: Deal. Twice, and with a timer.", "groups": [{"kind": "mc", "label": "Вопросы 21–26. Выберите один вариант.", "questions": [{"no": 21, "q": "The students wanted to find out", "options": ["A. how much customers spend", "B. why people choose an independent coffee shop", "C. which chain is the most popular"]}, {"no": 22, "q": "How many customers did they question?", "options": ["A. 60", "B. 80", "C. 100"]}, {"no": 23, "q": "They collected their data through", "options": ["A. an email questionnaire", "B. phone calls", "C. short interviews at the tables"]}, {"no": 24, "q": "The most common reason for visiting the café was", "options": ["A. the friendly atmosphere", "B. low prices", "C. fast service"]}, {"no": 25, "q": "The least satisfied customers were", "options": ["A. students", "B. pensioners", "C. office workers"]}, {"no": 26, "q": "The main recommendation in the report will be", "options": ["A. more staff at lunchtime", "B. a loyalty card", "C. longer opening hours"]}]}, {"kind": "gap", "label": "Вопросы 27–30. Дополните ОДНИМ словом или числом из записи.", "questions": [{"no": 27, "q": "The interviews took place over two ______."}, {"no": 28, "q": "The report deadline is the ______ of May."}, {"no": 29, "q": "Anna will design the ______."}, {"no": 30, "q": "They will rehearse the presentation ______ before the seminar."}]}]}, {"title": "Part 4 · Лекция: песни китов и их общение (монолог)", "intro": "Фрагмент лекции по морской биологии. Вопросы 31–40: дополните конспект ОДНИМ словом или числом.", "voices": ["A"], "script": "A: In nineteen sixty-seven, two researchers listening to underwater recordings made by the navy realised that the strange sounds of humpback whales were not random noise at all — they were songs, with themes and phrases repeated in a strict order. It was one of the great discoveries of marine biology. We now know that among humpbacks only the males sing, which suggests the songs play a part in attracting mates, though scientists still argue about their exact purpose. A single song can last up to thirty minutes, and a whale may repeat it for many hours without a break. Stranger still, all the males in one ocean region sing the same song — and that shared song slowly changes every year, like a fashion, so no two seasons ever sound alike. Other whales are less musical but far more powerful: the low calls of blue whales can travel hundreds of kilometres through deep water. In nineteen seventy an album of humpback recordings, Songs of the Humpback Whale, became an unexpected bestseller, and it helped turn public opinion against commercial whaling — international protection followed within two decades. But there is a modern problem. Noise from ships now fills the oceans, making whale communication much harder, and researchers have found that some whales now call louder than before — like people forced to shout in a crowded room.", "groups": [{"kind": "gap", "label": "Вопросы 31–40. Дополните конспект ОДНИМ словом или числом из записи.", "questions": [{"no": 31, "q": "Whale songs were first recognised in ______."}, {"no": 32, "q": "Among humpbacks, only the ______ sing."}, {"no": 33, "q": "A single song can last up to thirty ______."}, {"no": 34, "q": "All the males in one ocean region sing the same ______."}, {"no": 35, "q": "The shared song slowly changes every ______."}, {"no": 36, "q": "The calls of blue whales can travel hundreds of ______."}, {"no": 37, "q": "A famous album of whale recordings appeared in ______."}, {"no": 38, "q": "The album helped turn opinion against commercial ______."}, {"no": 39, "q": "Today, ______ from ships makes whale communication harder."}, {"no": 40, "q": "Some whales now call ______ than before."}]}]}]}, "answers": {"1": {"a": ["Tanner"], "why": "«The surname is spelt T-A-N-N-E-R»."}, "2": {"a": ["7", "seven"], "why": "«She's seven — she turned seven last month»."}, "3": {"a": ["beginner", "beginners"], "why": "«She'll need the beginner class»."}, "4": {"a": ["Wednesday"], "why": "«We have places on Wednesday afternoons»."}, "5": {"a": ["4:30", "4.30", "430"], "why": "«At half past four — that's four thirty»."}, "6": {"a": ["30", "thirty"], "why": "«Each lesson lasts thirty minutes»."}, "7": {"a": ["60"], "why": "«It's sixty pounds for the term»."}, "8": {"a": ["goggles"], "why": "«A towel, of course, and goggles»."}, "9": {"a": ["side"], "why": "«Should use the side entrance, not the main one»."}, "10": {"a": ["Peters"], "why": "«The beginner class is taught by Miss Peters»."}, "11": {"a": ["A"], "why": "«On a patch of wasteland behind the supermarket»."}, "12": {"a": ["B"], "why": "«The membership fee is fifteen pounds a year»."}, "13": {"a": ["B"], "why": "«Water your plants with rainwater from the barrels, not from the tap»."}, "14": {"a": ["C"], "why": "«Our summer barbecue will be in August»."}, "15": {"a": ["C"], "why": "«The code on the tool shed changes every month»."}, "16": {"a": ["D"], "why": "Marta — «running the greenhouse, raising seedlings»."}, "17": {"a": ["E"], "why": "Sam — «taking care of our two beehives»."}, "18": {"a": ["A"], "why": "Ruth — «in charge of the vegetable beds»."}, "19": {"a": ["C"], "why": "Dev — «looks after the compost»."}, "20": {"a": ["B"], "why": "Ken — «replanting the flower beds by the gate»."}, "21": {"a": ["B"], "why": "«Why people choose an independent coffee shop»."}, "22": {"a": ["B"], "why": "«We questioned eighty customers»."}, "23": {"a": ["C"], "why": "«We switched to short interviews at the tables»."}, "24": {"a": ["A"], "why": "«The most common reason for coming was the friendly atmosphere»."}, "25": {"a": ["C"], "why": "«The unhappiest group... were the office workers»."}, "26": {"a": ["A"], "why": "«Our main recommendation should be more staff at lunchtime»."}, "27": {"a": ["weekends"], "why": "«We did the interviews over two weekends»."}, "28": {"a": ["20th", "twentieth", "20"], "why": "«The deadline is the twentieth of May»."}, "29": {"a": ["charts"], "why": "«Will you design the charts? — Happily»."}, "30": {"a": ["twice", "2"], "why": "«Let's rehearse the presentation twice before the seminar»."}, "31": {"a": ["1967"], "why": "«In nineteen sixty-seven, two researchers... realised»."}, "32": {"a": ["males"], "why": "«Among humpbacks only the males sing»."}, "33": {"a": ["minutes"], "why": "«A single song can last up to thirty minutes»."}, "34": {"a": ["song"], "why": "«All the males in one ocean region sing the same song»."}, "35": {"a": ["year"], "why": "«That shared song slowly changes every year»."}, "36": {"a": ["kilometres", "kilometers"], "why": "«Can travel hundreds of kilometres through deep water»."}, "37": {"a": ["1970"], "why": "«In nineteen seventy an album of humpback recordings...»."}, "38": {"a": ["whaling"], "why": "«Helped turn public opinion against commercial whaling»."}, "39": {"a": ["noise"], "why": "«Noise from ships now fills the oceans»."}, "40": {"a": ["louder"], "why": "«Some whales now call louder than before»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "listening-15", "title": "Listening · Вариант 15", "minutes": 30, "parts": [{"title": "Part 1 · Обмен театральных билетов (диалог)", "intro": "Зритель звонит в кассу театра, чтобы поменять билеты. Вопросы 1–10: дополните заметки ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Good morning, box office of the Crown Theatre. How can I help?\nB: Hello. I've got two tickets for The Glass Garden, but I'm afraid we can't come on that date any more. Can I exchange them?\nA: Usually, yes. Could I take your surname?\nB: It's Fenwick — F-E-N-W-I-C-K.\nA: Thank you. And your booking number? It's on the confirmation email.\nB: Yes, here it is — four four seven one.\nA: Four four seven one... found it. Two tickets for Saturday evening. What's the problem with Saturday?\nB: It's a family wedding — we completely forgot about it when we booked.\nA: These things happen. Which other evening would suit you?\nB: Would Thursday be possible? The same week?\nA: Let me check... Yes, Thursday is fine, though I can't give you the same seats. I have two together in the stalls, row F.\nB: Row F sounds even better, actually.\nA: There is a small charge for exchanges — two pounds per ticket, so four pounds in total.\nB: That's fair. Do I need to come and collect the new tickets?\nA: No need — we'll send them by email, and you just show them on your phone at the door.\nB: Wonderful. And what time does the performance start?\nA: At half past seven — that's seven thirty — and we ask everyone to be seated ten minutes early.\nB: One last thing — is there parking nearby?\nA: Yes, the nearest car park is on Bridge Street, two minutes' walk from the theatre.\nB: You've been very helpful. Thank you!", "groups": [{"kind": "gap", "label": "Вопросы 1–10. Дополните заметки ОДНИМ словом или числом из записи.", "questions": [{"no": 1, "q": "Surname: ______"}, {"no": 2, "q": "Booking number: ______"}, {"no": 3, "q": "Tickets for the play: 'The Glass ______'"}, {"no": 4, "q": "Number of tickets: ______"}, {"no": 5, "q": "New performance day: ______"}, {"no": 6, "q": "New seats: in the stalls, row ______"}, {"no": 7, "q": "Exchange charge per ticket: £______"}, {"no": 8, "q": "New tickets will be sent by ______"}, {"no": 9, "q": "The performance starts at ______ p.m."}, {"no": 10, "q": "The nearest car park is on ______ Street"}]}]}, {"title": "Part 2 · Приветственная речь в студенческом общежитии (монолог)", "intro": "Менеджер общежития встречает новых жильцов. Вопросы 11–15: выберите ответ. Вопросы 16–20: соотнесите сотрудника с тем, чем он помогает.", "voices": ["A"], "script": "A: Good evening, everyone, and welcome to Maple Court! I'm the residence manager, and I promise to keep this short — I know you're tired after moving day. First, the building itself: Maple Court is brand new — it was finished only last year, so you are just the second group of students ever to live here. Please treat it kindly. A few essentials. The laundry room is down in the basement; the machines take payment by app, and instructions are on the door. Quiet hours start at eleven every night — music off, voices down, out of respect for neighbours who might have a nine o'clock exam. If you have a bicycle, please don't bring it inside: bikes must be kept in the racks behind the building, which are covered by cameras. Now, who to ask when you need help. For anything to do with payments and bills, see Mrs Adams — her office is next to mine. Peter at reception is your man for lost keys — it happens to everyone at least once. Mr Novak, our caretaker, handles repairs — report a dripping tap through the app or knock on his door. Lily, your residents' assistant, organises social events, starting with quiz night next week. And for personal or study worries, Dr Cole holds drop-in hours every afternoon — completely confidential. Finally, don't miss the welcome dinner this Friday in the common room — free pizza! Thank you, and welcome home.", "groups": [{"kind": "mc", "label": "Вопросы 11–15. Выберите один вариант.", "questions": [{"no": 11, "q": "Maple Court was finished", "options": ["A. in the 1990s", "B. last year", "C. five years ago"]}, {"no": 12, "q": "The laundry room is located", "options": ["A. in the basement", "B. on the top floor", "C. next to reception"]}, {"no": 13, "q": "Quiet hours start at", "options": ["A. ten o'clock", "B. eleven o'clock", "C. midnight"]}, {"no": 14, "q": "Bicycles must be kept", "options": ["A. in students' rooms", "B. in the corridor", "C. in the racks behind the building"]}, {"no": 15, "q": "The welcome dinner will be on", "options": ["A. Friday", "B. Saturday", "C. Sunday"]}]}, {"kind": "match", "label": "Вопросы 16–20. Кто чем помогает? A — потерянные ключи, B — оплата и счета, C — ремонт, D — мероприятия, E — личные и учебные проблемы.", "options": ["A", "B", "C", "D", "E"], "questions": [{"no": 16, "q": "Mrs Adams"}, {"no": 17, "q": "Peter"}, {"no": 18, "q": "Mr Novak"}, {"no": 19, "q": "Lily"}, {"no": 20, "q": "Dr Cole"}]}]}, {"title": "Part 3 · Студентка и тьютор обсуждают стратегию подготовки к экзаменам (диалог)", "intro": "Мия консультируется с тьютором о том, как готовиться к сессии. Вопросы 21–26: выберите ответ. Вопросы 27–30: соотнесите действие с тем, когда его выполнять.", "voices": ["A", "B"], "script": "A: Come in, Mia. You wanted to talk about exam preparation?\nB: Yes, Dr Shaw. The exams are in six weeks and I'm getting nowhere. I sit down every evening and reread my notes, but nothing seems to stay in my head.\nA: You're not alone — rereading feels productive, but it's the least effective method there is. Your eyes move, your brain sleeps.\nB: So what should I do instead?\nA: The research is very clear: testing yourself beats everything else. Close the notes and force your memory to work — flashcards, practice questions, explaining a topic aloud.\nB: That sounds harder.\nA: It is harder — that's exactly why it works. Now, how long are your study sessions?\nB: Three hours, sometimes four, until I can't think any more.\nA: Far too long. Work in blocks of twenty-five minutes, then take a five-minute break. Short and sharp.\nB: Twenty-five minutes... I can manage that. My real fear is statistics, though. I failed the mock exam.\nA: Then let's deal with statistics directly. The maths centre runs a revision workshop — I'd join it this week if I were you.\nB: I'll sign up today. And how should I organise all of this?\nA: Draw up a revision timetable a month before the exams, and put your weakest subjects in the morning slots. Test yourself with flashcards every day — ten minutes is enough. And do one full past paper every week, under exam conditions, with a clock.\nB: Every week? Okay. Anything for the exam itself?\nA: The day before, pack your bag and check the room number — and then stop. The best thing you can do the night before is get a full night's sleep.\nB: No midnight revising, then. Thank you, Dr Shaw — I feel calmer already.", "groups": [{"kind": "mc", "label": "Вопросы 21–26. Выберите один вариант.", "questions": [{"no": 21, "q": "Mia's current revision method is", "options": ["A. rereading her notes", "B. doing past papers", "C. studying in a group"]}, {"no": 22, "q": "According to the tutor, the most effective technique is", "options": ["A. highlighting notes", "B. testing yourself", "C. copying notes out"]}, {"no": 23, "q": "The tutor advises studying in blocks of", "options": ["A. 45 minutes", "B. 60 minutes", "C. 25 minutes"]}, {"no": 24, "q": "Mia's weakest subject is", "options": ["A. history", "B. statistics", "C. chemistry"]}, {"no": 25, "q": "The tutor recommends joining", "options": ["A. an online course", "B. a study group", "C. a revision workshop"]}, {"no": 26, "q": "The night before the exam, Mia should", "options": ["A. get a full night's sleep", "B. revise until late", "C. do one more past paper"]}]}, {"kind": "match", "label": "Вопросы 27–30. Когда следует это делать? A — каждый день, B — раз в неделю, C — за месяц до экзаменов, D — накануне экзамена.", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "Draw up a revision timetable"}, {"no": 28, "q": "Test yourself with flashcards"}, {"no": 29, "q": "Do a full past paper"}, {"no": 30, "q": "Pack your bag and check the room"}]}]}, {"title": "Part 4 · Лекция: история радио (монолог)", "intro": "Фрагмент лекции по истории средств связи. Вопросы 31–40: дополните конспект ОДНИМ словом или числом.", "voices": ["A"], "script": "A: It is hard to imagine now, but a little over a century ago the idea of sound travelling invisibly through the air seemed like pure magic. The science began in eighteen eighty-seven, when the German physicist Heinrich Hertz proved in his laboratory that radio waves actually exist — though Hertz himself famously saw no practical use for them. Others disagreed. In nineteen oh one, Guglielmo Marconi sent a signal all the way across the Atlantic, from England to Newfoundland. The message could hardly have been simpler: it was the letter S in Morse code — three short clicks, repeated over and over. In its first years radio was mainly used by ships, which could finally call for help far from land; the technology saved hundreds of lives after collisions and storms. Broadcasting to the general public began in nineteen twenty, when a station in Pittsburgh went on air; its first programme announced the results of an election, and suddenly thousands of people wanted receivers of their own. By the nineteen thirties radio was the centre of family life: every evening people gathered around the set for news, music and drama. The next revolution was the transistor, invented in nineteen forty-seven, which made radios small and cheap — now you could listen in cars and on beaches. Television was expected to kill radio, and later the internet was expected to finish the job. Neither did: today radio still reaches billions of listeners around the world.", "groups": [{"kind": "gap", "label": "Вопросы 31–40. Дополните конспект ОДНИМ словом или числом из записи.", "questions": [{"no": 31, "q": "In 1887 the physicist Heinrich ______ proved that radio waves exist."}, {"no": 32, "q": "In ______ Marconi sent a signal across the Atlantic."}, {"no": 33, "q": "The first transatlantic message was the letter ______ in Morse code."}, {"no": 34, "q": "In its first years, radio was mainly used by ______."}, {"no": 35, "q": "Broadcasting to the public began in ______."}, {"no": 36, "q": "The first programme announced the results of an ______."}, {"no": 37, "q": "In the 1930s families gathered for news, music and ______."}, {"no": 38, "q": "The ______, invented in 1947, made radios small and cheap."}, {"no": 39, "q": "People could now listen in cars and on ______."}, {"no": 40, "q": "Today radio still reaches ______ of listeners."}]}]}]}, "answers": {"1": {"a": ["Fenwick"], "why": "«It's Fenwick — F-E-N-W-I-C-K»."}, "2": {"a": ["4471"], "why": "«Four four seven one» — кассир повторяет и подтверждает."}, "3": {"a": ["Garden"], "why": "«Two tickets for The Glass Garden»."}, "4": {"a": ["2", "two"], "why": "«I've got two tickets»."}, "5": {"a": ["Thursday"], "why": "«Would Thursday be possible? — Yes, Thursday is fine»."}, "6": {"a": ["F"], "why": "«Two together in the stalls, row F»."}, "7": {"a": ["2", "two"], "why": "«Two pounds per ticket, so four pounds in total»."}, "8": {"a": ["email"], "why": "«We'll send them by email»."}, "9": {"a": ["7:30", "7.30", "730"], "why": "«At half past seven — that's seven thirty»."}, "10": {"a": ["Bridge"], "why": "«The nearest car park is on Bridge Street»."}, "11": {"a": ["B"], "why": "«It was finished only last year»."}, "12": {"a": ["A"], "why": "«The laundry room is down in the basement»."}, "13": {"a": ["B"], "why": "«Quiet hours start at eleven every night»."}, "14": {"a": ["C"], "why": "«Bikes must be kept in the racks behind the building»."}, "15": {"a": ["A"], "why": "«The welcome dinner this Friday in the common room»."}, "16": {"a": ["B"], "why": "Mrs Adams — «anything to do with payments and bills»."}, "17": {"a": ["A"], "why": "Peter — «your man for lost keys»."}, "18": {"a": ["C"], "why": "Mr Novak — «our caretaker, handles repairs»."}, "19": {"a": ["D"], "why": "Lily — «organises social events»."}, "20": {"a": ["E"], "why": "Dr Cole — «for personal or study worries»."}, "21": {"a": ["A"], "why": "«I sit down every evening and reread my notes»."}, "22": {"a": ["B"], "why": "«Testing yourself beats everything else»."}, "23": {"a": ["C"], "why": "«Work const TED_TALKS = [{"slug": "matt_cutts_try_something_new_for_30_days", "title": "Try something new for 30 days", "speaker": "Matt Cutts", "dur": "3 мин", "level": "A2–B1", "blurb": "Самое короткое и простое выступление подборки: инженер Google о 30-дневных экспериментах. Идеально для первого TED на английском.", "questions": [{"no": 1, "kind": "mc", "q": "How did Matt Cutts feel before he started his experiments?", "options": ["A. He was stuck in a rut", "B. He was extremely happy", "C. He wanted a new job", "D. He was training for a race"]}, {"no": 2, "kind": "gap", "q": "He decided to try each new thing for ______ days."}, {"no": 3, "kind": "mc", "q": "One of his photo challenges was to", "options": ["A. take a photo every day for a month", "B. buy a professional camera", "C. photograph only sunsets", "D. delete all his photos"]}, {"no": 4, "kind": "mc", "q": "Which big adventure does he mention completing?", "options": ["A. Sailing across the Atlantic", "B. Hiking up Mount Kilimanjaro", "C. Running a marathon in the desert", "D. Cycling across America"]}, {"no": 5, "kind": "gap", "q": "In one month he wrote a novel of ______ words."}, {"no": 6, "kind": "mc", "q": "What does he say about small changes compared to crazy challenges?", "options": ["A. Small changes are more likely to stick", "B. Crazy challenges are always better", "C. Neither works at all", "D. Only big changes matter"]}, {"no": 7, "kind": "mc", "q": "According to Cutts, the months of challenges were", "options": ["A. much more memorable", "B. boring and slow", "C. impossible to finish", "D. bad for his career"]}, {"no": 8, "kind": "mc", "q": "His final message is:", "options": ["A. the next 30 days will pass anyway — so try something new", "B. never make plans", "C. quit your job and travel", "D. 30 days is not enough for anything"]}], "answers": {"1": {"a": ["A"], "why": "Он говорит: «I felt like I was stuck in a rut» — застрял в рутине."}, "2": {"a": ["30", "thirty"], "why": "Вся идея — 30-дневн  A camera"]}, {"no": 2, "kind": "gap", "q": "At camp, the counsellors taught a cheer spelling the word R-O-W-D-I-E, meaning ______."}, {"no": 3, "kind": "mc", "q": "According to Cain, what share of people are introverts?", "options": ["A. A third to a half", "B. About 5 per cent", "C. Almost everyone", "D. One in a hundred"]}, {"no": 4, "kind": "mc", "q": "What does she say modern schools and workplaces are designed for?", "options": ["A. Extroverts and constant group work", "B. Introverts", "C. Robots", "D. Nobody"]}, {"no": 5, "kind": "mc", "q": "Why does solitude matter, according to Cain?", "options": ["A. It is a crucial ingredient of creativity", "B. It saves money", "C. It replaces friendship", "D. It makes people talk more"]}, {"no": 6, "kind": "mc", "q": "Which famous people does she give as examples of introverted leaders and creators?", "options": ["A. Darwin, Dr. Seuss, Steve Wozniak", "B. Only movie stars", "C. Football players", "D. TV presenters"]}, {"no": 7, "kind": "mc", "q": "What is the first of her three calls to action?", "options": ["A. Stop the madness for constant group work", "B. Ban meetings", "C. Close all offices", "D. Read fewer books"]}, {"no": 8, "kind": "gap", "q": "Her final wish: have the courage to speak ______."}], "answers": {"1": {"a": ["A"], "why": "Чемодан книг — семья считала чтение нормальным способом быть вместе."}, "2": {"a": ["rowdy"], "why": "R-O-W-D-I-E — «неправильно» написанное rowdy, «шумные»."}, "3": {"a": ["A"], "why": "«A third to a half of the population are introverts»."}, "4": {"a": ["A"], "why": "Школы и офисы построены под экстравертов и постоянную групповую работу."}, "5": {"a": ["A"], "why": "«Solitude is a crucial ingredient often to creativity»."}, "6": {"a": ["A"], "why": "Дарвин гулял один, Возняк собирал компьютер в одиночку, Др. Сьюз писал один."}, "7": {"a": ["A"], "why": "Призыв №1: «Stop the madness for constant group work»."}, "8": {"a": ["softly"], "why": "«Have the courage to speak softly» — гов ?", "options": ["A. Seek support and connect with people", "B. Run away", "C. Eat more", "D. Work alone"]}, {"no": 7, "kind": "mc", "q": "What protected people from stress-related death risk in the caring study?", "options": ["A. Helping and caring for others", "B. Money", "C. Vitamins", "D. Silence"]}, {"no": 8, "kind": "mc", "q": "Her final message is that", "options": ["A. chasing meaning is better for your health than avoiding discomfort", "B. stress must be avoided at all costs", "C. hearts should beat slowly", "D. science changes nothing"]}], "answers": {"1": {"a": ["A"], "why": "Риск рос только у тех, кто И испытывал сильный стресс, И верил, что он вредит."}, "2": {"a": ["A"], "why": "«I want to make you better at stress» — не избавить, а научить."}, "3": {"a": ["A"], "why": "У переосмысливших стресс сосуды оставались расслабленными — профиль как при радости."}, "4": {"a": ["action"], "why": "«Your pounding heart is preparing you for action»."}, "5": {"a": ["oxytocin"], "why": "Окситоцин выделяется и при стрессе — толкает искать поддержку."}, "6": {"a": ["A"], "why": "Окситоцин заставляет тянуться к людям и просить о помощи."}, "7": {"a": ["A"], "why": "У помогавших другим связь стресса со смертностью исчезала."}, "8": {"a": ["A"], "why": "«Chasing meaning is better for your health than trying to avoid discomfort»."}}}, {"slug": "cameron_russell_looks_aren_t_everything_believe_me_i_m_a_model", "title": "Looks aren't everything. Believe me, I'm a model", "speaker": "Cameron Russell", "dur": "9 мин", "level": "B1–B2", "blurb": "Модель Victoria's Secret честно разбирает собственную профессию. Короткий, разговорный английский — комфортный уровень.", "questions": [{"no": 1, "kind": "mc", "q": "What does Russell do at the very start of her talk?", "options": ["A. Changes her outfit on stage", "B. Shows her passport", "C. Sings a song", "D. Shows her school diploma"]}, {"no": 2, "kind": "mc", "q": "Why does she change clothes on stage?", "options": ["A. To show how

to be fifteen minutes, including questions»."}, "23": {"a": ["B"], "why": "«Let's start with the video clip then»."}, "24": {"a": ["A"], "why": "«Our main problem is that we've got far too much material»."}, "25": {"a": ["C"], "why": "«Let's make the rebuilding of the city our focus»."}, "26": {"a": ["B"], "why": "«Let's rehearse in the library on Tuesday»."}, "27": {"a": ["minutes"], "why": "«The clip only lasts two minutes»."}, "28": {"a": ["slides"], "why": "«I'll design the slides» — говорит Анна."}, "29": {"a": ["Friday"], "why": "«Mr Field wants our plan by Friday»."}, "30": {"a": ["Tuesday"], "why": "«Let's rehearse in the library on Tuesday after class»."}, "31": {"a": ["1889", "eighteen eighty-nine"], "why": "«The World's Fair of eighteen eighty-nine»."}, "32": {"a": ["iron"], "why": "«It is made not of steel but of iron»."}, "33": {"a": ["18", "eighteen"], "why": "«Around eighteen thousand separate parts»."}, "34": {"a": ["rivets"], "why": "«Joined together by two and a half million rivets»."}, "35": {"a": ["300", "three hundred"], "why": "«About three hundred workers assembled the tower»."}, "36": {"a": ["petition"], "why": "«Signed a petition protesting against... a useless and monstrous tower»."}, "37": {"a": ["20", "twenty"], "why": "«To stand for only twenty years and then be demolished»."}, "38": {"a": ["antenna"], "why": "«It proved perfect as a radio antenna»."}, "39": {"a": ["7", "seven"], "why": "«The tower is repainted every seven years»."}, "40": {"a": ["60", "sixty"], "why": "«Requires about sixty tonnes of paint»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "listening-5", "title": "Listening · Вариант 5", "minutes": 30, "parts": [{"title": "Part 1 · Заказ торта в пекарне (диалог)", "intro": "Клиентка заказывает торт по телефону. Вопросы 1–10: дополните заметки ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Good morning, the Corner Bakery. How can I help?\nB: Hi! I'd like to order a cake for a birthday party, please.\nA: Lovely. Can I take your name first?\nB: Sofia Bennett — that's B-E-N-N-E-T-T.\nA: Thank you. What flavour would you like? Chocolate is the most popular.\nB: Actually, everyone in my family prefers lemon. Could you do a lemon sponge?\nA: Of course. And how many people does it need to serve?\nB: About twenty. It's for my grandmother — the whole family is coming.\nA: Then I'd suggest our large round cake. For decoration we can do fresh strawberries on top — they look wonderful in summer.\nB: Yes, strawberries, please. And could you write 'Happy Birthday' on it?\nA: Certainly. What colour icing for the writing?\nB: Blue, please — that's her favourite colour.\nA: Blue it is. One important question: any allergies I should know about?\nB: Yes — please make sure there are no nuts in it. My nephew is allergic.\nA: Noted, no nuts anywhere near it. When do you need the cake?\nB: Could I collect it on Friday morning?\nA: Friday's fine. We open at eight, so any time after that — shall we say eleven o'clock?\nB: Eleven is perfect. How much will it be?\nA: A large lemon cake with fresh fruit comes to thirty-two pounds.\nB: Great. See you on Friday!", "groups": [{"kind": "gap", "label": "Вопросы 1–10. Дополните заметки ОДНИМ словом или числом из записи.", "questions": [{"no": 1, "q": "Surname: ______"}, {"no": 2, "q": "The cake is for a ______ party"}, {"no": 3, "q": "Flavour: ______"}, {"no": 4, "q": "Number of people it must serve: ______"}, {"no": 5, "q": "Decoration on top: fresh ______"}, {"no": 6, "q": "Colour of the icing for the writing: ______"}, {"no": 7, "q": "The cake must not contain any ______"}, {"no": 8, "q": "Day of collection: ______"}, {"no": 9, "q": "Collection time: ______ o'clock"}, {"no": 10, "q": "Total price: £______"}]}]}, {"title": "Part 2 · Инструктаж волонтёров перед уборкой пляжа (монолог)", "intro": "Координатор объясняет волонтёрам план дня. Вопросы 11–15: выберите ответ. Вопросы 16–20: соотнесите руководителя группы с зоной пляжа.", "voices": ["A"], "script": "A: Good morning, volunteers, and thank you all for giving up your Saturday! Before we hand out equipment, listen carefully, because safety comes first today. We start at half past nine — please meet by the lifeguard tower, the tall red building at the top of the steps; do not wait in the car park, as the minibuses need the space. The organisers provide gloves and bags for everyone, so you don't need to bring anything except sensible shoes and, ideally, a hat. Now, an important rule: if you find broken glass, don't pick it up — put a marker flag beside it and call a team leader, who has a special container. The same goes for anything sharp or rusty. We'll work through the morning and finish at one o'clock exactly, when the tide starts coming in. And as a thank-you, there will be a free barbecue for all volunteers by the beach café — vegetarian options included! Finally, the teams. Sam is leading the group on the main beach — it's the biggest area, so he needs the most people. Ravi's group will work around the rock pools at the south end — watch your step there. Leo's team will cover the car park and the footpaths leading down to the sand. Katie takes her team up into the sand dunes — mind the nesting birds, please. And Donna is in charge of the area beside the harbour, where the fishing boats come in. Choose a leader, grab your gloves, and let's make this beach beautiful!", "groups": [{"kind": "mc", "label": "Вопросы 11–15. Выберите один вариант.", "questions": [{"no": 11, "q": "Volunteers should meet", "options": ["A. in the car park", "B. at the beach café", "C. by the lifeguard tower"]}, {"no": 12, "q": "The organisers provide", "options": ["A. gloves and bags", "B. drinks and snacks", "C. hats and sun cream"]}, {"no": 13, "q": "Volunteers must NOT pick up", "options": ["A. seaweed", "B. broken glass", "C. plastic bottles"]}, {"no": 14, "q": "The clean-up finishes at", "options": ["A. 12 o'clock", "B. 2 o'clock", "C. 1 o'clock"]}, {"no": 15, "q": "Afterwards there will be", "options": ["A. a free barbecue", "B. a prize ceremony", "C. a group photo"]}]}, {"kind": "match", "label": "Вопросы 16–20. Кто за какую зону отвечает? A — главный пляж, B — песчаные дюны, C — каменные заводи, D — территория у гавани, E — парковка и дорожки.", "options": ["A", "B", "C", "D", "E"], "questions": [{"no": 16, "q": "Sam"}, {"no": 17, "q": "Ravi"}, {"no": 18, "q": "Leo"}, {"no": 19, "q": "Katie"}, {"no": 20, "q": "Donna"}]}]}, {"title": "Part 3 · Отчёт о полевой практике по географии (диалог)", "intro": "Студент Джек обсуждает с тьютором отчёт о выезде на реку. Вопросы 21–26: выберите ответ. Вопросы 27–30: дополните ОДНИМ словом.", "voices": ["A", "B"], "script": "A: Come in, Jack. Let's talk about your report on the field trip to the River Dean.\nB: Thanks, Dr Morris. I've brought my draft.\nA: Good. Remind me — how did you organise the measurements?\nB: We took measurements at six different sites along the river, from the source down to the bridge in town.\nA: And how did you measure the speed of the water? You didn't have the electronic flow meter, I remember.\nB: No, it was being repaired. So we timed floating oranges over a ten-metre stretch instead — it's low-tech, but it works.\nA: A perfectly respectable method. Any problems during the trip?\nB: The heavy rain on the second day. The river rose quickly, and honestly the data from that day is less reliable than the rest.\nA: Then say so in the report — examiners like honesty about limitations. Now, your maps are excellent — really clear, well labelled. Well done.\nB: Thank you. I spent ages on those.\nA: However, the introduction is too long. Three pages of background is too much — cut it to one page.\nB: Understood. Should I add anything?\nA: Yes — a comparison with last year's data. Another group studied the same river last October, and their figures are in the department archive.\nB: That would strengthen the conclusions. I'll do it.\nA: Good. The final deadline is the twelfth of December — no extensions this year. Let's meet on Monday to check your progress.\nB: Monday suits me. Thanks, Dr Morris!", "groups": [{"kind": "mc", "label": "Вопросы 21–26. Выберите один вариант.", "questions": [{"no": 21, "q": "The field trip studied", "options": ["A. a stretch of coastline", "B. a river", "C. a mountain forest"]}, {"no": 22, "q": "The main problem during the trip was", "options": ["A. heavy rain", "B. a lost notebook", "C. an injured student"]}, {"no": 23, "q": "The tutor says the maps are", "options": ["A. too detailed", "B. missing labels", "C. very clear"]}, {"no": 24, "q": "The students measured the speed of the water using", "options": ["A. an electronic flow meter", "B. floating oranges", "C. a drone camera"]}, {"no": 25, "q": "The tutor advises adding", "options": ["A. a comparison with last year's data", "B. more photographs", "C. interviews with local residents"]}, {"no": 26, "q": "The final deadline for the report is", "options": ["A. 2 December", "B. 5 December", "C. 12 December"]}]}, {"kind": "gap", "label": "Вопросы 27–30. Дополните ОДНИМ словом из записи.", "questions": [{"no": 27, "q": "Measurements were taken at six different ______."}, {"no": 28, "q": "The data from the second day is less ______."}, {"no": 29, "q": "The ______ must be cut to one page."}, {"no": 30, "q": "The next meeting with the tutor is on ______."}]}]}, {"title": "Part 4 · Лекция: история календаря (монолог)", "intro": "Фрагмент лекции по истории науки. Вопросы 31–40: дополните конспект ОДНИМ словом или числом.", "voices": ["A"], "script": "A: Why does a year have three hundred and sixty-five days, and why does February behave so strangely? The answer lies in the long history of the calendar. The earliest calendars, used by hunters and farmers alike, followed the phases of the moon — a new moon marked a new month. The problem is that twelve lunar months fall about eleven days short of a full year, so the seasons slowly drift. The ancient Egyptians found a better anchor: their year began with the flooding of the Nile, announced by the bright star Sirius, and their calendar had three hundred and sixty-five days — remarkably close to the truth. Rome, however, was stuck with a chaotic system until Julius Caesar reformed it, creating what we call the Julian calendar. Its key idea was simple: an extra day added every four years — the leap year. Yet even that clever system had a flaw: the Julian year was too long by eleven minutes. Eleven minutes sounds trivial, but over the centuries the errors piled up, and by the sixteenth century the calendar was ten days behind the sun. Easter was slipping towards summer. So in fifteen eighty-two a new calendar was introduced, named after Pope Gregory the Thirteenth, which removed those extra days and fixed the leap-year rule. Catholic countries switched at once; Protestant Britain resisted and only adopted it in seventeen fifty-two, when eleven days were simply deleted from September — and, according to legend, angry crowds shouted 'Give us back our eleven days!'", "groups": [{"kind": "gap", "label": "Вопросы 31–40. Дополните конспект ОДНИМ словом или числом из записи.", "questions": [{"no": 31, "q": "The earliest calendars followed the phases of the ______."}, {"no": 32, "q": "The Egyptian year began with the flooding of the ______."}, {"no": 33, "q": "The Egyptian calendar had ______ days."}, {"no": 34, "q": "The Julian calendar was created by Julius ______."}, {"no": 35, "q": "It added an extra day every ______ years."}, {"no": 36, "q": "The Julian year was too long by eleven ______."}, {"no": 37, "q": "By the 16th century the calendar was ______ days behind the sun."}, {"no": 38, "q": "The 1582 calendar is named after Pope ______."}, {"no": 39, "q": "Britain adopted the new calendar in ______."}, {"no": 40, "q": "In Britain, ______ days were deleted from September."}]}]}]}, "answers": {"1": {"a": ["Bennett"], "why": "Она диктует по буквам: «Sofia Bennett — B-E-N-N-E-T-T»."}, "2": {"a": ["birthday"], "why": "«I'd like to order a cake for a birthday party»."}, "3": {"a": ["lemon"], "why": "«Everyone in my family prefers lemon. Could you do a lemon sponge?»."}, "4": {"a": ["20", "twenty"], "why": "«How many people does it need to serve? — About twenty»."}, "5": {"a": ["strawberries"], "why": "«We can do fresh strawberries on top» — клиентка соглашается."}, "6": {"a": ["blue"], "why": "«What colour icing for the writing? — Blue, please»."}, "7": {"a": ["nuts"], "why": "«Please make sure there are no nuts in it»."}, "8": {"a": ["Friday"], "why": "«Could I collect it on Friday morning? — Friday's fine»."}, "9": {"a": ["11", "eleven"], "why": "«Shall we say eleven o'clock? — Eleven is perfect». Открытие в восемь — отвлекающая деталь."}, "10": {"a": ["32", "thirty-two"], "why": "«Comes to thirty-two pounds»."}, "11": {"a": ["C"], "why": "«Please meet by the lifeguard tower», а не на парковке."}, "12": {"a": ["A"], "why": "«The organisers provide gloves and bags for everyone»."}, "13": {"a": ["B"], "why": "«If you find broken glass, don't pick it up... call a team leader»."}, "14": {"a": ["C"], "why": "«Finish at one o'clock exactly, when the tide starts coming in»."}, "15": {"a": ["A"], "why": "«There will be a free barbecue for all volunteers»."}, "16": {"a": ["A"], "why": "«Sam is leading the group on the main beach»."}, "17": {"a": ["C"], "why": "«Ravi's group will work around the rock pools»."}, "18": {"a": ["E"], "why": "«Leo's team will cover the car park and the footpaths»."}, "19": {"a": ["B"], "why": "«Katie takes her team up into the sand dunes»."}, "20": {"a": ["D"], "why": "«Donna is in charge of the area beside the harbour»."}, "21": {"a": ["B"], "why": "«Your report on the field trip to the River Dean» — изучали реку."}, "22": {"a": ["A"], "why": "«Any problems during the trip? — The heavy rain on the second day»."}, "23": {"a": ["C"], "why": "«Your maps are excellent — really clear, well labelled»."}, "24": {"a": ["B"], "why": "«We timed floating oranges over a ten-metre stretch» — прибор был в ремонте."}, "25": {"a": ["A"], "why": "«Yes — a comparison with last year's data»."}, "26": {"a": ["C"], "why": "«The final deadline is the twelfth of December»."}, "27": {"a": ["sites"], "why": "«We took measurements at six different sites along the river»."}, "28": {"a": ["reliable"], "why": "«The data from that day is less reliable than the rest»."}, "29": {"a": ["introduction"], "why": "«The introduction is too long... cut it to one page»."}, "30": {"a": ["Monday"], "why": "«Let's meet on Monday to check your progress»."}, "31": {"a": ["moon"], "why": "«The earliest calendars... followed the phases of the moon»."}, "32": {"a": ["Nile"], "why": "«Their year began with the flooding of the Nile»."}, "33": {"a": ["365", "three hundred and sixty-five"], "why": "«Their calendar had three hundred and sixty-five days»."}, "34": {"a": ["Caesar"], "why": "«Until Julius Caesar reformed it, creating... the Julian calendar»."}, "35": {"a": ["4", "four"], "why": "«An extra day added every four years — the leap year»."}, "36": {"a": ["minutes"], "why": "«The Julian year was too long by eleven minutes»."}, "37": {"a": ["10", "ten"], "why": "«The calendar was ten days behind the sun»."}, "38": {"a": ["Gregory"], "why": "«Named after Pope Gregory the Thirteenth»."}, "39": {"a": ["1752", "seventeen fifty-two"], "why": "«Only adopted it in seventeen fifty-two»."}, "40": {"a": ["11", "eleven"], "why": "«Eleven days were simply deleted from September»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "listening-6", "title": "Listening · Вариант 6", "minutes": 30, "parts": [{"title": "Part 1 · Звонок в бюро находок (диалог)", "intro": "Мужчина ищет рюкзак, забытый в автобусе. Вопросы 1–10: дополните заметки ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Good afternoon, City Transport lost property office. How can I help?\nB: Hello. I left my bag on a bus yesterday evening, and I'm hoping someone handed it in.\nA: Let's check. Can I take your name?\nB: Yes, it's Peter Hollis — H-O-L-L-I-S.\nA: Thank you, Mr Hollis. What kind of bag is it?\nB: It's a black backpack, quite worn, with two side pockets.\nA: And which bus were you on?\nB: The number fifty-three, going towards the hospital. I got off at the cinema and realised straight away.\nA: What day was that?\nB: Monday — yesterday, around seven in the evening.\nA: Right. Can you tell me what was inside? We ask so we can confirm the owner.\nB: Of course. There's my laptop, and an umbrella — a grey one. Oh, and on the zip there's a small keyring shaped like a fish. My daughter made it.\nA: A keyring shaped like a fish — that's helpful... Yes! I think we have it. A black backpack came in from route fifty-three this morning.\nB: That's fantastic! Where do I collect it?\nA: We're at twelve Station Road, opposite the railway bridge. We open at half past eight in the morning, and we're here till five.\nB: I'll come tomorrow before work. Do I need to bring anything?\nA: Yes — some proof of identity. A passport or a driving licence is fine. And there's a handling fee of two pounds, cash or card.\nB: No problem at all. Thank you so much!", "groups": [{"kind": "gap", "label": "Вопросы 1–10. Дополните заметки ОДНИМ словом или числом из записи.", "questions": [{"no": 1, "q": "Surname: ______"}, {"no": 2, "q": "Lost item: a black ______"}, {"no": 3, "q": "Bus number: ______"}, {"no": 4, "q": "Day the bag was lost: ______"}, {"no": 5, "q": "Inside: a laptop and a grey ______"}, {"no": 6, "q": "On the zip: a keyring shaped like a ______"}, {"no": 7, "q": "Office address: 12 ______ Road"}, {"no": 8, "q": "The office opens at ______ in the morning"}, {"no": 9, "q": "Bring proof of identity, e.g. a ______ or a driving licence"}, {"no": 10, "q": "Handling fee: £______"}]}]}, {"title": "Part 2 · Вечернее мероприятие в музее (монолог)", "intro": "Объявление о вечерних открытиях городского музея. Вопросы 11–15: выберите ответ. Вопросы 16–20: соотнесите площадку с тем, что там происходит.", "voices": ["A"], "script": "A: Hello everyone, this is an announcement from the City Museum. This spring we're launching 'Museum Lates' — special evening openings that take place on the last Friday of every month, from six until ten p.m., when the museum is normally closed. Tickets cost ten pounds, and that includes a welcome drink. Now, a word of advice: numbers are limited to four hundred visitors, and our first two evenings sold out completely, so please book early on our website. What can you expect? In the Main Hall there'll be live jazz from a local quartet all evening. Out in the Courtyard, weather permitting, local chefs will be serving street food from around the world. In the Egyptian Gallery, our head curator gives a short talk about the golden mask — the star of our collection — at seven and again at nine. In the Studio upstairs you can join a drawing workshop; paper and pencils are provided, and no experience is needed. And the Lecture Theatre will be showing a programme of short films about the history of the city. Two practical notes. Photography is welcome everywhere except in the special exhibition, where the lenders don't allow it. And good news for anyone wanting a souvenir: the museum shop stays open right until closing time. We look forward to seeing you at the next Museum Late!", "groups": [{"kind": "mc", "label": "Вопросы 11–15. Выберите один вариант.", "questions": [{"no": 11, "q": "'Museum Lates' take place on", "options": ["A. the first Friday of the month", "B. the last Friday of the month", "C. every Saturday evening"]}, {"no": 12, "q": "Tickets cost", "options": ["A. £6", "B. £8", "C. £10"]}, {"no": 13, "q": "Visitors are advised to book early because", "options": ["A. numbers are limited", "B. prices rise at the door", "C. parking is difficult"]}, {"no": 14, "q": "Photography is allowed", "options": ["A. everywhere in the museum", "B. everywhere except the special exhibition", "C. only in the Main Hall"]}, {"no": 15, "q": "The museum shop will", "options": ["A. be closed all evening", "B. close at eight", "C. stay open until closing time"]}]}, {"kind": "match", "label": "Вопросы 16–20. Что где происходит? A — живой джаз, B — рассказ куратора о золотой маске, C — мастер-класс по рисованию, D — показ короткометражных фильмов, E — уличная еда.", "options": ["A", "B", "C", "D", "E"], "questions": [{"no": 16, "q": "Main Hall"}, {"no": 17, "q": "Courtyard"}, {"no": 18, "q": "Egyptian Gallery"}, {"no": 19, "q": "Studio"}, {"no": 20, "q": "Lecture Theatre"}]}]}, {"title": "Part 3 · Опрос о подработках студентов (диалог)", "intro": "Дэн и Мия обсуждают результаты опроса о подработках. Вопросы 21–26: выберите ответ. Вопросы 27–30: кто выполнит каждую задачу к следующей неделе?", "voices": ["A", "B"], "script": "A: Okay, Mia, let's pull together what we've got for the project.\nB: Sure. So, our survey question was how part-time jobs affect students' studies — whether working actually damages people's results.\nA: Right. And I still think doing it on paper was the right call. Handing out paper forms in the canteen got us far more answers than an online link would have.\nB: Agreed — people filled them in while they ate. In the end we collected ninety completed forms, which is enough for decent statistics.\nA: So what stands out? For me, it's where people work. By far the biggest group work in cafés and restaurants — over half of everyone who has a job.\nB: Yes, shops came second, but a long way behind. And the reason for working surprised nobody: most said they work to pay their rent. Saving for travel was a distant second.\nA: The real surprise is the marks. I expected working students to do worse, but their marks were no worse than anyone else's — up to about ten hours a week, anyway.\nB: Exactly, the problems only start above fifteen hours. Okay, jobs for next week. I'll write the introduction — I've already got the reading list.\nA: And I'll make the charts; I want to try that new graphics software.\nB: Great. What about the statistics? I'm still not confident about the percentages.\nA: Good news there — Dr Lee offered to check our statistics himself if we send him the spreadsheet by Wednesday.\nB: Perfect, I'll send it today. And the slides?\nA: Let's design the slides together on Thursday afternoon — it'll be faster with two of us.\nB: Thursday works. See you then!", "groups": [{"kind": "mc", "label": "Вопросы 21–26. Выберите один вариант.", "questions": [{"no": 21, "q": "The survey investigated", "options": ["A. how much students earn", "B. which jobs are most popular", "C. how part-time jobs affect students' studies"]}, {"no": 22, "q": "The responses were collected", "options": ["A. through an online link", "B. on paper forms in the canteen", "C. by interviewing students"]}, {"no": 23, "q": "How many completed forms did they collect?", "options": ["A. 90", "B. 100", "C. 150"]}, {"no": 24, "q": "Most working students are employed in", "options": ["A. shops", "B. offices", "C. cafés and restaurants"]}, {"no": 25, "q": "The most common reason for working is", "options": ["A. gaining work experience", "B. paying rent", "C. saving for travel"]}, {"no": 26, "q": "The students were surprised that", "options": ["A. working students' marks were no worse", "B. very few students have jobs", "C. many students work at night"]}]}, {"kind": "match", "label": "Вопросы 27–30. Кто выполнит каждую задачу к следующей неделе? A — Дэн, B — Мия, C — оба студента вместе, D — преподаватель доктор Ли, E — задача отложена.", "options": ["A", "B", "C", "D", "E"], "questions": [{"no": 27, "q": "Writing the introduction"}, {"no": 28, "q": "Making the charts"}, {"no": 29, "q": "Checking the statistics"}, {"no": 30, "q": "Designing the slides"}]}]}, {"title": "Part 4 · Лекция: изобретение телефона (монолог)", "intro": "Фрагмент лекции по истории технологий. Вопросы 31–40: дополните конспект ОДНИМ словом или числом.", "voices": ["A"], "script": "A: The telephone is so ordinary today that we forget how astonishing it once seemed. Its inventor, Alexander Graham Bell, did not set out to build a communication empire; by profession he was a teacher of the deaf, following his father, and his experiments with sound grew directly out of that work. Bell received his famous patent in eighteen seventy-six — sometimes called the most valuable patent in history. Three days later came the famous first sentence, spoken to his assistant, Mr Watson, in the next room: 'Mr Watson, come here — I want to see you.' Bell's luck was extraordinary. A rival inventor, Elisha Gray, arrived at the patent office on the very same day, just a few hours later, with a design for a remarkably similar device. Had he come that morning, we might remember a different name today. Progress was rapid. The first telephone exchange opened in eighteen seventy-eight in New Haven, Connecticut; it served just twenty-one subscribers, who could ask the operator to connect them to one another. Interestingly, early telephones were rented, not sold — the company kept ownership of every instrument, a business model that lasted in America for a century. By nineteen hundred the United States already had more than a million telephones. And a final irony: Bell himself refused to have a telephone in his study. He found that the ringing interrupted his thinking, and he called the machine a distraction from real work.", "groups": [{"kind": "gap", "label": "Вопросы 31–40. Дополните конспект ОДНИМ словом или числом из записи.", "questions": [{"no": 31, "q": "By profession, Bell was a teacher of the ______."}, {"no": 32, "q": "Bell received his patent in ______."}, {"no": 33, "q": "The first sentence was spoken to his assistant, Mr ______."}, {"no": 34, "q": "Elisha Gray arrived at the patent office a few ______ later."}, {"no": 35, "q": "The first telephone exchange opened in ______."}, {"no": 36, "q": "The exchange served just ______ subscribers."}, {"no": 37, "q": "Early telephones were ______, not sold."}, {"no": 38, "q": "By 1900 the USA had more than a ______ telephones."}, {"no": 39, "q": "Bell refused to have a telephone in his ______."}, {"no": 40, "q": "He called the machine a ______ from real work."}]}]}]}, "answers": {"1": {"a": ["Hollis"], "why": "Он диктует по буквам: «Peter Hollis — H-O-L-L-I-S»."}, "2": {"a": ["backpack"], "why": "«It's a black backpack, quite worn, with two side pockets»."}, "3": {"a": ["53", "fifty-three"], "why": "«The number fifty-three, going towards the hospital»."}, "4": {"a": ["Monday"], "why": "«What day was that? — Monday — yesterday»."}, "5": {"a": ["umbrella"], "why": "«There's my laptop, and an umbrella — a grey one»."}, "6": {"a": ["fish"], "why": "«On the zip there's a small keyring shaped like a fish»."}, "7": {"a": ["Station"], "why": "«We're at twelve Station Road, opposite the railway bridge»."}, "8": {"a": ["8:30", "8.30", "830", "half past eight"], "why": "«We open at half past eight in the morning»."}, "9": {"a": ["passport"], "why": "«Some proof of identity. A passport or a driving licence is fine»."}, "10": {"a": ["2", "two"], "why": "«There's a handling fee of two pounds»."}, "11": {"a": ["B"], "why": "«Take place on the last Friday of every month»."}, "12": {"a": ["C"], "why": "«Tickets cost ten pounds, and that includes a welcome drink»."}, "13": {"a": ["A"], "why": "«Numbers are limited to four hundred visitors... so please book early»."}, "14": {"a": ["B"], "why": "«Photography is welcome everywhere except in the special exhibition»."}, "15": {"a": ["C"], "why": "«The museum shop stays open right until closing time»."}, "16": {"a": ["A"], "why": "«In the Main Hall there'll be live jazz from a local quartet»."}, "17": {"a": ["E"], "why": "«Out in the Courtyard... chefs will be serving street food»."}, "18": {"a": ["B"], "why": "«In the Egyptian Gallery, our head curator gives a short talk about the golden mask»."}, "19": {"a": ["C"], "why": "«In the Studio upstairs you can join a drawing workshop»."}, "20": {"a": ["D"], "why": "«The Lecture Theatre will be showing a programme of short films»."}, "21": {"a": ["C"], "why": "«Our survey question was how part-time jobs affect students' studies»."}, "22": {"a": ["B"], "why": "«Handing out paper forms in the canteen got us far more answers»."}, "23": {"a": ["A"], "why": "«We collected ninety completed forms»."}, "24": {"a": ["C"], "why": "«By far the biggest group work in cafés and restaurants»."}, "25": {"a": ["B"], "why": "«Most said they work to pay their rent»."}, "26": {"a": ["A"], "why": "«I expected working students to do worse, but their marks were no worse»."}, "27": {"a": ["B"], "why": "Мия: «I'll write the introduction — I've already got the reading list»."}, "28": {"a": ["A"], "why": "Дэн: «And I'll make the charts»."}, "29": {"a": ["D"], "why": "«Dr Lee offered to check our statistics himself»."}, "30": {"a": ["C"], "why": "«Let's design the slides together on Thursday afternoon»."}, "31": {"a": ["deaf"], "why": "«By profession he was a teacher of the deaf»."}, "32": {"a": ["1876", "eighteen seventy-six"], "why": "«Bell received his famous patent in eighteen seventy-six»."}, "33": {"a": ["Watson"], "why": "«Spoken to his assistant, Mr Watson, in the next room»."}, "34": {"a": ["hours"], "why": "«Arrived at the patent office on the very same day, just a few hours later»."}, "35": {"a": ["1878", "eighteen seventy-eight"], "why": "«The first telephone exchange opened in eighteen seventy-eight»."}, "36": {"a": ["21", "twenty-one"], "why": "«It served just twenty-one subscribers»."}, "37": {"a": ["rented"], "why": "«Early telephones were rented, not sold»."}, "38": {"a": ["million"], "why": "«The United States already had more than a million telephones»."}, "39": {"a": ["study"], "why": "«Bell himself refused to have a telephone in his study»."}, "40": {"a": ["distraction"], "why": "«He called the machine a distraction from real work»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "listening-7", "title": "Listening · Вариант 7", "minutes": 30, "parts": [{"title": "Part 1 · Звонок о съёмной квартире (диалог)", "intro": "Девушка звонит в агентство недвижимости по поводу квартиры. Вопросы 1–10: дополните заметки ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Good morning, Hartley Lettings, Emma speaking. How can I help?\nB: Hello, I'm calling about the flat advertised on your website yesterday.\nA: Of course. Could I take your name first, please?\nB: Yes, it's Sophie Walker — that's W-A-L-K-E-R.\nA: Thank you, Sophie. So, the flat is at fourteen Bridge Road, on the third floor. There's no lift, I'm afraid.\nB: That's fine, I don't mind stairs. How much is the rent?\nA: It's eight hundred and fifty pounds a month. The deposit is nine hundred pounds, and it's fully protected in a government scheme.\nB: Okay. Are any bills included in the rent?\nA: Water and gas are included, but you'd pay for electricity separately.\nB: Understood. And how far is it from public transport?\nA: Very close — the station is just a ten-minute walk away, straight down the road.\nB: Great. Is there any outdoor space at all?\nA: Yes, actually — the flat has a small balcony overlooking the park. It gets the evening sun.\nB: Lovely. Could I arrange a viewing this week?\nA: Certainly. We have a free slot on Thursday at half past five, if that suits you.\nB: Thursday works perfectly. Do I need to bring anything with me?\nA: Just your passport, so we can check your ID before an application.\nB: Wonderful. See you on Thursday, then. Thanks for your help!", "groups": [{"kind": "gap", "label": "Вопросы 1–10. Дополните заметки ОДНИМ словом или числом из записи.", "questions": [{"no": 1, "q": "Surname: ______"}, {"no": 2, "q": "Flat address: 14 ______ Road"}, {"no": 3, "q": "The flat is on the ______ floor"}, {"no": 4, "q": "Monthly rent: £______"}, {"no": 5, "q": "Deposit: £______"}, {"no": 6, "q": "Tenant pays separately for ______"}, {"no": 7, "q": "The station is a ______-minute walk away"}, {"no": 8, "q": "Outdoor space: a small ______"}, {"no": 9, "q": "Viewing day: ______"}, {"no": 10, "q": "Bring your ______ to the viewing"}]}]}, {"title": "Part 2 · Смотритель национального парка встречает посетителей (монолог)", "intro": "Рейнджер рассказывает посетителям о парке. Вопросы 11–15: выберите ответ. Вопросы 16–20: соотнесите маршрут с тем, что там можно увидеть или сделать.", "voices": ["A"], "script": "A: Good morning, everyone, and welcome to Pinewood National Park! My name's Ray, and I'm one of the rangers here. The park was established in nineteen fifty-two, which makes it one of the oldest in the region. Before you head off, a few important updates. The Lakeside Trail is closed all this week, because last weekend's storm left several fallen trees across the path — our team is still clearing them. Everything else is open as usual. The visitor centre, where you are standing now, closes at five o'clock sharp, so please be back before then. And our golden rule: never feed the animals. It seems kind, but it makes them dependent on people and can make them seriously ill. Now, where should you go? The Silver Falls Path takes you to a spectacular waterfall — about an hour each way, and the spray is wonderful on a hot day. Eagle Ridge is the best place in the park for birdwatching; bring binoculars if you have them. On the Meadow Loop you're almost guaranteed to see wild deer, especially early in the morning. Oak Grove has tables and benches, and it's the only official picnic area in the park — fires are not allowed anywhere else. And the Echo Trail leads to a small cave — do take a torch. Finally, our free guided walk leaves from the visitor centre at two o'clock. Enjoy your day!", "groups": [{"kind": "mc", "label": "Вопросы 11–15. Выберите один вариант.", "questions": [{"no": 11, "q": "The park was established in", "options": ["A. 1925", "B. 1952", "C. 1972"]}, {"no": 12, "q": "The Lakeside Trail is closed because of", "options": ["A. flooding", "B. path repairs", "C. fallen trees"]}, {"no": 13, "q": "The visitor centre closes at", "options": ["A. 5 p.m.", "B. 6 p.m.", "C. 4 p.m."]}, {"no": 14, "q": "Visitors must never", "options": ["A. take photographs", "B. leave the marked paths", "C. feed the animals"]}, {"no": 15, "q": "The guided walk leaves from", "options": ["A. the main gate", "B. the visitor centre", "C. the car park"]}]}, {"kind": "match", "label": "Вопросы 16–20. Что где можно увидеть или сделать? A — водопад, B — наблюдение за птицами, C — дикие олени, D — место для пикника, E — пещера.", "options": ["A", "B", "C", "D", "E"], "questions": [{"no": 16, "q": "Silver Falls Path"}, {"no": 17, "q": "Eagle Ridge"}, {"no": 18, "q": "Meadow Loop"}, {"no": 19, "q": "Oak Grove"}, {"no": 20, "q": "Echo Trail"}]}]}, {"title": "Part 3 · Этика психологического эксперимента (диалог)", "intro": "Студентка Анна обсуждает с тьютором дизайн своего эксперимента. Вопросы 21–26: выберите ответ. Вопросы 27–30: дополните ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Come in, Anna. You wanted to talk about your experiment design, didn't you?\nB: Yes, Dr Lawson. I'm planning to study how background noise affects memory — participants will memorise word lists in quiet and in noisy conditions.\nA: Sounds workable. You mentioned in your email that there's some deception involved?\nB: A little. I want to tell participants the study is about reading speed, so they don't deliberately try to ignore the noise.\nA: I see. Ethically, deception is acceptable only if participants are debriefed afterwards — you must explain the real purpose as soon as their session ends.\nB: Of course. I've already prepared a debriefing sheet for that.\nA: Good. And what about consent?\nB: Everyone will sign a consent form before we start.\nA: Make sure the form states clearly that they can withdraw at any time, even in the middle of the session, without giving a reason.\nB: I'll add that sentence. What about the data?\nA: It must be anonymised. Don't store names anywhere — replace names with numbers, and keep the code list in a separate locked file.\nB: Understood. I'm planning to recruit forty volunteers, mostly first-years, and each session lasts twenty minutes.\nA: That's realistic. One last thing — the ethics committee needs about three weeks to review applications, so submit yours by Monday if you want to start next month.\nB: I'll send it today, actually. Thank you so much!", "groups": [{"kind": "mc", "label": "Вопросы 21–26. Выберите один вариант.", "questions": [{"no": 21, "q": "Anna's experiment studies the effect on memory of", "options": ["A. background noise", "B. lack of sleep", "C. caffeine"]}, {"no": 22, "q": "Participants will first be told the study is about", "options": ["A. memory", "B. reading speed", "C. music taste"]}, {"no": 23, "q": "Deception is acceptable only if", "options": ["A. the study is short", "B. participants are paid", "C. participants are debriefed afterwards"]}, {"no": 24, "q": "Participants may withdraw from the study", "options": ["A. only before it begins", "B. at any time", "C. only in writing"]}, {"no": 25, "q": "The data will be anonymised by", "options": ["A. deleting all recordings", "B. using participants' initials", "C. replacing names with numbers"]}, {"no": 26, "q": "The ethics committee review takes about", "options": ["A. three weeks", "B. two months", "C. ten days"]}]}, {"kind": "gap", "label": "Вопросы 27–30. Дополните ОДНИМ словом или числом из записи.", "questions": [{"no": 27, "q": "Before the study, everyone signs a consent ______."}, {"no": 28, "q": "Anna plans to recruit ______ volunteers."}, {"no": 29, "q": "Each session lasts twenty ______."}, {"no": 30, "q": "Anna should submit her application by ______."}]}]}, {"title": "Part 4 · Лекция: история Олимпийских игр (монолог)", "intro": "Фрагмент лекции по истории спорта. Вопросы 31–40: дополните конспект ОДНИМ словом или числом.", "voices": ["A"], "script": "A: Today we turn to the history of the Olympic Games. The first recorded games were held in seven hundred and seventy-six BC at Olympia, in ancient Greece. For years there was only one event — a short running race the length of the stadium. Winners received no money; their prize was a simple wreath made of olive branches, yet it brought them lifelong fame in their home cities. The ancient games continued for over a thousand years, until the Roman emperor banned them in AD three hundred and ninety-three, as part of a campaign against pagan festivals. After that, the tradition slept for fifteen centuries. The modern revival was largely the work of one man — the French educator Pierre de Coubertin, who believed that sport could bring nations together and that competition built character. Thanks to his tireless campaigning, the first modern games opened in Athens in eighteen ninety-six, with athletes from fourteen countries. Women first competed four years later, in nineteen hundred, in Paris — though only in a handful of sports such as tennis and golf. The Winter Games were added in nineteen twenty-four, held in the French mountain town of Chamonix. Coubertin also designed the famous flag: five rings, representing the five inhabited continents joined together in sport. And the official motto — faster, higher, stronger — still opens every games today, more than a century after it was first proposed.", "groups": [{"kind": "gap", "label": "Вопросы 31–40. Дополните конспект ОДНИМ словом или числом из записи.", "questions": [{"no": 31, "q": "The first recorded games: ______ BC."}, {"no": 32, "q": "The only event was a short ______ race."}, {"no": 33, "q": "The prize was a wreath made of ______ branches."}, {"no": 34, "q": "A Roman emperor banned the games in AD ______."}, {"no": 35, "q": "The revival was led by Pierre de ______."}, {"no": 36, "q": "The first modern games were held in Athens in ______."}, {"no": 37, "q": "Women first competed in ______."}, {"no": 38, "q": "The Winter Games were added in ______."}, {"no": 39, "q": "The five rings represent five ______."}, {"no": 40, "q": "The motto: faster, higher, ______."}]}]}]}, "answers": {"1": {"a": ["Walker"], "why": "Она диктует по буквам: «Sophie Walker — W-A-L-K-E-R»."}, "2": {"a": ["Bridge"], "why": "«The flat is at fourteen Bridge Road»."}, "3": {"a": ["third", "3rd", "3"], "why": "«On the third floor. There's no lift»."}, "4": {"a": ["850"], "why": "«Eight hundred and fifty pounds a month»."}, "5": {"a": ["900"], "why": "«The deposit is nine hundred pounds»."}, "6": {"a": ["electricity"], "why": "«You'd pay for electricity separately» — вода и газ включены."}, "7": {"a": ["10", "ten"], "why": "«The station is just a ten-minute walk away»."}, "8": {"a": ["balcony"], "why": "«The flat has a small balcony overlooking the park»."}, "9": {"a": ["Thursday"], "why": "«A free slot on Thursday at half past five»."}, "10": {"a": ["passport"], "why": "«Just your passport, so we can check your ID»."}, "11": {"a": ["B"], "why": "«The park was established in nineteen fifty-two»."}, "12": {"a": ["C"], "why": "«The storm left several fallen trees across the path»."}, "13": {"a": ["A"], "why": "«The visitor centre... closes at five o'clock sharp»."}, "14": {"a": ["C"], "why": "«Our golden rule: never feed the animals»."}, "15": {"a": ["B"], "why": "«Our free guided walk leaves from the visitor centre at two o'clock»."}, "16": {"a": ["A"], "why": "Silver Falls Path — «takes you to a spectacular waterfall»."}, "17": {"a": ["B"], "why": "Eagle Ridge — «the best place in the park for birdwatching»."}, "18": {"a": ["C"], "why": "Meadow Loop — «almost guaranteed to see wild deer»."}, "19": {"a": ["D"], "why": "Oak Grove — «the only official picnic area in the park»."}, "20": {"a": ["E"], "why": "Echo Trail — «leads to a small cave — do take a torch»."}, "21": {"a": ["A"], "why": "«How background noise affects memory»."}, "22": {"a": ["B"], "why": "«Tell participants the study is about reading speed»."}, "23": {"a": ["C"], "why": "«Deception is acceptable only if participants are debriefed afterwards»."}, "24": {"a": ["B"], "why": "«They can withdraw at any time... without giving a reason»."}, "25": {"a": ["C"], "why": "«Replace names with numbers, and keep the code list... separate»."}, "26": {"a": ["A"], "why": "«The ethics committee needs about three weeks»."}, "27": {"a": ["form"], "why": "«Everyone will sign a consent form before we start»."}, "28": {"a": ["40", "forty"], "why": "«I'm planning to recruit forty volunteers»."}, "29": {"a": ["minutes"], "why": "«Each session lasts twenty minutes»."}, "30": {"a": ["Monday"], "why": "«Submit yours by Monday if you want to start next month»."}, "31": {"a": ["776"], "why": "«In seven hundred and seventy-six BC at Olympia»."}, "32": {"a": ["running"], "why": "«Only one event — a short running race»."}, "33": {"a": ["olive"], "why": "«A simple wreath made of olive branches»."}, "34": {"a": ["393"], "why": "«Banned them in AD three hundred and ninety-three»."}, "35": {"a": ["Coubertin"], "why": "«The French educator Pierre de Coubertin»."}, "36": {"a": ["1896"], "why": "«Opened in Athens in eighteen ninety-six»."}, "37": {"a": ["1900"], "why": "«Women first competed... in nineteen hundred, in Paris»."}, "38": {"a": ["1924"], "why": "«The Winter Games were added in nineteen twenty-four»."}, "39": {"a": ["continents"], "why": "«Five rings, representing the five inhabited continents»."}, "40": {"a": ["stronger"], "why": "«The official motto — faster, higher, stronger»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "listening-8", "title": "Listening · Вариант 8", "minutes": 30, "parts": [{"title": "Part 1 · Бронирование стола и банкета в ресторане (диалог)", "intro": "Женщина бронирует зал для праздничного ужина. Вопросы 1–10: дополните заметки ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Good afternoon, the Willow Tree Restaurant, how can I help?\nB: Hello, I'd like to book a private room for a birthday dinner, please.\nA: Certainly. Could I have your surname first?\nB: It's Peters — P-E-T-E-R-S.\nA: Thank you, Ms Peters. What date did you have in mind, and for how many guests?\nB: The twelfth of December, for twenty-five people, more or less.\nA: The twelfth is free, luckily. For that number I'd suggest the Garden Room — it seats up to thirty and has its own terrace.\nB: Sounds lovely. And what about the food?\nA: For groups we do a set menu at thirty pounds per person — three courses, coffee included. The vegetarian main course is a mushroom risotto, and we can adapt other dishes too.\nB: Perfect. Is a deposit required?\nA: Yes, we ask for fifty pounds to secure the room — it comes off the final bill, of course.\nB: That's fine. And could we have some music?\nA: You're welcome to bring a live band — the Garden Room has space for a small stage in the corner.\nB: Excellent. What time can we arrive on the day?\nA: The room is yours from half past seven — so seven thirty onwards.\nB: Great. Is there anything else you need from me now?\nA: Just confirm the final number of guests by Tuesday, please, so the chef can plan.\nB: Will do. Thank you very much!", "groups": [{"kind": "gap", "label": "Вопросы 1–10. Дополните заметки ОДНИМ словом или числом из записи.", "questions": [{"no": 1, "q": "Surname: ______"}, {"no": 2, "q": "Date of dinner: ______ December"}, {"no": 3, "q": "Number of guests: ______"}, {"no": 4, "q": "Suggested room: the ______ Room"}, {"no": 5, "q": "Set menu price: £______ per person"}, {"no": 6, "q": "Vegetarian main course: mushroom ______"}, {"no": 7, "q": "Deposit: £______"}, {"no": 8, "q": "Music: guests may bring a live ______"}, {"no": 9, "q": "Arrival time: ______ p.m."}, {"no": 10, "q": "Confirm final guest numbers by ______"}]}]}, {"title": "Part 2 · Объявление о городской системе велопроката (монолог)", "intro": "Радиоведущий рассказывает о запуске велопроката CityWheels. Вопросы 11–15: выберите ответ. Вопросы 16–20: соотнесите станцию с её особенностью.", "voices": ["A"], "script": "A: Good evening, listeners! Big news for the city: our new bike-share scheme, CityWheels, launches on the first of April. Here's how it works. Fifty docking stations will appear across town, each holding between ten and twenty bicycles. To join, simply download the CityWheels app and register with a bank card — that's genuinely all you need. And here's the best part: the first thirty minutes of every ride are completely free, so most trips across the centre will cost nothing at all. After that, it's one pound for each extra half hour. A quick word about safety: helmets are not provided at the stations, so riders should bring their own. Now, a few stations worth knowing about. The University station will be the only one offering electric bikes — perfect for the long hill up to campus. Market Square will operate twenty-four hours a day, the only round-the-clock station in the whole scheme. At the Harbour station you'll find a repair workshop, where mechanics can fix a puncture while you wait. City Park will be the largest station, with sixty bicycles in a long double rack. And the Central Avenue station sits right next to the railway station, so commuters can grab a bike straight off the train. Full details and a map are on the city council website. Get pedalling!", "groups": [{"kind": "mc", "label": "Вопросы 11–15. Выберите один вариант.", "questions": [{"no": 11, "q": "The scheme launches on the first of", "options": ["A. April", "B. May", "C. June"]}, {"no": 12, "q": "How many docking stations will there be?", "options": ["A. 40", "B. 50", "C. 60"]}, {"no": 13, "q": "The free period at the start of every ride is", "options": ["A. 15 minutes", "B. 20 minutes", "C. 30 minutes"]}, {"no": 14, "q": "To register, users need the app and", "options": ["A. a passport", "B. a bank card", "C. a utility bill"]}, {"no": 15, "q": "Helmets", "options": ["A. are compulsory by law", "B. are free at every station", "C. should be brought by riders"]}]}, {"kind": "match", "label": "Вопросы 16–20. Чем известна каждая станция? A — электровелосипеды, B — работает круглосуточно, C — ремонтная мастерская, D — самая большая станция, E — рядом с железнодорожным вокзалом.", "options": ["A", "B", "C", "D", "E"], "questions": [{"no": 16, "q": "University"}, {"no": 17, "q": "Market Square"}, {"no": 18, "q": "Harbour"}, {"no": 19, "q": "City Park"}, {"no": 20, "q": "Central Avenue"}]}]}, {"title": "Part 3 · Два студента готовят маркетинговый кейс (диалог)", "intro": "Том и Кейти планируют кейс-стади по маркетингу. Вопросы 21–26: выберите ответ. Вопросы 27–30: кто отвечает за каждую задачу?", "voices": ["A", "B"], "script": "A: Right, Katie, we really need to plan this marketing case study — the deadline is coming fast.\nB: I know, Tom. So, the case is about Beanhouse, the coffee company. Their sales have fallen sharply over the past year.\nA: Yes, and the reason is pretty clear from the case notes: a cheaper competitor opened nearby and took most of their customers. It's not really about quality at all.\nB: Agreed. So our job is to propose a strategy to win those customers back. How should we collect our data?\nA: I thought about interviews at first, but they take ages to arrange. Let's use an online survey — we can reach far more people in a single week.\nB: Fine by me. And who exactly are we targeting?\nA: Well, Beanhouse sits right between two campuses, so the obvious target group is university students, roughly eighteen to twenty-five.\nB: Exactly. Which is why I think the campaign should focus on social media — that's where students actually spend their time. Posters and radio would be wasted money.\nA: Completely agree. Now, the tasks. I'm happy to design the questionnaire — I made one last term, so I know the software.\nB: Then I'll create the slides — I actually enjoy that part. What about the introduction?\nA: Let's write the introduction together, over a coffee — appropriately enough. And Dr Simmons said she would check the final draft before we submit it.\nB: Perfect. So everything has to be ready before the presentation on the ninth of May.\nA: The ninth, right. Okay, let's get moving.", "groups": [{"kind": "mc", "label": "Вопросы 21–26. Выберите один вариант.", "questions": [{"no": 21, "q": "The case study is about a company selling", "options": ["A. sportswear", "B. smartphones", "C. coffee"]}, {"no": 22, "q": "Sales fell mainly because of", "options": ["A. a cheaper competitor", "B. higher prices", "C. bad reviews"]}, {"no": 23, "q": "The students will collect data using", "options": ["A. interviews", "B. an online survey", "C. sales records"]}, {"no": 24, "q": "Their target group is", "options": ["A. teenagers", "B. office workers", "C. university students"]}, {"no": 25, "q": "Katie thinks the campaign should focus on", "options": ["A. social media", "B. posters", "C. radio"]}, {"no": 26, "q": "The presentation is on", "options": ["A. 2 May", "B. 9 May", "C. 19 May"]}]}, {"kind": "match", "label": "Вопросы 27–30. Кто отвечает за задачу? A — Том, B — Кейти, C — оба студента вместе, D — преподаватель (Dr Simmons).", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "Design the questionnaire"}, {"no": 28, "q": "Create the slides"}, {"no": 29, "q": "Write the introduction"}, {"no": 30, "q": "Check the final draft"}]}]}, {"title": "Part 4 · Лекция: история денег (монолог)", "intro": "Фрагмент лекции по экономической истории. Вопросы 31–40: дополните конспект ОДНИМ словом или числом.", "voices": ["A"], "script": "A: What did people do before money existed? They swapped goods directly — a system called barter. The problem is obvious: if you have fish and want shoes, you must find a shoemaker who happens to want fish that very day. So communities began using objects that everyone valued. Among the earliest forms of money were cowrie shells — small, durable and impossible to fake — used across Asia and Africa for many centuries. The next great step came in the kingdom of Lydia, in what is now Turkey, where the first true coins were struck around the seventh century BC. They were made of electrum, a natural mixture of gold and silver, and stamped to guarantee their weight. Coins spread quickly, but they were heavy to carry in large amounts. The solution appeared in China, where merchants and then the state began issuing paper money — notes so surprising to Europeans that the traveller Marco Polo devoted a whole chapter of his book to them. In Europe, banknotes developed along a different path: people left their coins with goldsmiths for safekeeping, and the receipts issued by those goldsmiths gradually began to circulate as money themselves. The modern era brought the next revolution in nineteen fifty, when the first credit card appeared in New York. It was called the Diners Club card, and at first it worked only in restaurants. Today, of course, most payments are digital — and coins may one day seem as strange to our grandchildren as cowrie shells seem to us.", "groups": [{"kind": "gap", "label": "Вопросы 31–40. Дополните конспект ОДНИМ словом или числом из записи.", "questions": [{"no": 31, "q": "Swapping goods directly is a system called ______."}, {"no": 32, "q": "Early money included cowrie ______."}, {"no": 33, "q": "The first true coins were struck in the kingdom of ______."}, {"no": 34, "q": "Electrum is a natural mixture of gold and ______."}, {"no": 35, "q": "Paper money first appeared in ______."}, {"no": 36, "q": "The traveller ______ Polo described paper money in his book."}, {"no": 37, "q": "European banknotes grew from receipts issued by ______."}, {"no": 38, "q": "The first credit card appeared in ______."}, {"no": 39, "q": "It was called the ______ Club card."}, {"no": 40, "q": "Today most payments are ______."}]}]}]}, "answers": {"1": {"a": ["Peters"], "why": "Она диктует по буквам: «Peters — P-E-T-E-R-S»."}, "2": {"a": ["12", "12th", "twelfth"], "why": "«The twelfth of December» — администратор подтверждает дату."}, "3": {"a": ["25", "twenty-five"], "why": "«For twenty-five people, more or less»."}, "4": {"a": ["Garden"], "why": "«I'd suggest the Garden Room — it seats up to thirty»."}, "5": {"a": ["30", "thirty"], "why": "«A set menu at thirty pounds per person»."}, "6": {"a": ["risotto"], "why": "«The vegetarian main course is a mushroom risotto»."}, "7": {"a": ["50", "fifty"], "why": "«We ask for fifty pounds to secure the room»."}, "8": {"a": ["band"], "why": "«You're welcome to bring a live band»."}, "9": {"a": ["7:30", "7.30", "730"], "why": "Half past seven = 7:30; администратор подтверждает «seven thirty onwards»."}, "10": {"a": ["Tuesday"], "why": "«Confirm the final number of guests by Tuesday»."}, "11": {"a": ["A"], "why": "«CityWheels launches on the first of April»."}, "12": {"a": ["B"], "why": "«Fifty docking stations will appear across town»."}, "13": {"a": ["C"], "why": "«The first thirty minutes of every ride are completely free»."}, "14": {"a": ["B"], "why": "«Download the CityWheels app and register with a bank card»."}, "15": {"a": ["C"], "why": "«Helmets are not provided... riders should bring their own»."}, "16": {"a": ["A"], "why": "University — «the only one offering electric bikes»."}, "17": {"a": ["B"], "why": "Market Square — «will operate twenty-four hours a day»."}, "18": {"a": ["C"], "why": "Harbour — «you'll find a repair workshop»."}, "19": {"a": ["D" [0, 2.0]]}, {"test": {"id": "listening-9", "title": "Listening · Вариант 9", "minutes": 30, "parts": [{"title": "Part 1 · Запись на курс гончарного мастерства (диалог)", "intro": "Мужчина записывается на курс керамики по телефону. Вопросы 1–10: дополните заметки ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Good morning, Clayworks Studio, Jenny speaking. How can I help?\nB: Hi! I'd like to sign up for a pottery course, please.\nA: Lovely. Have you done any pottery before?\nB: No, none at all — I'm a complete beginner.\nA: Then our beginners course is exactly right for you. Can I take your surname?\nB: It's Fletcher — F-L-E-T-C-H-E-R.\nA: Thank you. The next beginners course starts on the third of September.\nB: Great. And which day does it run?\nA: It's on Wednesday evenings, from half past six — that's six thirty until half past eight — and it runs for eight weeks in total.\nB: Perfect, Wednesdays suit me. How much does it cost?\nA: It's one hundred and twenty pounds, and that includes all the clay and the firing — nothing extra to pay.\nB: Good to know. Should I bring anything with me?\nA: Just an old shirt to protect your clothes — everything else is provided here.\nB: And where exactly is the studio? I've only ever seen the shop upstairs.\nA: The studio is in the basement — take the stairs at the back of the shop, past the kiln room.\nB: Perfect. How do I confirm my place?\nA: Places are limited, so please pay by Monday — you can do it online or here at the desk.\nB: I'll pay online today, then. Thanks so much for your help!", "groups": [{"kind": "gap", "label": "Вопросы 1–10. Дополните заметки ОДНИМ словом или числом из записи.", "questions": [{"no": 1, "q": "Surname: ______"}, {"no": 2, "q": "Course level: ______"}, {"no": 3, "q": "Start date: ______ September"}, {"no": 4, "q": "Classes are on ______ evenings"}, {"no": 5, "q": "Start time: ______ p.m."}, {"no": 6, "q": "Course length: ______ weeks"}, {"no": 7, "q": "Fee: £______ (clay and firing included)"}, {"no": 8, "q": "Bring an old ______ to protect clothes"}, {"no": 9, "q": "The studio is in the ______"}, {"no": 10, "q": "Pay for the course by ______"}]}]}, {"title": "Part 2 · Инструктаж волонтёров зоопарка (монолог)", "intro": "Координатор проводит вводный инструктаж для новых волонтёров. Вопросы 11–15: выберите ответ. Вопросы 16–20: соотнесите волонтёра с местом работы.", "voices": ["A"], "script": "A: Good morning, everyone, and thank you for volunteering at Westbrook Zoo! A few essentials before we begin. Volunteer days start promptly, so please be here by nine o'clock — the animals certainly notice when breakfast is late. You'll each receive a green t-shirt with our logo, which you must wear on site; with it, please wear your own dark trousers and comfortable closed shoes. At lunchtime you're entitled to a free lunch in the staff canteen, behind the elephant house — just show your volunteer badge at the till. Now, the most important safety rule of all: never feed any animal unless a keeper asks you to and shows you exactly how. Even a slice of apple in the wrong stomach can cause serious problems. And if anything ever goes wrong — an open gate, an injured visitor — don't shout and don't run: contact the office using the radio you'll be given at the entrance each morning. Right, your placements for today. Sarah will be helping at the monkey house, preparing food and enrichment toys. David is in the reptile house, mainly cleaning the glass and checking temperatures. Amina will spend the day in the bird garden, topping up the feeders. Carlos, you're in the gift shop this morning, helping unpack the new stock. And Ruth will shadow our guides on the guided tours, learning the route for next month. Any questions? Then let's go and meet your keepers!", "groups": [{"kind": "mc", "label": "Вопросы 11–15. Выберите один вариант.", "questions": [{"no": 11, "q": "Volunteers must arrive by", "options": ["A. 8:00", "B. 8:30", "C. 9:00"]}, {"no": 12, "q": "Volunteers are entitled to", "options": ["A. a free lunch in the staff canteen", "B. free parking", "C. a free annual ticket"]}, {"no": 13, "q": "With the green t-shirt, volunteers wear their own", "options": ["A. boots", "B. dark trousers", "C. cap"]}, {"no": 14, "q": "Volunteers must never", "options": ["A. feed an animal without a keeper's instruction", "B. talk to visitors", "C. take photographs"]}, {"no": 15, "q": "In an emergency, volunteers should", "options": ["A. phone the manager", "B. shout for help", "C. use the radio"]}]}, {"kind": "match", "label": "Вопросы 16–20. Где работает каждый волонтёр? A — обезьяны, B — рептилии, C — птицы, D — сувенирный магазин, E — экскурсии.", "options": ["A", "B", "C", "D", "E"], "questions": [{"no": 16, "q": "Sarah"}, {"no": 17, "q": "David"}, {"no": 18, "q": "Amina"}, {"no": 19, "q": "Carlos"}, {"no": 20, "q": "Ruth"}]}]}, {"title": "Part 3 · Обсуждение обзора литературы с научным руководителем (диалог)", "intro": "Студент Маркус обсуждает черновик обзора литературы с руководителем. Вопросы 21–26: выберите ответ. Вопросы 27–30: дополните ОДНИМ словом.", "voices": ["A", "B"], "script": "A: So, Marcus, you sent me the first draft of your literature review. Let's talk it through.\nB: Thanks for reading it, Dr Chen. I know it's still quite rough.\nA: It's a reasonable start. First, length: the finished chapter should be around four thousand words, and you're already close to that — so it's time to tighten, not to add.\nB: Right. What's the main weakness, in your view?\nA: Honestly? Too many direct quotations. Whole paragraphs are other people's words. Paraphrase more — show me you've digested the ideas, not just collected them.\nB: Fair enough. I was worried about misrepresenting the authors.\nA: Careful paraphrasing is a skill — you'll get it. Second point: some of your sources are quite dated. As a rule, most references should come from the last ten years, unless a work is a genuine classic.\nB: That's partly a practical problem — one key journal is behind a paywall, and our library doesn't subscribe to it.\nA: Ah, but the library offers an interlibrary loan service — they can order any article from another university, usually within a week. Just ask at the desk.\nB: I didn't know that. I'll go tomorrow.\nA: Also, structure. At the moment the review moves year by year. Organise it by theme instead — group the studies by the questions they ask, not by their dates.\nB: That makes sense. Anything else?\nA: Yes, the ending. A good review should highlight the research gap — the space your own project is going to fill. At the moment you just stop.\nB: Understood. One more thing — should I be using reference management software? Everyone keeps mentioning it.\nA: Absolutely, it will save you hours of formatting. So: revised draft by the end of term, and let's meet again in three weeks to check your progress.\nB: Great. Thank you, Dr Chen!", "groups": [{"kind": "mc", "label": "Вопросы 21–26. Выберите один вариант.", "questions": [{"no": 21, "q": "The finished chapter should be around", "options": ["A. 3,000 words", "B. 4,000 words", "C. 5,000 words"]}, {"no": 22, "q": "The main weakness of the draft is", "options": ["A. too many tables", "B. too few examples", "C. too many direct quotations"]}, {"no": 23, "q": "Most references should come from the last", "options": ["A. ten years", "B. five years", "C. twenty years"]}, {"no": 24, "q": "Marcus has trouble accessing", "options": ["A. lab equipment", "B. survey data", "C. a key journal"]}, {"no": 25, "q": "The supervisor advises organising the review by", "options": ["A. date", "B. theme", "C. author"]}, {"no": 26, "q": "The revised draft is due", "options": ["A. by the end of term", "B. next Friday", "C. in three days"]}]}, {"kind": "gap", "label": "Вопросы 27–30. Дополните ОДНИМ словом из записи.", "questions": [{"no": 27, "q": "Marcus should use reference ______ software."}, {"no": 28, "q": "The library offers an interlibrary ______ service."}, {"no": 29, "q": "The review should end by highlighting the research ______."}, {"no": 30, "q": "The next meeting is in three ______."}]}]}, {"title": "Part 4 · Лекция: история мороженого (монолог)", "intro": "Фрагмент лекции по истории еды. Вопросы 31–40: дополните конспект ОДНИМ словом или числом.", "voices": ["A"], "script": "A: Ice cream feels like a modern pleasure, but its story is surprisingly long. In ancient China, over two thousand years ago, cooks prepared a frozen mixture of milk and rice, packed in snow to set. The Romans loved frozen desserts too: the emperor Nero famously sent runners into the mountains to collect snow, which was then flavoured with fruit and honey and served at his banquets. The idea of a truly creamy frozen dessert developed much later, and it reached France from Italy — Italian cooks at the French court guarded their recipes jealously. Ordinary people finally got a taste in Paris, where a fashionable café began selling ice cream to the public in sixteen eighty-six; the queue, we are told, stretched down the street. For centuries, making ice cream meant hours of stirring by hand in a bucket of ice and salt. That changed in eighteen forty-three, when the American inventor Nancy Johnson patented a hand-cranked freezer, which cut the work to minutes and brought ice cream into ordinary homes. The cone has its own legend: at the world's fair of nineteen oh four, in the city of St Louis, an ice-cream seller ran out of dishes, and a waffle seller next door rolled his waffles into cones to help. The partnership stuck, and the cone conquered the world. And today? The country that eats the most ice cream per person is New Zealand — around twenty litres per head, every single year.", "groups": [{"kind": "gap", "label": "Вопросы 31–40. Дополните конспект ОДНИМ словом или числом из записи.", "questions": [{"no": 31, "q": "In ancient China cooks froze a mixture of milk and ______."}, {"no": 32, "q": "Emperor Nero sent runners to collect ______ from the mountains."}, {"no": 33, "q": "It was flavoured with fruit and ______."}, {"no": 34, "q": "Creamy ice cream reached France from ______."}, {"no": 35, "q": "A Paris café began selling ice cream to the public in ______."}, {"no": 36, "q": "In 1843 Nancy Johnson patented a hand-cranked ______."}, {"no": 37, "q": "The cone became famous at the world's fair of ______."}, {"no": 38, "q": "The fair took place in the city of St ______."}, {"no": 39, "q": "The ice-cream seller had run out of ______."}, {"no": 40, "q": "The country eating the most ice cream per person is New ______."}]}]}]}, "answers": {"1": {"a": ["Fletcher"], "why": "Он диктует по буквам: «Fletcher — F-L-E-T-C-H-E-R»."}, "2": {"a": ["beginners", "beginner"], "why": "«Our beginners course is exactly right for you» — он полный новичок."}, "3": {"a": ["3", "3rd", "third"], "why": "«Starts on the third of September»."}, "4": {"a": ["Wednesday"], "why": "«It's on Wednesday evenings»."}, "5": {"a": ["6:30", "6.30", "630"], "why": "Half past six = 6:30; администратор уточняет «that's six thirty»."}, "6": {"a": ["8", "eight"], "why": "«It runs for eight weeks in total»."}, "7": {"a": ["120"], "why": "«One hundred and twenty pounds... includes all the clay and the firing»."}, "8": {"a": ["shirt"], "why": "«Just an old shirt to protect your clothes»."}, "9": {"a": ["basement"], "why": "«The studio is in the basement — take the stairs at the back»."}, "10": {"a": ["Monday"], "why": "«Places are limited, so please pay by Monday»."}, "11": {"a": ["C"], "why": "«Please be here by nine o'clock»."}, "12": {"a": ["A"], "why": "«You're entitled to a free lunch in the staff canteen»."}, "13": {"a": ["B"], "why": "«Please wear your own dark trousers and comfortable closed shoes»."}, "14": {"a": ["A"], "why": "«Never feed any animal unless a keeper asks you to»."}, "15": {"a": ["C"], "why": "«Contact the office using the radio»."}, "16": {"a": ["A"], "why": "Sarah — «helping at the monkey house»."}, "17": {"a": ["B"], "why": "David — «in the reptile house, cleaning the glass»."}, "18": {"a": ["C"], "why": "Amina — «in the bird garden, topping up the feeders»."}, "19": {"a": ["D"], "why": "Carlos — «in the gift shop this morning»."}, "20": {"a": ["E"], "why": "Ruth — «will shadow our guides on the guided tours»."}, "21": {"a": ["B"], "why": "«The finished chapter should be around four thousand words»."}, "22": {"a": ["C"], "why": "«Too many direct quotations. Whole paragraphs are other people's words»."}, "23": {"a": ["A"], "why": "«Most references should come from the last ten years»."}, "24": {"a": ["C"], "why": "«One key journal is behind a paywall»."}, "25": {"a": ["B"], "why": "«Organise it by theme instead... not by their dates»."}, "26": {"a": ["A"], "why": "«Revised draft by the end of term»."}, "27": {"a": ["management"], "why": "«Should I be using reference management software? — Absolutely»."}, "28": {"a": ["loan"], "why": "«The library offers an interlibrary loan service»."}, "29": {"a": ["gap"], "why": "«A good review should highlight the research gap»."}, "30": {"a": ["weeks"], "why": "«Let's meet again in three weeks»."}, "31": {"a": ["rice"], "why": "«A frozen mixture of milk and rice, packed in snow»."}, "32": {"a": ["snow"], "why": "«Sent runners into the mountains to collect snow»."}, "33": {"a": ["honey"], "why": "«Flavoured with fruit and honey»."}, "34": {"a": ["Italy"], "why": "«It reached France from Italy»."}, "35": {"a": ["1686"], "why": "«Selling ice cream to the public in sixteen eighty-six»."}, "36": {"a": ["freezer"], "why": "«Nancy Johnson patented a hand-cranked freezer»."}, "37": {"a": ["1904"], "why": "«At the world's fair of nineteen oh four»."}, "38": {"a": ["Louis"], "why": "«In the city of St Louis»."}, "39": {"a": ["dishes"], "why": "«An ice-cream seller ran out of dishes»."}, "40": {"a": ["Zealand"], "why": "«The most ice cream per person is New Zealand»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "listening-10", "title": "Listening · Вариант 10", "minutes": 30, "parts": [{"title": "Part 1 · Перенос брони в отеле (диалог)", "intro": "Гостья звонит в отель, чтобы изменить бронирование. Вопросы 1–10: дополните заметки ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Good morning, Harbour View Hotel, Chloe speaking. How can I help?\nB: Hello. I have a reservation with you, but I need to change some details, please.\nA: Of course. Could I take your surname?\nB: It's Whitfield — W-H-I-T-F-I-E-L-D.\nA: Thank you. And do you have your booking reference?\nB: Yes, it's three eight two.\nA: Found it — arriving Tuesday, staying in a double room. What would you like to change?\nB: The dates, first of all. Could we arrive on Thursday instead of Tuesday?\nA: Thursday is fine. Still four nights?\nB: Yes, four nights, exactly as before. And one more thing — my sister is coming instead of my husband, so could we have a twin room rather than a double?\nA: No problem, a twin room it is. Any preference for the view?\nB: If possible, something quiet, facing the garden rather than the street.\nA: I'll note that. Would you like to add breakfast? It's nine pounds per person per day.\nB: Yes, please, for both of us. Oh — and we're coming by car. Is there parking?\nA: Yes, we have an underground car park; I'll reserve a space for you.\nB: Wonderful. Is there a charge for making these changes?\nA: None at all, as long as you tell us more than forty-eight hours in advance — which you have.\nB: Perfect. Could you confirm everything in writing?\nA: Certainly, I'll send the new confirmation by email within the hour.\nB: Thank you so much. Goodbye!", "groups": [{"kind": "gap", "label": "Вопросы 1–10. Дополните заметки ОДНИМ словом или числом из записи.", "questions": [{"no": 1, "q": "Surname: ______"}, {"no": 2, "q": "Booking reference: ______"}, {"no": 3, "q": "New arrival day: ______"}, {"no": 4, "q": "Number of nights: ______"}, {"no": 5, "q": "New room type: ______"}, {"no": 6, "q": "Room preference: facing the ______"}, {"no": 7, "q": "Breakfast: £______ per person per day"}, {"no": 8, "q": "Parking: a space in the ______ car park"}, {"no": 9, "q": "Changes are free if made more than ______ hours in advance"}, {"no": 10, "q": "Confirmation will be sent by ______"}]}]}, {"title": "Part 2 · Открытие фермерского рынка (монолог)", "intro": "Организатор объявляет об открытии рынка. Вопросы 11–15: выберите ответ. Вопросы 16–20: соотнесите продавца с товаром.", "voices": ["A"], "script": "A: Good morning! I'm delighted to announce that after two years of planning, our town is finally getting its own farmers' market. The market will be held every Saturday morning, from eight until one o'clock, and the location is the old cattle yard behind the town hall — we've cleaned it up beautifully, and there's plenty of space under cover if it rains. Now for a special offer: during the first month, every visitor receives a free coffee from the van by the gate — our way of saying welcome. One rule we're proud of: single-use plastic bags are banned at the market, so please bring your own bag or basket. Let me introduce some of our stallholders. Rachel grows wonderful vegetables on her farm just outside town. Martin keeps bees and will be selling honey. Mrs Hale makes prize-winning cheese from her own goats' milk. Sofia will brighten the yard with fresh flowers from her garden. And Ben is our baker — his stall will be piled with bread and pastries. If you'd like a stall yourself, don't phone the council — simply visit the market office next to the entrance, and we'll talk you through it. See you on Saturday!", "groups": [{"kind": "mc", "label": "Вопросы 11–15. Выберите один вариант.", "questions": [{"no": 11, "q": "The new market will be held", "options": ["A. every Saturday morning", "B. every Sunday morning", "C. once a month"]}, {"no": 12, "q": "The market is located in", "options": ["A. the station square", "B. the old cattle yard", "C. the riverside park"]}, {"no": 13, "q": "During the first month every visitor receives", "options": ["A. a cloth bag", "B. a discount voucher", "C. a free coffee"]}, {"no": 14, "q": "Which items are banned at the market?", "options": ["A. dogs", "B. single-use plastic bags", "C. bicycles"]}, {"no": 15, "q": "To apply for a stall, you should", "options": ["A. phone the council", "B. fill in an online form", "C. visit the market office"]}]}, {"kind": "match", "label": "Вопросы 16–20. Кто что продаёт? A — сыр, B — хлеб и выпечка, C — мёд, D — овощи, E — цветы.", "options": ["A", "B", "C", "D", "E"], "questions": [{"no": 16, "q": "Rachel"}, {"no": 17, "q": "Martin"}, {"no": 18, "q": "Mrs Hale"}, {"no": 19, "q": "Sofia"}, {"no": 20, "q": "Ben"}]}]}, {"title": "Part 3 · Студенты-инженеры и модель моста (диалог)", "intro": "Эмма и Радж обсуждают модель моста с преподавателем. Вопросы 21–26: выберите ответ. Вопросы 27–30: соотнесите задачу с исполнителем.", "voices": ["A", "B", "C"], "script": "A: So, Emma, Raj — how is the bridge model coming along?\nB: We had a slow start, Dr Fisher. Our first design looked fine on paper, but when we built a quick prototype, it kept bending in the middle.\nA: A classic problem. What did you change?\nC: We added a proper arch to carry the load, and we switched materials. We're using balsa wood now — it's very light, so the structure isn't fighting its own weight.\nA: Good. And how will you test the final model?\nB: By adding weights gradually — small bags of sand, one at a time, until we reach the target load.\nA: Sensible. One warning from experience: in models like this the weakest part is almost never the beams — it's the joints. Use glue rather than pins, and let every joint dry overnight.\nC: We'll do that.\nA: Now, about the written report. Whatever else you include, I want photographs of each stage of construction — examiners love to see the process, not just the result.\nB: We've been taking pictures already. In fact, I'm keeping a photo diary of the whole project.\nA: Excellent, Emma. Raj, what's your job this week?\nC: I'm building the deck — the arch is finished.\nA: Good. And send me your calculations by email — I'll check them myself before you test anything. One last thing: book the testing rig now. It gets very busy at the end of term.\nC: I'll reserve it today.\nA: And the presentation?\nB: We'll give the presentation together — half each.\nA: Perfect. See you both next week.", "groups": [{"kind": "mc", "label": "Вопросы 21–26. Выберите один вариант.", "questions": [{"no": 21, "q": "The students' first design", "options": ["A. was too expensive", "B. was too heavy", "C. kept bending in the middle"]}, {"no": 22, "q": "They chose balsa wood because it is", "options": ["A. cheap", "B. light", "C. strong"]}, {"no": 23, "q": "The model will be tested by", "options": ["A. adding weights gradually", "B. a computer program", "C. dropping it from a height"]}, {"no": 24, "q": "The tutor says the weakest part of such models is usually", "options": ["A. the deck", "B. the beams", "C. the joints"]}, {"no": 25, "q": "The written report must include", "options": ["A. photographs of each stage", "B. a cost calculation", "C. interviews with engineers"]}, {"no": 26, "q": "Before testing, the students must", "options": ["A. paint the model", "B. book the testing rig", "C. buy more wood"]}]}, {"kind": "match", "label": "Вопросы 27–30. Кто за что отвечает? A — Эмма, B — Радж, C — оба студента, D — преподаватель.", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "Checking the calculations"}, {"no": 28, "q": "Building the deck"}, {"no": 29, "q": "Keeping the photo diary"}, {"no": 30, "q": "Giving the presentation"}]}]}, {"title": "Part 4 · Лекция: Шёлковый путь (монолог)", "intro": "Фрагмент лекции по истории торговли. Вопросы 31–40: дополните конспект ОДНИМ словом или числом.", "voices": ["A"], "script": "A: Today we turn to one of history's great trade networks — the Silk Road. Interestingly, the name is quite modern: it was coined by a German geographer, Ferdinand von Richthofen, in eighteen seventy-seven. The route earned its name from Chinese silk, a fabric that was light and extremely valuable — perfect for long journeys. And the journeys were long indeed: a loaded camel caravan covered only about thirty kilometres a day, and few merchants ever travelled the whole way. Instead, goods changed hands again and again in oasis towns, where traders could rest and water their animals. The road carried far more than cloth. Religions such as Buddhism spread along it from India into China, and technologies moved too — most famously, the secret of making paper travelled slowly westwards. Sadly, the route also carried disease, including the plague, which reached Europe along these same paths. From the fifteenth century the network declined, because it became faster and cheaper to move goods by sea. Yet the story is not over. In twenty fourteen, UNESCO added long sections of the route to the World Heritage list, and today freight trains once again link China and Europe — a journey of about eighteen days instead of many months.", "groups": [{"kind": "gap", "label": "Вопросы 31–40. Дополните конспект ОДНИМ словом или числом из записи.", "questions": [{"no": 31, "q": "The name 'Silk Road' was coined by a German geographer in ______."}, {"no": 32, "q": "Silk was light and extremely ______."}, {"no": 33, "q": "A camel caravan covered about ______ kilometres a day."}, {"no": 34, "q": "Goods changed hands in ______ towns."}, {"no": 35, "q": "Religions such as ______ spread along the route."}, {"no": 36, "q": "The secret of making ______ travelled westwards."}, {"no": 37, "q": "The route also carried disease, including the ______."}, {"no": 38, "q": "From the 15th century it became cheaper to move goods by ______."}, {"no": 39, "q": "UNESCO listed sections of the route in ______.

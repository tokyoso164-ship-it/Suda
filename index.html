e anything» — модельный путь не тот совет, что кажется."}, "8": {"a": ["A"], "why": "«Image is powerful, but image is superficial» — сквозная мысль."}}}, {"slug": "robert_waldinger_what_makes_a_good_life_lessons_from_the_longest_study_on_happiness", "title": "What makes a good life? Lessons from the longest study on happiness", "speaker": "Robert Waldinger", "dur": "13 мин", "level": "B2", "blurb": "75 лет Гарвард следил за жизнью сотен людей. Ответ психиатра-руководителя исследования проще, чем кажется.", "questions": [{"no": 1, "kind": "gap", "q": "The Harvard study has tracked lives for ______ years."}, {"no": 2, "kind": "mc", "q": "What did most young people in a recent survey say their major life goal was?", "options": ["A. To get rich", "B. To plant trees", "C. To travel", "D. To retire early"]}, {"no": 3, "kind": "mc", "q": "The study followed two groups of men: Harvard students and", "options": ["A. boys from Boston's poorest neighbourhoods", "B. farmers", "C. soldiers only", "D. musicians"]}, {"no": 4, "kind": "mc", "q": "The clearest message from the study is:", "options": ["A. good relationships keep us happier and healthier", "B. money buys happiness", "C. fame protects health", "D. work harder, live longer"]}, {"no": 5, "kind": "mc", "q": "What does the study say about loneliness?", "options": ["A. It turns out to be toxic", "B. It is relaxing", "C. It only affects the old", "D. It improves focus"]}, {"no": 6, "kind": "mc", "q": "What mattered more than the number of friends?", "options": ["A. The quality of close relationships", "B. The size of the house", "C. The length of holidays", "D. The number of colleagues"]}, {"no": 7, "kind": "mc", "q": "What predicted healthy ageing at 80 better than cholesterol at 50?", "options": ["A. Satisfaction in relationships", "B. Salary", "C. Exercise records", "D. Diet"]}, {"no": 8, "kind": "gap", "q": "He ends with Mark Twain: 'There isn't time... for anything but to ______.'"}], "answers": {"1": {"a": ["75", "seventy-five"], "why": "На момент выступления исследованию 75 лет — рекорд длительности."}, "2": {"a": ["A"], "why": "Больше 80% миллениалов назвали главной целью богатство."}, "3": {"a": ["A"], "why": "Вторая группа — юноши из беднейших районов Бостона."}, "4": {"a": ["A"], "why": "«Good relationships keep us happier and healthier. Period.»"}, "5": {"a": ["A"], "why": "«Loneliness turns out to be toxic» — одиночество разрушает здоровье."}, "6": {"a": ["A"], "why": "Важно качество близких отношений, а не количество друзей."}, "7": {"a": ["A"], "why": "Удовлетворённость отношениями в 50 предсказывала здоровье в 80 лучше холестерина."}, "8": {"a": ["love"], "why": "«There isn't time, so brief is life, for anything but to love» (по Твену)."}}}, {"slug": "shawn_achor_the_happy_secret_to_better_work", "title": "The happy secret to better work", "speaker": "Shawn Achor", "dur": "12 мин", "level": "B2–C1", "blurb": "Самый смешной спикер подборки — скороговорка про позитивную психологию. Отличная тренировка быстрой речи на слух.", "questions": [{"no": 1, "kind": "mc", "q": "The talk opens with a childhood story about", "options": ["A. playing war with his sister Amy and turning her into a unicorn", "B. a school exam", "C. a family trip", "D. a lost dog"]}, {"no": 2, "kind": "mc", "q": "Why did young Shawn tell Amy she was a unicorn?", "options": ["A. To stop her crying and avoid waking their parents", "B. She asked him to", "C. It was her birthday", "D. He read it in a book"]}, {"no": 3, "kind": "mc", "q": "What does Achor say about the formula 'work harder → be more successful → be happier'?", "options": ["A. It is broken and backwards", "B. It works perfectly", "C. It applies only to students", "D. It was invented by him"]}, {"no": 4, "kind": "mc", "q": "Why does the 'success first' formula never work?", "options": ["A. Every success just moves the goalposts further", "B. People forget their goals", "C. Success is random", "D. Nobody works hard"]}, {"no": 5, "kind": "gap", "q": "A positive brain is 31 per cent more ______ than a negative, neutral or stressed brain."}, {"no": 6, "kind": "mc", "q": "What does he call this effect?", "options": ["A. The happiness advantage", "B. The unicorn effect", "C. The Harvard rule", "D. The gratitude gap"]}, {"no": 7, "kind": "gap", "q": "One exercise: write three new things you are grateful for, every day for ______ days."}, {"no": 8, "kind": "mc", "q": "Which activities does he list for rewiring the brain?", "options": ["A. Gratitude, journaling, exercise, meditation, random acts of kindness", "B. More coffee and less sleep", "C. Watching news", "D. Working weekends"]}], "answers": {"1": {"a": ["A"], "why": "История про сестру Эми, упавшую с кровати, и «ты не ушиблась — ты единорог»."}, "2": {"a": ["A"], "why": "Чтобы она не разбудила родителей плачем — и мозг Эми поверил в радость."}, "3": {"a": ["A"], "why": "Формула «успех → счастье» сломана: она работает в обратную сторону."}, "4": {"a": ["A"], "why": "Каждый успех сдвигает цель: сдал экзамен — теперь сдай следующий."}, "5": {"a": ["productive"], "why": "«Позитивный» мозг на 31% продуктивнее — happiness advantage."}, "6": {"a": ["A"], "why": "Он называет это «the happiness advantage»."}, "7": {"a": ["21", "twenty-one"], "why": "21 день по три благодарности — мозг начинает сканировать мир на позитив."}, "8": {"a": ["A"], "why": "Благодарности, дневник, спорт, медитация, случайные добрые дела."}}}, {"slug": "angela_lee_duckworth_grit_the_power_of_passion_and_perseverance", "title": "Grit: the power of passion and perseverance", "speaker": "Angela Lee Duckworth", "dur": "6 мин", "level": "B1–B2", "blurb": "Короткое и мотивирующее: что лучше таланта предсказывает успех. Простая лексика, medium скорость — хорошо для среднего уровня.", "questions": [{"no": 1, "kind": "mc", "q": "What was Duckworth's job before she became a psychologist?", "options": ["A. A maths teacher in New York public schools", "B. A lawyer", "C. A doctor", "D. A journalist"]}, {"no": 2, "kind": "mc", "q": "What did she notice about her strongest students?", "options": ["A. They were not always the ones with the highest IQ", "B. They all had the highest IQ", "C. They never did homework", "D. They were the oldest"]}, {"no": 3, "kind": "mc", "q": "Where did she study who would survive tough training?", "options": ["A. West Point military academy", "B. A cooking school", "C. An airport", "D. A hospital"]}, {"no": 4, "kind": "gap", "q": "In all her studies, one characteristic predicted success: ______."}, {"no": 5, "kind": "mc", "q": "How does she define this quality?", "options": ["A. Passion and perseverance for very long-term goals", "B. Talent plus luck", "C. High test scores", "D. Strong muscles"]}, {"no": 6, "kind": "mc", "q": "She says living life like a marathon, not a sprint, means", "options": ["A. sticking with your future day after day, for years", "B. running every morning", "C. avoiding rest", "D. working alone"]}, {"no": 7, "kind": "mc", "q": "What is the best idea she has heard for building grit in kids?", "options": ["A. Growth mindset, studied by Carol Dweck", "B. More exams", "C. Cash rewards", "D. Longer lessons"]}, {"no": 8, "kind": "mc", "q": "What honest admission does she make at the end?", "options": ["A. Science still knows little about how to build grit", "B. Grit cannot exist", "C. Talent is everything", "D. Kids cannot learn"]}], "answers": {"1": {"a": ["A"], "why": "Она ушла из консалтинга преподавать математику семиклассникам в Нью-Йорке."}, "2": {"a": ["A"], "why": "Лучшие результаты показывали не обязательно самые «умные по IQ» дети."}, "3": {"a": ["A"], "why": "Вест-Пойнт: кто выдержит «Beast Barracks» — предсказывал не талант, а grit."}, "4": {"a": ["grit"], "why": "Во всех исследованиях успех предсказывала «грит» — стойкость."}, "5": {"a": ["A"], "why": "«Grit is passion and perseverance for very long-term goals»."}, "6": {"a": ["A"], "why": "«Grit is living life like it's a marathon, not a sprint»."}, "7": {"a": ["A"], "why": "Growth mindset Кэрол Двек: способность к обучению не фиксирована."}, "8": {"a": ["A"], "why": "Она честно признаёт: наука пока мало знает, как растить grit."}}}, {"slug": "simon_sinek_how_great_leaders_inspire_action", "title": "How great leaders inspire action", "speaker": "Simon Sinek", "dur": "18 мин", "level": "B2–C1", "blurb": "«Золотой круг» и «люди покупают не ЧТО вы делаете, а ПОЧЕМУ»: классика для эссе про лидерство и бизнес.", "questions": [{"no": 1, "kind": "mc", "q": "What does Sinek call his model?", "options": ["A. The golden circle", "B. The silver line", "C. The iron triangle", "D. The why-wheel"]}, {"no": 2, "kind": "mc", "q": "What are the three levels of the model, from outside in?", "options": ["A. What → How → Why", "B. Why → What → How", "C. Who → Where → When", "D. Plan → Do → Check"]}, {"no": 3, "kind": "gap", "q": "His key phrase: 'People don't buy what you do; they buy ______ you do it.'"}, {"no": 4, "kind": "mc", "q": "Which company is his main positive example?", "options": ["A. Apple", "B. Dell", "C. TiVo", "D. Kodak"]}, {"no": 5, "kind": "mc", "q": "Who does he contrast with Samuel Pierpont Langley?", "options": ["A. The Wright brothers", "B. Thomas Edison", "C. Henry Ford", "D. Isaac Newton"]}, {"no": 6, "kind": "mc", "q": "Why did the Wright brothers win the race to flight, in Sinek's telling?", "options": ["A. They were driven by a cause, not by fame or money", "B. They had more funding", "C. They had better degrees", "D. They worked for the government"]}, {"no": 7, "kind": "mc", "q": "Which speech does he use as an example of leading with 'why'?", "options": ["A. Martin Luther King's 'I have a dream'", "B. A company earnings call", "C. A graduation speech", "D. A political debate"]}, {"no": 8, "kind": "mc", "q": "King attracted the crowd, Sinek says, because people came", "options": ["A. for themselves and what they believed", "B. for him personally", "C. for the weather", "D. because it was a holiday"]}], "answers": {"1": {"a": ["A"], "why": "The golden circle: Why — How — What."}, "2": {"a": ["A"], "why": "Снаружи внутрь: What → How → Why; великие лидеры идут изнутри."}, "3": {"a": ["why"], "why": "«People don't buy what you do; they buy why you do it» — рефрен выступления."}, "4": {"a": ["A"], "why": "Apple продаёт «think different» — «почему», а не просто компьютеры."}, "5": {"a": ["A"], "why": "Лэнгли с деньгами и прессой против братьев Райт с мечтой."}, "6": {"a": ["A"], "why": "Командой Райтов двигала вера, что полёт изменит мир."}, "7": {"a": ["A"], "why": "«I have a dream» — а не «I have a plan»."}, "8": {"a": ["A"], "why": "250 тысяч пришли не ради Кинга, а ради того, во что верили сами."}}}];
const INTERVIEW_SETS = [[["Part 1", "Let's talk about your home town. Where is it, and what do you like about living there?"], ["Part 1", "Do you work or are you a student? What do you enjoy most about it?"], ["Part 1", "How do you usually spend your weekends?"], ["Part 2", "Describe a place you have visited that impressed you. You should say: where it is, when you went there, what you did there — and explain why it impressed you. Speak for 1–2 minutes."], ["Part 3", "Why do you think people enjoy travelling to new places?"], ["Part 3", "How has tourism changed in your country over the last few decades?"]], [["Part 1", "Let's talk about studying. What subject do you enjoy most, and why?"], ["Part 1", "Do you prefer studying in the morning or in the evening?"], ["Part 1", "How often do you use a computer or phone for learning?"], ["Part 2", "Describe a piece of technology that has changed the way you study or work. You should say: what it is, when you started using it, how you use it — and explain why it is important to you. Speak for 1–2 minutes."], ["Part 3", "Do you think technology makes learning easier or just more distracting?"], ["Part 3", "How might classrooms change in the next twenty years?"]], [["Part 1", "Let's talk about food. What kind of food do you usually eat during the week?"], ["Part 1", "Do you prefer eating at home or eating out? Why?"], ["Part 1", "Is there any food you disliked as a child but enjoy now?"], ["Part 2", "Describe a traditional dish from your country. You should say: what it is, how it is made, when people usually eat it — and explain why you think it is popular. Speak for 1–2 minutes."], ["Part 3", "Why do you think traditional dishes are important to a culture?"], ["Part 3", "How have people's eating habits changed compared with your grandparents' time?"]], [["Part 1", "Let's talk about work. Would you prefer to work for a big company or a small one? Why?"], ["Part 1", "What did you want to be when you were a child?"], ["Part 1", "Is there a job you would never want to do?"], ["Part 2", "Describe a person whose job you admire. You should say: who they are, what they do, how you know about their work — and explain why you admire it. Speak for 1–2 minutes."], ["Part 3", "Do you think people will change careers more often in the future? Why?"], ["Part 3", "Should salary be the most important factor when choosing a job?"]], [["Part 1", "Let's talk about sport. Do you do any sport or exercise regularly?"], ["Part 1", "Did you enjoy PE lessons at school? Why or why not?"], ["Part 1", "Do you prefer watching sport or playing it?"], ["Part 2", "Describe a healthy habit you have or would like to have. You should say: what it is, when you started or plan to start, how it affects your life — and explain why it matters to you. Speak for 1–2 minutes."], ["Part 3", "Why do many people find it hard to exercise regularly?"], ["Part 3", "Should governments do more to encourage healthy lifestyles?"]], [["Part 1", "Let's talk about music. What kind of music do you usually listen to?"], ["Part 1", "Did you learn to play a musical instrument at school?"], ["Part 1", "Do you ever listen to music while studying?"], ["Part 2", "Describe a song or a piece of music that means a lot to you. You should say: what it is, when you first heard it, what it reminds you of — and explain why it is special. Speak for 1–2 minutes."], ["Part 3", "How has the way people listen to music changed in recent decades?"], ["Part 3", "Do you think live concerts will remain popular in the age of streaming?"]], [["Part 1", "Let's talk about reading. What was the last book you read?"], ["Part 1", "Do you prefer paper books or e-books? Why?"], ["Part 1", "Did your parents read to you when you were little?"], ["Part 2", "Describe a book that influenced you. You should say: what it is about, when you read it, why you chose it — and explain how it influenced you. Speak for 1–2 minutes."], ["Part 3", "Why do some people say young people read less than before? Do you agree?"], ["Part 3", "Can films ever replace the books they are based on?"]], [["Part 1", "Let's talk about the weather. What's your favourite season, and why?"], ["Part 1", "Does the weather affect your mood?"], ["Part 1", "What do you usually do on very cold or very hot days?"], ["Part 2", "Describe a memorable day when the weather changed your plans. You should say: when it was, what you had planned, what happened instead — and explain why you remember it. Speak for 1–2 minutes."], ["Part 3", "How does climate influence the way people live in different countries?"], ["Part 3", "Are people in your country worried about climate change?"]], [["Part 1", "Let's talk about your family. Who are you closest to in your family?"], ["Part 1", "Do you look like anyone in your family?"], ["Part 1", "How often do you meet your friends?"], ["Part 2", "Describe a friend who is important to you. You should say: how you met, what you do together, what makes them a good friend — and explain why this friendship matters. Speak for 1–2 minutes."], ["Part 3", "Is it easier to make friends online or in person? Why?"], ["Part 3", "How do friendships change as people get older?"]], [["Part 1", "Let's talk about shopping. Do you enjoy shopping, or is it a chore for you?"], ["Part 1", "Do you prefer shopping online or in real shops?"], ["Part 1", "Have you ever bought something you never used?"], ["Part 2", "Describe something you saved money to buy. You should say: what it was, how long you saved, how you felt when you bought it — and explain whether it was worth it. Speak for 1–2 minutes."], ["Part 3", "Why do people sometimes buy things they don't need?"], ["Part 3", "Should schools teach children how to manage money?"]], [["Part 1", "Let's talk about your city. How do you usually get around your city?"], ["Part 1", "Is public transport good where you live?"], ["Part 1", "Do you like walking around your neighbourhood?"], ["Part 2", "Describe a place in your city you like visiting. You should say: where it is, how often you go there, what you do there — and explain why you like it. Speak for 1–2 minutes."], ["Part 3", "Should city centres be closed to private cars? Why or why not?"], ["Part 3", "How will transport in cities change over the next twenty years?"]], [["Part 1", "Let's talk about the internet. How much time do you spend online every day?"], ["Part 1", "What do you mainly use social media for?"], ["Part 1", "Have you ever tried to spend less time on your phone?"], ["Part 2", "Describe a website or an app you use a lot. You should say: what it is, how you found it, what you use it for — and explain why it is useful to you. Speak for 1–2 minutes."], ["Part 3", "Do social networks bring people closer together or push them apart?"], ["Part 3", "Should there be an age limit for social media? Why?"]], [["Part 1", "Let's talk about celebrations. What is your favourite holiday of the year?"], ["Part 1", "How does your family usually celebrate birthdays?"], ["Part 1", "Do you prefer giving presents or receiving them?"], ["Part 2", "Describe a celebration you will always remember. You should say: what the occasion was, who was there, what happened — and explain why it was memorable. Speak for 1–2 minutes."], ["Part 3", "Why are traditional festivals important for a country?"], ["Part 3", "Do you think celebrations have become too commercial?"]], [["Part 1", "Let's talk about nature. Do you spend much time outdoors?"], ["Part 1", "Are there parks or green spaces near your home?"], ["Part 1", "Do you recycle at home?"], ["Part 2", "Describe a beautiful natural place you have visited. You should say: where it is, when you went there, what you saw and did — and explain why you found it beautiful. Speak for 1–2 minutes."], ["Part 3", "What can ordinary people do to protect the environment?"], ["Part 3", "Who should take more responsibility for the environment: individuals, companies or governments?"]], [["Part 1", "Let's talk about films. How often do you watch films or series?"], ["Part 1", "Do you prefer watching films at home or at the cinema?"], ["Part 1", "What kind of films do you usually avoid?"], ["Part 2", "Describe a film or series you would recommend to a friend. You should say: what it is about, when you watched it, who you would recommend it to — and explain why it is worth watching. Speak for 1–2 minutes."], ["Part 3", "Why do people enjoy watching films from other countries?"], ["Part 3", "Do streaming services change the kind of films that get made?"]]];
const ARTICLES = [{"slug": "foundation-year", "cat": "uk", "title": "Foundation Year: мост из российской школы в британский вуз", "teaser": "Почему с аттестатом РФ почти всегда идут через подготовительный год, как он устроен и во сколько обходится.", "min": 6, "body": "\n<p>Российский (и казахстанский) школьный аттестат — это 11 лет учёбы, а британские\nуниверситеты принимают на бакалавриат после 13: два последних года школьники сдают\nA-levels. Разницу закрывает <b>Foundation Year</b> — подготовительный год при\nуниверситете или его партнёрском колледже.</p>\n<h3>Как устроен год</h3>\n<p>Три составляющие: академические модули по выбранному направлению (например,\nBusiness, Engineering, Science), академический английский (эссе, конспекты,\nпрезентации) и учебные навыки. Успешно закончили — переходите на первый курс\nэтого же вуза, чаще всего без нового UCAS-цикла.</p>\n<h3>Что нужно для поступления</h3>\n<ul>\n<li>Аттестат со средним баллом обычно от 3.5–4.5 в зависимости от вуза;</li>\n<li>IELTS от 4.5–5.5 (для визы — UKVI Academic);</li>\n<li>мотивационное письмо на 300–500 слов — напрямую в вуз, не через UCAS.</li>\n</ul>\n<h3>Сколько стоит</h3>\n<p>£15–28 тыс. за учебный год в зависимости от вуза и города, плюс жильё и жизнь.\nЗаявки принимаются круглый год, но сильные программы заполняются к весне.</p>\n<p>Проверить, куда реально пройти с вашим баллом, можно в диагностике — подборка\nпоявится на странице «План».</p>\n", "cta": "Проверить письмо для Foundation", "go": "motivation"}, {"slug": "russell-group", "cat": "uk", "title": "Что такое Russell Group и стоит ли за ней гнаться", "teaser": "24 исследовательских университета, вокруг которых строится весь разговор о «престиже». Когда это важно, а когда — нет.", "min": 5, "body": "\n<p><b>Russell Group</b> — ассоциация 24 исследовательских университетов: Оксфорд,\nКембридж, UCL, Манчестер, Лидс, Глазго и другие. На них приходится большая часть\nисследовательского бюджета страны, и работодатели в консервативных сферах\n(право, финансы, консалтинг) смотрят на этот «лейбл» тепло.</p>\n<h3>Когда Russell Group важна</h3>\n<ul>\n<li>Планируете карьеру в корпоративном праве, инвестбанкинге, Big-4;</li>\n<li>целитесь в магистратуру мирового топа — бренд бакалавриата помогает;</li>\n<li>важна научная среда: лаборатории, гранты, преподаватели-исследователи.</li>\n</ul>\n<h3>Когда можно не гнаться</h3>\n<p>В IT, дизайне, гостеприимстве и стартапах портфолио и стажировки весят больше\nтаблички на входе. Скажем, по game design лидируют вовсе не расселловские вузы.\nА ещё вне группы часто мягче требования Foundation и ниже цена года.</p>\n<p>Честный вывод: выбирайте программу и город под свои цели и бюджет, а «группу» —\nкак бонус, а не как самоцель.</p>\n", "cta": "", "go": "home"}, {"slug": "uni-cities", "cat": "uk", "title": "Лондон, Манчестер или кампус у моря: как город меняет учёбу", "teaser": "Бюджет, темп жизни и шансы на подработку сильно зависят от города — разбираем на примерах.", "min": 5, "body": "\n<p>Один и тот же курс в Лондоне и в Ньюкасле — это два разных студенческих опыта\nи два разных бюджета.</p>\n<h3>Лондон</h3>\n<p>Максимум стажировок, событий и нетворкинга — и максимум расходов: жильё\n£800–1400 в месяц, транспорт съедает заметную долю бюджета. Для визы придётся\nпоказывать больше средств: требования к «сумме на жизнь» в Лондоне выше.</p>\n<h3>Большие студенческие города</h3>\n<p>Манчестер, Лидс, Бирмингем, Глазго: жильё £500–800, вся жизнь вращается вокруг\nуниверситетов, подработку найти реально. Хороший баланс цены и возможностей.</p>\n<h3>Кампусные и приморские</h3>\n<p>Ланкастер, Эксетер, Брайтон: компактно, безопасно, всё в шаговой доступности —\nидеально для первого года вдали от дома. Меньше суеты, но и меньше корпоративных\nсобытий — до них придётся ездить.</p>\n<p>Правило простое: чем дороже город, тем важнее заранее посчитать полный бюджет\nгода, а не только tuition fee.</p>\n", "cta": "", "go": "home"}, {"slug": "my-path", "cat": "ours", "title": "Как я поступил в UK из России: цифры, дедлайны и фейлы", "teaser": "История куратора thames от первого лица: без агентства, с IELTS в Казахстане и визой со второй попытки нервов.", "min": 7, "body": "\n<p>Меня зовут куратор thames, и весь этот сервис — мой задокументированный маршрут.\nКоротко о том, как выглядел путь на самом деле.</p>\n<h3>Цифры</h3>\n<ul>\n<li>7 месяцев от решения до оффера;</li>\n<li>IELTS сдавал в Алматы — слоты разобрали за месяц, брал оставшийся;</li>\n<li>агентства просили 200–500 тысяч рублей — прошёл сам, дорога и экзамен обошлись дешевле;</li>\n<li>3 черновика заявления улетели в корзину, четвёртый стал оффером.</li>\n</ul>\n<h3>Главные фейлы</h3>\n<p>Первый: тянул с бронированием IELTS — в итоге летел в другой город. Второй:\nв первом черновике письма рассказывал биографию вместо ответа «зачем мне этот курс».\nТретий: не знал про правило 28 дней для визовых финансов и чуть не подал выписку,\nкоторой не хватало недели.</p>\n<h3>Что из этого стало продуктом</h3>\n<p>Каждый фейл — теперь шаг в вашем плане с дедлайном и напоминанием: запись на\nIELTS за месяцы, проверка письма до подачи, финансовый чек-лист до открытия визы.\nУчитесь на моих ошибках — это дешевле.</p>\n", "cta": "Собрать мой план", "go": "ob"}, {"slug": "cost-of-uk", "cat": "ours", "title": "Сколько на самом деле стоит год в Британии", "teaser": "Tuition — только половина правды. Считаем полный бюджет: жильё, виза, IHS, перелёты и «мелочи», о которых забывают.", "min": 6, "body": "\n<p>В буклетах пишут стоимость обучения, но семейный бюджет ломают обычно остальные\nстроки. Считаем год Foundation вне Лондона, по средним значениям.</p>\n<h3>Большие статьи</h3>\n<ul>\n<li>Обучение: £15–28 тыс.;</li>\n<li>жильё: £6–9 тыс. за учебный год (студенческая резиденция);</li>\n<li>еда и быт: £3–4 тыс.;</li>\n<li>виза + IHS (медицинский сбор): виза ~£500 и IHS ~£800 за год — платятся сразу;</li>\n<li>перелёты и дорога: £600–1200 на два конца с багажом.</li>\n</ul>\n<h3>О чём забывают</h3>\n<p>Депозит за жильё, гарант или предоплата семестра, UKVI-версия IELTS дороже\nобычной, поездка в другую страну ради экзамена, зимняя одежда, первый набор посуды\nи постели. Закладывайте резерв 10–15% сверху.</p>\n<h3>Как показать деньги для визы</h3>\n<p>Средства должны непрерывно лежать на счёте 28 дней, а выписка — быть не старше\n31 дня на момент подачи. Подробности и типичные ошибки разберёт куратор.\n<i>Сервис не гарантирует визу и не является юридической консультацией — решения\nпринимают визовые органы.</i></p>\n", "cta": "Спросить ассистента про финансы", "go": "chat"}, {"slug": "ielts-8-weeks", "cat": "guides", "title": "План подготовки к IELTS за 8 недель", "teaser": "Реалистичный график с нашими тренажёрами: от диагностического мока до недели перед экзаменом.", "min": 8, "body": "\n<p>Восемь недель — честный срок, чтобы поднять балл на 0.5–1.0 при регулярных\nзанятиях. План рассчитан на 6–8 часов в неделю.</p>\n<h3>Недели 1–2 · диагностика и база</h3>\n<p>Пройдите полный Mock IELTS, зафиксируйте band по каждой секции. Дальше — по\n30–40 минут в день: Reading на время, подкасты для уха, дневник новых слов.</p>\n<h3>Недели 3–4 · Writing</h3>\n<p>Два эссе в неделю в тренажёре с таймером. Разбирайте правки «было → стало»\nи переписывайте те же темы — прогресс виден на второй итерации. Отдельно\nвыучите структуры Task 1: графики, таблицы, процессы.</p>\n<h3>Недели 5–6 · Speaking и Listening</h3>\n<p>Mock-интервью 3 раза в неделю: записывайте себя, слушайте паузы и повторы.\nВ Listening тренируйте части 3–4 — именно там теряются баллы.</p>\n<h3>Недели 7–8 · экзаменационный режим</h3>\n<p>Два полных мока в неделю в реальном тайминге, без пауз. Последние три дня —\nтолько повторение слов и сон: свежая голова даёт больше, чем зубрёжка ночью.</p>\n<p>Помните: в России IELTS не проводится с 2022 года — бронируйте слот в Казахстане,\nАрмении или Грузии за 4–6 недель, в пик сезона раньше.</p>\n", "cta": "Пройти Mock IELTS", "go": "ielts"}, {"slug": "ucas-three-questions", "cat": "guides", "title": "Три вопроса UCAS: что изменилось и как отвечать", "teaser": "Personal statement умер — теперь три конкретных вопроса и общий лимит 4000 символов. Структура ответа на каждый.", "min": 6, "body": "\n<p>С цикла 2026 года вместо сплошного personal statement UCAS спрашивает три вещи:</p>\n<ol>\n<li><b>Why do you want to study this course or subject?</b> — мотивация;</li>\n<li><b>How have your qualifications and studies helped you to prepare?</b> — учёба;</li>\n<li><b>What else have you done to prepare outside of education?</b> — опыт вне школы.</li>\n</ol>\n<h3>Рабочая формула ответа</h3>\n<p>Каждый ответ — мини-эссе: конкретный момент → что сделали → чему научились →\nкак это ведёт к курсу. Комиссия ищет доказательства, а не декларации: проект,\nолимпиада, курс с названием, самостоятельная работа.</p>\n<h3>Чего не делать</h3>\n<ul>\n<li>Штампы «passionate about», «since childhood», «rapidly changing world»;</li>\n<li>пересказ школьной программы во втором вопросе — только то, что относится к курсу;</li>\n<li>список кружков без выводов в третьем — одно дело с деталями сильнее пяти строк перечислений.</li>\n</ul>\n<p>Лимит 4000 символов общий на все три ответа — держите пропорцию примерно\n40/30/30 и оставляйте запас на правки.</p>\n", "cta": "Проверить ответы UCAS", "go": "ucas"}, {"slug": "visa-checklist", "cat": "guides", "title": "Чек-лист студенческой визы: документы и правило 28 дней", "teaser": "CAS, финансы, TB-тест и типичные причины отказов — по шагам, без паники.", "min": 7, "body": "\n<p>Student visa подаётся после получения <b>CAS</b> — подтверждения места от вуза.\nС этого момента у вас обычно есть 6 месяцев, но тянуть не стоит: приёмы в визовых\nцентрах в сезон забиваются.</p>\n<h3>Базовый комплект</h3>\n<ul>\n<li>Загранпаспорт, действующий на весь срок учёбы + запас;</li>\n<li>CAS-номер и документы, указанные в нём (аттестат, IELTS UKVI);</li>\n<li>финансовые доказательства: tuition за год + средства на жизнь\n(для Лондона сумма выше) — <b>непрерывно 28 дней на счёте</b>, выписка не старше 31 дня;</li>\n<li>согласие родителей и свидетельство о рождении, если вам нет 18;</li>\n<li>TB-тест из одобренной клиники — для подачи из РФ и большинства стран СНГ.</li>\n</ul>\n<h3>Частые причины отказов</h3>\n<p>Деньги «мелькали» на счёте меньше 28 дней; выписка устарела; сумма посчитана\nбез лондонской надбавки; спонсор — не родитель, а дядя (так нельзя без нюансов).\nВсе три лечатся планированием за 2 месяца.</p>\n<p><i>Важно: сервис помогает подготовить комплект, но не гарантирует визу и не\nявляется юридической консультацией — решение принимает визовый офицер. Критичные\nвопросы по финансам всегда передаём куратору.</i></p>\n", "cta": "Задать вопрос по визе", "go": "chat"}, {"slug": "motivation-letter-guide", "cat": "guides", "title": "Мотивационное письмо на Foundation: структура из 5 абзацев", "teaser": "Короткая версия нашей инструкции: что комиссия хочет увидеть в 300–500 словах и какие штампы выдают «письмо для всех».", "min": 4, "body": "\n<p>Письмо для Foundation подаётся напрямую в вуз и читается быстро — у вас\n300–500 слов, чтобы показать три вещи: осознанный выбор, готовность учиться\nи реалистичные цели.</p>\n<h3>Пять абзацев</h3>\n<ol>\n<li>Зачем вам направление — конкретный момент, с которого начался интерес;</li>\n<li>академический бэкграунд + честное «зачем Foundation» (11 классов → мост к британской системе);</li>\n<li>опыт вне учёбы — одно дело с деталями;</li>\n<li>почему этот вуз и курс — названия модулей, а не комплименты;</li>\n<li>цели после выпуска — какая степень и какая сфера.</li>\n</ol>\n<h3>Красные флаги для комиссии</h3>\n<p>«Passionate about since childhood», пересказ биографии, канцеляризмы в дословном\nпереводе, ни слова о самом вузе, обещание «стать CEO через 5 лет». Полная версия\nинструкции и проверка ИИ + куратором — в разделе «Мотивационное письмо».</p>\n", "cta": "Проверить моё письмо", "go": "motivation"}];

const READING_TESTS = [{"test": {"id": "academic-1", "title": "Academic Reading · Mock 1", "minutes": 60, "passages": [{"title": "Farming above the streets", "text": "Growing food on rooftops may look like a fashion of the last two decades, but gardens above the street are far from new: archaeologists describe planted terraces in ancient Mesopotamia, and nineteenth-century Berlin had beer gardens on warehouse roofs. What is genuinely modern is the scale and the ambition. In 2011 the Canadian company Lufa Farms opened what it describes as the world's first commercial rooftop greenhouse in Montreal, and today produce grown above supermarkets, offices and car parks is sold in dozens of cities across North America, Europe and Asia.\n\nThe appeal is easy to understand. A layer of plants and growing medium shields the roof membrane from ultraviolet radiation and from daily swings of temperature, which can double the life of the roof itself. The same layer works as insulation, cutting the energy a building needs for heating in winter and for cooling in summer. Water management improves too: studies of green roofs show that they can retain up to 80 per cent of the rain that falls on them, easing the load on city drains during storms. And because the food is grown a lift-ride away from the people who eat it, 'food miles' shrink almost to zero.\n\nThere are, of course, obstacles. Soil, water and equipment are heavy, and older buildings often need expensive structural checks before a single seed tray can be carried upstairs. Partly for this reason, although some projects still grow crops in raised beds of soil, the majority of commercial operations now prefer hydroponic systems, in which plants stand in channels of circulating nutrient solution. Such systems weigh far less and use about 90 per cent less water than conventional growing. Governments are starting to help: in Singapore, where land is scarce, the city authorities subsidise part of the installation costs of approved rooftop farms.\n\nSupporters also point to benefits that are harder to measure. Lufa Farms delivers its vegetables to subscribers within hours of harvesting, and argues that freshness of this kind changes how people think about seasonal food. Rooftop plots can serve as outdoor classrooms for local schools, and several operators reserve beds for community groups. Critics reply that rooftop farming will never feed a whole city, and they are almost certainly right; even enthusiasts admit that the initial cost remains the main obstacle to expansion. Yet as roofs sit empty above every urban district, the question increasingly asked is not whether they can replace the countryside, but why so many of them still grow nothing at all.", "instructions_groups": [{"kind": "tfng", "label": "Вопросы 1–6. TRUE / FALSE / NOT GIVEN — соответствует ли утверждение тексту.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "questions": [{"no": 1, "q": "Rooftop gardens first appeared in the twenty-first century."}, {"no": 2, "q": "Lufa Farms opened what it calls the first commercial rooftop greenhouse in the world."}, {"no": 3, "q": "A rooftop farm can reduce the amount of energy a building uses."}, {"no": 4, "q": "Most commercial rooftop farms grow their crops in beds of soil."}, {"no": 5, "q": "The authorities in Singapore cover part of the cost of installing approved rooftop farms."}, {"no": 6, "q": "Vegetables grown on rooftops taste better than those sold in supermarkets."}]}, {"kind": "gap", "label": "Вопросы 7–13. Дополните предложение ОДНИМ словом или числом из текста.", "questions": [{"no": 7, "q": "A layer of plants protects the roof membrane from ______ radiation."}, {"no": 8, "q": "Green roofs can hold back up to ______ per cent of rainwater."}, {"no": 9, "q": "Older buildings may require costly ______ checks before a farm is installed."}, {"no": 10, "q": "Hydroponic systems use around ______ per cent less water than conventional growing."}, {"no": 11, "q": "Lufa Farms delivers vegetables to subscribers within ______ of harvesting."}, {"no": 12, "q": "Rooftop plots can be used as outdoor ______ for nearby schools."}, {"no": 13, "q": "Even supporters accept that the biggest barrier to growth is the initial ______."}]}]}, {"title": "Why we sleep", "text": "A  For most of scientific history, sleep was treated as a simple absence: the brain, it was assumed, merely switched off for the night. Modern neuroscience has overturned this view completely. Recordings of electrical activity show that the sleeping brain is anything but idle — it cycles through distinct states, each with its own tasks, rhythms and chemistry.\n\nB  Sleep is organised into two broad kinds. During non-REM sleep the brain's waves become slow and deep, breathing steadies and the body repairs tissue. REM sleep — named for the rapid eye movements that accompany it — looks closer to waking, and it is when most vivid dreaming occurs. A healthy night moves through these states in cycles of roughly 90 minutes: deep non-REM sleep dominates the first half of the night, while REM periods grow longer towards morning.\n\nC  One of sleep's best-documented jobs is filing memories. New experiences are held first in the hippocampus, a temporary store; during deep sleep the brain replays them and transfers the important ones to the cortex for long-term keeping. In one experiment, students who slept after studying word lists recalled significantly more the next day than classmates who stayed awake — an advantage of between 20 and 40 per cent in some trials.\n\nD  Deep sleep also gives the brain a wash. In 2013 researchers described the glymphatic system, a network of channels that expands during deep sleep and flushes out metabolic waste, including beta-amyloid, a protein that accumulates in Alzheimer's disease. The discovery suggested a direct biological reason why chronic poor sleep is linked to declining memory in later life.\n\nE  The price of missing sleep is paid quickly. After a short night, attention wavers and reaction times stretch; the immune system produces fewer defensive cells; and the hormones that govern appetite shift, with ghrelin (which drives hunger) rising while leptin (which signals fullness) falls — one reason tired people snack. On the road the effects are starkest of all: driving while severely sleep-deprived produces impairment comparable to driving drunk.\n\nF  The encouraging news is that sleep responds to habit. Specialists advise keeping the same bedtime and waking time every day, seeking bright light in the morning, and avoiding caffeine and glowing screens late in the evening. Needs vary from person to person — most adults fall somewhere between seven and nine hours — and a short nap of about 20 minutes can restore alertness without leaving grogginess behind.", "instructions_groups": [{"kind": "headings", "label": "Вопросы 14–18. Подберите заголовок (i–viii) к абзацам B–F. Пример: абзац A — viii.", "options": ["i. How the brain washes itself clean", "ii. Two kinds of sleep and their nightly rhythm", "iii. Why teenagers need more sleep than adults", "iv. The cost of missing sleep", "v. Moving memories into long-term storage", "vi. Practical steps towards better sleep", "vii. What dreams really mean", "viii. Sleep as an active state"], "questions": [{"no": 14, "q": "Абзац B"}, {"no": 15, "q": "Абзац C"}, {"no": 16, "q": "Абзац D"}, {"no": 17, "q": "Абзац E"}, {"no": 18, "q": "Абзац F"}]}, {"kind": "mc", "label": "Вопросы 19–22. Выберите правильный вариант (A–D).", "questions": [{"no": 19, "q": "During a typical night, deep non-REM sleep mostly occurs…", "options": ["A. in the first half of the night", "B. just before waking", "C. during periods of dreaming", "D. evenly through the night"]}, {"no": 20, "q": "In the experiment described, students who slept after studying…", "options": ["A. felt more confident about the test", "B. remembered more words than those who stayed awake", "C. finished the test more quickly", "D. preferred studying at night"]}, {"no": 21, "q": "The glymphatic system is most active…", "options": ["A. during REM sleep", "B. immediately after waking", "C. during deep sleep", "D. while we exercise"]}, {"no": 22, "q": "According to paragraph E, lack of sleep changes appetite because…", "options": ["A. tired people have less time to cook", "B. the stomach empties more slowly", "C. levels of two hormones move in opposite directions", "D. food becomes less enjoyable"]}]}, {"kind": "ynng", "label": "Вопросы 23–26. YES / NO / NOT GIVEN — согласуется ли утверждение с мнением автора.", "options": ["YES", "NO", "NOT GIVEN"], "questions": [{"no": 23, "q": "Every adult needs exactly eight hours of sleep."}, {"no": 24, "q": "A short daytime nap can be helpful."}, {"no": 25, "q": "Sleeping pills are an effective long-term solution to poor sleep."}, {"no": 26, "q": "Driving while extremely tired can be as dangerous as driving drunk."}]}]}, {"title": "Vanishing voices", "text": "Of the roughly 7,000 languages spoken in the world today, linguists expect that between a third and a half will fall silent within a century. The statistics hide an awkward problem of definition. As the field linguist Tomas Berg points out, a language rarely dies at a recordable moment: it fades, used in fewer homes and for fewer purposes, until one day the last fluent conversation has already happened without anyone noticing. Berg argues, however, that raw speaker numbers mislead in both directions — a language spoken by only a few hundred people can remain perfectly viable for centuries, provided parents keep passing it to children.\n\nWhy should the loss matter to anyone beyond the community itself? The ecologist-turned-linguist Elena Vaquero answers with a comparison: when a language disappears unrecorded, it is like burning the only library in a town. Her fieldwork in the Amazon documents how local languages encode knowledge that exists nowhere else — names and uses of medicinal plants, fish migration calendars, techniques of soil management — knowledge assembled over hundreds of generations and rarely written down.\n\nThe causes of decline are seldom mysterious. Cities pull young speakers away from villages; schools have historically punished children for using home languages; and television, advertising and the internet arrive overwhelmingly in a handful of dominant tongues. Parents, acting rationally, raise children in the language of jobs and examinations. What looks like free choice is often the endpoint of decades of policy.\n\nYet the story is not uniformly bleak, and the clearest lessons come from revivals. Hebrew returned from liturgical use to become the daily language of a modern state. Welsh climbed back from decline with the help of dedicated television channels and compulsory teaching in schools. In New Zealand, the Māori movement built 'language nests' — nurseries in which infants spend their days with elders who speak to them only in Māori, recreating the domestic transmission that had been broken. Studying such cases, Vaquero concludes that money matters less than continuity: what decides a language's fate is unbroken transmission between generations.\n\nTechnology, long blamed for flattening linguistic diversity, is switching sides. The sociolinguist Aiko Tanaka studies indigenous teenagers who text, stream and joke online in their ancestral languages; her surveys suggest that seeing a language on a smartphone screen does more than any textbook to convince the young that it belongs to the future. Free apps now teach languages with a few thousand speakers, and communities crowdsource dictionaries that would once have taken a university decades.\n\nOptimism, then, is possible — but conditional. Revival succeeds where communities come to see their language as an asset rather than a burden, and where speaking it opens doors instead of closing them. Languages are not museum pieces to be preserved behind glass; they survive by being argued in, joked in and sung in. The task, as Tanaka puts it, is not to save languages but to make them worth keeping.", "instructions_groups": [{"kind": "mc", "label": "Вопросы 27–31. Выберите правильный вариант (A–D).", "questions": [{"no": 27, "q": "Approximately how many languages are spoken in the world today?", "options": ["A. 700", "B. 3,500", "C. 7,000", "D. 70,000"]}, {"no": 28, "q": "The loss of an unrecorded language is compared to…", "options": ["A. the extinction of a rare species", "B. the burning of a town's only library", "C. the demolition of an ancient building", "D. the closing of a school"]}, {"no": 29, "q": "Which of the following is NOT mentioned as a cause of language decline?", "options": ["A. migration to cities", "B. school policies", "C. dominant-language media", "D. climate change"]}, {"no": 30, "q": "The Māori 'language nests' work by…", "options": ["A. paying parents to speak Māori at home", "B. placing young children with elders who use only Māori", "C. broadcasting children's television in Māori", "D. teaching Māori as a school subject"]}, {"no": 31, "q": "The writer's overall attitude to language revival is…", "options": ["A. dismissive", "B. neutral", "C. cautiously optimistic", "D. alarmed"]}]}, {"kind": "match", "label": "Вопросы 32–35. Кому принадлежит утверждение: A — Tomas Berg, B — Elena Vaquero, C — Aiko Tanaka. Буквы можно использовать более одного раза.", "options": ["A. Tomas Berg", "B. Elena Vaquero", "C. Aiko Tanaka"], "questions": [{"no": 32, "q": "Local languages contain unique practical knowledge about the natural world."}, {"no": 33, "q": "It is hard to identify the exact moment at which a language dies."}, {"no": 34, "q": "Seeing a language used on digital devices persuades young people it has a future."}, {"no": 35, "q": "A language with very few speakers can still survive for a long time."}]}, {"kind": "gap", "label": "Вопросы 36–40. Дополните конспект ОДНИМ словом из текста.", "questions": [{"no": 36, "q": "Welsh recovered partly thanks to television and compulsory lessons in ______."}, {"no": 37, "q": "In Māori nurseries, infants spend their days with ______ who speak only Māori."}, {"no": 38, "q": "According to Vaquero, a language's fate depends on unbroken ______ between generations."}, {"no": 39, "q": "Free ______ now teach even very small languages."}, {"no": 40, "q": "Revival works where a community sees its language as an asset, not a ______."}]}]}]}, "answers": {"1": {"a": ["FALSE"], "why": "В тексте: сады на крышах «far from new» — были в древней Месопотамии и Берлине XIX века."}, "2": {"a": ["TRUE"], "why": "«Lufa Farms opened what it describes as the world's first commercial rooftop greenhouse»."}, "3": {"a": ["TRUE"], "why": "Слой растений работает как изоляция и сокращает энергию на отопление и охлаждение."}, "4": {"a": ["FALSE"], "why": "«the majority of commercial operations now prefer hydroponic systems» — не в грунте."}, "5": {"a": ["TRUE"], "why": "«the city authorities subsidise part of the installation costs of approved rooftop farms»."}, "6": {"a": ["NOT GIVEN"], "why": "О вкусе овощей в тексте не сказано ничего."}, "7": {"a": ["ultraviolet", "uv"], "why": "«shields the roof membrane from ultraviolet radiation»."}, "8": {"a": ["80"], "why": "«retain up to 80 per cent of the rain»."}, "9": {"a": ["structural"], "why": "«older buildings often need expensive structural checks»."}, "10": {"a": ["90"], "why": "«use about 90 per cent less water»."}, "11": {"a": ["hours"], "why": "«delivers its vegetables to subscribers within hours of harvesting»."}, "12": {"a": ["classrooms"], "why": "«serve as outdoor classrooms for local schools»."}, "13": {"a": ["cost"], "why": "«the initial cost remains the main obstacle to expansion»."}, "14": {"a": ["ii"], "why": "Абзац B — про два вида сна и 90-минутные циклы."}, "15": {"a": ["v"], "why": "Абзац C — про перенос памяти из гиппокампа в кору."}, "16": {"a": ["i"], "why": "Абзац D — глимфатическая система «даёт мозгу помывку»."}, "17": {"a": ["iv"], "why": "Абзац E — цена недосыпа: внимание, иммунитет, аппетит, дорога."}, "18": {"a": ["vi"], "why": "Абзац F — практические советы по гигиене сна."}, "19": {"a": ["A"], "why": "«deep non-REM sleep dominates the first half of the night»."}, "20": {"a": ["B"], "why": "Спавшие студенты вспоминали на 20–40% больше слов."}, "21": {"a": ["C"], "why": "Система «expands during deep sleep»."}, "22": {"a": ["C"], "why": "Грелин растёт, лептин падает — гормоны движутся в противоположные стороны."}, "23": {"a": ["NO"], "why": "«Needs vary from person to person» — автор прямо не согласен с «ровно 8 часов»."}, "24": {"a": ["YES"], "why": "«a short nap of about 20 minutes can restore alertness»."}, "25": {"a": ["NOT GIVEN"], "why": "Снотворное в тексте не обсуждается."}, "26": {"a": ["YES"], "why": "«impairment comparable to driving drunk»."}, "27": {"a": ["C"], "why": "«roughly 7,000 languages»."}, "28": {"a": ["B"], "why": "«like burning the only library in a town»."}, "29": {"a": ["D"], "why": "Города, школы и медиа названы; изменение климата — нет."}, "30": {"a": ["B"], "why": "«infants spend their days with elders who speak to them only in Māori»."}, "31": {"a": ["C"], "why": "«Optimism, then, is possible — but conditional» — сдержанный оптимизм."}, "32": {"a": ["B"], "why": "Вакеро документирует знания о растениях, рыбе, почве."}, "33": {"a": ["A"], "why": "Берг: язык «fades… without anyone noticing»."}, "34": {"a": ["C"], "why": "Танака: язык на экране смартфона убеждает молодых, что у него есть будущее."}, "35": {"a": ["A"], "why": "Берг: несколько сотен носителей — и «perfectly viable for centuries»."}, "36": {"a": ["schools"], "why": "«compulsory teaching in schools»."}, "37": {"a": ["elders"], "why": "«spend their days with elders»."}, "38": {"a": ["transmission"], "why": "«unbroken transmission between generations»."}, "39": {"a": ["apps"], "why": "«Free apps now teach languages…»."}, "40": {"a": ["burden"], "why": "«an asset rather than a burden»."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [33, 7.5], [30, 7.0], [27, 6.5], [23, 6.0], [19, 5.5], [15, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "reading-2", "title": "Reading · Вариант 2", "minutes": 60, "passages": [{"title": "The bicycle that changed the world", "text": "When the first pedal-driven bicycles appeared in the 1860s, they were known as 'boneshakers' — heavy machines with wooden wheels and iron tyres that turned every cobbled street into a punishment. The high-wheeled penny-farthing that followed was faster, but its enormous front wheel made falls frequent and dangerous, so cycling remained a pastime for daring young men with money to spare.\n\nEverything changed in 1885, when John Kemp Starley produced the Rover 'safety bicycle' in Coventry, England. It had two wheels of equal size and a chain drive to the rear wheel; soon afterwards it gained John Dunlop's newly invented air-filled tyres. The safety bicycle was stable, comfortable and — crucially — cheap to produce in large numbers. Within a decade, cycling stopped being a stunt and became transport.\n\nThe social effects were remarkable. For the first time, ordinary workers could live several miles from the factory and still arrive on time, which widened their choice of jobs and housing. Historians also credit the bicycle with changing women's lives: it gave them independent mobility, encouraged practical clothing instead of restrictive Victorian dress, and became a symbol of the emancipation movement. The American campaigner Susan B. Anthony declared that the bicycle had done 'more to emancipate women than anything else in the world'.\n\nThe bicycle also left its mark on industry. Factories that made bicycles perfected techniques — ball bearings, thin steel tubes, chain drives, precision assembly — that were later adopted by car and even aircraft manufacturers. The Wright brothers famously ran a bicycle repair shop before they built their first aeroplane, and early cars borrowed wheels, tyres and steering ideas directly from cycles.\n\nIn the twentieth century the private car pushed the bicycle aside in most wealthy countries, and for decades it was dismissed as a child's toy or a poor man's vehicle. Yet the story did not end there. Concerns about congestion, air quality and health have brought the bicycle back into city planning: Copenhagen and Amsterdam now count more bicycles than cars in their central districts, and hundreds of cities from Paris to Bogotá have built protected cycle lanes and public hire schemes. A machine invented before the light bulb is once again seen as the transport of the future.", "instructions_groups": [{"kind": "tfng", "label": "Вопросы 1–7. TRUE — утверждение совпадает с текстом; FALSE — противоречит; NOT GIVEN — в тексте об этом нет.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "questions": [{"no": 1, "q": "Early boneshakers had air-filled tyres."}, {"no": 2, "q": "The penny-farthing was considered dangerous to ride."}, {"no": 3, "q": "The Rover safety bicycle was produced in Coventry."}, {"no": 4, "q": "John Dunlop invented the chain drive."}, {"no": 5, "q": "The safety bicycle cost more than the penny-farthing."}, {"no": 6, "q": "Susan B. Anthony believed the bicycle helped the emancipation of women."}, {"no": 7, "q": "The Wright brothers built bicycles after their first aeroplane."}]}, {"kind": "gap", "label": "Вопросы 8–13. Дополните предложения ОДНИМ-ДВУМЯ словами из текста.", "questions": [{"no": 8, "q": "The Rover had a chain drive to the ______ wheel."}, {"no": 9, "q": "Workers could live several miles from the ______ and still arrive on time."}, {"no": 10, "q": "The bicycle encouraged women to wear more ______ clothing."}, {"no": 11, "q": "Bicycle-making techniques were later adopted by car and ______ manufacturers."}, {"no": 12, "q": "In the twentieth century the private ______ replaced the bicycle in rich countries."}, {"no": 13, "q": "Cities promote cycling today partly because of concerns about air ______."}]}]}, {"title": "Museums in the digital age", "text": "A. For most of their history, museums were judged by the size of their collections: the more objects, the greater the institution. What visitors rarely realise is how little of this wealth they actually see. A typical national museum displays well under ten per cent of what it owns; the rest sits in climate-controlled storerooms, examined only by researchers.\n\nB. Digitisation promised to open those storerooms to everyone. Over the past two decades, museums have photographed, scanned and catalogued millions of objects and put the results online. The Rijksmuseum in Amsterdam went further than most: it released high-resolution images of its masterpieces free of charge, inviting the public to download, remix and even print them, arguing that open access spreads the collection's fame rather than devaluing it.\n\nC. Sceptics predicted that if people could study a painting on a screen, they would stop visiting the original. The opposite happened: studies repeatedly find that people who engage with a museum online are more likely to buy a ticket later, not less. During the pandemic closures, virtual tours and live-streamed curator talks kept audiences connected — and introduced museums to viewers who had never set foot in them.\n\nD. Inside the galleries themselves, technology is a more delicate matter. Touchscreens, audio guides and augmented-reality apps can reconstruct a ruined temple or put flesh on a dinosaur skeleton, and children in particular love them. But curators warn that a room full of glowing screens can compete with the very objects people came to see; the best installations, they argue, direct attention towards the artefact, not away from it.\n\nE. The deepest change is professional. The curator was once a gatekeeper who decided what the public should know about an object. Today's curators write for the web, answer questions on social media and increasingly invite the public to contribute: volunteers transcribe old letters, identify birds in photographs and add local knowledge to online catalogues. The museum, once a one-way lecture, is slowly becoming a conversation.", "instructions_groups": [{"kind": "headings", "label": "Вопросы 14–18. Подберите заголовок к каждому абзацу A–E. Два заголовка лишние.", "options": ["i. Putting whole collections on the internet", "ii. Why screens can compete with exhibits", "iii. A profession transformed", "iv. Most objects the public never sees", "v. Online interest brings people through the door", "vi. Ticket prices in the digital era", "vii. Museums lose government funding"], "questions": [{"no": 14, "q": "Абзац A"}, {"no": 15, "q": "Абзац B"}, {"no": 16, "q": "Абзац C"}, {"no": 17, "q": "Абзац D"}, {"no": 18, "q": "Абзац E"}]}, {"kind": "mc", "label": "Вопросы 19–22. Выберите один вариант.", "questions": [{"no": 19, "q": "The Rijksmuseum example shows that", "options": ["A. museums can profit by selling digital images", "B. high-quality images can be given away free", "C. digitisation is too expensive for most museums", "D. paintings are damaged by photography"]}, {"no": 20, "q": "During the pandemic, virtual tours", "options": ["A. permanently replaced physical visits", "B. helped museums stay in touch with audiences", "C. proved unpopular with viewers", "D. were mostly cancelled"]}, {"no": 21, "q": "Augmented-reality apps in galleries are used to", "options": ["A. sell souvenirs to visitors", "B. reconstruct damaged or vanished things", "C. count the number of visitors", "D. replace human guides completely"]}, {"no": 22, "q": "According to the passage, modern curators increasingly", "options": ["A. work in isolation from the public", "B. invite the public to contribute", "C. avoid using technology", "D. focus only on buying new objects"]}]}, {"kind": "ynng", "label": "Вопросы 23–26. YES — совпадает с мнением автора; NO — противоречит; NOT GIVEN — мнения нет.", "options": ["YES", "NO", "NOT GIVEN"], "questions": [{"no": 23, "q": "Putting collections online always reduces museum attendance."}, {"no": 24, "q": "Some gallery technology can distract visitors from the real objects."}, {"no": 25, "q": "Every museum will eventually digitise its whole collection."}, {"no": 26, "q": "The change in the curator's role is a loss for museums."}]}]}, {"title": "The trained memory", "text": "Every year, competitors at the World Memory Championships memorise shuffled decks of cards, strings of random digits and pages of invented dates at speeds that look superhuman. The oldest known technique behind such feats — the 'method of loci', or memory palace — is credited to the ancient Greek poet Simonides. After a banquet hall collapsed, he was able to identify the victims by remembering where each guest had been sitting, and realised that locations make powerful hooks for memory. The method still works the same way today: the learner imagines a familiar route and places vivid images of the things to be remembered along it.\n\nAre champions simply born with extraordinary brains? Neuroscientist Martin Dresler and his colleagues scanned dozens of leading memory athletes and matched them with untrained volunteers of similar age and intelligence. Structurally, the athletes' brains looked much like everyone else's — the difference appeared in how they were used. During memorisation, the athletes showed strong activity in regions responsible for spatial memory: they were, in effect, navigating their imaginary palaces. More striking still, after six weeks of daily training in the technique, the volunteers' recall roughly doubled, and their brain-activity patterns began to resemble the champions'.\n\nThis fits a broader idea associated with psychologist Anders Ericsson: that expert performance grows out of a particular kind of practice — focused, effortful and feedback-driven — rather than raw talent. The journalist Joshua Foer put the theory to a famous test. Sent to cover a memory contest as a reporter, he became fascinated, trained for about a year under a champion's guidance, and returned to win the United States Memory Championship himself. He later admitted that he still forgot where he had left his car keys.\n\nFor learners, the lessons are practical. Abstract material sticks better when converted into concrete, even absurd images; numbers become people or objects; long lists become journeys through a childhood home. None of this removes the need for understanding — a memory palace full of formulas you cannot apply is just expensive furniture. But the research is encouraging: the machinery of exceptional memory appears to be standard equipment, available to anyone willing to train it.", "instructions_groups": [{"kind": "match", "label": "Вопросы 27–31. Соотнесите утверждение с человеком: A — Simonides, B — Joshua Foer, C — Martin Dresler, D — Anders Ericsson. Буквы могут повторяться.", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "Is credited with discovering a memory technique after a disaster."}, {"no": 28, "q": "Won a national competition after about a year of training."}, {"no": 29, "q": "Led brain-scan research comparing athletes with untrained volunteers."}, {"no": 30, "q": "Linked expert performance to a special kind of practice."}, {"no": 31, "q": "First encountered memory sport while working as a journalist."}]}, {"kind": "gap", "label": "Вопросы 32–36. Дополните предложения ОДНИМ словом из текста.", "questions": [{"no": 32, "q": "In the method of loci, images are placed along a familiar ______."}, {"no": 33, "q": "Memory athletes rely on regions responsible for ______ memory."}, {"no": 34, "q": "After six weeks of training, volunteers' recall roughly ______."}, {"no": 35, "q": "Foer trained under the guidance of a ______."}, {"no": 36, "q": "Numbers are easier to remember when turned into people or ______."}]}, {"kind": "mc", "label": "Вопросы 37–40. Выберите один вариант.", "questions": [{"no": 37, "q": "What surprised researchers about the champions' brains?", "options": ["A. They were unusually large", "B. They looked much like ordinary brains", "C. They showed signs of damage", "D. They aged more slowly"]}, {"no": 38, "q": "Simonides identified the victims by remembering", "options": ["A. their names", "B. where they had been sitting", "C. their clothes", "D. their voices"]}, {"no": 39, "q": "The author mentions car keys to show that", "options": ["A. Foer's training was useless", "B. trained memory does not fix everyday forgetfulness", "C. champions memorise objects, not places", "D. car keys are hard to memorise"]}, {"no": 40, "q": "The main conclusion of the passage is that exceptional memory", "options": ["A. is a rare inherited gift", "B. cannot be studied scientifically", "C. can be developed through training", "D. is useless without a memory palace"]}]}]}]}, "answers": {"1": {"a": ["FALSE"], "why": "У них были деревянные колёса и железные шины; надувные шины появились позже у safety bicycle."}, "2": {"a": ["TRUE"], "why": "«Falls frequent and dangerous» — падения были частыми и опасными."}, "3": {"a": ["TRUE"], "why": "«Produced the Rover 'safety bicycle' in Coventry»."}, "4": {"a": ["FALSE"], "why": "Данлоп изобрёл надувные (air-filled) шины, а не цепную передачу."}, "5": {"a": ["NOT GIVEN"], "why": "Текст говорит, что safety bicycle был дёшев в производстве, но цены с пенни-фартингом не сравнивает."}, "6": {"a": ["TRUE"], "why": "Её цитата: велосипед сделал «more to emancipate women than anything else»."}, "7": {"a": ["FALSE"], "why": "Мастерская была ДО постройки самолёта: «before they built their first aeroplane»."}, "8": {"a": ["rear"], "why": "«A chain drive to the rear wheel»."}, "9": {"a": ["factory"], "why": "«Live several miles from the factory and still arrive on time»."}, "10": {"a": ["practical"], "why": "«Encouraged practical clothing instead of restrictive Victorian dress»."}, "11": {"a": ["aircraft"], "why": "«Adopted by car and even aircraft manufacturers»."}, "12": {"a": ["car"], "why": "«The private car pushed the bicycle aside»."}, "13": {"a": ["quality"], "why": "«Concerns about congestion, air quality and health»."}, "14": {"a": ["iv"], "why": "Абзац A — о том, что публика видит меньше 10% коллекции."}, "15": {"a": ["i"], "why": "Абзац B — об оцифровке и выкладке коллекций в интернет."}, "16": {"a": ["v"], "why": "Абзац C — онлайн-знакомство повышает шанс визита."}, "17": {"a": ["ii"], "why": "Абзац D — экраны могут конкурировать с экспонатами."}, "18": {"a": ["iii"], "why": "Абзац E — как изменилась профессия куратора."}, "19": {"a": ["B"], "why": "Rijksmuseum выложил изображения в высоком разрешении бесплатно."}, "20": {"a": ["B"], "why": "«Kept audiences connected» — туры удержали связь с аудиторией."}, "21": {"a": ["B"], "why": "AR «can reconstruct a ruined temple» — восстанавливает разрушенное."}, "22": {"a": ["B"], "why": "«Increasingly invite the public to contribute»."}, "23": {"a": ["NO"], "why": "Автор пишет обратное: онлайн-доступ ПОВЫШАЕТ посещаемость."}, "24": {"a": ["YES"], "why": "«A room full of glowing screens can compete with the very objects»."}, "25": {"a": ["NOT GIVEN"], "why": "Про «все музеи в итоге оцифруют всё» автор не высказывается."}, "26": {"a": ["NO"], "why": "Автор описывает перемену позитивно: музей «становится разговором»."}, "27": {"a": ["A"], "why": "Симонид опознал погибших после обрушения зала — начало метода локусов."}, "28": {"a": ["B"], "why": "Фоер тренировался около года и выиграл чемпионат США."}, "29": {"a": ["C"], "why": "Дреслер сканировал мозг атлетов и добровольцев."}, "30": {"a": ["D"], "why": "Эрикссон связал экспертность с особой практикой."}, "31": {"a": ["B"], "why": "Фоер попал на турнир как репортёр."}, "32": {"a": ["route"], "why": "«Imagines a familiar route» — образы размещают вдоль знакомого маршрута."}, "33": {"a": ["spatial"], "why": "«Regions responsible for spatial memory»."}, "34": {"a": ["doubled"], "why": "«Recall roughly doubled» после шести недель тренировок."}, "35": {"a": ["champion"], "why": "«Under a champion's guidance»."}, "36": {"a": ["objects"], "why": "«Numbers become people or objects»."}, "37": {"a": ["B"], "why": "Структурно мозг чемпионов «looked much like everyone else's»."}, "38": {"a": ["B"], "why": "Он помнил, ГДЕ сидел каждый гость."}, "39": {"a": ["B"], "why": "Ключи — пример: тренированная память не лечит бытовую забывчивость."}, "40": {"a": ["C"], "why": "Вывод: исключительная память доступна каждому, кто тренируется."}}, "bands": [[39, 9.0], [37, 8.5], [35, 8.0], [32, 7.5], [30, 7.0], [26, 6.5], [23, 6.0], [18, 5.5], [16, 5.0], [13, 4.5], [10, 4.0], [8, 3.5], [6, 3.0], [4, 2.5], [0, 2.0]]}, {"test": {"id": "reading-3", "title": "Reading · Вариант 3", "minutes": 60, "passages": [{"title": "A short history of tea", "text": "According to Chinese legend, tea was discovered by accident around 2737 BC, when leaves from a wild bush blew into water being boiled for the emperor Shennong. Whatever the truth of the story, tea was being cultivated in China thousands of years ago, first as a medicine and only later as an everyday drink. Buddhist monks, who valued the way it kept them alert during long meditation, helped carry the custom to Japan, where it grew into an elaborate ceremony.\n\nEurope tasted tea remarkably late. It was Portuguese and Dutch merchants who first shipped it west in the early seventeenth century, selling it as an exotic luxury. In England the drink was made fashionable by Catherine of Braganza, the Portuguese princess who married King Charles II in 1662 and served tea at court. Before long, the East India Company held a monopoly on British imports, and tea taxes became serious politics: smuggling flourished at home, while anger over tea duties in the American colonies helped spark a revolution.\n\nIn the nineteenth century, speed became an obsession. Fast sailing ships known as clippers raced each other from China to London, because the first cargo of the new season commanded the highest prices; the Cutty Sark, built in 1869 and preserved in Greenwich today, is the most famous survivor of those races. In the same period Britain, uneasy about depending on a single supplier, established plantations in Assam in India, using a native variety of the plant discovered growing there.\n\nTea also reshaped daily life. In the 1840s Anna, Duchess of Bedford, complaining of a 'sinking feeling' in the long gap between meals, began inviting friends to bread, cake and tea at five o'clock — and afternoon tea became a British institution. Factory owners adopted the tea break after finding that workers performed better with a hot, mildly caffeinated drink than with beer, the traditional alternative.\n\nToday tea is, after water, the most consumed drink on the planet. It is grown in more than sixty countries, picked largely by hand, and drunk in ways the emperor's boiling pot never foresaw — iced in America, spiced in India, whisked into green foam in Japan, and stewed strong and sweet, with milk, in millions of British kitchens every day.", "instructions_groups": [{"kind": "tfng", "label": "Вопросы 1–7. TRUE — совпадает с текстом; FALSE — противоречит; NOT GIVEN — информации нет.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "questions": [{"no": 1, "q": "According to legend, tea was discovered by accident."}, {"no": 2, "q": "Buddhist monks helped bring tea to Japan."}, {"no": 3, "q": "Tea first reached Europe on British ships."}, {"no": 4, "q": "Catherine of Braganza refused to drink tea at court."}, {"no": 5, "q": "Tea clippers also carried passengers."}, {"no": 6, "q": "Britain created Indian plantations to reduce dependence on China."}, {"no": 7, "q": "Tea is the most consumed drink in the world."}]}, {"kind": "gap", "label": "Вопросы 8–13. Дополните предложения ОДНИМ-ДВУМЯ словами из текста.", "questions": [{"no": 8, "q": "Legend links the discovery of tea to the emperor ______."}, {"no": 9, "q": "The first tea in Europe was shipped by Portuguese and ______ merchants."}, {"no": 10, "q": "British tea imports were controlled by the ______ Company."}, {"no": 11, "q": "Fast ships called ______ raced to bring the season's first tea."}, {"no": 12, "q": "British plantations were first established in ______."}, {"no": 13, "q": "Afternoon tea was started by the Duchess of ______."}]}]}, {"title": "Why cities need trees", "text": "A. On a summer afternoon, the difference between a bare street and a tree-lined one can be measured with an ordinary thermometer. Dark roads and roofs absorb heat and release it slowly, creating the 'urban heat island' effect; mature trees cool the air both by casting shade and by releasing water vapour through their leaves. Studies of European cities have recorded street-level differences of several degrees between green and treeless districts — a gap that matters more with every heatwave.\n\nB. Trees are also quiet infrastructure. Their leaves trap a portion of the fine dust thrown up by traffic, and their canopies intercept rain, slowing the rush of water into drains during storms. Root systems act like sponges: a single large street tree can take up hundreds of litres after heavy rain, easing the pressure on sewers and reducing the risk of flash flooding in low-lying neighbourhoods.\n\nC. The health evidence is striking. In a famous 1984 study, hospital patients whose windows faced trees recovered from surgery faster and requested less pain medication than patients looking at a brick wall. Later research has linked leafy streets with lower stress levels, more walking, and even small improvements in concentration among schoolchildren. Greenery seems to work on the mind as well as the lungs.\n\nD. Trees pay their way in money, too. Houses on tree-lined streets sell for more, and shoppers linger longer — and spend more — where there is shade. Tools such as the i-Tree software developed by the US Forest Service let city councils put a dollar figure on these services, from cooling to stormwater capture, and the totals routinely exceed the cost of planting and pruning many times over.\n\nE. None of this makes urban forestry simple. Roots lift pavements, branches meet power lines, and maintenance budgets are often the first thing cut. Planting huge numbers of a single fashionable species is a quiet gamble: when Dutch elm disease reached Britain in the 1970s, it killed tens of millions of elms and stripped whole streets bare. The modern rule is 'the right tree in the right place' — and as many different species as possible, so that no single pest can undo a century of growth.", "instructions_groups": [{"kind": "headings", "label": "Вопросы 14–18. Подберите заголовок к каждому абзацу A–E. Два заголовка лишние.", "options": ["i. Natural air conditioning", "ii. Trees pay their way", "iii. Choosing and caring for urban trees", "iv. Green views and human health", "v. Cleaner air and drier streets", "vi. Why some cities remove trees", "vii. The world's oldest street trees"], "questions": [{"no": 14, "q": "Абзац A"}, {"no": 15, "q": "Абзац B"}, {"no": 16, "q": "Абзац C"}, {"no": 17, "q": "Абзац D"}, {"no": 18, "q": "Абзац E"}]}, {"kind": "mc", "label": "Вопросы 19–22. Выберите один вариант.", "questions": [{"no": 19, "q": "In the 1984 study, patients with a view of trees", "options": ["A. stayed in hospital longer", "B. needed less pain medication", "C. complained about noise", "D. saw no difference in recovery"]}, {"no": 20, "q": "According to the passage, shoppers on shaded streets", "options": ["A. avoid the heat by staying home", "B. spend more time and money", "C. park more cars", "D. prefer indoor malls"]}, {"no": 21, "q": "i-Tree is described as", "options": ["A. a campaign against tree diseases", "B. software that estimates the value of trees' services", "C. a tree-planting charity", "D. a type of drought-resistant tree"]}, {"no": 22, "q": "Planting mostly one species is risky because", "options": ["A. it looks monotonous", "B. a single disease can destroy them all", "C. it is more expensive", "D. such trees grow too slowly"]}]}, {"kind": "ynng", "label": "Вопросы 23–26. YES — совпадает с мнением автора; NO — противоречит; NOT GIVEN — мнения нет.", "options": ["YES", "NO", "NOT GIVEN"], "questions": [{"no": 23, "q": "The benefits of urban trees are usually worth far more than their cost."}, {"no": 24, "q": "Tree roots inevitably make streets unusable."}, {"no": 25, "q": "City trees live longer than forest trees."}, {"no": 26, "q": "Money for tree maintenance is often cut first."}]}]}, {"title": "Reading the ice", "text": "High on the ice sheets of Greenland and Antarctica, snow that fell tens of thousands of years ago lies compressed into ice, layer upon layer, like the pages of a very cold book. By drilling down and pulling up long cylinders of ice — cores — scientists can read that book. Each year's snowfall forms a distinct band, so layers can be counted much as tree rings are; a core is a calendar reaching back through ice ages.\n\nThe real treasure lies inside the ice. As snow turns to ice, it seals tiny bubbles of air — actual samples of the ancient atmosphere. By crushing the ice in a vacuum and analysing the gas, researchers measure exactly how much carbon dioxide and methane the air held when a mammoth might have been walking overhead. Dust trapped in the layers reveals how dry and windy the planet was, and thin bands of volcanic ash pin down the dates of great eruptions, providing fixed points for the whole timeline.\n\nThe longest records are astonishing. The core drilled at Vostok station in Antarctica reached back more than 400,000 years; the European EPICA project later extended the archive to about 800,000 years — eight ice ages and the warm periods between them. Across all that time, two curves move together with remarkable consistency: when greenhouse gases rise, temperature rises, and when they fall, it falls. The cores also show that today's carbon-dioxide level is higher than at any point in the entire record.\n\nCollecting this evidence is brutal work. Drilling camps operate for short summer seasons in some of the most extreme conditions on Earth, and a single deep core can take several years of seasons to complete. The cylinders are then flown, carefully frozen, to archives kept at around minus thirty-five degrees, where researchers from many countries can sample them for decades to come.\n\nIce cores settled old arguments about whether climate and greenhouse gases are linked; the question they leave open is not scientific but human. The archive shows that the atmosphere we are creating has no precedent in almost a million years — and the next layers of the book are being written now.", "instructions_groups": [{"kind": "match", "label": "Вопросы 27–31. Что позволяет определить каждая находка? A — пузырьки воздуха, B — годовые слои, C — вулканический пепел, D — пыль. Буквы могут повторяться.", "options": ["A", "B", "C", "D"], "questions": [{"no": 27, "q": "Counting the age of the ice, like tree rings."}, {"no": 28, "q": "Measuring the composition of ancient air."}, {"no": 29, "q": "Fixing the dates of major eruptions."}, {"no": 30, "q": "Judging how dry and windy past climates were."}, {"no": 31, "q": "Comparing today's greenhouse-gas levels with the distant past."}]}, {"kind": "gap", "label": "Вопросы 32–36. Дополните предложения ОДНИМ словом или числом из текста.", "questions": [{"no": 32, "q": "The EPICA core covers about ______ years of climate history."}, {"no": 33, "q": "Ice layers are counted much like tree ______."}, {"no": 34, "q": "Core archives are kept at about minus ______ degrees."}, {"no": 35, "q": "Today's CO₂ level is ______ than at any point in the record."}, {"no": 36, "q": "A single deep core can take several ______ of seasons to drill."}]}, {"kind": "mc", "label": "Вопросы 37–40. Выберите один вариант.", "questions": [{"no": 37, "q": "Why are the air bubbles so valuable?", "options": ["A. They make the ice easier to drill", "B. They contain samples of ancient atmosphere", "C. They keep the ice frozen", "D. They show where to find fossils"]}, {"no": 38, "q": "What do the two curves in the long records show?", "options": ["A. Greenhouse gases and temperature move together", "B. Temperature never changes", "C. Dust levels control eruptions", "D. Ice ages have stopped occurring"]}, {"no": 39, "q": "The main purpose of the passage is to", "options": ["A. describe life at a polar station", "B. explain what ice cores reveal about climate", "C. compare Greenland with Antarctica", "D. argue against polar research"]}, {"no": 40, "q": "The author implies that current CO₂ levels are", "options": ["A. typical of warm periods", "B. impossible to measure", "C. without precedent in the record", "D. falling slowly"]}]}]}]}, "answers": {"1": {"a": ["TRUE"], "why": "По легенде листья случайно упали в кипящую воду императора."}, "2": {"a": ["TRUE"], "why": "«Buddhist monks... helped carry the custom to Japan»."}, "3": {"a": ["FALSE"], "why": "Первыми были португальские и голландские купцы."}, "4": {"a": ["FALSE"], "why": "Наоборот: она ввела чай в моду при дворе."}, "5": {"a": ["NOT GIVEN"], "why": "О пассажирах на клиперах текст не говорит."}, "6": {"a": ["TRUE"], "why": "«Uneasy about depending on a single supplier» — чтобы не зависеть от Китая."}, "7": {"a": ["FALSE"], "why": "Чай — второй после воды: «after water, the most consumed drink»."}, "8": {"a": ["Shennong"], "why": "«Water being boiled for the emperor Shennong»."}, "9": {"a": ["Dutch"], "why": "«Portuguese and Dutch merchants»."}, "10": {"a": ["East India"], "why": "«The East India Company held a monopoly»."}, "11": {"a": ["clippers"], "why": "«Fast sailing ships known as clippers»."}, "12": {"a": ["Assam", "India"], "why": "«Established plantations in Assam in India»."}, "13": {"a": ["Bedford"], "why": "«Anna, Duchess of Bedford»."}, "14": {"a": ["i"], "why": "Абзац A — деревья охлаждают улицы: «natural air conditioning»."}, "15": {"a": ["v"]

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thames — интерактивная версия (откройте файл в браузере)</title>
<style>
  :root{
    --milk:#F1ECDF; --cream:#FAF7EF; --graphite:#232E38; --graphite-800:#2C3944;
    --sky:#4A8FBF; --meadow:#5DA463; --meadow-t:#3C7A42;
    --tile:#C75B39; --tile-600:#B04D2E; --straw:#E4C97E;
    --tx:#232E38; --tx2:#5C6670; --line:#DFD7C4; --err:#B03A2E;
    --serif:Georgia,'Times New Roman',serif; /* в приложении — Yeseva One */
    --mono:ui-monospace,Menlo,Consolas,monospace; /* в приложении — JetBrains Mono */
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--tx); font-size:16px; line-height:1.55;
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif; /* в приложении — Golos Text */
    background:var(--milk); padding-bottom:110px;
  }
  .sw{position:absolute; opacity:0; pointer-events:none; width:0; height:0}

  header{padding:10px 16px 12px; border-bottom:1px solid var(--line); background:var(--cream);
    position:sticky; top:0; z-index:20}
  .brand{display:flex; align-items:center; gap:10px}
  .brand b{font-family:var(--serif); font-weight:400; font-size:21px}
  header p{font-size:11.5px; color:var(--tx2); margin:6px 0 0}

  .cover{display:block; width:100%; height:auto; border-bottom:1px solid var(--line)}

  main{max-width:640px; margin:0 auto; padding:18px 16px 40px}
  .view{display:none}
  #t-auth:checked  ~ main #v-auth{display:block}
  #t-home:checked  ~ main #v-home{display:block}
  #t-art:checked   ~ main #v-art{display:block}
  #t-ob:checked    ~ main #v-ob{display:block}
  #t-ielts:checked ~ main #v-ielts{display:block}
  #t-mock:checked  ~ main #v-mock{display:block}
  #t-plan:checked  ~ main #v-plan{display:block}
  #t-chat:checked  ~ main #v-chat{display:block}
  #t-ucas:checked  ~ main #v-ucas{display:block}
  #t-mot:checked   ~ main #v-mot{display:block}
  #t-read:checked  ~ main #v-read{display:block}
  #t-writ:checked  ~ main #v-writ{display:block}
  #t-speak:checked ~ main #v-speak{display:block}
  #t-tarif:checked ~ main #v-tarif{display:block}
  #t-games:checked ~ main #v-games{display:block}
  /* обложка видна только на экране входа */
  #t-auth:checked ~ .cover{display:block}
  .cover{display:none}

  h1{font-family:var(--serif); font-weight:400; font-size:26px; line-height:1.15; margin:2px 0 8px}
  h3{font-family:var(--serif); font-weight:400}
  .sub{color:var(--tx2); font-size:13.5px; margin:0 0 16px}
  .stamp{font-family:var(--mono); font-weight:700; font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--tile)}
  .stamp::before{content:"[ "} .stamp::after{content:" ]"}
  .btn{display:inline-block; background:var(--tile); color:var(--cream); border-radius:12px;
    padding:12px 20px; font-weight:700; font-size:14px; cursor:pointer; border:0; text-align:center}
  .btn:hover{background:var(--tile-600)}
  .ghost{display:inline-block; background:transparent; border:1.5px solid var(--graphite); color:var(--graphite);
    border-radius:12px; padding:11px 16px; font-weight:600; font-size:13.5px; cursor:pointer; text-align:center}
  .card{background:var(--cream); border:1px solid var(--line); border-radius:16px; padding:15px; margin-bottom:11px;
    box-shadow:0 1px 2px rgba(35,46,56,.05)}
  .chip{display:inline-block; border-radius:999px; padding:4px 11px;
    font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    background:var(--cream); border:1px solid var(--line); color:var(--tx2)}
  .chip.mint{color:var(--meadow-t); border-color:rgba(93,164,99,.55); background:rgba(93,164,99,.1)}
  .step{display:none}
  .founder{background:var(--graphite); border-radius:12px; padding:9px 11px;
    font-size:11.5px; line-height:1.45; white-space:pre-line; margin-top:10px; color:rgba(250,247,239,.8)}
  .founder b{color:var(--straw); font-family:var(--mono); font-size:9px; letter-spacing:.08em;
    text-transform:uppercase; display:block; margin-bottom:2px}
  .field{display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:700; margin-bottom:9px}
  .field input, .field textarea{background:var(--cream); border:1px solid var(--line); border-radius:11px;
    padding:11px; color:var(--tx); font-size:14px; font-family:inherit}

  /* ---------- меню-кнопка ----------
     Телефон: правый нижний угол. Планшет/десктоп (≥768px): правый ВЕРХНИЙ угол,
     меню раскрывается вниз. В настоящем приложении кнопку можно перетащить,
     зажав её на полсекунды, — позиция запоминается (в CSS-копии жест не работает). */
  .backdrop{display:none; position:fixed; inset:0; background:rgba(35,46,56,.28); z-index:30}
  #c-menu:checked ~ .backdrop{display:block}
  .fabwrap{position:fixed; right:14px; bottom:14px; z-index:40; display:flex; flex-direction:column; align-items:flex-end; gap:10px}
  @media(min-width:768px){
    .fabwrap{bottom:auto; top:86px; flex-direction:column-reverse}
  }
  /* телефон: меню — нижняя панель на всю ширину с «ручкой» */
  @media(max-width:767px){
    #c-menu:checked ~ .fabwrap .menu{
      position:fixed; left:0; right:0; bottom:0; z-index:45;
      min-width:0; max-height:72vh; overflow-y:auto;
      border-radius:22px 22px 0 0; border-left:0; border-right:0; border-bottom:0;
      padding:14px 14px 18px;
      box-shadow:0 -14px 40px rgba(35,46,56,.28);
    }
    #c-menu:checked ~ .fabwrap .menu::before{
      content:""; display:block; width:44px; height:4px; border-radius:2px;
      background:var(--line); margin:0 auto 10px;
    }
    .menu label{min-height:48px; font-size:15px}
  }
  .sub-hint{margin-left:auto; color:var(--tx2); font-size:17px}
  .menu-close{justify-content:center; color:var(--tx2); border-top:1px solid var(--line);
    border-radius:0; margin-top:6px; font-size:13.5px !important}
  .fab{min-height:54px; border-radius:999px; border:0; background:var(--graphite);
    color:var(--cream); font-size:13px; font-weight:700; padding:0 18px; display:flex; align-items:center; gap:9px;
    cursor:pointer; box-shadow:0 6px 18px rgba(35,46,56,.3)}
  #c-menu:checked ~ .fabwrap .fab{background:var(--tile)}
  .menu{display:none; background:var(--cream); border:1px solid var(--line); border-radius:16px;
    padding:8px; flex-direction:column; gap:2px; min-width:240px; box-shadow:0 12px 32px rgba(35,46,56,.2)}
  #c-menu:checked ~ .fabwrap .menu{display:flex}
  .menu label{display:flex; align-items:center; gap:11px; min-height:42px; color:var(--tx2);
    font-size:14px; font-weight:600; border-radius:10px; padding:7px 11px; cursor:pointer}
  .menu label:hover{background:var(--milk)}
  .menu .grp{font-size:14px; font-weight:600; color:var(--tx); display:flex; gap:11px; align-items:center; padding:8px 11px}
  .menu .sub-items{border-left:1px solid var(--line); margin-left:21px; padding-left:12px; display:flex; flex-direction:column; gap:2px}
  .ic{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none}
  .icw{position:relative; width:22px; height:22px; flex:none}
  .spark{position:absolute; top:-2px; right:-4px; width:9px; height:9px; opacity:0}
  .spark circle{fill:var(--tile)}
  /* активный пункт: подсветка + терракотовая точка-«солнце», иконка терракотовая */
  #t-home:checked  ~ .fabwrap label[for=t-home],
  #t-art:checked   ~ .fabwrap label[for=t-home],
  #t-plan:checked  ~ .fabwrap label[for=t-plan],
  #t-chat:checked  ~ .fabwrap label[for=t-chat],
  #t-ucas:checked  ~ .fabwrap label[for=t-ucas],
  #t-mot:checked   ~ .fabwrap label[for=t-mot],
  #t-ielts:checked ~ .fabwrap label[for=t-ielts],
  #t-mock:checked  ~ .fabwrap label[for=t-ielts],
  #t-read:checked  ~ .fabwrap label[for=t-ielts],
  #t-writ:checked  ~ .fabwrap label[for=t-ielts],
  #t-speak:checked ~ .fabwrap label[for=t-ielts],
  #t-tarif:checked ~ .fabwrap label[for=t-tarif],
  #t-games:checked ~ .fabwrap label[for=t-games]{color:var(--graphite); background:var(--milk)}
  #t-home:checked  ~ .fabwrap label[for=t-home] .spark,
  #t-art:checked   ~ .fabwrap label[for=t-home] .spark,
  #t-plan:checked  ~ .fabwrap label[for=t-plan] .spark,
  #t-chat:checked  ~ .fabwrap label[for=t-chat] .spark,
  #t-ucas:checked  ~ .fabwrap label[for=t-ucas] .spark,
  #t-mot:checked   ~ .fabwrap label[for=t-mot] .spark,
  #t-ielts:checked ~ .fabwrap label[for=t-ielts] .spark,
  #t-mock:checked  ~ .fabwrap label[for=t-ielts] .spark,
  #t-read:checked  ~ .fabwrap label[for=t-ielts] .spark,
  #t-writ:checked  ~ .fabwrap label[for=t-ielts] .spark,
  #t-speak:checked ~ .fabwrap label[for=t-ielts] .spark,
  #t-tarif:checked ~ .fabwrap label[for=t-tarif] .spark,
  #t-games:checked ~ .fabwrap label[for=t-games] .spark{opacity:1}
  #t-home:checked  ~ .fabwrap label[for=t-home] .ic,
  #t-art:checked   ~ .fabwrap label[for=t-home] .ic,
  #t-plan:checked  ~ .fabwrap label[for=t-plan] .ic,
  #t-chat:checked  ~ .fabwrap label[for=t-chat] .ic,
  #t-ucas:checked  ~ .fabwrap label[for=t-ucas] .ic,
  #t-mot:checked   ~ .fabwrap label[for=t-mot] .ic,
  #t-ielts:checked ~ .fabwrap label[for=t-ielts] .ic,
  #t-mock:checked  ~ .fabwrap label[for=t-ielts] .ic,
  #t-read:checked  ~ .fabwrap label[for=t-ielts] .ic,
  #t-writ:checked  ~ .fabwrap label[for=t-ielts] .ic,
  #t-speak:checked ~ .fabwrap label[for=t-ielts] .ic,
  #t-tarif:checked ~ .fabwrap label[for=t-tarif] .ic,
  #t-games:checked ~ .fabwrap label[for=t-games] .ic{color:var(--tile)}

  /* ---------- облачный декор и небесная обложка ---------- */
  .sky-decor{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
  .sky-decor .sd{position:absolute; opacity:.55; pointer-events:auto;
    transition:transform 1.1s cubic-bezier(.45,0,.85,.6), opacity 1.1s ease-in}
  .sky-decor .sd label{display:block; cursor:pointer}
  .sky-decor .sd-1{top:150px; right:-140px}
  .sky-decor .sd-2{top:52vh; left:-60px; opacity:.4}
  main, header{position:relative; z-index:1}
  /* пустоты контента пропускают клики к облакам, элементы — нет */
  main, main .view{pointer-events:none}
  main .view > *, header *{pointer-events:auto}
  /* улетание по клику */
  #c-fly1:checked ~ .sky-decor .sd-1{transform:translate(120vw,-45vh) rotate(4deg); opacity:0}
  #c-fly2:checked ~ .sky-decor .sd-2{transform:translate(-120vw,-40vh) rotate(-4deg); opacity:0}
  #c-fly3:checked ~ .sky-decor .sd-x1{transform:translate(120vw,-40vh) rotate(4deg); opacity:0}
  #c-fly4:checked ~ .sky-decor .sd-x2{transform:translate(-120vw,-45vh) rotate(-4deg); opacity:0}
  #c-fly5:checked ~ .sky-decor .sd-x3{transform:translate(120vw,-50vh) rotate(4deg); opacity:0}
  /* «добавить облачности»: каждое нажатие генерирует одно облако (лимит 6).
     Кнопка только добавляет — убрать облако можно лишь кликом по нему. */
  .sd-extra{display:none}
  #c-m1:checked ~ .sky-decor .sd-x1, #c-m2:checked ~ .sky-decor .sd-x2,
  #c-m3:checked ~ .sky-decor .sd-x3, #c-m4:checked ~ .sky-decor .sd-x4,
  #c-m5:checked ~ .sky-decor .sd-x5, #c-m6:checked ~ .sky-decor .sd-x6{
    display:block; animation:sd-pop .5s cubic-bezier(.2,1.3,.5,1)}
  @keyframes sd-pop{from{transform:scale(.3); opacity:0}}
  .sd-x1{top:26vh; right:-50px; opacity:.5}
  .sd-x2{top:70vh; right:6vw; opacity:.4}
  .sd-x3{top:12vh; left:-46px; opacity:.45}
  .sd-x4{top:42vh; left:5vw; opacity:.35}
  .sd-x5{top:84vh; left:-40px; opacity:.45}
  .sd-x6{top:56vh; right:-64px; opacity:.5}
  #c-fly6:checked ~ .sky-decor .sd-x4{transform:translate(-120vw,-42vh) rotate(-4deg); opacity:0}
  #c-fly7:checked ~ .sky-decor .sd-x5{transform:translate(-120vw,-48vh) rotate(-4deg); opacity:0}
  #c-fly8:checked ~ .sky-decor .sd-x6{transform:translate(120vw,-44vh) rotate(4deg); opacity:0}
  .cloud-add{position:fixed; left:14px; bottom:14px; z-index:30; display:none; align-items:center; gap:7px;
    background:var(--cream); border:1px solid var(--line); border-radius:999px; padding:10px 15px;
    font-size:12.5px; font-weight:600; color:var(--tx2); cursor:pointer;
    box-shadow:0 4px 14px rgba(35,46,56,.12)}
  /* цепочка из 6 нажатий: видна всегда ровно одна кнопка-этап */
  .ca-1{display:flex}
  #c-m1:checked ~ .ca-1{display:none} #c-m1:checked ~ .ca-2{display:flex}
  #c-m2:checked ~ .ca-2{display:none} #c-m2:checked ~ .ca-3{display:flex}
  #c-m3:checked ~ .ca-3{display:none} #c-m3:checked ~ .ca-4{display:flex}
  #c-m4:checked ~ .ca-4{display:none} #c-m4:checked ~ .ca-5{display:flex}
  #c-m5:checked ~ .ca-5{display:none} #c-m5:checked ~ .ca-6{display:flex}
  #c-m6:checked ~ .ca-6{display:none} #c-m6:checked ~ .ca-done{display:flex}
  .ca-done{pointer-events:none; opacity:.55}
  .home-hero{position:relative; border-radius:18px; overflow:hidden; margin:2px 0 12px;
    border:1px solid var(--line); box-shadow:0 8px 24px rgba(35,46,56,.12)}
  .hh-scene{display:block; width:100%; height:auto; min-height:200px}
  .hh-copy{position:absolute; left:18px; right:18px; bottom:32px; color:var(--cream)}
  .hh-copy .stamp{color:var(--cream); text-shadow:0 1px 2px rgba(35,46,56,.3)}
  .hh-copy h1{color:#fff; margin:8px 0 5px; text-shadow:0 1px 3px rgba(35,46,56,.3)}
  .hh-copy p{margin:0; max-width:32ch; font-size:12.5px; color:#FCFAF4; text-shadow:0 1px 2px rgba(35,46,56,.35)}

  /* ---------- главная: статьи и соцсети ---------- */
  .art-card{display:block; background:var(--cream); border:1px solid var(--line); border-radius:15px;
    padding:14px; margin-bottom:9px; cursor:pointer; box-shadow:0 1px 2px rgba(35,46,56,.05)}
  .art-card:hover{border-color:var(--tile)}
  .art-cat{display:block; font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; color:var(--tile); margin-bottom:7px}
  .art-card b{display:block; font-family:var(--serif); font-weight:400; font-size:16.5px; line-height:1.3; margin-bottom:5px}
  .art-card p{margin:0; font-size:12.5px; color:var(--tx2)}
  .soc-card{display:flex; gap:11px; align-items:flex-start; background:var(--cream); border:1px solid var(--line);
    border-radius:15px; padding:13px 14px; margin-bottom:9px; text-decoration:none; color:var(--tx)}
  .soc-card b{display:block; font-size:14px}
  .soc-handle{display:block; font-family:var(--mono); font-size:10.5px; color:var(--sky); margin:1px 0 3px}
  .soc-card p{margin:0; font-size:12px; color:var(--tx2)}
  .soc-ic{display:inline-flex; width:36px; height:36px; border-radius:10px; flex:none; align-items:center;
    justify-content:center; background:var(--milk); border:1px solid var(--line); color:var(--tile)}
  .art-body{font-size:14px; line-height:1.6}
  .art-body h3{font-family:var(--serif); font-weight:400; font-size:18px; margin:20px 0 6px}
  .art-body p{margin:0 0 11px}
  .art-body ul{margin:0 0 11px; padding-left:18px}
  .art-body li{margin-bottom:4px}

  /* ---------- мини-игры: CSS-виселица (слово CLOUD) ---------- */
  .hg{display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap}
  .hg-gallows{width:150px; flex:none; background:var(--cream); border:1px solid var(--line); border-radius:14px}
  .hg-gallows .hp{opacity:0}
  #g-a:checked ~ main .hp-1{opacity:1}
  #g-e:checked ~ main .hp-2{opacity:1}
  #g-t:checked ~ main .hp-3{opacity:1}
  .hg-side{flex:1; min-width:180px}
  .hg-slots{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:8px}
  .hg-slot{width:32px; height:40px; display:inline-flex; align-items:center; justify-content:center;
    background:var(--cream); border:1px solid var(--line); border-bottom:3px solid var(--graphite);
    border-radius:8px; font-family:var(--mono); font-weight:700; font-size:19px}
  .hg-slot b{visibility:hidden}
  #g-c:checked ~ main .hs-c b{visibility:visible}
  #g-l:checked ~ main .hs-l b{visibility:visible}
  #g-o:checked ~ main .hs-o b{visibility:visible}
  #g-u:checked ~ main .hs-u b{visibility:visible}
  #g-d:checked ~ main .hs-d b{visibility:visible}
  .hg-kb{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
  .hg-kb label{width:40px; height:42px; display:inline-flex; align-items:center; justify-content:center;
    background:var(--cream); border:1px solid var(--line); border-radius:9px;
    font-family:var(--mono); font-weight:700; font-size:15px; cursor:pointer}
  #g-c:checked ~ main label[for=g-c], #g-l:checked ~ main label[for=g-l],
  #g-o:checked ~ main label[for=g-o], #g-u:checked ~ main label[for=g-u],
  #g-d:checked ~ main label[for=g-d]{opacity:.35; pointer-events:none; border-color:var(--meadow)}
  #g-a:checked ~ main label[for=g-a], #g-e:checked ~ main label[for=g-e],
  #g-t:checked ~ main label[for=g-t]{opacity:.35; pointer-events:none; border-color:var(--err)}
  .hg-win, .hg-lose{display:none; margin-top:10px}
  #g-c:checked ~ #g-l:checked ~ #g-o:checked ~ #g-u:checked ~ #g-d:checked ~ main .hg-win{display:block}
  #g-a:checked ~ #g-e:checked ~ #g-t:checked ~ main .hg-lose{display:block}

  /* ---------- хаб IELTS и полный мок ---------- */
  #c-sub:checked ~ main .lock-chip{display:none}
  .hub-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
  .hub-card{display:block; background:var(--cream); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:10px; cursor:pointer; box-shadow:0 1px 2px rgba(35,46,56,.05)}
  .hub-card:hover{border-color:var(--tile)}
  .hub-card b{display:block; font-family:var(--serif); font-weight:400; font-size:18px; margin:8px 0 5px}
  .hub-card p{margin:0; font-size:13px; color:var(--tx2)}
  .hub-ic{display:inline-flex; width:38px; height:38px; border-radius:11px; align-items:center;
    justify-content:center; background:var(--milk); border:1px solid var(--line); color:var(--tile)}
  .mk-bands{display:flex; gap:7px; flex-wrap:wrap; margin:10px 0 4px}
  .mk-cell{flex:1 1 60px; background:var(--cream); border:1px solid var(--line); border-radius:12px;
    padding:9px 6px; text-align:center}
  .mk-cell span{display:block; font-family:var(--mono); font-size:9px; color:var(--tx2); font-weight:700;
    text-transform:uppercase; letter-spacing:.07em; margin-bottom:3px}
  .mk-cell b{font-family:var(--mono); font-size:17px}
  .mk-cell.overall{border-color:var(--tile); background:rgba(199,91,57,.06)}
  .mk-cell.overall b{color:var(--tile)}

  /* ---------- опросник (диагностика) ---------- */
  #c-gcalc:checked ~ main .s-gcalc{display:block}
  #c-gcalc:checked ~ main .s-gmanual{display:none}
  #c-obdone:checked ~ main .s-obres{display:block}
  #c-obdone:checked ~ main .s-obform{display:none}
  .q-chip{display:inline-block; border:1px solid var(--line); background:var(--cream); border-radius:999px;
    padding:8px 13px; font-size:12.5px; font-weight:600; margin:0 6px 6px 0}
  .q-chip.on{border-color:var(--tile); color:var(--tile); background:rgba(199,91,57,.08)}

  /* ---------- вход ---------- */
  #c-login:checked ~ main .s-logged{display:block}
  #c-login:checked ~ main .s-login-form{display:none}

  /* ---------- план ---------- */
  .pi{display:flex; gap:11px; align-items:flex-start; background:var(--cream);
    border:1px solid var(--line); border-radius:14px; padding:12px 13px; margin-bottom:8px; cursor:pointer;
    box-shadow:0 1px 2px rgba(35,46,56,.05)}
  .pi input{width:20px; height:20px; margin-top:1px; accent-color:var(--meadow); flex:none}
  .pi .t{font-weight:600; font-size:14px}
  .pi .d{font-size:12px; color:var(--tx2); margin-top:1px}
  .badge{margin-left:auto; flex:none; font-family:var(--mono); font-size:10px; font-weight:700; border-radius:999px; padding:3px 8px; white-space:nowrap}
  .badge.soon{background:rgba(199,91,57,.12); border:1px solid rgba(199,91,57,.4); color:var(--tile)}
  .badge.far{background:var(--milk); border:1px solid var(--line); color:var(--tx2)}
  .badge.ok{background:rgba(93,164,99,.12); border:1px solid rgba(93,164,99,.45); color:var(--meadow-t)}
  .pi:has(input:checked){opacity:.6}
  .pi:has(input:checked) .t{text-decoration:line-through}

  /* ---------- чат ---------- */
  .msg{max-width:90%; border-radius:13px; padding:9px 12px; font-size:13.5px; line-height:1.5;
    white-space:pre-line; margin-bottom:8px; word-wrap:break-word}
  .m-user{background:var(--graphite); color:var(--cream); margin-left:auto; border-bottom-right-radius:4px}
  .m-bot{background:var(--cream); border:1px solid var(--line); border-bottom-left-radius:4px}
  .m-cur{border-color:rgba(74,143,191,.6); background:#EFF4F8}
  .m-cur::before{content:"Куратор"; display:block; font-family:var(--mono); font-size:9.5px; font-weight:700; color:var(--sky);
    margin-bottom:4px; text-transform:uppercase; letter-spacing:.08em}
  .src{display:block; margin-top:6px; font-size:11.5px; color:var(--tx2)}
  .ask{display:block; width:100%; background:var(--cream); border:1px solid var(--line); color:var(--tile);
    border-radius:11px; padding:10px 12px; font-size:12.5px; font-weight:700; cursor:pointer; text-align:center; margin-bottom:8px}
  #c-a1:checked ~ main .s-a1{display:block} #c-a1:checked ~ main label[for="c-a1"]{display:none}
  #c-a2:checked ~ main .s-a2{display:block} #c-a2:checked ~ main label[for="c-a2"]{display:none}
  #c-esc:checked ~ main .s-esc{display:block} #c-esc:checked ~ main label[for="c-esc"]{display:none}

  /* ---------- бары/кольца ---------- */
  .ring{width:130px; height:130px; border-radius:50%; flex:none; margin:0 auto 14px;
    background:conic-gradient(var(--tile) 0 72%, #E3DCC9 0);
    display:flex; align-items:center; justify-content:center}
  .ring .in{width:100px; height:100px; border-radius:50%; background:var(--cream);
    display:flex; flex-direction:column; align-items:center; justify-content:center}
  .ring b{font-family:var(--mono); font-size:28px} .ring span{font-size:9.5px; color:var(--tx2)}
  .crit{background:var(--cream); border:1px solid var(--line); border-radius:13px; padding:11px 13px; margin-bottom:8px}
  .cr{display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:6px}
  .cr span:last-child{font-family:var(--mono)}
  .bar{height:5px; border-radius:3px; background:#E3DCC9; margin-bottom:6px; overflow:hidden}
  .bar i{display:block; height:100%; border-radius:3px}
  .g{background:var(--meadow)} .m{background:var(--sky)} .w{background:var(--tile)}
  .cc{font-size:12px; color:var(--tx2); margin:0}

  /* ---------- UCAS ---------- */
  #c-uq:checked ~ main .s-uform{display:block} #c-uq:checked ~ main .s-upick{display:none}
  #c-ucheck:checked ~ main .s-ures{display:block} #c-ucheck:checked ~ main .s-uform{display:none}
  .fixes{padding-left:18px; margin:0; display:flex; flex-direction:column; gap:10px; font-size:13px}
  .was{color:var(--tx2); text-decoration:line-through; text-decoration-color:var(--err)}
  .became{color:var(--meadow-t); font-weight:600}
  .why{display:block; color:var(--tx2); font-size:11.5px; margin-top:1px}

  /* ---------- мотивационное письмо ---------- */
  #c-mcheck:checked ~ main .s-mres{display:block} #c-mcheck:checked ~ main .s-mform{display:none}
  details{background:var(--cream); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:12px}
  details summary{font-size:14px; font-weight:700; cursor:pointer}
  details[open] summary{margin-bottom:9px}
  .instr{font-size:12.5px; color:var(--tx2); line-height:1.55}
  .instr b{color:var(--tx)}
  .instr ol, .instr ul{padding-left:17px; margin:5px 0 11px}
  .instr li{margin-bottom:4px}

  /* ---------- Reading ---------- */
  #c-r1:checked ~ main .s-rtest{display:block} #c-r1:checked ~ main .s-rstart{display:none}
  #c-r2:checked ~ main .s-rres{display:block} #c-r2:checked ~ main .s-rtest{display:none}
  .timer{width:66px; height:66px; border-radius:50%; flex:none;
    background:conic-gradient(var(--tile) 0 98%, #E3DCC9 0);
    display:flex; align-items:center; justify-content:center}
  .timer .in{width:52px; height:52px; border-radius:50%; background:var(--cream);
    display:flex; flex-direction:column; align-items:center; justify-content:center}
  .timer b{font-family:var(--mono); font-size:11.5px; font-variant-numeric:tabular-nums} .timer span{font-size:8px; color:var(--tx2)}
  .rt-head{display:flex; gap:12px; align-items:center; background:var(--cream);
    border:1px solid var(--line); border-radius:14px; padding:9px 12px; margin-bottom:12px;
    position:sticky; top:86px; z-index:10; box-shadow:0 4px 14px rgba(35,46,56,.07)}
  .passage{background:var(--cream); border:1px solid var(--line); border-radius:14px; padding:13px 15px;
    font-size:13px; line-height:1.6; max-height:200px; overflow-y:auto; margin-bottom:12px; color:var(--tx2)}
  .passage b{color:var(--tx); font-family:var(--serif); font-weight:400; font-size:14.5px}
  .q{background:var(--cream); border:1px solid var(--line); border-radius:13px; padding:11px 13px; margin-bottom:9px}
  .q p{font-size:13px; margin:0 0 9px}
  .q p b{color:var(--tile); font-family:var(--mono)}
  .pills{display:flex; flex-wrap:wrap; gap:6px}
  .pills label{border:1px solid var(--line); background:var(--milk); border-radius:999px; padding:7px 13px; font-size:12px; font-weight:600; cursor:pointer}
  .pills input{position:absolute; opacity:0; width:0; height:0}
  .pills label:has(input:checked){border-color:var(--tile); color:var(--tile); background:rgba(199,91,57,.08)}
  .rev{border:1px solid var(--line); border-radius:11px; padding:9px 12px; margin-bottom:7px; background:var(--cream); font-size:12.5px}
  .rev .no{font-weight:800; margin-right:6px; font-family:var(--mono)}
  .rev.ok .no{color:var(--meadow-t)} .rev.bad .no{color:var(--err)}
  .rev .why{margin-top:3px}

  /* ---------- Writing ---------- */
  #c-w1:checked ~ main .s-wtest{display:block} #c-w1:checked ~ main .s-wstart{display:none}
  #c-w2:checked ~ main .s-wres{display:block} #c-w2:checked ~ main .s-wtest{display:none}

  /* ---------- Speaking / Тариф ---------- */
  #c-sub:checked ~ main .s-nosub{display:none}
  .s-hasub{display:none}
  #c-sub:checked ~ main .s-hasub{display:block}
  .rec{width:64px; height:64px; border-radius:50%; border:0; background:var(--tile); color:var(--cream);
    font-size:24px; cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center}
  #c-rec:checked ~ main .s-fb{display:block} #c-rec:checked ~ main .rec-row{display:none}
  .rec-row{display:flex; gap:13px; align-items:center; margin:14px 0}
  #c-pay:checked ~ main .s-payform{display:block} #c-pay:checked ~ main .tf-buy{display:none}
  #c-sub:checked ~ main .s-payform{display:none} #c-sub:checked ~ main .s-subon{display:block}
  .tf{background:var(--cream); border:1px solid var(--line); border-radius:16px; padding:15px; margin-bottom:11px;
    box-shadow:0 1px 2px rgba(35,46,56,.05)}
  .tf.hot{border-color:var(--tile); box-shadow:0 0 0 1px var(--tile) inset}
  .tf h3{margin:0 0 3px; font-size:17px}
  .tf .pr{font-family:var(--serif); font-size:21px}
  .tf .pr small{font-size:11.5px; color:var(--tx2); font-family:var(--mono)}
  .tf ul{margin:7px 0 11px; padding-left:17px; color:var(--tx2); font-size:12.5px}


  /* --- интерактивная версия: js-роутер вместо чекбоксов --- */
  .view{display:none} .view.on{display:block}
  .cover{display:none} body[data-view=auth] .cover{display:block}
  .menu label{user-select:none}
  .fabwrap.menu-left{align-items:flex-start}
  .fabwrap.menu-below{flex-direction:column-reverse}
  .fab.dragging{transform:scale(1.07)}
  .iform label{display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:700; margin-bottom:10px}
  .iform input, .iform textarea, .iform select{background:var(--cream); border:1px solid var(--line);
    border-radius:11px; padding:12px; color:var(--tx); font-size:15px; font-family:inherit}
  .iform textarea{resize:vertical; line-height:1.55}
  .ob-opts{display:flex; flex-direction:column; gap:8px; margin-top:12px}
  .ob-opts button{text-align:left; background:var(--cream); border:1px solid var(--line); color:var(--tx);
    border-radius:13px; padding:13px 15px; font-size:14.5px; font-weight:600; cursor:pointer; font-family:inherit}
  .ob-opts button:hover{border-color:var(--tile)}
  .gbar{height:6px; border-radius:3px; background:#E3DCC9; overflow:hidden; margin:12px 0 16px}
  .gbar i{display:block; height:100%; background:var(--tile); transition:width .25s}
  .msgrow{display:flex; gap:8px; margin-top:10px}
  .msgrow textarea{flex:1; min-height:46px; max-height:110px}
  .msgrow button{background:var(--tile); color:var(--cream); border:0; border-radius:11px; width:46px; font-size:17px; cursor:pointer}
  .demo-note{background:rgba(228,201,126,.25); border:1px solid rgba(228,201,126,.8); border-radius:11px;
    padding:9px 12px; font-size:12px; color:#6b5820; margin:10px 0}
  .timerbox{display:flex; gap:12px; align-items:center; background:var(--cream); border:1px solid var(--line);
    border-radius:14px; padding:10px 12px; margin-bottom:10px; position:sticky; top:86px; z-index:5}
  .timerbox b{font-family:var(--mono); font-size:20px}
  .g-key[disabled]{opacity:.35; pointer-events:none}

  /* js-версия меню: показ через [hidden], а не чекбокс */
  .menu:not([hidden]){display:flex}
  .backdrop:not([hidden]){display:block}
  @media(max-width:767px){
    .menu:not([hidden]){
      position:fixed; left:0; right:0; bottom:0; z-index:45;
      min-width:0; max-height:72vh; overflow-y:auto;
      border-radius:22px 22px 0 0; border-left:0; border-right:0; border-bottom:0;
      padding:14px 14px 18px; box-shadow:0 -14px 40px rgba(35,46,56,.28);
    }
    .menu:not([hidden])::before{content:""; display:block; width:44px; height:4px;
      border-radius:2px; background:var(--line); margin:0 auto 10px;}
  }
  button.cloud-add{display:flex}
  button.cloud-add:disabled{opacity:.55; pointer-events:none}

  /* --- стили мини-игр и общих карточек (перенос из app.css) --- */
  .lnk{background:none;border:0;color:var(--sky);font-weight:600;cursor:pointer;padding:0;font-size:14px;font-family:inherit}
  .acard{background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:11px;box-shadow:0 1px 2px rgba(35,46,56,.05)}
  .btn-primary{display:inline-block;background:var(--tile);color:var(--cream);font-weight:600;font-size:15px;
    padding:13px 20px;border:0;border-radius:12px;cursor:pointer;min-height:44px;font-family:inherit}
  .btn-primary:hover{background:var(--tile-600)}
  .status-line{min-height:1.3em;font-size:13.5px;color:var(--tx2);margin:10px 0}
  .status-line.err{color:var(--err)}
  .game-root{max-width:560px}
  .g-head{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .g-bar{height:6px;border-radius:3px;background:#E3DCC9;overflow:hidden}
  .g-bar i{display:block;height:100%;background:var(--tile);border-radius:3px;transition:width .25s ease}
  .g-diff{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .g-opt{text-align:left;background:var(--milk);border:1px solid var(--line);color:var(--tx);
    border-radius:13px;padding:13px 16px;font-size:15px;font-weight:600;cursor:pointer;min-height:44px;font-family:inherit}
  .g-opt span{display:block;font-weight:400;font-size:12.5px;color:var(--tx2);margin-top:2px}
  .g-opt:hover{border-color:var(--tile)}
  .g-opt:disabled{cursor:default}
  .g-opt.ok{border-color:var(--meadow);background:rgba(93,164,99,.12)}
  .g-opt.bad{border-color:var(--err);background:rgba(176,58,46,.08)}
  .g-opts{display:flex;flex-direction:column;gap:8px}
  .g-hang{display:flex;gap:18px;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap}
  .g-gallows{width:160px;flex:none;background:var(--cream);border:1px solid var(--line);border-radius:16px}
  .g-hang-side{flex:1;min-width:200px}
  .g-slots{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .g-slot{width:34px;height:42px;display:inline-flex;align-items:center;justify-content:center;
    background:var(--cream);border:1px solid var(--line);border-bottom:3px solid var(--tx);
    border-radius:8px;font-family:var(--mono);font-weight:700;font-size:20px}
  .g-hint{font-size:13.5px;color:var(--tx2);margin:0 0 6px;min-height:1.4em}
  .g-lives{font-size:13.5px;margin:0}
  .g-kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
  .g-key{min-height:42px;background:var(--cream);border:1px solid var(--line);border-radius:9px;
    font-family:var(--mono);font-weight:700;font-size:15px;color:var(--tx);cursor:pointer}
  .g-key:hover:not([disabled]){border-color:var(--tile);color:var(--tile)}
  .g-key[disabled]{opacity:.35;cursor:default}
  .g-answer{display:flex;gap:6px;flex-wrap:wrap;min-height:44px;align-items:center}
  .g-pool{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .g-chip{background:var(--milk);border:1px solid var(--line);border-radius:999px;padding:9px 14px;
    font-size:14.5px;font-weight:600;color:var(--tx);cursor:pointer;min-height:40px;font-family:inherit}
  .g-chip:hover{border-color:var(--tile)}
  .g-chip.on{background:rgba(199,91,57,.08);border-color:rgba(199,91,57,.45)}
  .g-check[disabled]{opacity:.5}
  .crit-list{display:flex;flex-direction:column;gap:10px}

  .soc-card{display:flex;gap:11px;align-items:flex-start;background:var(--cream);border:1px solid var(--line);
    border-radius:15px;padding:13px 14px;margin-bottom:9px;text-decoration:none;color:var(--tx)}
  .soc-card b{display:block;font-size:14px}
  .soc-handle{display:block;font-family:var(--mono);font-size:10.5px;color:var(--sky);margin:1px 0 3px}
  .soc-card p{margin:0;font-size:12px;color:var(--tx2)}
  .soc-ic{display:inline-flex;width:36px;height:36px;border-radius:10px;flex:none;align-items:center;
    justify-content:center;background:var(--milk);border:1px solid var(--line);color:var(--tile)}
  .art-body{font-size:14.5px;line-height:1.62;max-width:62ch}
  .art-body h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:20px 0 7px}
  .art-body p{margin:0 0 12px}
  .art-body ul,.art-body ol{margin:0 0 12px;padding-left:19px}
  .art-body li{margin-bottom:5px}
  .art-body i{color:var(--tx2)}

  .rec-idle,.rec-live{width:72px;height:72px;border-radius:50%;border:0;cursor:pointer;flex:none;
    font-size:26px;color:var(--cream)}
  .rec-idle{background:var(--tile)}
  .rec-live{background:var(--err);animation:recp 1.2s ease-in-out infinite}
  @keyframes recp{0%,100%{transform:scale(1)}50%{transform:scale(.92)}}

  .instr{font-size:12.5px;color:var(--tx2);line-height:1.55}
  .instr b{color:var(--tx)}
  .instr ol,.instr ul{padding-left:17px;margin:5px 0 11px}
  .instr li{margin-bottom:4px}
</style>
</head>

const LISTENING_DATA = {"test": {"id": "listening-1", "title": "Listening · Mock 1", "minutes": 30, "parts": [{"title": "Part 1 · Запись на курс английского (диалог)", "intro": "Разговор администратора языковой школы и студентки. Вопросы 1–10: дополните заметки ОДНИМ словом или числом.", "voices": ["A", "B"], "script": "A: Good morning, Riverside Language School, how can I help you?\nB: Hi! I'd like to book an English course, please.\nA: Of course. Can I take your name?\nB: It's Sarah Kowalski — that's K-O-W-A-L-S-K-I.\nA: Thank you, Sarah. And which level are you looking for? We run beginner, intermediate and advanced groups.\nB: I took a test online last week and it said intermediate.\nA: Perfect. The next intermediate group starts on the twelfth of September. There are three classes per week — Monday, Wednesday and Thursday.\nB: That works. Are the lessons in the morning?\nA: These ones are in the evening, from half past six. The price is two hundred and forty pounds per month, and we offer a ten per cent discount for students — do you have a student card?\nB: I do, yes.\nA: Lovely. Your classroom will be room fourteen, on the first floor. On your first day, please bring your passport so we can complete the registration.\nB: Got it. Oh — how do I reach you by public transport?\nA: The nearest bus stop is called Library — it's right opposite our entrance. Buses seven and twelve stop there.\nB: Wonderful. Thank you so much!\nA: See you on the twelfth, Sarah.", "groups": [{"kind": "gap", "label": "Вопросы 1–10. Дополните заметки ОДНИМ словом или числом из записи.", "questions": [{"no": 1, "q": "Surname: ______"}, {"no": 2, "q": "Course level: ______"}, {"no": 3, "q": "Start date: 12 ______"}, {"no": 4, "q": "Classes per week: ______"}, {"no": 5, "q": "Lessons take place in the ______"}, {"no": 6, "q": "Price per month: £______"}, {"no": 7, "q": "Discount available for ______"}, {"no": 8, "q": "Room number: ______"}, {"no": 9, "q": "On the first day bring your ______  earned Karl von Frisch the Nobel Prize in nineteen seventy-three. Since then, researchers have even built a robot bee that can dance convincingly enough to recruit real foragers. Modern studies show the system is sensitive: bees dance far less in rain, and there is growing evidence that certain pesticides impair the dance's accuracy. Understanding all this is not just beautiful science — city planners now use dance data to decide where to plant wildflower corridors, giving urban bees routes between feeding sites.", "groups": [{"kind": "gap", "label": "Вопросы 31–40. Дополните конспект ОДНИМ словом или числом.", "questions": [{"no": 31, "q": "A returning forager performs the «______ dance»."}, {"no": 32, "q": "The length of the dance shows the ______ to the food."}, {"no": 33, "q": "Outside the hive, direction is measured relative to the ______."}, {"no": 34, "q": "Inside the hive, the angle is translated relative to ______."}, {"no": 35, "q": "Watching bees follow the dance by touch and by ______."}, {"no": 36, "q": "Von Frisch received the Nobel Prize in ______ (год)."}, {"no": 37, "q": "Scientists built a ______ bee able to recruit real foragers."}, {"no": 38, "q": "Bees dance much less in ______."}, {"no": 39, "q": "Some ______ reduce the accuracy of the dance."}, {"no": 40, "q": "Dance data helps planners position wildflower ______."}]}]}]}, "answers": {"1": {"a": ["kowalski"], "why": "«Sarah Kowalski — K-O-W-A-L-S-K-I»."}, "2": {"a": ["intermediate"], "why": "«it said intermediate»."}, "3": {"a": ["september"], "why": "«starts on the twelfth of September»."}, "4": {"a": ["3", "three"], "why": "«three classes per week»."}, "5": {"a": ["evening"], "why": "«these ones are in the evening»."}, "6": {"a": ["240"], "why": "«two hundred and forty pounds per month»."}, "7": {"a": ["students"], "why": "«a ten per cent discount for students»."}, "8": {"a": ["14", "fourteen"], "why": "«room fourteen, on the first floor»."}, "9": {"a": ["passport"], "why": "«please bring y const ARTICLES = [{"slug": "foundation-year", "cat": "uk", "title": "Foundation Year: мост из российской школы в британский вуз", "teaser": "Почему с аттестатом РФ почти всегда идут через подготовительный год, как он устроен и во сколько обходится.", "min": 6, "body": "\n<p>Российский (и казахстанский) школьный аттестат — это 11 лет учёбы, а британские\nуниверситеты принимают на бакалавриат после 13: два последних года школьники сдают\nA-levels. Разницу закрывает <b>Foundation Year</b> — подготовительный год при\nуниверситете или его партнёрском колледже.</p>\n<h3>Как устроен год</h3>\n<p>Три составляющие: академические модули по выбранному направлению (например,\nBusiness, Engineering, Science), академический английский (эссе, конспекты,\nпрезентации) и учебные навыки. Успешно закончили — переходите на первый курс\nэтого же вуза, чаще всего без нового UCAS-цикла.</p>\n<h3>Что нужно для поступления</h3>\n<ul>\n<li>Аттестат со средним баллом обычно от 3.5–4.5 в зависимости от вуза;</li>\n<li>IELTS от 4.5–5.5 (для визы — UKVI Academic);</li>\n<li>мотивационное письмо на 300–500 слов — напрямую в вуз, не через UCAS.</li>\n</ul>\n<h3>Сколько стоит</h3>\n<p>£15–28 тыс. за учебный год в зависимости от вуза и города, плюс жильё и жизнь.\nЗаявки принимаются круглый год, но сильные программы заполняются к весне.</p>\n<p>Проверить, куда реально пройти с вашим баллом, можно в диагностике — подборка\nпоявится на странице «План».</p>\n", "cta": "Проверить письмо для Foundation", "go": "motivation"}, {"slug": "russell-group", "cat": "uk", "title": "Что такое Russell Group и стоит ли за ней гнаться", "teaser": "24 исследовательских университета, вокруг которых строится весь разговор о «престиже». Когда это важно, а когда — нет.", "min": 5, "body": "\n<p><b>Russell Group</b> — ассоциация 24 исследовательских университетов: Оксфорд,\nКембридж, UCL, Манчестер, Лидс, Глазго и другие. На них приходится большая часть\nисследовательского бюджета страны, и работодатели в консервативных сферах\n(право, финансы, консалтинг) смотрят на этот «лейбл» тепло.</p>\n<h3>Когда Russell Group важна</h3>\n<ul>\n<li>Планируете карьеру в корпоративном праве, инвестбанкинге, Big-4;</li>\n<li>целитесь в магистратуру мирового топа — бренд бакалавриата помогает;</li>\n<li>важна научная среда: лаборатории, гранты, преподаватели-исследователи.</li>\n</ul>\n<h3>Когда можно не гнаться</h3>\n<p>В IT, дизайне, гостеприимстве и стартапах портфолио и стажировки весят больше\nтаблички на входе. Скажем, по game design лидируют вовсе не расселловские вузы.\nА ещё вне группы часто мягче требования Foundation и ниже цена года.</p>\n<p>Честный вывод: выбирайте программу и город под свои цели и бюджет, а «группу» —\nкак бонус, а не как самоцель.</p>\n", "cta": "", "go": "home"}, {"slug": "uni-cities", "cat": "uk", "title": "Лондон, Манчестер или кампус у моря: как город меняет учёбу", "teaser": "Бюджет, темп жизни и шансы на подработку сильно зависят от города — разбираем на примерах.", "min": 5, "body": "\n<p>Один и тот же курс в Лондоне и в Ньюкасле — это два разных студенческих опыта\nи два разных бюджета.</p>\n<h3>Лондон</h3>\n<p>Максимум стажировок, событий и нетворкинга — и максимум расходов: жильё\n£800–1400 в месяц, транспорт съедает заметную долю бюджета. Для визы придётся\nпоказывать больше средств: требования к «сумме на жизнь» в Лондоне выше.</p>\n<h3>Большие студенческие города</h3>\n<p>Манчестер, Лидс, Бирмингем, Глазго: жильё £500–800, вся жизнь вращается вокруг\nуниверситетов, подработку найти реально. Хороший баланс цены и возможностей.</p>\n<h3>Кампусные и приморские</h3>\n<p>Ланкастер, Эксетер, Брайтон: компактно, безопасно, всё в шаговой доступности —\nидеально для первого года вдали от дома. Меньше суеты, но и меньше корпоративных\nсобытий — до них придётся ездить.</p>\n<p>Правило простое: чем дороже город, тем важнее заранее посчитать полный бюджет\nгода, а не только tuition fee.</p>\n", "cta": "", "go": "home"}, {"slug": "my-path", "cat": "ours", "title": "Как я поступил в UK из России: цифры, дедлайны и фейлы", "teaser": "История куратора thames от первого лица: без агентства, с IELTS в Казахстане и визой со второй попытки нервов.", "min": 7, "body": "\n<p>Меня зовут куратор thames, и весь этот сервис — мой задокументированный маршрут.\nКоротко о том, как выглядел путь на самом деле.</p>\n<h3>Цифры</h3>\n<ul>\n<li>7 месяцев от решения до оффера;</li>\n<li>IELTS сдавал в Алматы — слоты разобрали за месяц, брал оставшийся;</li>\n<li>агентства просили 200–500 тысяч рублей — прошёл сам, дорога и экзамен обошлись дешевле;</li>\n<li>3 черновика заявления улетели в корзину, четвёртый стал оффером.</li>\n</ul>\n<h3>Главные фейлы</h3>\n<p>Первый: тянул с бронированием IELTS — в итоге летел в другой город. Второй:\nв первом черновике письма рассказывал биографию вместо ответа «зачем мне этот курс».\nТретий: не знал про правило 28 дней для визовых финансов и чуть не подал выписку,\nкоторой не хватало недели.</p>\n<h3>Что из этого стало продуктом</h3>\n<p>Каждый фейл — теперь шаг в вашем плане с дедлайном и напоминанием: запись на\nIELTS за месяцы, проверка письма до подачи, финансовый чек-лист до открытия визы.\nУчитесь на моих ошибках — это дешевле.</p>\n", "cta": "Собрать мой план", "go": "ob"}, {"slug": "cost-of-uk", "cat": "ours", "title": "Сколько на самом деле стоит год в Британии", "teaser": "Tuition — только половина правды. Считаем полный бюджет: жильё, виза, IHS, перелёты и «мелочи», о которых забывают.", "min": 6, "body": "\n<p>В буклетах пишут стоимость обучения, но семейный бюджет ломают обычно остальные\nстроки. Считаем год Foundation вне Лондона, по средним значениям.</p>\n<h3>Большие статьи</h3>\n<ul>\n<li>Обучение: £15–28 тыс.;</li>\n<li>жильё: £6–9 тыс. за учебный год (студенческая резиденция);</li>\n<li>еда и быт: £3–4 тыс.;</li>\n<li>виза + IHS (медицинский сбор): виза ~£500 и IHS ~£800 за год — платятся сразу;</li>\n<li>перелёты и дорога: £600–1200 на два конца с багажом.</li>\n</ul>\n<h3>О чём забывают</h3>\n<p>Депозит за жильё, гарант или предоплата семестра, UKVI-версия IELTS дороже\nобычной, поездка в другую страну ради экзамена, зимняя одежда, первый набор посуды\nи постели. Закладывайте резерв 10–15% сверху.</p>\n<h3>Как показать деньги для визы</h3>\n<p>Средства должны непрерывно лежать на счёте 28 дней, а выписка — быть не старше\n31 дня на момент подачи. Подробности и типичные ошибки разберёт куратор.\n<i>Сервис не гарантирует визу и не является юридической консультацией — решения\nпринимают визовые органы.</i></p>\n", "cta": "Спросить ассистента про финансы", "go": "chat"}, {"slug": "ielts-8-weeks", "cat": "guides", "title": "План подготовки к IELTS за 8 недель", "teaser": "Реалистичный график с нашими тренажёрами: от диагностического мока до недели перед экзаменом.", "min": 8, "body": "\n<p>Восемь недель — честный срок, чтобы поднять балл на 0.5–1.0 при регулярных\nзанятиях. План рассчитан на 6–8 часов в неделю.</p>\n<h3>Недели 1–2 · диагностика и база</h3>\n<p>Пройдите полный Mock IELTS, зафиксируйте band по каждой секции. Дальше — по\n30–40 минут в день: Reading на время, подкасты для уха, дневник новых слов.</p>\n<h3>Недели 3–4 · Writing</h3>\n<p>Два эссе в неделю в тренажёре с таймером. Разбирайте правки «было → стало»\nи переписывайте те же темы — прогресс виден на второй итерации. Отдельно\nвыучите структуры Task 1: графики, таблицы, процессы.</p>\n<h3>Недели 5–6 · Speaking и Listening</h3>\n<p>Mock-интервью 3 раза в неделю: записывайте себя, слушайте паузы и повторы.\nВ Listening тренируйте части 3–4 — именно там теряются баллы.</p>\n<h3>Недели 7–8 · экзаменационный режим</h3>\n<p>Два полных мока в неделю в реальном тайминге, без пауз. Последние три дня —\nтолько повторение слов и сон: свежая голова даёт больше, чем зубрёжка ночью.</p>\n<p>Помните: в России IELTS не проводится с 2022 года — бронируйте слот в Казахстане,\nАрмении или Грузии за 4–6 недель, в пик сезона раньше.</p>\n", "cta": "Пройти Mock IELTS", "go": "ielts"}, {"slug": "ucas-three-questions", "cat": "guides", "title": "Три вопроса UCAS: что изменилось и как отвечать", "teaser": "Personal statement умер — теперь три конкретных вопроса и общий лимит 4000 символов. Структура ответа на каждый.", "min": 6, "body": "\n<p>С цикла 2026 года вместо сплошного personal statement UCAS спрашивает три вещи:</p>\n<ol>\n<li><b>Why do you want to study this course or subject?</b> — мотивация;</li>\n<li><b>How have your qualifications and studies helped you to prepare?</b> — учёба;</li>\n<li><b>What else have you done to prepare outside of education?</b> — опыт вне школы.</li>\n</ol>\n<h3>Рабочая формула ответа</h3>\n<p>Каждый ответ — мини-эссе: конкретный момент → что сделали → чему научились →\nкак это ведёт к курсу. Комиссия ищет доказательства, а не декларации: проект,\nолимпиада, курс с названием, самостоятельная работа.</p>\n<h3>Чего не делать</h3>\n<ul>\n<li>Штампы «passionate about», «since childhood», «rapidly changing world»;</li>\n<li>пересказ школьной программы во втором вопросе — только то, что относится к курсу;</li>\n<li>список кружков без выводов в третьем — одно дело с деталями сильнее пяти строк перечислений.</li>\n</ul>\n<p>Лимит 4000 символов общий на все три ответа — держите пропорцию примерно\n40/30/30 и оставляйте запас на правки.</p>\n", "cta": "Проверить ответы UCAS", "go": "ucas"}, {"slug": "visa-checklist", "cat": "guides", "title": "Чек-лист студенческой визы: документы и правило 28 дней", "teaser": "CAS, финансы, TB-тест и типичные причины отказов — по шагам, без паники.", "min": 7, "body": "\n<p>Student visa подаётся после получения <b>CAS</b> — подтверждения места от вуза.\nС этого момента у вас обычно есть 6 месяцев, но тянуть не стоит: приёмы в визовых\nцентрах в сезон забиваются.</p>\n<h3>Базовый комплект</h3>\n<ul>\n<li>Загранпаспорт, действующий на весь срок учёбы + запас;</li>\n<li>CAS-номер и документы, указанные в нём (аттестат, IELTS UKVI);</li>\n<li>финансовые доказательства: tuition за год + средства на жизнь\n(для Лондона сумма выше) — <b>непрерывно 28 дней на счёте</b>, выписка не старше 31 дня;</li>\n<li>согласие родителей и свидетельство о рождении, если вам нет 18;</li>\n<li>TB-тест из одобренной клиники — для подачи из РФ и большинства стран СНГ.</li>\n</ul>\n<h3>Частые причины отказов</h3>\n<p>Деньги «мелькали» на счёте меньше 28 дней; выписка устарела; сумма посчитана\nбез лондонской надбавки; спонсор — не родитель, а дядя (так нельзя без нюансов).\nВсе три лечатся планированием за 2 месяца.</p>\n<p><i>Важно: сервис помогает подготовить комплект, но не гарантирует визу и не\nявляется юридической консультацией — решение принимает визовый офицер. Критичные\nвопросы по финансам всегда передаём куратору.</i></p>\n", "cta": "Задать вопрос по визе", "go": "chat"}, {"slug": "motivation-letter-guide", "cat": "guides", "title": "Мотивационное письмо на Foundation: структура из 5 абзацев", "teaser": "Короткая версия нашей инструкции: что комиссия хочет увидеть в 300–500 словах и какие штампы выдают «письмо для всех».", "min": 4, "body": "\n<p>Письмо для Foundation подаётся напрямую в вуз и читается быстро — у вас\n300–500 слов, чтобы показать три вещи: осознанный выбор, готовность учиться\nи реалистичные цели.</p>\n<h3>Пять абзацев</h3>\n<ol>\n<li>Зачем вам направление — конкретный момент, с которого начался интерес;</li>\n<li>академический бэкграунд + честное «зачем Foundation» (11 классов → мост к британской системе);</li>\n<li>опыт вне учёбы — одно дело с деталями;</li>\n<li>почему этот вуз и курс — названия модулей, а не комплименты;</li>\n<li>цели после выпуска — какая степень и какая сфера.</li>\n</ol>\n<h3>Красные флаги для комиссии</h3>\n<p>«Passionate about since childhood», пересказ биографии, канцеляризмы в дословном\nпереводе, ни слова о самом вузе, обещание «стать CEO через 5 лет». Полная версия\nинструкции и проверка ИИ + куратором — в разделе «Мотивационное письмо».</p>\n", "cta": "Проверить моё письмо", "go": "motivation"}];

const SOCIALS = [{"key": "tg", "title": "Telegram-канал", "handle": "@thames_uk", "url": "https://t.me/thames_uk", "blurb": "Путь в UK без прикрас: цифры, дедлайны, фейлы. Пишем 2–3 раза в неделю."}, {"key": "yt", "title": "YouTube", "handle": "thames uk", "url": "https://youtube.com/@thames_uk", "blurb": "Разборы Speaking, влоги про кампусы и «неудобные гайды» в видео."}, {"key": "vk", "title": "ВКонтакте", "handle": "vk.com/thames_uk", "url": "https://vk.com/thames_uk", "blurb": "Дублируем главное и отвечаем на вопросы в комментариях."}];
const READING_DATA = {"test": {"id": "academic-1", "title": "Academic Reading · Mock 1", "minutes": 60, "passages": [{"title": "Farming above the streets", "text": "Growing food on rooftops may look like a fashion of the last two decades, but gardens above the street are far from new: archaeologists describe planted terraces in ancient Mesopotamia, and nineteenth-century Berlin had beer gardens on warehouse roofs. What is genuinely modern is the scale and the ambition. In 2011 the Canadian company Lufa Farms opened what it describes as the world's first commercial rooftop greenhouse in Montreal, and today produce grown above supermarkets, offices and car parks is sold in dozens of cities across North America, Europe and Asia.\n\nThe appeal is easy to understand. A layer of plants and growing medium shields the roof membrane from ultraviolet radiation and from daily swings of temperature, which can double the life of the roof itself. The same layer works as insulation, cutting the energy a building needs for heating in winter and for cooling in summer. Water management improves too: studies of green roofs show that they can retain up to 80 per cent of the rain that falls on them, easing the load on city drains during storms. And because the food is grown a lift-ride away from the people who eat it, 'food miles' shrink almost to zero.\n\nThere are, of course, obstacles. Soil, water and equipment are heavy, and older buildings often need expensive structural checks before a single seed tray can be carried upstairs. Partly for this reason, although some projects still grow crops in raised beds of soil, the majority of commercial operations now prefer hydroponic systems, in which plants stand in channels of circulating nutrient solution. Such systems weigh far less and use about 90 per cent less water than conventional growing. Governments are starting to help: in Singapore, where land is scarce, the city authorities subsidise part of the installation costs of approved rooftop farms.\n\nSupporters also point to benefits that are harder to measure. Lufa Farms delivers its vegetables to subscribers within hours of harvesting, and argues that freshness of this kind changes how people think about seasonal food. Rooftop plots can serve as outdoor classrooms for local schools, and several operators reserve beds for community groups. Critics reply that rooftop farming will never feed a whole city, and they are almost certainly right; even enthusiasts admit that the initial cost remains the main obstacle to expansion. Yet as roofs sit empty above every urban district, the question increasingly asked is not whether they can replace the countryside, but why so many of them still grow nothing at all.", "instructions_groups": [{"kind": "tfng", "label": "Вопросы 1–6. TRUE / FALSE / NOT GIVEN — соответствует ли утверждение тексту.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "questions": [{"no": 1, "q": "Rooftop gardens first appeared in the twenty-first century."}, {"no": 2, "q": "Lufa Farms opened what it calls the first commercial rooftop greenhouse in the world."}, {"no": 3, "q": "A rooftop farm can reduce the amount of energy a building uses."}, {"no": 4, "q": "Most commercial rooftop farms grow their crops in beds of soil."}, {"no": 5, "q": "The authorities in Singapore cover part of the cost of installing approved rooftop farms."}, {"no": 6, "q": "Vegetables grown on rooftops taste better than those sold in supermarkets."}]}, {"kind": "gap", "label": "Вопросы 7–13. Дополните предложение ОДНИМ словом или числом из текста.", "questions": [{"no": 7, "q": "A layer of plants protects the roof membrane from ______ radiation."}, {"no": 8, "q": "Green roofs can hold back up to ______ per cent of rainwater."}, {"no": 9, "q": "Older buildings may require costly ______ checks before a farm is installed."}, {"no": 10, "q": "Hydroponic systems use around ______ per cent less water than conventional growing."}, {"no": 11, "q": "Lufa Farms delivers vegetables to subscribers within ______ of harvesting."}, {"no": 12, "q": "Rooftop plots can be used as outdoor ______ for nearby schools."}, {"no": 13, "q": "Even supporters accept that the biggest barrier to growth is the initial ______."}]}]}, {"title": "Why we sleep", "text": "A  For most of scientific history, sleep was treated as a simple absence: the brain, it was assumed, merely switched off for the night. Modern neuroscience has overturned this view completely. Recordings of electrical activity show that the sleeping brain is anything but idle — it cycles through distinct states, each with its own tasks, rhythms and chemistry.\n\nB  Sleep is organised into two broad kinds. During non-REM sleep the brain's waves become slow and deep, breathing steadies and the body repairs tissue. REM sleep — named for the rapid eye movements that accompany it — looks closer to waking, and it is when most vivid dreaming occurs. A healthy night moves through these states in cycles of roughly 90 minutes: deep non-REM sleep dominates the first half of the night, while REM periods grow longer towards morning.\n\nC  One of sleep's best-documented jobs is filing memories. New experiences are held first in the hippocampus, a temporary store; during deep sleep the brain replays them and transfers the important ones to the cortex for long-term keeping. In one experiment, students who slept after studying word lists recalled significantly more the next day than classmates who stayed awake — an advantage of between 20 and 40 per cent in some trials.\n\nD  Deep sleep also gives the brain a wash. In 2013 researchers described the glymphatic system, a network of channels that expands during deep sleep and flushes out metabolic waste, including beta-amyloid, a protein that accumulates in Alzheimer's disease. The discovery suggested a direct biological reason why chronic poor sleep is linked to declining memory in later life.\n\nE  The price of missing sleep is paid quickly. After a short night, attention wavers and reaction times stretch; the immune system produces fewer defensive cells; and the hormones that govern appetite shift, with ghrelin (which drives hunger) rising while leptin (which signals fullness) falls — one reason tired people snack. On the road the effects are starkest of all: driving while severely sleep-deprived produces impairment comparable to driving drunk.\n\nF  The encouraging news is that sleep responds to habit. Specialists advise keeping the same bedtime and waking time every day, seeking bright light in the morning, and avoiding caffeine and glowing screens late in the evening. Needs vary from person to person — most adults fall somewhere between seven and nine hours — and a short nap of about 20 minutes can restore alertness without leaving grogginess behind.", "instructions_groups": [{"kind": "headings", "label": "Вопросы 14–18. Подберите заголовок (i–viii) к абзацам B–F. Пример: абзац A — viii.", "options": ["i. How the brain washes itself clean", "ii. Two kinds of sleep and their nightly rhythm", "iii. Why teenagers need more sleep than adults", "iv. The cost of missing sleep", "v. Moving memories into long-term storage", "vi. Practical steps towards better sleep", "vii. What dreams really mean", "viii. Sleep as an active state"], "questions": [{"no": 14, "q": "Абзац B"}, {"no": 15, "q": "Абзац C"}, {"no": 16, "q": "Абзац D"}, {"no": 17, "q": "Абзац E"}, {"no": 18, "q": "Абзац F"}]}, {"kind": "mc", "label": "Вопросы 19–22. Выберите правильный вариант (A–D).", "questions": [{"no": 19, "q": "During a typical night, deep non-REM sleep mostly occurs…", "options": ["A. in the first half of the night", "B. just before waking", "C. during periods of dreaming", "D. evenly through the night"]}, {"no": 20, "q": "In the experiment described, students who slept after studying…", "options": ["A. felt more confident about the test", "B. remembered more words than those who stayed awake", "C. finished the test more quickly", "D. preferred studying at night"]}, {"no": 21, "q": "The glymphatic system is most active…", "options": ["A. during REM sleep", "B. immediately after waking", "C. during deep sleep", "D. while we exercise"]}, {"no": 22, "q": "According to paragraph E, lack of sleep changes appetite because…", "options": ["A. tired people have less time to cook", "B. the stomach empties more slowly", "C. levels of two hormones move in opposite directions", "D. food becomes less enjoyable"]}]}, {"kind": "ynng", "label": "Вопросы 23–26. YES / NO / NOT GIVEN — согласуется ли утверждение с мнением автора.", "options": ["YES", "NO", "NOT GIVEN"], "questions": [{"no": 23, "q": "Every adult needs exactly eight hours of sleep."}, {"no": 24, "q": "A short daytime nap can be helpful."}, {"no": 25, "q": "Sleeping pills are an effective long-term solution to poor sleep."}, {"no": 26, "q": "Driving while extremely tired can be as dangerous as driving drunk."}]}]}, {"title": "Vanishing voices", "text": "Of the roughly 7,000 languages spoken in the world today, linguists expect that between a third and a half will fall silent within a century. The statistics hide an awkward problem of definition. As the field linguist Tomas Berg points out, a language rarely dies at a recordable moment: it fades, used in fewer homes and for fewer purposes, until one day the last fluent conversation has already happened without anyone noticing. Berg argues, however, that raw speaker numbers mislead in both directions — a language spoken by only a few hundred people can remain perfectly viable for centuries, provided parents keep passing it to children.\n\nWhy should the loss matter to anyone beyond the community itself? The ecologist-turned-linguist Elena Vaquero answers with a comparison: when a language disappears unrecorded, it is like burning the only library in a town. Her fieldwork in the Amazon documents how local languages encode knowledge that exists nowhere else — names and uses of medicinal plants, fish migration calendars, techniques of soil management — knowledge assembled over hundreds of generations and rarely written down.\n\nThe causes of decline are seldom mysterious. Cities pull young speakers away from villages; schools have historically punished children for using home languages; and television, advertising and the internet arrive overwhelmingly in a handful of dominant tongues. Parents, acting rationally, raise children in the language of jobs and examinations. What looks like free choice is often the endpoint of decades of policy.\n\nYet the story is not uniformly bleak, and the clearest lessons come from revivals. Hebrew returned from liturgical use to become the daily language of a modern state. Welsh climbed back from decline with the help of dedicated television channels and compulsory teaching in schools. In New Zealand, the Māori movement built 'language nests' — nurseries in which infants spend their days with elders who speak to them only in Māori, recreating the domestic transmission that had been broken. Studying such cases, Vaquero concludes that money matters less than continuity: what decides a language's fate is unbroken transmission between generations.\n\nTechnology, long blamed for flattening linguistic diversity, is switching sides. The sociolinguist Aiko Tanaka studies indigenous teenagers who text, stream and joke online in their ancestral languages; her surveys suggest that seeing a language on a smartphone screen does more than any textbook to convince the young that it belongs to the future. Free apps now teach languages with a few thousand speakers, and communities crowdsource dictionaries that would once have taken a university decades.\n\nOptimism, then, is possible — but conditional. Revival succeeds where communities come to see their language as an asset rather than a burden, and where speaking it opens doors instead of closing them. Languages are not museum pieces to be preserved behind glass; they survive by being argued in, joked in and sung in. The task, as Tanaka puts it, is not to save languages but to make them worth keeping.", "instructions_groups": [{"kind": "mc", "label": "Вопросы 27–31. Выберите правильный вариант (A–D).", "questions": [{"no": 27, "q": "Approximately how many languages are spoken in the world today?", "options": ["A. 700", "B. 3,500", "C. 7,000", "D. 70,000"]}, {"no": 28, "q": "The loss of an unrecorded language is compared to…", "options": ["A. the extinction of a rare species", "B. the burning of a town's only library", "C. the demolition of an ancient building", "D. the closing of a school"]}, {"no": 29, "q": "Which of the following is NOT mentioned as a cause of language decline?", "options": ["A. migration to cities", "B. school policies", "C. dominant-language media", "D. climate change"]}, {"no": 30, "q": "The Māori 'language nests' work by…", "options": ["A. paying parents to speak Māori at home", "B. placing young children with elders who use only Māori", "C. broadcasting children's television in Māori", "D. teaching Māori as a school subject"]}, {"no": 31, "q": "The writer's overall attitude to language revival is…", "options": ["A. dismissive", "B. neutral", "C. cautiously optimistic", "D. alarmed"]}]}, {"kind": "match", "label": "Вопросы 32–35. Кому принадлежит утверждение: A — Tomas Berg, B — Elena Vaquero, C — Aiko Tanaka. Буквы можно использовать более одного раза.", "options": ["A. Tomas Berg", "B. Elena Vaquero", "C. Aiko Tanaka"], "questions": [{"no": 32, "q": "Local languages contain unique practical knowledge about the natural world."}, {"no": 33, "q": "It is hard to identify the exact moment at which a language dies."}, {"no": 34, "q": "Seeing a language used on digital devices persuades young people it has a future."}, {"no": 35, "q": "A language with very few speakers can still survive for a long time."}]}, {"kind": "gap", "label": "Вопросы 36–40. Дополните конспект ОДНИМ словом из текста.", "questions": [{"no": 36, "q": "Welsh recovered partly thanks to television and compulsory lessons in ______."}, {"no": 37, "q": "In Māori nurseries, infants spend their days with ______ who speak only Māori."}, {"no": 38, "q": "According to Vaquero, a language's fate depends on unbroken ______ between generations."}, {"no": 39, "q": "Free ______ now teach even very small languages."}, {"no": 40, "q": "Revival works where a community sees its language as an asset, not a ______."}]}]}]}, "answers": {"1": {"a": ["FALSE"], "why": "В тексте: сады на крышах «far from new» — были в древней Месопотамии и Берлине XIX века."}, "2": {"a": ["TRUE"], "why": "«Lufa Farms opened what it describes as the world's first commercial rooftop greenhouse»."}, "3": {"a": ["TRUE"], "why": "Слой растений работает как изоляция и сокращает энергию на отопление и охлаждение."}, "4": {"a": ["FALSE"], "why": "«the majority of commercial operations now prefer hydroponic systems» — не в грунте."}, "5": {"a": ["TRUE"], "why": "«the city authorities subsidise part of the installation costs of approved rooftop farms»."}, "6": {"a": ["NOT GIVEN"], "why": "О вкусе овощей в тексте не сказано ничего."}, "7": {"a": ["ultraviolet", "uv"], "why": "«shields the roof membrane from ultraviolet radiation»."}, "8": {"a": ["80"], "why": "«retain up to 80 per cent of the rain»."}, "9": {"a": ["structural"], "why": "«older buildings often need expensive structural checks»."}, "10": {"a": ["90"], "why": "«use about 90 per cent less water»."}, "11": {"a": ["hours"], "why": "«delivers its vegetables to subscribers within hours of harvesting»."}, "12": {"a": ["classrooms"], "why": "«serve as outdoor classrooms for local schools»."}, "13": {"a": ["cost"], "why": "«the initial cost remains the main obstacle to expansion»."}, "14": {"a": ["ii"], "why": "Абзац B — про два вида сна и 90-минутные циклы."}, "15": {"a": ["v"], "why": "Абзац C — про перенос памяти из гиппокампа в кору."}, "16": {"a": ["i"], "why": "Абзац D — глимфатическая система «даёт мозгу помывку»."}, "17": {"a": [ function matchUnis(dirTag, gpa, ielts){
  const tiers = {safe:0, match:1, reach:2}, titles = {safe:"уверенно", match:"реально", reach:"на вырост"};
  const out = [];
  for (const [name, city, fields, minGpa, minIelts, courses, note] of CATALOG){
    if (dirTag && !fields.includes(dirTag)) continue;
    let tier;
    if (gpa == null) tier = "match";
    else if (gpa >= minGpa + 0.4) tier = "safe";
    else if (gpa >= minGpa) tier = "match";
    else if (gpa >= minGpa - 0.3) tier = "reach";
    else continue;
    out.push({name, city, courses, note, minGpa, minIelts, tier, tierTitle: titles[tier],
              ieltsGap: ielts != null && ielts < minIelts});
  }
  out.sort((a,b) => tiers[a.tier]-tiers[b.tier] || b.minGpa-a.minGpa);
  return out;
}

const fabWrap = document.getElementById("fabwrap"), fabBtn = document.getElementById("fab");
let fabHold=null, fabDrag=false, fabMoved=false, fabSuppress=false, fsx=0, fsy=0;
function placeFab(xr, yr){
  const vw=innerWidth, vh=innerHeight, fw=fabBtn.offsetWidth, fh=fabBtn.offsetHeight;
  const cx=Math.min(Math.max(xr*vw, fw/2+8), vw-fw/2-8);
  const cy=Math.min(Math.max(yr*vh, fh/2+8), vh-fh/2-8);
  fabWrap.classList.toggle("menu-below", cy < vh/2);
  fabWrap.classList.toggle("menu-left", cx < vw/2);
  fabWrap.style.right=(vw-cx-fw/2)+"px";
  if (cy < vh/2){ fabWrap.style.top=(cy-fh/2)+"px"; fabWrap.style.bottom="auto"; }
  else { fabWrap.style.bottom=(vh-cy-fh/2)+"px"; fabWrap.style.top="auto"; }
}
fabBtn.addEventListener("pointerdown", e => {
  fsx=e.clientX; fsy=e.clientY; fabMoved=false;
  fabHold=setTimeout(()=>{ fabHold=null; fabDrag=true; fabBtn.classList.add("dragging"); toggleMenu(false); fabBtn.setPointerCapture(e.pointerId); },350);
});
fabBtn.addEventListener("pointermove", e => {
  if (!fabDrag){ if (fabHold && Math.hypot(e.clientX-fsx,e.clientY-fsy)>12){clearTimeout(fabHold);fabHold=null;} return; }
  fabMoved=true; placeFab(e.clientX/innerWidth, e.clientY/innerHeight);
});
function fabEnd(){ if(fabHold){clearTimeout(fabHold);fabHold=null;} if(!fabDrag)return;
  fabDrag=false; fabBtn.classList.remove("dragging");
  if(fabMoved){ fabSuppress=true; setTimeout(()=>fabSuppress=false,0); } }
fabBtn.addEventListener("pointerup", fabEnd);

      const now = Date.now(), horizon = months*30*24*3600*1000;
      const plan = PLAN_STEPS[track].map(([title, frac]) => ({
        title, due: new Date(now + horizon*frac).toISOString().slice(0,10), done: false }));
      store.survey = {answers, gpa, track}; store.plan = plan; save();
      go("plan");
    };
  }
  q();
};

    const topic = WRITING_TOPICS[task][Math.floor(Math.random()*WRITING_TOPICS[task].length)];
    let left = (task === "task2" ? 40 : 20) * 60;
    const target = task === "task2" ? 250 : 150;
    box.innerHTML = `<h1>Writing · ${task === "task2" ? "Task 2" : "Task 1"}</h1>
      <div class="timerbox"><b id="w-timer">--:--</b>
        <span style="font-size:12.5px;color:var(--tx2)"><span id="w-words">0</span> слов · цель ${target}+ · время выйдет — проверка запустится сама</span></div>

      <div class="iform"><textarea id="w-text" rows="12" placeholder="Пишите здесь..."></textarea></div>
      <button class="btn" style="border:0;margin-top:10px" onclick="wCheck()">Проверить эссе</button>`;
    const tick = () => {
      const m = String(Math.floor(left/60)).padStart(2,"0"), s = String(left%60).padStart(2,"0");
      const el = document.getElementById("w-timer"); if (!el) { clearInterval(wTimer); return; }
      el.textContent = m+":"+s;
      if (--left < 0) { clearInterval(wTimer); window.wCheck(); }

      document.getElementById("w-words").textContent = e.target.value.trim().split(/\s+/).filter(Boolean).length;

      if (/however|moreover|furthermore|although|whereas|consequently/i.test(text)) band += 0.25;

    };
  };
};

    время выйдет — тест сдастся сам. В демо один вариант теста, в полной версии — банк уникальных.</p>
    <button class="btn" style="border:0;display:block;width:100%" onclick="rStart()">Начать Reading</button>`;
  window.rStart = () => {
    const answers = {};
    let left = 60 * 60, cur = 0;
    const P = READING_DATA.test.passages;

    function answered(){ return Object.keys(answers).filter(k => answers[k]).length; }
    function fmt(s){ return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); }

    rTimer = setInterval(() => {
      left--;
      const el = document.getElementById("r-clock");
      if (!el) { clearInterval(rTimer); return; }
      el.textContent = fmt(left);
      if (left <= 0) finish();
    }, 1000);

    function groupHtml(g){
      const qs = g.questions.map(q => {
        const chosen = answers[q.no] || "";
        if (g.kind === "gap")
          return `<div class="q"><p><b>${q.no}.</b> ${esc(q.q)}</p>
            <input class="r-gap" data-no="${q.no}" value="${esc(chosen)}" placeholder="ответ одним-двумя словами"
              style="width:100%;background:var(--milk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit"></div>`;
        const opts = g.kind === "mc" ? q.options : g.options;
        const stack = g.kind === "mc" || (g.options && g.options[0] && g.options[0].length > 14);
        return `<div class="q"><p><b>${q.no}.</b> ${esc(q.q)}</p>
          <div class="pills" style="${stack ? "flex-direction:column;align-items:stretch" : ""}">
            ${opts.map(o => {
              const val = g.kind === "mc" ? o.split(".")[0].trim() : o;
              return `<label class="r-pill ${chosen === val ? "onp" : ""}" data-no="${q.no}" data-val="${esc(val)}"
                style="${stack ? "border-radius:11px" : ""}${chosen === val ? ";border-color:var(--tile);color:var(--tile)" : ""}">${esc(o)}</label>`;
            }).join("")}
          </div></div>`;
      }).join("");
      return `<p class="cc" style="font-weight:600;margin:14px 0 8px">${esc(g.label)}</p>${qs}`;
    }

    function render(){
      const pas = P[cur];
      box.innerHTML = `
        <div class="timerbox"><b id="r-clock">${fmt(left)}</b>
          <span style="font-size:12px;color:var(--tx2)">отвечено <span id="r-done">${answered()}</span>/40</span>
          <button class="ghost" style="margin-left:auto;padding:8px 12px;font-size:12px" onclick="rFinish()">Завершить</button></div>
        <div style="display:flex;gap:6px;margin-bottom:10px">
          ${P.map((pp,i)=>`<button class="r-tab" data-i="${i}" style="flex:1;min-height:42px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;background:var(--cream);border:1px solid ${i===cur?"var(--tile)":"var(--line)"};color:${i===cur?"var(--tile)":"var(--tx2)"}">Пассаж ${i+1}</button>`).join("")}
        </div>
        <div class="passage" style="max-height:34vh"><b>${esc(pas.title)}</b><br><br>${esc(pas.text).replace(/\n/g,"<br>")}</div>
        ${pas.instructions_groups.map(groupHtml).join("")}
        <button class="btn" style="border:0;display:block;width:100%;margin-top:6px"
          onclick="${cur < 2 ? "rNext()" : "rFinish()"}">${cur < 2 ? "Дальше: пассаж " + (cur+2) : "Завершить и проверить"}</button>`;
      box.querySelectorAll(".r-pill").forEach(el => el.addEventListener("click", () => {
        answers[el.dataset.no] = el.dataset.val;
        const sibs = el.parentElement.querySelectorAll(".r-pill");
        sibs.forEach(s => { s.style.borderColor = "var(--line)"; s.style.color = ""; });
        el.style.borderColor = "var(--tile)"; el.style.color = "var(--tile)";
        document.getElementById("r-done").textContent = answered();
      }));
      box.querySelectorAll(".r-gap").forEach(el => el.addEventListener("input", () => {
        answers[el.dataset.no] = el.value;
        document.getElementById("r-done").textContent = answered();
      }));
      box.querySelectorAll(".r-tab").forEach(el => el.addEventListener("click", () => { cur = +el.dataset.i; render(); }));
      window.rNext = () => { cur++; render(); window.scrollTo({top:0}); };
    }

    function finish(){
      clearInterval(rTimer);
      let raw = 0; const review = [];
      for (const [no, {a, why}] of Object.entries(READING_DATA.answers)){
        const given = String(answers[no] || "").trim();
        const ok = a.map(x => x.toLowerCase()).includes(given.toLowerCase().replace(/[ .]+$/,"").replace(/^[ .]+/,""));
        if (ok) raw++;
        review.push({no, given: given || "—", correct: a[0], ok, why});
      }
      let band = 2.0;
      for (const [thr, b] of READING_DATA.bands){ if (raw >= thr){ band = b; break; } }
      box.innerHTML = `<h1>Результат Reading</h1>
        <div class="ring" style="background:conic-gradient(var(--tile) 0 ${band/9*100}%, #E3DCC9 0)">
          <div class="in"><b>${band.toFixed(1)}</b><span>band Reading</span></div></div>
        <p style="text-align:center;font-size:14.5px;margin:0 0 4px"><b>${raw} из 40 правильных</b></p>
        <p class="cc" style="text-align:center;margin:0 0 16px">Официальная шкала перевода баллов в band.</p>
        ${review.map(r => `<div class="rev ${r.ok ? "ok" : "bad"}"><span class="no">${r.ok ? "✓" : "✗"} ${r.no}</span>
          ${esc(r.given)}${r.ok ? "" : " · правильно: <b>" + esc(r.correct) + "</b>"}
          <p class="cc why">${esc(r.why)}</p></div>`).join("")}
        <button class="btn" style="border:0;margin-top:12px" onclick="VIEWS.reading()">Пройти ещё раз</button>`;
      store.mock = store.mock || {}; store.mock.reading = band; save();
      window.scrollTo({top:0});
    }
    window.rFinish = finish;
    render();
  };
};

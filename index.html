addView("listening", "");
VIEWS.listening = () => {
  speechSynthesis.cancel();
  const box = document.getElementById("v-listening");
  if (!ieltsAllowed()){
    box.innerHTML = `<p style="margin:2px 0 0"><button class="lnk" onclick="go('ielts')">← IELTS</button></p>
      <h1 style="margin:6px 0 12px">IELTS Listening</h1>` + paywall("Listening", "listening");
    return;
  }
  box.innerHTML = `<p style="margin:2px 0 0"><button class="lnk" onclick="go('ielts')">← IELTS</button></p>
    <h1 style="margin:6px 0 8px">IELTS Listening</h1>
    <p class="sub">4 части, 40 вопросов. Каждая запись озвучивается браузером и играет
    <b>один раз</b> — как на экзамене. Если звук недоступен, можно открыть транскрипт.</p>
    <button class="btn" style="border:0;display:block;width:100%" onclick="lStart()">Начать Listening</button>`;

  window.lStart = () => {
    const answers = {}; let cur = 0, usedTranscript = false;
    const played = [false, false, false, false];
    const P = LISTENING_DATA.test.parts;

    function speak(part, onDone){
      speechSynthesis.cancel();
      const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"));
      const roleVoice = {};
      (part.voices || ["A"]).forEach((r, i) => roleVoice[r] = voices[i % Math.max(voices.length,1)]);
      const lines = part.script.split("\n").filter(l => l.trim());
      let li = 0;
      const next = () => {
        if (li >= lines.length){ onDone(); return; }
        const line = lines[li++];
        const mm = line.match(/^([A-C]):\s*(.*)$/);
        const u = new SpeechSynthesisUtterance(mm ? mm[2] : line);
        if (mm && roleVoice[mm[1]]) u.voice = roleVoice[mm[1]];
        u.lang = "en-GB"; u.rate = 0.95;
        u.onend = next; u.onerror = next;
        speechSynthesis.speak(u);
      };
      next();
    }

    function groupHtml(g){
      return `<p class="cc" style="font-weight:600;margin:14px 0 8px">${esc(g.label)}</p>` +
        g.questions.map(q => {
          const chosen = answers[q.no] || "";
          if (g.kind === "gap")
            return `<div class="q"><p><b>${q.no}.</b> ${esc(q.q)}</p>
              <input class="l-gap" data-no="${q.no}" value="${esc(chosen)}" placeholder="одно слово или число"
                style="width:100%;background:var(--milk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit"></div>`;
          const opts = g.kind === "mc" ? q.options : g.options;
          return `<div class="q"><p><b>${q.no}.</b> ${esc(q.q)}</p>
            <div class="pills" style="flex-direction:column;align-items:stretch">
              ${opts.map(o => { const val = g.kind === "mc" ? o.split(".")[0].trim() : o;
                return `<label class="l-pill" data-no="${q.no}" data-val="${esc(val)}"
                  style="border-radius:11px${chosen===val ? ";border-color:var(--tile);color:var(--tile)" : ""}">${esc(o)}</label>`; }).join("")}
            </div></div>`;
        }).join("");
    }

    function render(){
      const part = P[cur];
      const done = Object.keys(answers).filter(k => answers[k]).length;
      box.innerHTML = `
        <div class="timerbox"><b style="font-size:14px">Part ${cur+1}/4</b>
          <span style="font-size:12px;color:var(--tx2)">отвечено ${done}/40</span>
          <button class="ghost" style="margin-left:auto;padding:8px 12px;font-size:12px" onclick="lFinish()">Завершить</button></div>
        <div class="card"><b style="font-size:14px">${esc(part.title)}</b>
          <p class="cc" style="margin:5px 0 10px">${esc(part.intro)}</p>
          <button class="btn" style="border:0" id="l-play" ${played[cur] ? "disabled" : ""}>${played[cur] ? "Прослушано (играет один раз)" : "▶ Прослушать запись"}</button>
          <button class="lnk" style="display:block;margin-top:10px" id="l-script">Показать транскрипт (если звук недоступен)</button>
          <div class="passage" id="l-transcript" hidden style="max-height:180px;margin-top:8px">${esc(part.script).replace(/\n/g,"<br>")}</div>
        </div>
        ${part.groups.map(groupHtml).join("")}
        <button class="btn" style="border:0;display:block;width:100%;margin-top:6px"
          onclick="${cur < 3 ? "lNext()" : "lFinish()"}">${cur < 3 ? "Дальше: Part " + (cur+2) : "Завершить и проверить"}</button>`;
      const playBtn = document.getElementById("l-play");
      playBtn.addEventListener("click", () => {
        if (played[cur]) return;
        played[cur] = true;
        playBtn.disabled = true; playBtn.textContent = "🔊 Звучит…";
        speak(part, () => { playBtn.textContent = "Прослушано (играет один раз)"; });
      });
      document.getElementById("l-script").addEventListener("click", () => {
        usedTranscript = true;
        document.getElementById("l-transcript").hidden = false;
      });
      box.querySelectorAll(".l-pill").forEach(el => el.addEventListener("click", () => {
        answers[el.dataset.no] = el.dataset.val;
        el.parentElement.querySelectorAll(".l-pill").forEach(s => { s.style.borderColor = "var(--line)"; s.style.color = ""; });
        el.style.borderColor = "var(--tile)"; el.style.color = "var(--tile)";
      }));
      box.querySelectorAll(".l-gap").forEach(el => el.addEventListener("input", () => { answers[el.dataset.no] = el.value; }));
      window.lNext = () => { speechSynthesis.cancel(); cur++; render(); window.scrollTo({top:0}); };
    }

    window.lFinish = () => {
      speechSynthesis.cancel();
      let raw = 0; const review = [];
      for (const [no, {a, why}] of Object.entries(LISTENING_DATA.answers)){
        const given = String(answers[no] || "").trim();
        const ok = a.map(x => x.toLowerCase()).includes(given.toLowerCase().replace(/[ .]+$/,"").replace(/^[ .]+/,""));
        if (ok) raw++;
        review.push({no, given: given || "—", correct: a[0], ok, why});
      }
      let band = 2.0;
      for (const [thr, b] of LISTENING_DATA.bands){ if (raw >= thr){ band = b; break; } }
      store.mock = store.mock || {}; store.mock.listening = band; save();
      box.innerHTML = `<h1>Результат Listening</h1>
        ${usedTranscript ? NOTE("Вы подглядывали в транскрипт — на экзамене его не будет, band ориентировочный.") : ""}
        <div class="ring" style="background:conic-gradient(var(--tile) 0 ${band/9*100}%, #E3DCC9 0)">
          <div class="in"><b>${band.toFixed(1)}</b><span>band Listening</span></div></div>
        <p style="text-align:center;font-size:14.5px;margin:0 0 16px"><b>${raw} из 40 правильных</b></p>
        ${review.map(r => `<div class="rev ${r.ok ? "ok" : "bad"}"><span class="no">${r.ok ? "✓" : "✗"} ${r.no}</span>
          ${esc(r.given)}${r.ok ? "" : " · правильно: <b>" + esc(r.correct) + "</b>"}
          <p class="cc why">${esc(r.why)}</p></div>`).join("")}
        <button class="btn" style="border:0;margin-top:12px" onclick="VIEWS.listening()">Пройти ещё раз</button>`;
      window.scrollTo({top:0});
    };
    render();
  };
};

// ---- Speaking: запись голоса в браузере ----
addView("speaking", "");
VIEWS.speaking = () => {
  const box = document.getElementById("v-speaking");
  if (!ieltsAllowed()){
    box.innerHTML = `<p style="margin:2px 0 0"><button class="lnk" onclick="go('ielts')">← IELTS</button></p>
      <h1 style="margin:6px 0 12px">Speaking</h1>` + paywall("Speaking", "speaking");
    return;
  }
  const script = INTERVIEW_SETS[Math.floor(Math.random() * INTERVIEW_SETS.length)];
  let qi = 0, recorder = null, chunks = [];
  function render(state, audioUrl){
    const [qPart, qText] = script[qi];
    box.innerHTML = `<p style="margin:2px 0 0"><button class="lnk" onclick="go('ielts')">← IELTS</button></p>
      <h1 style="margin:6px 0 8px">Mock-интервью Speaking</h1>
      <p class="sub">Вопрос ${qi+1} из ${script.length}. Отвечайте голосом до двух минут — запись можно переслушать.
      ${NOTE("Транскрипция и оценка по критериям работают на сервере полной версии; здесь — тренировка с самопрослушиванием.")}</p>
      <div class="card"><span class="stamp" style="font-size:10px">${esc(qPart)}</span>
        <p style="font-size:15px;margin:8px 0 0">${esc(qText)}</p></div>
      <div style="display:flex;gap:14px;align-items:center;margin:16px 0">
        ${state === "rec"
          ? `<button class="rec-live" id="sp-stop">■</button><span class="cc">Идёт запись… нажмите, чтобы остановить</span>`
          : `<button class="rec-idle" id="sp-rec">🎤</button><span class="cc">${state === "done" ? "Готово! Переслушайте себя ниже" : "Нажмите и говорите"}</span>`}
      </div>
      ${audioUrl ? `<audio controls src="${audioUrl}" style="width:100%;margin-bottom:12px"></audio>
        <div class="card"><b style="font-size:13px">Чек-лист самопроверки</b>
          <ul style="padding-left:17px;color:var(--tx2);font-size:13px;margin:8px 0 0">
            <li>Говорили 30–60 секунд без длинных пауз?</li>
            <li>Ответили на вопрос, а не «вокруг»?</li>
            <li>Есть пример или деталь?</li>
            <li>Слышны связки (well, actually, on the other hand)?</li>
          </ul></div>` : ""}
      <div style="display:flex;gap:10px;margin-top:8px">
        ${audioUrl || state === "skip" ? `<button class="btn" style="border:0" onclick="spNext()">${qi < script.length-1 ? "Следующий вопрос" : "Завершить"}</button>` : ""}
        <button class="ghost" onclick="spSkip()">Ответил(а) вслух без записи</button>
      </div>`;
    const recBtn = document.getElementById("sp-rec");
    if (recBtn) recBtn.addEventListener("click", startRec);
    const stopBtn = document.getElementById("sp-stop");
    if (stopBtn) stopBtn.addEventListener("click", () => recorder && recorder.stop());
  }
  async function startRec(){
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio: true});
      recorder = new MediaRecorder(stream); chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        stream.getTracks().forEach(tr => tr.stop());
        render("done", URL.createObjectURL(new Blob(chunks)));
      };
      recorder.start();
      setTimeout(() => { if (recorder && recorder.state === "recording") recorder.stop(); }, 120000);
      render("rec");
    } catch(e) {
      render("skip");
      box.insertAdjacentHTML("beforeend", NOTE("Микрофон недоступен (нет разрешения или страница открыта как файл). Отвечайте вслух и жмите «Следующий вопрос»."));
    }
  }
  window.spSkip = () => render("skip");
  window.spNext = () => {
    if (qi < script.length - 1){ qi++; render("idle"); window.scrollTo({top:0}); }
    else box.innerHTML = `<h1>Интервью пройдено 🎉</h1>
      <p class="sub">Вы ответили на ${script.length} вопросов. В полной версии каждый ответ
      расшифровывается и разбирается по Fluency, Lexical Resource и Grammar с честной пометкой про произношение.</p>
      <button class="btn" style="border:0" onclick="VIEWS.speaking()">Ещё интервью (новый сценарий)</button>`;
  };
  render("idle");
};

// Мини-игры для тренировки языка. Всё на клиенте, без ИИ и без сервера:
// словари лежат здесь же, рекорды — в localStorage (thamesGameBest.<key>).


window.__gameInit = (root, KEY) => {

  // ---------- утилиты ----------
  const shuffle = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const bestKey = "thamesGameBest." + KEY;
  const getBest = () => localStorage.getItem(bestKey);
  function saveBest(value, better) {
    const old = getBest();
    if (old === null || better(value, old)) localStorage.setItem(bestKey, String(value));
  }

  // ---------- словари ----------

  // виселица: [слово, перевод-подсказка]
  const HANG_WORDS = {
    easy: [
      ["WATER", "вода"], ["FRIEND", "друг"], ["MORNING", "утро"], ["SCHOOL", "школа"],
      ["FAMILY", "семья"], ["WINDOW", "окно"], ["BREAD", "хлеб"], ["MONEY", "деньги"],
      ["HAPPY", "счастливый"], ["WINTER", "зима"], ["STREET", "улица"], ["TEACHER", "учитель"],
      ["ANSWER", "ответ"], ["DINNER", "ужин"], ["GARDEN", "сад"], ["TICKET", "билет"],
    ],
    medium: [
      ["CAMPUS", "территория вуза"], ["DEGREE", "учёная степень"], ["LIBRARY", "библиотека"],
      ["SCHEDULE", "расписание"], ["LECTURE", "лекция"], ["DEADLINE", "крайний срок"],
      ["ESSAY", "эссе"], ["ABROAD", "за границей"], ["LUGGAGE", "багаж"],
      ["LANDLORD", "арендодатель"], ["SEMESTER", "семестр"], ["TUITION", "плата за обучение"],
      ["INTERVIEW", "собеседование"], ["CERTIFICATE", "сертификат"], ["ACCOMMODATION", "жильё"],
      ["APPLICATION", "заявление"],
    ],
    hard: [
      ["CURRICULUM", "учебная программа"], ["SCHOLARSHIP", "стипендия"],
      ["HYPOTHESIS", "гипотеза"], ["NEGOTIATE", "вести переговоры"],
      ["SUSTAINABILITY", "устойчивое развитие"], ["ENTREPRENEUR", "предприниматель"],
      ["BUREAUCRACY", "бюрократия"], ["PHENOMENON", "явление"],
      ["CONSCIENTIOUS", "добросовестный"], ["AMBIGUOUS", "двусмысленный"],
      ["PRELIMINARY", "предварительный"], ["INEVITABLE", "неизбежный"],
      ["COMPREHENSIVE", "всеобъемлющий"], ["DETERIORATE", "ухудшаться"],
      ["ACCOMMODATE", "вмещать; учитывать"], ["PERSEVERANCE", "упорство"],
    ],
  };

  // перевод-спринт: [en, ru] — A2–B1
  const MATCH_PAIRS = [
    ["improve", "улучшать"], ["borrow", "одалживать"], ["arrive", "прибывать"],
    ["choice", "выбор"], ["crowded", "многолюдный"], ["fee", "взнос, плата"],
    ["queue", "очередь"], ["skill", "навык"], ["mistake", "ошибка"],
    ["timetable", "расписание"], ["subject", "предмет"], ["explain", "объяснять"],
    ["allow", "разрешать"], ["quiet", "тихий"], ["journey", "поездка"],
    ["health", "здоровье"], ["knowledge", "знания"], ["language", "язык"],
    ["science", "наука"], ["weather", "погода"], ["expensive", "дорогой"],
    ["cheap", "дешёвый"], ["early", "ранний"], ["important", "важный"],
    ["decide", "решать"], ["prepare", "готовиться"], ["receive", "получать"],
    ["society", "общество"], ["several", "несколько"], ["enough", "достаточно"],
    ["succeed", "преуспеть"], ["fail", "провалиться"], ["proud", "гордый"],
    ["advice", "совет"], ["opportunity", "возможность"], ["experience", "опыт"],
  ];

  // собери предложение: от простого к сложному (B1–B2)
  const SENTENCES = [
    "I study English every day",
    "She wants to become a doctor",
    "We moved to London last year",
    "The library opens at nine",
    "He asked me a difficult question",
    "Students must submit essays on time",
    "I have never been to Britain",
    "The professor explained the topic clearly",
    "Living abroad teaches you independence",
    "This course requires strong writing skills",
    "Applicants should describe their relevant experience",
    "The deadline was extended by two weeks",
    "Despite the rain we visited the campus",
    "Research shows that sleep improves memory",
    "The university offers scholarships to international students",
    "Critical thinking is essential for academic success",
  ];

  // фразовые глаголы (B2–C1): предложение с пропуском, варианты, верный, пояснение
  const PHRASALS = [
    ["The meeting was ___ until next Friday.", ["put off", "put on", "put out", "put up"], "put off",
     "put off = отложить. Put on — надеть, put out — потушить, put up — разместить."],
    ["I need to ___ this new word in the dictionary.", ["look up", "look after", "look into", "look for"], "look up",
     "look up = найти в справочнике. Look after — присматривать, look into — расследовать."],
    ["She ___ smoking two years ago.", ["gave up", "gave in", "gave away", "gave out"], "gave up",
     "give up = бросить (привычку). Give in — сдаться, give away — раздарить."],
    ["Our car ___ on the way to the airport.", ["broke down", "broke up", "broke in", "broke out"], "broke down",
     "break down = сломаться. Break up — расстаться, break out — вспыхнуть (о войне, эпидемии)."],
    ["Can you ___ the music? I'm studying.", ["turn down", "turn up", "turn in", "turn over"], "turn down",
     "turn down = сделать тише (или отклонить предложение). Turn up — сделать громче; появиться."],
    ["I ___ my grandmother — we are both stubborn.", ["take after", "take over", "take up", "take in"], "take after",
     "take after = пойти в кого-то, быть похожим. Take over — взять контроль, take up — заняться."],
    ["The plane ___ despite the fog.", ["took off", "took up", "took out", "took over"], "took off",
     "take off = взлететь. Ещё значение — «выстрелить», резко стать успешным."],
    ["We've ___ of milk — I'll buy some.", ["run out", "run into", "run over", "run away"], "run out",
     "run out (of) = закончиться. Run into — случайно встретить, run over — переехать."],
    ["I ___ an old friend at the station yesterday.", ["ran into", "ran out", "ran off", "ran up"], "ran into",
     "run into = случайно встретить. Синоним — bump into."],
    ["Don't worry, I'll ___ the children tonight.", ["look after", "look up", "look out", "look down"], "look after",
     "look after = присматривать, заботиться."],
    ["The university ___ the number of places this year.", ["cut down", "cut off", "cut out", "cut up"], "cut down",
     "cut down = сократить. Cut off — отрезать/отключить, cut out — вырезать; перестать."],
    ["She ___ the job offer because of the salary.", ["turned down", "turned up", "turned on", "turned out"], "turned down",
     "turn down = отклонить. Turn out — оказаться (It turned out that...)."],
    ["He ___ a story to explain why he was late.", ["made up", "made out", "made over", "made off"], "made up",
     "make up = выдумать (ещё: помириться; компенсировать)."],
    ["I'm trying to ___ what this chart means.", ["figure out", "figure in", "fill out", "find out"], "figure out",
     "figure out = разобраться, понять. Fill out — заполнить форму, find out — узнать факт."],
    ["Please ___ this application form.", ["fill in", "fill up", "fall in", "feel in"], "fill in",
     "fill in (BrE) / fill out (AmE) = заполнить форму."],
  ];

  // ---------- каркас ----------
  const $ = sel => root.querySelector(sel);
  function screen(html) { root.innerHTML = html; }
  function bar(now, total) {
    return `<div class="g-bar"><i style="width:${(now / total) * 100}%"></i></div>`;
  }

  // ---------- виселица ----------
  function hangman() {
    screen(`
      <div class="acard">
        <b>Выберите сложность</b>
        <div class="g-diff">
          <button class="g-opt" data-d="easy">Полегче <span>A2 · бытовые слова · подсказка сразу</span></button>
          <button class="g-opt" data-d="medium">Средне <span>B1 · студенческая жизнь · подсказка после ошибки</span></button>
          <button class="g-opt" data-d="hard">Сложно <span>C1 · академическая лексика · без подсказок</span></button>
        </div>
      </div>`);
    root.querySelectorAll(".g-opt").forEach(b =>
      b.addEventListener("click", () => hangmanRound(b.dataset.d)));
  }

  const HANG_PARTS = [
    '<circle cx="140" cy="60" r="14"/>',                     // голова
    '<line x1="140" y1="74" x2="140" y2="118"/>',            // туловище
    '<line x1="140" y1="84" x2="118" y2="104"/>',            // рука
    '<line x1="140" y1="84" x2="162" y2="104"/>',            // рука
    '<line x1="140" y1="118" x2="122" y2="146"/>',           // нога
    '<line x1="140" y1="118" x2="158" y2="146"/>',           // нога
  ];

  function hangmanRound(diff) {
    const [word, hint] = pick(HANG_WORDS[diff]);
    const guessed = new Set();
    let lives = 6;

    function gallowsSvg() {
      const parts = HANG_PARTS.slice(0, 6 - lives).join("");
      return `<svg class="g-gallows" viewBox="0 0 200 170" aria-hidden="true">
        <g stroke="#232E38" stroke-width="3" stroke-linecap="round" fill="none">
          <line x1="20" y1="160" x2="90" y2="160"/><line x1="55" y1="160" x2="55" y2="20"/>
          <line x1="55" y1="20" x2="140" y2="20"/><line x1="140" y1="20" x2="140" y2="46"/>
          <g stroke="#C75B39">${parts}</g>
        </g></svg>`;
    }
    function slots() {
      return word.split("").map(ch =>
        `<span class="g-slot">${guessed.has(ch) ? ch : "&nbsp;"}</span>`).join("");
    }
    function kb() {
      return "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(ch => {
        const used = guessed.has(ch) || (!word.includes(ch) && usedWrong.has(ch));
        return `<button class="g-key" data-ch="${ch}" ${used ? "disabled" : ""}>${ch}</button>`;
      }).join("");
    }
    const usedWrong = new Set();
    const showHint = () => diff === "easy" || (diff === "medium" && usedWrong.size > 0);

    function render() {
      const won = word.split("").every(ch => guessed.has(ch));
      const lost = lives <= 0;
      screen(`
        <div class="g-hang">
          ${gallowsSvg()}
          <div class="g-hang-side">
            <div class="g-slots">${slots()}</div>
            <p class="g-hint">${showHint() ? "Подсказка: " + esc(hint) : "&nbsp;"}</p>
            <p class="g-lives">Осталось попыток: <b>${lives}</b></p>
          </div>
        </div>
        ${won || lost ? "" : `<div class="g-kb">${kb()}</div>`}
        ${won ? resultCard("🎉 Слово разгадано!", `${word} — ${esc(hint)}. Ошибок: ${usedWrong.size}.`) : ""}
        ${lost ? resultCard("Человечек собрался…", `Слово было ${word} — ${esc(hint)}. В следующий раз получится.`) : ""}
      `);
      if (won || lost) {
        if (won) saveBest(`${diff}: ${usedWrong.size} ошибок`, () => true);
        $(".g-again").addEventListener("click", hangman);
        return;
      }
      root.querySelectorAll(".g-key:not([disabled])").forEach(b =>
        b.addEventListener("click", () => {
          const ch = b.dataset.ch;
          if (word.includes(ch)) guessed.add(ch);
          else { usedWrong.add(ch); lives--; }
          render();
        }));
    }
    render();
  }

  function resultCard(title, text) {
    return `<div class="acard" style="margin-top:14px">
      <b>${title}</b><p style="margin:8px 0 14px; font-size:14px; color:var(--tx-2)">${text}</p>
      <button class="btn-primary g-again">Играть ещё</button></div>`;
  }

  // ---------- перевод-спринт ----------
  function match() {
    screen(`<div class="acard">
      <b>60 секунд на максимум правильных ответов</b>
      <p style="margin:8px 0 14px; font-size:14px; color:var(--tx-2)">Показываем слово —
      выберите перевод из четырёх. Серия из 5 подряд даёт +2 бонусных очка.
      ${getBest() ? "Ваш рекорд: <b>" + esc(getBest()) + "</b>." : ""}</p>
      <button class="btn-primary g-start">Начать спринт</button></div>`);
    $(".g-start").addEventListener("click", () => {
      let score = 0, streak = 0, left = 60;
      const timer = setInterval(() => {
        left--;
        const t = $(".g-timer"); if (t) t.textContent = left + " c";
        if (left <= 0) { clearInterval(timer); finish(); }
      }, 1000);

      function finish() {
        clearInterval(timer);
        saveBest(score, (a, b) => Number(a) > Number(b));
        screen(resultCard("Время!", `Ваш счёт: ${score}. ${Number(getBest()) > score ? "Рекорд: " + getBest() + "." : "Это новый рекорд! 🎉"}`));
        $(".g-again").addEventListener("click", match);
      }

      function question() {
        const [en, ru] = pick(MATCH_PAIRS);
        const wrong = shuffle(MATCH_PAIRS.filter(p => p[1] !== ru)).slice(0, 3).map(p => p[1]);
        const options = shuffle([ru, ...wrong]);
        screen(`
          <div class="g-head"><span class="chip">счёт: ${score}</span>
            <span class="chip ${streak >= 5 ? "mint" : ""}">серия: ${streak}</span>
            <span class="chip coral g-timer">${left} c</span></div>
          <div class="acard" style="text-align:center; margin-bottom:10px">
            <b style="font-family:var(--disp); font-weight:400; font-size:28px">${esc(en)}</b></div>
          <div class="g-opts">${options.map(o =>
            `<button class="g-opt" data-ok="${o === ru ? 1 : 0}">${esc(o)}</button>`).join("")}</div>`);
        root.querySelectorAll(".g-opt").forEach(b =>
          b.addEventListener("click", () => {
            if (b.dataset.ok === "1") {
              score++; streak++;
              if (streak % 5 === 0) score += 2;
            } else { streak = 0; }
            question();
          }));
      }
      question();
    });
  }

  // ---------- собери предложение ----------
  function builder() {
    let idx = 0, mistakes = 0;
    const order = shuffle(SENTENCES.map((_, i) => i));

    function round() {
      if (idx >= order.length) {
        saveBest(`${SENTENCES.length} фраз, ошибок: ${mistakes}`, () => true);
        screen(resultCard("Все предложения собраны! 🎉",
          `${SENTENCES.length} из ${SENTENCES.length}, ошибок по пути: ${mistakes}.`));
        $(".g-again").addEventListener("click", builder);
        return;
      }
      const sentence = SENTENCES[order[idx]];
      const words = sentence.split(" ");
      let pool = shuffle(words.map((w, i) => ({ w, i })));
      // перемешка не должна случайно совпасть с ответом
      if (pool.map(p => p.w).join(" ") === sentence) pool = pool.reverse();
      const answer = [];

      function render() {
        screen(`
          <div class="g-head"><span class="chip">${idx + 1} / ${SENTENCES.length}</span>
            <span class="chip">ошибки: ${mistakes}</span></div>
          ${bar(idx, SENTENCES.length)}
          <div class="acard" style="margin:10px 0">
            <p style="font-size:12.5px; color:var(--tx-2); margin:0 0 8px">Соберите предложение:</p>
            <div class="g-answer">${answer.length
              ? answer.map((t, k) => `<button class="g-chip on" data-k="${k}">${esc(t.w)}</button>`).join("")
              : '<span style="color:#9AA1A8; font-size:14px">нажимайте на слова внизу…</span>'}</div>
          </div>
          <div class="g-pool">${pool.map((t, k) =>
            `<button class="g-chip" data-k="${k}">${esc(t.w)}</button>`).join("")}</div>
          <button class="btn-primary g-check" ${answer.length === words.length ? "" : "disabled"}>Проверить</button>
          <p class="status-line err g-msg"></p>`);
        root.querySelectorAll(".g-pool .g-chip").forEach(b =>
          b.addEventListener("click", () => { answer.push(pool.splice(b.dataset.k, 1)[0]); render(); }));
        root.querySelectorAll(".g-answer .g-chip").forEach(b =>
          b.addEventListener("click", () => { pool.push(answer.splice(b.dataset.k, 1)[0]); render(); }));
        const check = $(".g-check");
        if (check) check.addEventListener("click", () => {
          if (answer.map(t => t.w).join(" ") === sentence) { idx++; round(); }
          else { mistakes++; $(".g-msg").textContent = "Почти — проверьте порядок слов."; }
        });
      }
      render();
    }
    round();
  }

  // ---------- фразовые глаголы ----------
  function phrasal() {
    let idx = 0, score = 0;
    const order = shuffle(PHRASALS.map((_, i) => i));

    function round() {
      if (idx >= order.length) {
        saveBest(`${score} / ${PHRASALS.length}`, (a, b) =>
          Number(String(a).split(" ")[0]) > Number(String(b).split(" ")[0]));
        screen(resultCard(score >= PHRASALS.length * 0.8 ? "Отличный результат! 🎉" : "Готово",
          `Верно ${score} из ${PHRASALS.length}. Фразовые глаголы берутся повторением — заходите ещё.`));
        $(".g-again").addEventListener("click", phrasal);
        return;
      }
      const [q, options, correct, why] = PHRASALS[order[idx]];
      screen(`
        <div class="g-head"><span class="chip">${idx + 1} / ${PHRASALS.length}</span>
          <span class="chip">счёт: ${score}</span></div>
        ${bar(idx, PHRASALS.length)}
        <div class="acard" style="margin:10px 0"><b style="font-size:16px">${esc(q)}</b></div>
        <div class="g-opts">${shuffle(options).map(o =>
          `<button class="g-opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
        <div class="acard g-why" hidden style="margin-top:10px">
          <p style="margin:0 0 12px; font-size:14px"></p>
          <button class="btn-primary g-next">Дальше</button></div>`);
      root.querySelectorAll(".g-opt").forEach(b =>
        b.addEventListener("click", () => {
          const ok = b.dataset.o === correct;
          if (ok) score++;
          root.querySelectorAll(".g-opt").forEach(x => {
            x.disabled = true;
            if (x.dataset.o === correct) x.classList.add("ok");
            else if (x === b) x.classList.add("bad");
          });
          const box = $(".g-why");
          box.hidden = false;
          box.querySelector("p").textContent = (ok ? "Верно! " : "Правильный ответ: " + correct + ". ") + why;
          $(".g-next").addEventListener("click", () => { idx++; round(); });
        }));
    }
    round();
  }

  const GAMES = { hangman, match, builder, phrasal };
  (GAMES[KEY] || (() => screen("<p>Игра не найдена.</p>")))();
};

// Интерактивные облака-декор: клик — облако улетает, зажатие (~0.3 с) —
// перетаскивается, кнопка «добавить облачности» подкидывает новые.
//
// События ловим на document: слой декора лежит ПОД контентом, и прямые
// слушатели на облаках не получали бы указатель там, где сверху колонка
// контента. Делегирование срабатывает только если клик не занят
// интерактивным элементом — формы и кнопки работают как обычно.


(() => {
  const decor = document.querySelector(".sky-decor");
  if (!decor) return;

  const HOLD_MS = 300;
  const INTERACTIVE =
    "a,button,input,textarea,select,label,summary,details,[role=button],[contenteditable]";

  // разметка кучевого облака — та же, что в _clouds.html (тень → свет → блик)
  const CLOUD_SVG = `
<svg viewBox="0 0 260 140" aria-hidden="true" focusable="false">
  <g fill="#DCE6EA">
    <circle cx="52" cy="96" r="30"/><circle cx="92" cy="76" r="40"/>
    <circle cx="140" cy="68" r="46"/><circle cx="188" cy="82" r="34"/>
    <circle cx="216" cy="100" r="21"/><rect x="34" y="88" width="200" height="36" rx="18"/>
  </g>
  <g fill="#F6F8F7">
    <circle cx="52" cy="90" r="27"/><circle cx="91" cy="69" r="37"/>
    <circle cx="139" cy="61" r="43"/><circle cx="187" cy="76" r="31"/>
    <circle cx="214" cy="95" r="18"/><rect x="38" y="82" width="192" height="34" rx="17"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="96" cy="56" r="24"/><circle cx="134" cy="44" r="28"/>
    <circle cx="168" cy="56" r="19"/><ellipse cx="130" cy="72" rx="58" ry="26"/>
    <circle cx="76" cy="66" r="9"/><circle cx="113" cy="36" r="8"/>
    <circle cx="152" cy="38" r="7"/><circle cx="185" cy="66" r="8"/>
  </g>
  <g fill="#DCE6EA" opacity=".6">
    <ellipse cx="86" cy="104" rx="18" ry="6"/><ellipse cx="138" cy="108" rx="24" ry="7"/>
    <ellipse cx="186" cy="104" rx="14" ry="5"/>
  </g>
</svg>`;

  function cloudAt(x, y) {
    const clouds = decor.querySelectorAll(".sd");
    // верхнее по DOM облако, в чей прямоугольник попала точка
    for (let i = clouds.length - 1; i >= 0; i--) {
      const r = clouds[i].getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return clouds[i];
    }
    return null;
  }

  function flyAway(el) {
    if (el.dataset.flying) return;
    el.dataset.flying = "1";
    const r = el.getBoundingClientRect();
    const dir = r.left + r.width / 2 < window.innerWidth / 2 ? -1 : 1;
    el.style.transition = "transform 1.1s cubic-bezier(.45,0,.85,.6), opacity 1.1s ease-in";
    el.style.transform =
      `translate(${dir * (window.innerWidth + r.width)}px, ${-(120 + Math.random() * 180)}px) rotate(${dir * 4}deg)`;
    el.style.opacity = "0";
    setTimeout(() => el.remove(), 1150);
  }

  let target = null, holdTimer = null, dragging = false, moved = false;
  let sx = 0, sy = 0, offX = 0, offY = 0;

  document.addEventListener("pointerdown", e => {
    if (e.button) return;
    if (e.target.closest(INTERACTIVE)) return; // интерфейс важнее игрушки
    const cl = cloudAt(e.clientX, e.clientY);
    if (!cl || cl.dataset.flying) return;
    target = cl; moved = false;
    sx = e.clientX; sy = e.clientY;
    const r = cl.getBoundingClientRect();
    offX = e.clientX - r.left; offY = e.clientY - r.top;
    holdTimer = setTimeout(() => {
      holdTimer = null; dragging = true;
      target.classList.add("sd-drag");
      document.body.style.touchAction = "none"; // не скроллить, пока тащим
    }, HOLD_MS);
  });

  document.addEventListener("pointermove", e => {
    if (!target) return;
    if (!dragging) {
      // палец поехал до срабатывания зажатия — это скролл, отпускаем облако
      if (holdTimer && Math.hypot(e.clientX - sx, e.clientY - sy) > 12) {
        clearTimeout(holdTimer); holdTimer = null; target = null;
      }
      return;
    }
    moved = true;
    target.style.left = (e.clientX - offX) + "px";
    target.style.top = (e.clientY - offY) + "px";
    target.style.right = "auto"; target.style.bottom = "auto";
  });

  function finish(e) {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (!target) return;
    if (dragging) {
      dragging = false;
      target.classList.remove("sd-drag");
      document.body.style.touchAction = "";
      if (!moved) flyAway(target); // зажал и отпустил на месте — тоже улетает
    } else if (e.type === "pointerup") {
      flyAway(target); // обычный клик
    }
    target = null;
  }
  document.addEventListener("pointerup", finish);
  document.addEventListener("pointercancel", finish);

  function spawnCloud() {
    const s = document.createElement("span");
    s.className = "sd sd-pop";
    s.innerHTML = CLOUD_SVG;
    const w = Math.round(110 + Math.random() * 220);
    s.querySelector("svg").setAttribute("width", w);
    s.style.left = Math.round(2 + Math.random() * 72) + "vw";
    s.style.top = Math.round(6 + Math.random() * 74) + "vh";
    s.style.opacity = (0.35 + Math.random() * 0.4).toFixed(2);
    decor.appendChild(s);
  }

  // Кнопка «добавить облачности» — в левом нижнем углу, напротив меню.
  // Только генерирует: убирает облака сам пользователь, кликая по ним.
  // Лимит — 6 нажатий, дальше кнопка честно говорит «достаточно».
  const CLOUD_ICON =
    '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">' +
    '<path d="M17.5 18H8.2a5.2 5.2 0 1 1 1-10.3 6 6 0 0 1 11.3 2A4.15 4.15 0 0 1 17.5 18Z" ' +
    'transform="translate(0 -1.5)" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let spawnsLeft = 6;
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "cloud-add";
  btn.innerHTML = CLOUD_ICON + "добавить облачности";
  btn.addEventListener("click", () => {
    if (spawnsLeft <= 0) return;
    spawnCloud();
    spawnsLeft--;
    if (spawnsLeft === 0) {
      btn.disabled = true;
      btn.innerHTML = CLOUD_ICON + "облачности достаточно";
    }
  });
  document.body.appendChild(btn);
})();

</script>
</body>
</html>
